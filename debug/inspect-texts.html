<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Inspeccionar textos backgrounds</title>
<style>
body { background:#111; color:#ccc; font-family:sans-serif; margin:0; padding:20px; }
h1 { font-size:18px; }
.world { margin-bottom:20px; border:1px solid #444; padding:10px; }
.world h2 { color:#fff; font-size:14px; margin:0 0 5px 0; }
img { width:100%; border:1px solid #555; image-rendering:pixelated; }
</style>
</head>
<body>
<h1>Recortes del borde superior (top 15%) de cada background</h1>
<div id="content"></div>
<script>
const WORLDS = ['AGUA','MAZMORRA','ESPACIO','FUEGO','HIELO','INFRAMUNDO','TIERRA','VIENTO'];
const content = document.getElementById('content');
WORLDS.forEach(w => {
  const div = document.createElement('div');
  div.className = 'world';
  div.innerHTML = `<h2>${w}</h2><img src="/debug/crops/${w}_top.png">`;
  content.appendChild(div);
});
</script>
</body>
</html>
