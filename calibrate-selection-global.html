<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calibración global de selección</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font:14px Arial,sans-serif}#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}#image{width:100%;height:100%;object-fit:contain;display:block}#overlay{position:absolute;inset:0;z-index:2;cursor:move}svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.avatar{fill:rgba(0,220,255,.12);stroke:#0ff;stroke-width:3}.button{fill:rgba(255,210,60,.1);stroke:#ffd54f;stroke-width:2}.name{fill:rgba(80,255,100,.18);stroke:#5f5;stroke-width:4;stroke-dasharray:8 5}.label{fill:#fff;font:14px Arial,sans-serif;paint-order:stroke;stroke:#000;stroke-width:4px}.drag{position:absolute;border:3px solid #fff;box-shadow:0 0 15px #fff;pointer-events:none;display:none}#panel{position:absolute;z-index:5;top:12px;left:12px;width:300px;padding:13px;background:rgba(0,0,0,.9);border:1px solid #789;border-radius:6px;line-height:1.5}.key{color:#ffd54f}button{width:100%;margin:3px 0;padding:8px;background:#17212b;color:#fff;border:1px solid #789;border-radius:4px;cursor:pointer}.status{position:absolute;z-index:5;bottom:12px;left:50%;transform:translateX(-50%);padding:8px 15px;background:rgba(0,0,0,.9);border-radius:4px;color:#9de}</style></head>
<body><div id="stage"><img id="image" src="/assets/menu%20principal/seleccion_personaje.png?v=global-calibration" alt=""><div id="overlay"><svg id="svg"></svg><div id="drag"></div></div></div><div id="panel"><b>Calibración global</b><br>Desplaza todos los calibrados juntos sobre la nueva imagen.<br><span class="key">Arrastrar la imagen</span>: mover todo<br><span class="key">Flechas</span>: mover · <span class="key">Shift + flechas</span>: fino<br><button id="left">←</button><button id="right">→</button><button id="up">↑</button><button id="down">↓</button><button id="fine">Movimiento fino</button><button id="save">Guardar todo</button><div id="coords"></div></div><div class="status" id="status">Cargando calibraciones...</div>
<script>
const image=document.getElementById('image'),svg=document.getElementById('svg'),overlay=document.getElementById('overlay'),status=document.getElementById('status'),coords=document.getElementById('coords');let avatars=null,buttons=null,name=null,legacyA=false,legacyB=false,legacyN=false,fine=false,dragging=false,last=null;
function contentRect(){const w=innerWidth,h=innerHeight,ratio=1.5;let width=w,height=w/ratio;if(height>h){height=h;width=h*ratio}return{left:(w-width)/2,top:(h-height)/2,width,height}}function viewportRect(){return{left:0,top:0,width:innerWidth,height:innerHeight}}function rect(legacy){return legacy?viewportRect():contentRect()}function pxy(p,r){return`${r.left+p[0]*r.width},${r.top+p[1]*r.height}`}function drawPoly(poly,r,cls,label){if(!poly||poly.length<3)return;const e=document.createElementNS('http://www.w3.org/2000/svg','polygon');e.setAttribute('points',poly.map(p=>pxy(p,r)).join(' '));e.setAttribute('class',cls);svg.appendChild(e);if(label){const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',pxy(poly[0],r).split(',')[0]);t.setAttribute('y',String(Number(pxy(poly[0],r).split(',')[1])-5));t.setAttribute('class','label');t.textContent=label;svg.appendChild(t)}}function render(){svg.innerHTML='';if(avatars?.polygons)avatars.polygons.forEach((p,i)=>drawPoly(p,rect(legacyA),'avatar','A'+(i+1)));if(buttons?.buttons)buttons.buttons.forEach(b=>drawPoly(b.polygon,rect(legacyB),'button',b.label));if(name?.w>0){const r=rect(legacyN),e=document.createElementNS('http://www.w3.org/2000/svg','rect');e.setAttribute('x',r.left+name.x*r.width);e.setAttribute('y',r.top+name.y*r.height);e.setAttribute('width',name.w*r.width);e.setAttribute('height',name.h*r.height);e.setAttribute('class','name');svg.appendChild(e)}coords.textContent=`Avatares: ${avatars?.polygons?.filter(p=>p?.length>=3).length||0} · Botones: ${buttons?.buttons?.filter(b=>b.polygon?.length>=3).length||0} · Área texto: ${name?.w?'sí':'no'}`}
function shiftPoly(poly,dx,dy){if(poly)poly.forEach(p=>{p[0]=Math.max(0,Math.min(1,p[0]+dx));p[1]=Math.max(0,Math.min(1,p[1]+dy))})}function move(dx,dy){if(!avatars||!buttons||!name)return;const step=fine?.0005:.003;const sx=dx*step,sy=dy*step;shiftPolyList(avatars.polygons,sx,sy,legacyA);shiftPolyList(buttons.buttons.map(b=>b.polygon),sx,sy,legacyB);if(name.w){name.x=Math.max(0,Math.min(1-name.w,name.x+sx));name.y=Math.max(0,Math.min(1-name.h,name.y+sy))}render();status.textContent='Desplazamiento aplicado. Pulsa Guardar todo.'}function shiftPolyList(list,dx,dy,legacy){const r=rect(legacy),cr=rect(false);const nx=dx*r.width/cr.width,ny=dy*r.height/cr.height;list.forEach(p=>shiftPoly(p,nx,ny))}
function save(){Promise.all([fetch('/api/save-character-positions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(avatars)}),fetch('/api/save-selection-buttons',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(buttons)}),fetch('/api/save-selection-name',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(name)} )]).then(rs=>{if(rs.some(r=>!r.ok))throw Error();status.textContent='Todas las calibraciones guardadas.'}).catch(()=>status.textContent='Error al guardar alguna calibración')}
function applyDrag(dx,dy){if(!last)return;const ra=rect(legacyA),rb=rect(legacyB),rn=rect(legacyN);shiftPolyList(avatars.polygons,dx/ra.width,dy/ra.height,legacyA);shiftPolyList(buttons.buttons.map(b=>b.polygon),dx/rb.width,dy/rb.height,legacyB);if(name.w){name.x=Math.max(0,Math.min(1-name.w,name.x+dx/rn.width));name.y=Math.max(0,Math.min(1-name.h,name.y+dy/rn.height))}render()}
overlay.addEventListener('pointerdown',e=>{if(e.target!==overlay&&e.target!==svg)return;dragging=true;last={x:e.clientX,y:e.clientY};overlay.setPointerCapture?.(e.pointerId);e.preventDefault()});overlay.addEventListener('pointermove',e=>{if(!dragging)return;applyDrag(e.clientX-last.x,e.clientY-last.y);last={x:e.clientX,y:e.clientY}});overlay.addEventListener('pointerup',()=>{dragging=false;last=null;status.textContent='Desplazamiento aplicado. Pulsa Guardar todo.'});document.addEventListener('keydown',e=>{if(e.key==='Shift'){fine=true;return}if(e.key==='ArrowLeft'){e.preventDefault();move(-1,0)}else if(e.key==='ArrowRight'){e.preventDefault();move(1,0)}else if(e.key==='ArrowUp'){e.preventDefault();move(0,-1)}else if(e.key==='ArrowDown'){e.preventDefault();move(0,1)}else if(e.key==='Shift')fine=true});document.addEventListener('keyup',e=>{if(e.key==='Shift')fine=false});document.getElementById('fine').onclick=()=>{fine=!fine;document.getElementById('fine').textContent=fine?'Movimiento normal':'Movimiento fino'};document.getElementById('left').onclick=()=>move(-1,0);document.getElementById('right').onclick=()=>move(1,0);document.getElementById('up').onclick=()=>move(0,-1);document.getElementById('down').onclick=()=>move(0,1);document.getElementById('save').onclick=save;
Promise.all([fetch('/api/load-character-positions').then(r=>r.ok?r.json():{polygons:[]}),fetch('/api/load-selection-buttons').then(r=>r.ok?r.json():{buttons:[]}),fetch('/api/load-selection-name').then(r=>r.ok?r.json():null)]).then(([a,b,n])=>{avatars=a;buttons=b;name=n||{x:.322,y:.565,w:.375,h:.1};legacyA=!a.coordinateSpace;legacyB=!b.coordinateSpace;legacyN=!n?.coordinateSpace;render();status.textContent='Calibraciones cargadas. Arrastra para moverlas juntas.'}).catch(()=>status.textContent='Error al cargar calibraciones');window.addEventListener('resize',render);
</script></body></html>
