<!DOCTYPE html>
<html lang="es">
<head>
<script src="/web/webdb.js"></script>
<script src="/web/solver.bundle.js"></script>
<script src="/web/api-shim.js"></script>
<script src="/web/tizen.js"></script>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Runika 2D</title>
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --glow-x: 14px;
    --glow-y: 0px;
    --glow-op: 0.6;
    --glow-blur: 8px;
  }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000; font-family: 'ChelseaMarket', cursive;
  }
  /* Pantalla de carga — estética clásica de aventura */
  #loading-screen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 100;
    background:
      radial-gradient(ellipse 80% 60% at 50% 40%, #1a1208 0%, #0a0806 70%),
      #0a0806;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #e8d4a8;
    cursor: pointer;
  }
  /* Marco doble estilo grabado */
  #loading-screen::before {
    content: '';
    position: absolute; top: 14px; left: 14px; right: 14px; bottom: 14px;
    border: 2px solid rgba(180, 150, 80, 0.35);
    box-shadow: inset 0 0 0 4px #0a0806, inset 0 0 0 6px rgba(180, 150, 80, 0.2);
    pointer-events: none;
  }
  #loading-screen .title {
    font-family: 'ChelseaMarket', cursive;
    font-size: clamp(2.4em, 7vw, 5em);
    color: #f0d890; letter-spacing: 6px;
    /* Contorno grueso estilo texto de aventura gráfica */
    text-shadow:
      -2px -2px 0 #20140a, 2px -2px 0 #20140a,
      -2px 2px 0 #20140a, 2px 2px 0 #20140a,
      0 6px 14px rgba(0,0,0,0.9),
      0 0 30px rgba(232, 180, 80, 0.25);
    margin-bottom: 14px;
  }
  #loading-subtitle {
    font-family: 'ChelseaMarket', cursive;
    font-size: clamp(0.9em, 2vw, 1.3em); color: #a08850;
    letter-spacing: 4px; margin-bottom: 46px;
    text-shadow: 1px 1px 0 #20140a;
  }
  #loading-bar-bg {
    width: min(560px, 70vw); height: 20px;
    background: #140d05;
    border: 3px solid #4a3820;
    box-shadow:
      inset 0 2px 6px rgba(0,0,0,0.9),
      0 0 0 1px rgba(240, 216, 144, 0.25),
      0 4px 14px rgba(0,0,0,0.8);
    overflow: hidden;
    image-rendering: pixelated;
  }
  #loading-bar {
    width: 0%; height: 100%;
    background:
      repeating-linear-gradient(90deg,
        rgba(0,0,0,0.22) 0 6px, transparent 6px 12px),
      linear-gradient(180deg, #f0d890 0%, #c4a050 55%, #8a6a30 100%);
    transition: width 0.15s ease;
  }
  #loading-text {
    margin-top: 16px; font-size: 1.05em; color: #c8a860;
    font-family: 'ChelseaMarket', cursive; letter-spacing: 2px;
    text-shadow: 1px 1px 0 #20140a;
  }
  /* Taglines rotativos de venta: "cada partida es unica..." */
  #loading-tips {
    margin-top: 22px; max-width: min(560px, 78vw); min-height: 2.6em;
    font-size: clamp(0.85em, 1.7vw, 1.05em); color: #b09a68;
    font-family: 'ChelseaMarket', cursive; letter-spacing: 1px;
    line-height: 1.35; text-align: center;
    text-shadow: 1px 1px 0 #20140a;
    opacity: 0; transition: opacity 0.7s ease;
  }
  #loading-tips.show { opacity: 1; }
  #start-hint {
    margin-top: 34px; font-size: clamp(1em, 2.4vw, 1.5em); color: #f0d890;
    font-family: 'ChelseaMarket', cursive; letter-spacing: 3px;
    display: none;
    text-shadow:
      -1px -1px 0 #20140a, 1px -1px 0 #20140a,
      -1px 1px 0 #20140a, 1px 1px 0 #20140a,
      0 0 18px rgba(232, 180, 80, 0.4);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }
  /* Transicion */
  #transition-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 90; background: #000;
    opacity: 1; pointer-events: auto; /* nace en negro: cero destello al entrar */
  }
  #stage {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  #bg {
    width: 100%; height: 100%;
    object-fit: contain; display: block;
    position: relative; z-index: 1;
  }
  /* El fondo del menú es 3:2: rellena los bordes del letterbox con una
     copia difuminada del mismo fondo, sin estirar ni recortar el arte */
  #fillbg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    filter: blur(45px) brightness(0.42) saturate(1.25);
    transform: scale(1.15);
    z-index: 0;
  }
  #overlay {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 10; pointer-events: none;
  }
  #borders {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 12; pointer-events: none;
  }
  #version-tag {
    position: absolute; bottom: 10px; right: 16px; z-index: 13;
    font-family: 'ChelseaMarket', cursive; font-size: 13px; letter-spacing: 1px;
    color: rgba(255, 222, 150, 0.6); text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.85);
    pointer-events: none;
  }
  .btn {
    position: absolute;
    cursor: pointer;
    pointer-events: auto;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.12s ease;
    z-index: 11;
    border-radius: 6px;
    background: transparent;
  }
  .btn-text {
    font-family: 'ChelseaMarket', cursive;
    color: #e8d4a8;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.8), 0 0 8px rgba(0,0,0,0.5);
    text-align: center;
    transition: transform 0.12s ease, color 0.12s ease;
    user-select: none;
    white-space: nowrap;
  }
  .btn:hover {
    background: transparent;
    box-shadow:
      var(--glow-x) 0 var(--glow-blur) -2px rgba(232, 212, 168, var(--glow-op)),
      calc(-1 * var(--glow-x)) 0 var(--glow-blur) -2px rgba(232, 212, 168, var(--glow-op)),
      0 var(--glow-y) var(--glow-blur) -2px rgba(232, 212, 168, var(--glow-op)),
      0 calc(-1 * var(--glow-y)) var(--glow-blur) -2px rgba(232, 212, 168, var(--glow-op));
  }
  .btn:hover .btn-text {
    color: #fff8e0;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.9), 0 0 12px rgba(255, 200, 80, 0.6), 0 0 24px rgba(255, 180, 60, 0.4);
    transform: scale(1.08);
  }
  .btn.active {
    background: transparent;
    box-shadow:
      var(--glow-x) 0 var(--glow-blur) -2px rgba(232, 212, 168, var(--glow-op)),
      calc(-1 * var(--glow-x)) 0 var(--glow-blur) -2px rgba(232, 212, 168, var(--glow-op)),
      0 var(--glow-y) var(--glow-blur) -2px rgba(232, 212, 168, var(--glow-op)),
      0 calc(-1 * var(--glow-y)) var(--glow-blur) -2px rgba(232, 212, 168, var(--glow-op));
    /* Sin animación continua: animar box-shadow repinta las sombras cada
       frame — en GPU débiles (Fire TV) era la causa del menú "lentísimo".
       El brillo estático + el borde SVG ya marcan la selección. */
  }
  .btn.active .btn-text {
    color: #fff8e0;
    font-weight: bold;
    text-shadow:
      1px 1px 2px rgba(0,0,0,0.9),
      0 0 10px rgba(255,220,120,1),
      0 0 20px rgba(255,200,80,0.9),
      0 0 40px rgba(255,180,60,0.7),
      0 0 60px rgba(255,160,40,0.5);
    transform: scale(1.15);
  }
  .btn.disabled {
    cursor: not-allowed;
    pointer-events: none;
  }
  .btn.disabled .btn-text {
    color: #6b5d45 !important;
    opacity: 0.55;
    text-shadow: none !important;
    transform: none !important;
  }
  @keyframes btnPulse {
    0%, 100% {
      box-shadow:
        var(--glow-x) 0 var(--glow-blur) -2px rgba(232, 212, 168, var(--glow-op)),
        calc(-1 * var(--glow-x)) 0 var(--glow-blur) -2px rgba(232, 212, 168, var(--glow-op)),
        0 var(--glow-y) var(--glow-blur) -2px rgba(232, 212, 168, var(--glow-op)),
        0 calc(-1 * var(--glow-y)) var(--glow-blur) -2px rgba(232, 212, 168, var(--glow-op));
    }
    50% {
      box-shadow:
        calc(var(--glow-x) * 1.4) 0 calc(var(--glow-blur) * 1.5) -2px rgba(232, 212, 168, calc(var(--glow-op) * 1.3)),
        calc(-1 * var(--glow-x) * 1.4) 0 calc(var(--glow-blur) * 1.5) -2px rgba(232, 212, 168, calc(var(--glow-op) * 1.3)),
        0 calc(var(--glow-y) * 1.4) calc(var(--glow-blur) * 1.5) -2px rgba(232, 212, 168, calc(var(--glow-op) * 1.3)),
        0 calc(-1 * var(--glow-y) * 1.4) calc(var(--glow-blur) * 1.5) -2px rgba(232, 212, 168, calc(var(--glow-op) * 1.3));
    }
  }
  #hud {
    position: absolute; top: 12px; left: 12px; z-index: 20;
    background: rgba(0,0,0,0.7); padding: 8px 14px;
    border-radius: 4px; font-family: 'ChelseaMarket', cursive;
    font-size: 0.8em; color: #aaa;
  }
  #hud .key { color: #fc4; }
  #hud b { color: #0ff; }
</style>
</head>
<body>

<!-- Pantalla de carga -->
<div id="loading-screen">
  <div class="title">RUNIKA 2D</div>
  <div id="loading-subtitle"></div>
  <div id="loading-bar-bg"><div id="loading-bar"></div></div>
  <div id="loading-text"></div>
  <div id="loading-tips"></div>
  <div id="start-hint"></div>
</div>

<!-- Overlay de transicion -->
<div id="transition-overlay"></div>

<div id="stage">
  <img id="fillbg" src="/assets/menu%20principal/menu%20principal.169.webp?v=menu8k-4" alt="" />
  <img id="bg" src="/assets/menu%20principal/menu%20principal.169.webp?v=menu8k-4" />
  <div id="overlay"></div>
  <svg id="borders"></svg>
  <div id="version-tag"></div>
</div>

<div id="hud" style="display:none">
  <b>Runika 2D</b><br>
  <span class="key">Raton</span> = hover<br>
  <span class="key">Flechas ↑↓</span> = cambiar seleccion<br>
  <span class="key">Enter</span> = activar boton<br>
  <br>
  <b>Ajustar glow</b><br>
  <span class="key">A/D</span> = ancho · <span class="key">W/S</span> = alto<br>
  <span class="key">Q/E</span> = opacidad · <span class="key">Z/X</span> = blur<br>
  <span class="key">G</span> = guardar<br>
  <br>
  <span id="glow-info" style="color:#0ff"></span>
</div>

<script src="/assets-cache.js"></script>
<script>
  // --- Desbloquear audio al primer gesto ---
  let audioUnlocked = false;
  function unlockAudio() {
    if (audioUnlocked) return;
    audioUnlocked = true;
    AssetsCache.unlockAudio();
  }
  document.addEventListener('click', unlockAudio, { once: true });
  document.addEventListener('keydown', unlockAudio, { once: true });
  document.addEventListener('touchstart', unlockAudio, { once: true });
  document.addEventListener('mouseenter', unlockAudio, { once: true });
  document.addEventListener('mousemove', unlockAudio, { once: true });

  // --- Sonidos (desde cache, Web Audio API) ---
  function playMove() {
    AssetsCache.playSound('/assets/sounds/comun/move.wav', 0.5);
  }
  function playHover() {
    AssetsCache.playSound('/assets/sounds/comun/hover.wav', 0.45);
  }
  function playSelect() {
    AssetsCache.playSound('/assets/sounds/comun/press.wav', 0.7);
  }

  // Coordenadas calibradas: se cargan desde /api/load-menu-buttons
  let BUTTONS = [];      // [{ label, polygon|rect, textPolygon|text }]
  let I18N_KEYS = [
    'menu.newGame', 'menu.continue', 'menu.instructions',
    'menu.settings', 'menu.credits', 'menu.exit'
  ];

  let translations = {};
  let fallback = {};
  let selectedIdx = 0, hoveredIdx = -1, selVisible = false;
  // En TV no hay puntero real (hover:none, maxTouchPoints:0): el WebView
  // puede sintetizar mouseenter/click fantasma (cursor residual tras un
  // Enter, o re-hit-test al re-renderizar los botones) que movía o activaba
  // la selección "solo" — el menú subía y bajaba sin tocar el mando.
  // Solo se honra el puntero si hubo uno REAL en los últimos 1.5 s
  // (movimiento/pulsación/tacto), y nunca un click pegado a un keydown
  // (el click sintetizado que a veces acompaña al Enter del mando).
  let realPointerAt = -1e9, lastKeyDownAt = -1e9, lastTouchAt = -1e9;
  const sawPointer = () => { realPointerAt = performance.now(); };
  document.addEventListener('mousemove', sawPointer, true);
  document.addEventListener('mousedown', sawPointer, true);
  document.addEventListener('touchstart', () => { sawPointer(); lastTouchAt = performance.now(); }, { capture: true, passive: true });
  document.addEventListener('keydown', () => { lastKeyDownAt = performance.now(); }, true);
  const realPointer = () => performance.now() - realPointerAt < 1500;
  const phantomClick = () => performance.now() - lastKeyDownAt < 300
    || performance.now() - lastTouchAt < 600; // tap ya activó en touchstart
  // "Continuar" (indice 1) solo activo si hay partida empezada en la bbdd
  let hasSave = false;
  const CONTINUE_IDX = 1;
  // Menú móvil: solo en la app nativa con pantalla táctil cuando el lado
  // corto del viewport es <550px (móviles en landscape ≈ 400-480). La TV
  // reporta viewport en dp pequeño (~540) pero no tiene táctil — sin el
  // check de maxTouchPoints salía el menú móvil en el Fire Stick.
  const MOBILE_MENU = IS_NATIVE && navigator.maxTouchPoints > 0
    && Math.min(window.innerWidth, window.innerHeight) < 550;
  if (MOBILE_MENU) {
    const mSrc = '/assets/menu%20principal/menu-mobile.webp?v=mm1';
    document.getElementById('bg').src = mSrc;
    document.getElementById('fillbg').src = mSrc;
  }
  // ?auto=1 — autopiloto de grabación (tools/record-demo.mjs)
  const AUTO_MODE = new URLSearchParams(location.search).get('auto') === '1';

  async function refreshSaveState() {
    try {
      const r = await fetch('/api/savegame');
      if (r.ok) hasSave = !!(await r.json()).exists;
    } catch {}
  }

  async function loadLang(lang) {
    const r = await fetch('/api/i18n' + (lang ? '/' + lang : ''));
    if (!r.ok) return {};
    return await r.json();
  }
  function t(key) { return translations[key] ?? fallback[key] ?? key; }

  async function loadButtons() {
    try {
      const r = await fetch(MOBILE_MENU
        ? '/assets/menu%20principal/menu-buttons-mobile.json'
        : '/api/load-menu-buttons');
      if (!r.ok) return;
      const data = await r.json();
      if (data.buttons) {
        BUTTONS = data.buttons.map((b, i) => ({
          label: b.label || ('boton ' + i),
          polygon: b.polygon || null,
          rect: b.rect || null,
          textPolygon: b.textPolygon || null,
          text: b.text || null
        }));
      }
    } catch (e) { console.error('No se pudieron cargar botones', e); }
  }

  // Devuelve el bounding box normalizado de un area (polygon o rect)
  function areaBBox(area, poly) {
    if (area && area.w > 0) {
      return { x: area.x, y: area.y, w: area.w, h: area.h, angle: area.angle || 0 };
    }
    if (poly && poly.length >= 2) {
      const xs = poly.map(p => p[0]);
      const ys = poly.map(p => p[1]);
      return {
        x: Math.min(...xs), y: Math.min(...ys),
        w: Math.max(...xs) - Math.min(...xs),
        h: Math.max(...ys) - Math.min(...ys),
        angle: polyAngle(poly)
      };
    }
    return null;
  }

  // Angulo del poligono: la arista mas horizontal define la rotacion del area
  function polyAngle(poly) {
    if (!poly || poly.length < 2) return 0;
    let bestAngle = 0, bestScore = Infinity;
    for (let i = 0; i < poly.length; i++) {
      const a = poly[i], b = poly[(i + 1) % poly.length];
      const ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
      let a2 = Math.abs(ang) > Math.PI / 2 ? ang - Math.sign(ang) * Math.PI : ang;
      if (Math.abs(a2) < bestScore) { bestScore = Math.abs(a2); bestAngle = a2; }
    }
    return bestAngle;
  }

  const bg = document.getElementById('bg');
  const overlay = document.getElementById('overlay');

  // Rect de la imagen dibujada (descuenta el letterbox de object-fit: contain):
  // las coordenadas calibradas viven en el espacio de la imagen original.
  function getImgRect() {
    const er = bg.getBoundingClientRect();
    const iw = bg.naturalWidth || 1536, ih = bg.naturalHeight || 1024;
    const cs = getComputedStyle(bg);
    if (cs.objectFit === 'fill')
      return { left: er.left, top: er.top, width: er.width, height: er.height, right: er.right, bottom: er.bottom };
    const s = cs.objectFit === 'cover'
      ? Math.max(er.width / iw, er.height / ih)
      : Math.min(er.width / iw, er.height / ih);
    const w = iw * s, h = ih * s;
    const pos = (cs.objectPosition || '50% 50%').trim().split(/\s+/);
    const ox = (parseFloat(pos[0]) || 50) / 100, oy = (parseFloat(pos[1] ?? pos[0]) || 50) / 100;
    const left = er.left + (er.width - w) * ox, top = er.top + (er.height - h) * oy;
    return { left, top, width: w, height: h, right: left + w, bottom: top + h };
  }

  const borders = document.getElementById('borders');
  const SVGNS = 'http://www.w3.org/2000/svg';

  // En nativo (Fire TV/movil) el drop-shadow SVG obliga a refiltrar toda
  // la capa en cada navegacion -> el highlight llegaba tarde ("a saltos").
  const NATIVE_LITE = document.documentElement.classList.contains('runika-native');

  function renderBorders() {
    const r = getImgRect();
    borders.setAttribute('viewBox', '0 0 ' + window.innerWidth + ' ' + window.innerHeight);
    borders.innerHTML = '';
    BUTTONS.forEach((b, i) => {
      const isSel = (selVisible && i === selectedIdx) || i === hoveredIdx;
      if (!isSel) return;
      const stroke = '#ffd860';
      const sw = 3.5;
      if (b.polygon && b.polygon.length >= 3 && !b.rect) {
        const pts = b.polygon.map(p =>
          (r.left + p[0] * r.width) + ',' + (r.top + p[1] * r.height)
        ).join(' ');
        const poly = document.createElementNS(SVGNS, 'polygon');
        poly.setAttribute('points', pts);
        poly.setAttribute('fill', 'none');
        poly.setAttribute('stroke', stroke);
        poly.setAttribute('stroke-width', sw);
        if (isSel && !NATIVE_LITE) poly.style.filter = 'drop-shadow(0 0 6px rgba(255,200,80,0.9))';
        borders.appendChild(poly);
      } else if (b.rect && b.rect.w > 0) {
        const cx = r.left + (b.rect.x + b.rect.w / 2) * r.width;
        const cy = r.top + (b.rect.y + b.rect.h / 2) * r.height;
        const w = b.rect.w * r.width, h = b.rect.h * r.height;
        const ang = b.rect.angle || 0;
        const cos = Math.cos(ang), sin = Math.sin(ang);
        const corners = [[-w/2,-h/2],[w/2,-h/2],[w/2,h/2],[-w/2,h/2]].map(([x,y]) =>
          (cx + x*cos - y*sin) + ',' + (cy + x*sin + y*cos)
        ).join(' ');
        const poly = document.createElementNS(SVGNS, 'polygon');
        poly.setAttribute('points', corners);
        poly.setAttribute('fill', 'none');
        poly.setAttribute('stroke', stroke);
        poly.setAttribute('stroke-width', sw);
        if (isSel && !NATIVE_LITE) poly.style.filter = 'drop-shadow(0 0 6px rgba(255,200,80,0.9))';
        borders.appendChild(poly);
      }
    });
  }

  function render() {
    overlay.innerHTML = '';
    renderBorders();
    const r = getImgRect();
    BUTTONS.forEach((b, i) => {
      const btnBBox = areaBBox(b.rect, b.polygon);
      if (!btnBBox) return;
      const div = document.createElement('div');
      div.className = 'btn' + (i === selectedIdx && selVisible ? ' active' : '')
        + (i === CONTINUE_IDX && !hasSave ? ' disabled' : '');
      div.style.left = (r.left + btnBBox.x * r.width) + 'px';
      div.style.top = (r.top + btnBBox.y * r.height) + 'px';
      div.style.width = (btnBBox.w * r.width) + 'px';
      div.style.height = (btnBBox.h * r.height) + 'px';

      // Si es rectangulo rotado, aplicar transform
      if (b.rect && b.rect.angle) {
        div.style.transformOrigin = 'center center';
        div.style.transform = 'rotate(' + b.rect.angle + 'rad)';
      }

      // Si es poligono, usar clip-path para recortar la forma
      if (b.polygon && b.polygon.length >= 3 && !b.rect) {
        const clipPoints = b.polygon.map(p => {
          const cx = ((p[0] - btnBBox.x) / btnBBox.w * 100).toFixed(2);
          const cy = ((p[1] - btnBBox.y) / btnBBox.h * 100).toFixed(2);
          return cx + '% ' + cy + '%';
        }).join(', ');
        div.style.clipPath = 'polygon(' + clipPoints + ')';
      }

      // Area de texto
      const textBBox = areaBBox(b.text, b.textPolygon);
      if (textBBox) {
        const textDiv = document.createElement('div');
        textDiv.className = 'btn-text';
        const txOffset = (textBBox.x - btnBBox.x) / btnBBox.w;
        const tyOffset = (textBBox.y - btnBBox.y) / btnBBox.h;
        const twRel = textBBox.w / btnBBox.w;
        const thRel = textBBox.h / btnBBox.h;
        textDiv.style.position = 'absolute';
        textDiv.style.left = (txOffset * 100) + '%';
        textDiv.style.top = (tyOffset * 100) + '%';
        textDiv.style.width = (twRel * 100) + '%';
        textDiv.style.height = (thRel * 100) + '%';
        textDiv.style.display = 'flex';
        textDiv.style.alignItems = 'center';
        textDiv.style.justifyContent = 'center';
        const fontSize = textBBox.h * r.height * 0.65;
        textDiv.style.fontSize = fontSize + 'px';
        const str = t(I18N_KEYS[i] || b.label);
        if (b.textPolygon && b.textPolygon.length >= 4) {
          // Texto curvo: cada letra sigue el borde inferior del poligono (p1->p2)
          const p0 = b.textPolygon[0], p1 = b.textPolygon[1],
                p2 = b.textPolygon[2], p3 = b.textPolygon[3];
          const baseAng = Math.atan2(p2[1] - p1[1], p2[0] - p1[0]);
          const N = str.length;
          const slotW = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]) * r.width / Math.max(1, N);
          for (let k = 0; k < N; k++) {
            const ch = str[k];
            if (ch === ' ') continue;
            const t2 = (k + 0.5) / N;
            const bx = p1[0] + (p2[0] - p1[0]) * t2;
            const by = p1[1] + (p2[1] - p1[1]) * t2;
            const tx = p0[0] + (p3[0] - p0[0]) * t2;
            const ty = p0[1] + (p3[1] - p0[1]) * t2;
            const cx = (bx + tx) / 2, cy = (by + ty) / 2;
            const lh = Math.hypot(tx - bx, ty - by);
            const span = document.createElement('span');
            span.textContent = ch;
            span.style.position = 'absolute';
            span.style.left = (((cx - textBBox.x) / textBBox.w) * 100) + '%';
            span.style.top = (((cy - textBBox.y) / textBBox.h) * 100) + '%';
            span.style.transform = 'translate(-50%, -50%) rotate(' + baseAng + 'rad)';
            span.style.fontSize = Math.min(lh * r.height * 0.72, slotW * 1.9) + 'px';
            textDiv.appendChild(span);
          }
        } else {
          // La rotacion va en un span interno: si la ponemos en .btn-text,
          // el inline transform anula el scale del hover/active en CSS
          const inner = document.createElement('span');
          inner.textContent = str;
          inner.style.display = 'inline-block';
          inner.style.whiteSpace = 'nowrap';
          const btnRot = (b.rect && b.rect.angle) ? b.rect.angle : 0;
          const textAngle = (textBBox.angle || 0) - btnRot;
          if (Math.abs(textAngle) > 0.0001) {
            inner.style.transform = 'rotate(' + textAngle + 'rad)';
            inner.style.transformOrigin = 'center center';
          }
          textDiv.appendChild(inner);
          let fs = fontSize;
          while (fs > 6 && inner.offsetWidth > textDiv.clientWidth + 1) { fs -= 1; textDiv.style.fontSize = fs + 'px'; }
        }
        div.appendChild(textDiv);
      }

      div.addEventListener('mouseenter', () => {
        if (!realPointer()) return;
        if (hoveredIdx !== i) playHover();
        hoveredIdx = i; selectedIdx = i; updateActive();
      });
      div.addEventListener('mouseleave', () => {
        if (!realPointer()) return;
        if (hoveredIdx === i) { hoveredIdx = -1; updateActive(); }
      });
      div.addEventListener('click', () => {
        if (!realPointer() || phantomClick()) return;
        selectedIdx = i; updateActive(); playSelect(); activate(i);
      });
      div.addEventListener('touchstart', (e) => {
        e.preventDefault(); selectedIdx = i; updateActive(); playSelect(); activate(i);
      });
      overlay.appendChild(div);
    });
  }

  function updateActive() {
    overlay.querySelectorAll('.btn').forEach((el, i) => {
      el.classList.toggle('active', selVisible && i === selectedIdx);
    });
    renderBorders();
  }

  function activate(i) {
    if (i === CONTINUE_IDX && !hasSave) return;
    if (i === 0) AssetsCache.transitionTo('/seleccion-personaje.html' + (AUTO_MODE ? '?auto=1' : ''));
    if (i === 1) AssetsCache.transitionTo('/mapamundi.html' + (AUTO_MODE ? '?auto=1' : ''));
    if (i === 2) AssetsCache.transitionTo('/instructions.html');
    if (i === 3) AssetsCache.transitionTo('/ajustes.html');
    if (i === 4) AssetsCache.transitionTo('/creditos.html');
    if (i === 5) {
      // En TV/Android salir = cerrar la app nativa directamente (sin
      // pasar por exit.html ni mostrar "cierra esta pestaña"). En un
      // navegador Android normal (sin cordova) se usa exit.html igual.
      if ((window.cordova || window.tizen) && window.runikaExit) { window.runikaExit(); return; }
      AssetsCache.transitionTo('/exit.html');
    }
  }

  // --- Ajustes de glow ---
  let glowX = 14, glowY = 0, glowOp = 0.6, glowBlur = 8;
  let loadingScreenCleanup = null;
  let menuActive = false; // true tras "pulsa para empezar" o al volver en sesión
  const glowInfo = document.getElementById('glow-info');

  function applyGlow() {
    document.documentElement.style.setProperty('--glow-x', glowX + 'px');
    document.documentElement.style.setProperty('--glow-y', glowY + 'px');
    document.documentElement.style.setProperty('--glow-op', glowOp);
    document.documentElement.style.setProperty('--glow-blur', glowBlur + 'px');
    glowInfo.textContent = 'ancho:' + glowX + ' alto:' + glowY + ' op:' + glowOp.toFixed(2) + ' blur:' + glowBlur;
  }

  document.addEventListener('keydown', (e) => {
    // Ignorar teclas hasta que el menú sea interactivo: el mismo Enter que
    // cierra "pulsa para empezar" activaba Nueva Partida de rebote.
    if (!menuActive) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      const dir = e.key === 'ArrowDown' ? 1 : -1;
      let next = selectedIdx;
      do { next = (next + dir + BUTTONS.length) % BUTTONS.length; }
      while (next === CONTINUE_IDX && !hasSave && next !== selectedIdx);
      selectedIdx = next; selVisible = true; updateActive(); playMove();
    } else if (e.key === 'Enter') {
      e.preventDefault(); playSelect(); activate(selectedIdx);
    } else if (e.key === 'a' || e.key === 'A') { glowX = Math.max(0, glowX - 2); applyGlow(); }
    else if (e.key === 'd' || e.key === 'D') { glowX = Math.min(80, glowX + 2); applyGlow(); }
    else if (e.key === 'w' || e.key === 'W') { glowY = Math.max(0, glowY - 2); applyGlow(); }
    else if (e.key === 's' || e.key === 'S') { glowY = Math.min(80, glowY + 2); applyGlow(); }
    else if (e.key === 'q' || e.key === 'Q') { glowOp = Math.max(0, glowOp - 0.05); applyGlow(); }
    else if (e.key === 'e' || e.key === 'E') { glowOp = Math.min(1, glowOp + 0.05); applyGlow(); }
    else if (e.key === 'z' || e.key === 'Z') { glowBlur = Math.max(0, glowBlur - 2); applyGlow(); }
    else if (e.key === 'x' || e.key === 'X') { glowBlur = Math.min(60, glowBlur + 2); applyGlow(); }
    else if (e.key === 'g' || e.key === 'G') {
      fetch('/api/save-glow', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ glowX, glowY, glowOp, glowBlur })
      }).then(() => alert('Guardado'));
    }
  });

  // --- Init con cache + transicion ---
  (async () => {
    // Si ya estamos en sesion (venimos de otra pantalla), no recargar
    if (sessionStorage.getItem('runika-session') === 'active') {
      // Audio ya desbloqueado, ir directo al menu
      await AssetsCache.loadSettings();
      AssetsCache.setMusicTrack(AssetsCache.MUSIC.main);
      fallback = await loadLang('es');
      translations = await loadLang();
      await loadButtons();
      try {
        const r = await fetch('/api/load-glow');
        if (r.ok) {
          const cfg = await r.json();
          if (cfg.glowX !== undefined) glowX = cfg.glowX;
          if (cfg.glowY !== undefined) glowY = cfg.glowY;
          if (cfg.glowOp !== undefined) glowOp = cfg.glowOp;
          if (cfg.glowBlur !== undefined) glowBlur = cfg.glowBlur;
          applyGlow();
        }
      } catch {}
      audioUnlocked = true;
      AssetsCache.unlockAudio();
      await refreshSaveState();
      if (MOBILE_MENU) { try { await document.getElementById('bg').decode(); } catch (e) {} }
      render();
      selVisible = true; updateActive();
      menuActive = true;
      AssetsCache.revealPage();
      return;
    }

    // Primera vez: mostrar pantalla de carga
    AssetsCache.showLoading();
    const loadingBar = document.getElementById('loading-bar');
    const loadingText = document.getElementById('loading-text');

    // Ajustes + idioma primero: la pantalla de carga ya sale traducida
    await AssetsCache.loadSettings();
    fallback = await loadLang('es');
    translations = await loadLang();
    document.getElementById('loading-subtitle').textContent = t('menu.subtitle');

    // Taglines rotativos mientras carga (y tras "pulsa para empezar"):
    // venden el valor del juego — partida unica, puzles infinitos
    const tipsEl = document.getElementById('loading-tips');
    const TIP_KEYS = ['loading.tip1', 'loading.tip2', 'loading.tip3'];
    let tipIdx = Math.floor(Math.random() * TIP_KEYS.length);
    let tipsTimer = null;
    const showTip = () => {
      tipsEl.classList.remove('show');
      setTimeout(() => {
        tipsEl.textContent = t(TIP_KEYS[tipIdx % TIP_KEYS.length]);
        tipIdx++;
        tipsEl.classList.add('show');
      }, 700);
    };
    tipsEl.textContent = t(TIP_KEYS[tipIdx++ % TIP_KEYS.length]);
    tipsEl.classList.add('show');
    tipsTimer = setInterval(showTip, 4500);
    loadingScreenCleanup = () => { clearInterval(tipsTimer); };

    // Precargar TODO (manifiesto completo de assets del servidor)
    await AssetsCache.preloadAll((loaded, total) => {
      const pct = Math.round((loaded / total) * 100);
      loadingBar.style.width = pct + '%';
      loadingText.textContent = t('loading.text') + ' ' + pct + '%';
    });

    // Cargar botones calibrados
    await loadButtons();

    // Cargar glow guardado
    try {
      const r = await fetch('/api/load-glow');
      if (r.ok) {
        const cfg = await r.json();
        if (cfg.glowX !== undefined) glowX = cfg.glowX;
        if (cfg.glowY !== undefined) glowY = cfg.glowY;
        if (cfg.glowOp !== undefined) glowOp = cfg.glowOp;
        if (cfg.glowBlur !== undefined) glowBlur = cfg.glowBlur;
        applyGlow();
      }
    } catch {}

    // Estado de partida guardada (habilita/deshabilita Continuar)
    await refreshSaveState();

    // Renderizar menu
    render();

    // "Pulsa para empezar": el gesto desbloquea audio y arranca la música
    const startHint = document.getElementById('start-hint');
    startHint.textContent = t('loading.pressStart');
    startHint.style.display = 'block';
    const loadingScreen = document.getElementById('loading-screen');
    const enterGame = () => {
      if (loadingScreenCleanup) loadingScreenCleanup();
      selVisible = true; updateActive();
      menuActive = true;
      unlockAudio();
      AssetsCache.startMusic(AssetsCache.MUSIC.main);
      sessionStorage.setItem('runika-session', 'active');
      AssetsCache.revealPage();
    };
    loadingScreen.addEventListener('click', enterGame, { once: true });
    document.addEventListener('keydown', enterGame, { once: true });
  })();

  // Versión del juego, abajo a la derecha (de /api/version → package.json)
  fetch('/api/version').then(r => r.json()).then(d => {
    if (d && d.version) document.getElementById('version-tag').textContent = 'v' + d.version;
  }).catch(() => {});

  // === Autopiloto ?auto=1: salta "pulsa para empezar" (click sobre la
  // pantalla de carga, no Enter — así no se activa el botón 0) y entra en
  // Continuar/Nueva partida para encadenar la toma ===
  if (AUTO_MODE) (async () => {
    const t0 = Date.now();
    while (document.getElementById('start-hint').style.display !== 'block' && Date.now() - t0 < 30000)
      await new Promise(r => setTimeout(r, 300));
    document.getElementById('loading-screen').click();
    await new Promise(r => setTimeout(r, 2200));
    // La toma empieza en "Nueva partida": la selección de personaje es
    // parte del show (carrusel + máquina de escribir)
    activate(0);
  })();

  bg.addEventListener('load', render);
  window.addEventListener('resize', render);
</script>

</body>
