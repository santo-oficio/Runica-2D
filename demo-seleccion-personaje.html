<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Selección de personaje</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schoolbell&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}#stage{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;outline:none}#bg{width:100%;height:100%;object-fit:contain;display:block}#overlay{position:absolute;inset:0;pointer-events:auto}#avatar-slots,#button-overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.avatar-slot{position:absolute;overflow:hidden;clip-path:inset(0);contain:paint;background:transparent;pointer-events:none}.avatar-slot img{position:absolute;inset:0;display:block;width:100%;height:100%;max-width:none;max-height:none;object-fit:cover;background:transparent;pointer-events:none}.button-hit{fill:transparent;stroke:transparent;pointer-events:auto;cursor:pointer}.button-hit.focused{fill:rgba(255,213,79,.12);stroke:#ffd54f;stroke-width:3;filter:drop-shadow(0 0 6px #ffd54f)}.hotspot{position:absolute;border:2px solid transparent;border-radius:10px;pointer-events:auto;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}.hotspot:hover,.hotspot.focused{border-color:#ffd54f;box-shadow:0 0 0 3px #ffb300,0 0 18px 6px rgba(255,213,79,.9);transform:scale(1.07);z-index:10}.hotspot.avatar,.hotspot.avatar:hover,.hotspot.avatar.selected{border-color:transparent;box-shadow:none;transform:none}.hotspot.letter.pressed{background:rgba(255,235,59,.6);transform:scale(.93)}#name-display{position:absolute;display:flex;align-items:center;justify-content:center;font-family:'Schoolbell',cursive;font-weight:400;font-size:clamp(16px,2.4vw,28px);letter-spacing:3px;color:#2b1a0a;text-transform:uppercase;pointer-events:none;text-shadow:1px 1px 0 rgba(255,240,180,.5)}#confirm{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.25);pointer-events:none;color:#fff8d0;font:900 clamp(18px,3vw,42px) 'Courier New',monospace;text-shadow:0 0 18px #ffd54f,3px 3px 4px #000;letter-spacing:4px;text-transform:uppercase}#confirm.show{display:flex}
</style>
</head>
<body tabindex="0">
<div id="stage" tabindex="0"><img id="bg" src="/assets/menu%20principal/seleccion_personaje.png?v=template-8k" alt=""><div id="overlay"><div id="avatar-slots"></div><svg id="button-overlay"></svg></div><div id="confirm">Seleccionado</div></div>
<script>
const bg=document.getElementById('bg'),overlay=document.getElementById('overlay'),avatarSlotsEl=document.getElementById('avatar-slots'),buttonOverlay=document.getElementById('button-overlay'),nameDisplay=document.createElement('div'),confirm=document.getElementById('confirm');
const moveSound=new Audio('/assets/sounds/comun/menu_mover.wav');
const selectSound=new Audio('/assets/sounds/comun/menu_seleccionar.wav');
const typeSound=new Audio('/assets/sounds/comun/pulsacion%20maquina%20escribir.mp3');
function playSound(audio,volume=.7){const sound=audio.cloneNode();sound.volume=volume;sound.play().catch(()=>{});}
const NAMES=['Capitán Hueso Rojo','Barba Corta','Espectro Hielo','Bruja Vudú Morada','Almirante Sombra','Monóculo Blanco','Veterano Parche','Pirata Pelirroja'];
const FRAMES=[{x:.324,y:.283,w:.081,h:.107},{x:.421,y:.281,w:.081,h:.108},{x:.513,y:.279,w:.076,h:.108},{x:.605,y:.279,w:.078,h:.109},{x:.325,y:.403,w:.080,h:.111},{x:.420,y:.403,w:.080,h:.112},{x:.513,y:.401,w:.076,h:.112},{x:.603,y:.401,w:.078,h:.112}];
const KEY_ROWS=[
 [['A',.321,.661,.035,.068],['B',.360,.661,.035,.068],['C',.399,.661,.035,.068],['D',.438,.661,.035,.068],['E',.477,.661,.035,.068],['F',.516,.661,.035,.068],['G',.555,.661,.035,.068],['H',.594,.661,.035,.068],['I',.633,.661,.035,.068],['J',.672,.661,.035,.068]],
 [['K',.321,.740,.035,.067],['L',.360,.740,.035,.067],['M',.399,.740,.035,.067],['N',.438,.740,.035,.067],['O',.477,.740,.035,.067],['P',.516,.740,.035,.067],['Q',.555,.740,.035,.067],['R',.594,.740,.035,.067],['S',.633,.740,.035,.067],['T',.665,.740,.037,.067]],
 [['U',.322,.822,.045,.080],['V',.371,.822,.045,.080],['W',.414,.822,.042,.076],['X',.460,.822,.044,.080],['Y',.508,.822,.045,.080],['Z',.563,.824,.036,.078],['Borrar',.611,.827,.106,.077]]
];
const LEFT_ARROW={x:.214,y:.818,w:.079,h:.117},RIGHT_ARROW={x:.727,y:.818,w:.074,h:.114};
let selected=0,typed='',focus={type:'avatar',index:0},nodes=[],buttonPolygons=null,avatarSlotData=null,nameArea={x:.322,y:.565,w:.375,h:.1},legacyButtons=false,legacyAvatars=false,legacyName=false;
nameDisplay.id='name-display';overlay.appendChild(nameDisplay);
const AVATAR_SRCS=Array.from({length:8},(_,i)=>`/assets/avatars/thumbs/avatar_${String(i+1).padStart(2,'0')}.png`);
function preload(srcs){return Promise.all(srcs.map(s=>new Promise(r=>{const im=new Image();im.onload=im.onerror=()=>r();im.src=s})))}
const avatarSlotEls=[],avatarImgEls=[];
for(let i=0;i<8;i++){const slot=document.createElement('div');slot.className='avatar-slot';const img=document.createElement('img');img.src=AVATAR_SRCS[i];img.alt='';slot.appendChild(img);avatarSlotsEl.appendChild(slot);avatarSlotEls.push(slot);avatarImgEls.push(img)}
function contentRect(){const w=innerWidth,h=innerHeight,ratio=1.5;let cw=w,ch=w/ratio;if(ch>h){ch=h;cw=h*ratio}return{left:(w-cw)/2,top:(h-ch)/2,width:cw,height:ch}}function viewportRect(){return{left:0,top:0,width:innerWidth,height:innerHeight}}
function place(el,a,r){el.style.left=(r.left+a.x*r.width)+'px';el.style.top=(r.top+a.y*r.height)+'px';el.style.width=(a.w*r.width)+'px';el.style.height=(a.h*r.height)+'px'}
function add(type,index,label,a,r){const el=document.createElement('div');el.className='hotspot '+type+(focus.type===type&&focus.index===index?' focused':'');place(el,a,r);el.addEventListener('mouseenter',()=>{if(focus.type!==type||focus.index!==index)setFocus(type,index)});el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();setFocus(type,index);playSound(type==='button'&&index<KEY_ROWS.flat().length?typeSound:selectSound);activate()});overlay.appendChild(el);nodes.push({type,index,x:a.x+a.w/2,y:a.y+a.h/2})}
function updateAvatarSlot(index,a,r){const slot=avatarSlotEls[index],img=avatarImgEls[index];slot.className='avatar-slot'+(index===selected?' selected':'')+(focus.type==='avatar'&&focus.index===index?' focused':'');place(slot,a,r);img.style.left='0';img.style.top='0';img.style.width='100%';img.style.height='100%'}
function buttonPolygon(index){if(buttonPolygons?.[index]?.length>=3)return buttonPolygons[index];const a=[...KEY_ROWS.flat().map(k=>({x:k[1],y:k[2],w:k[3],h:k[4]})),{...LEFT_ARROW},{...RIGHT_ARROW}][index];return[[a.x,a.y],[a.x+a.w,a.y],[a.x+a.w,a.y+a.h],[a.x,a.y+a.h]]}
function addButton(index,poly,r){const el=document.createElementNS('http://www.w3.org/2000/svg','polygon');el.classList.add('button-hit');el.setAttribute('points',poly.map(p=>`${r.left+p[0]*r.width},${r.top+p[1]*r.height}`).join(' '));el.addEventListener('pointerenter',()=>{if(focus.type!=='button'||focus.index!==index)setFocus('button',index)});if(focus.type==='button'&&focus.index===index)el.classList.add('focused');el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();setFocus('button',index);playSound(index<KEY_ROWS.flat().length?typeSound:selectSound);activate()});buttonOverlay.appendChild(el);const center=poly.reduce((a,p)=>[a[0]+p[0]/poly.length,a[1]+p[1]/poly.length],[0,0]);nodes.push({type:'button',index,x:center[0],y:center[1]})}
function render(){overlay.querySelectorAll('.hotspot').forEach(e=>e.remove());buttonOverlay.innerHTML='';nodes=[];const r=contentRect(),avatarRect=legacyAvatars?viewportRect():r,buttonRect=legacyButtons?viewportRect():r,nameRect=legacyName?viewportRect():r;buttonOverlay.setAttribute('viewBox',`0 0 ${innerWidth} ${innerHeight}`);FRAMES.forEach((a,i)=>{const s=avatarSlotData?.[i]||a;updateAvatarSlot(i,s,avatarRect);add('avatar',i,NAMES[i],s,avatarRect)});const buttonCount=KEY_ROWS.flat().length+2;for(let i=0;i<buttonCount;i++)addButton(i,buttonPolygon(i),buttonRect);place(nameDisplay,nameArea,nameRect);nameDisplay.textContent=typed||'_'}
function setFocus(type,index){focus={type,index};render()}
function activate(){if(focus.type==='avatar'){selected=focus.index;render();return}if(focus.type==='button'){const buttons=KEY_ROWS.flat().map(k=>k[0]);if(focus.index<buttons.length){const key=buttons[focus.index];if(key==='Borrar')typed=typed.slice(0,-1);else if(typed.length<12)typed+=key;render();return}moveFocus(focus.index===buttons.length?-1:1,0)}}
function moveFocus(dx,dy){const cur=nodes.find(n=>n.type===focus.type&&n.index===focus.index)||nodes[0];const candidates=nodes.filter(n=>{const vx=n.x-cur.x,vy=n.y-cur.y;if(dx)return Math.sign(vx)===Math.sign(dx)&&Math.abs(vx)>.004&&Math.abs(vx)>=Math.abs(vy)*.2;return Math.sign(vy)===Math.sign(dy)&&Math.abs(vy)>.004&&Math.abs(vy)>=Math.abs(vx)*.2});if(!candidates.length)return false;candidates.sort((a,b)=>Math.hypot(a.x-cur.x,a.y-cur.y)-Math.hypot(b.x-cur.x,b.y-cur.y));setFocus(candidates[0].type,candidates[0].index);playSound(moveSound,.5);return true}
function handleKey(e){if(e.key==='ArrowRight'){e.preventDefault();moveFocus(1,0)}else if(e.key==='ArrowLeft'){e.preventDefault();moveFocus(-1,0)}else if(e.key==='ArrowDown'){e.preventDefault();moveFocus(0,1)}else if(e.key==='ArrowUp'){e.preventDefault();moveFocus(0,-1)}else if(e.key==='Enter'){e.preventDefault();playSound(selectSound);activate()}else if(e.key==='Backspace'){e.preventDefault();typed=typed.slice(0,-1);playSound(typeSound);render()}else if(/^[a-zA-Z]$/.test(e.key)){e.preventDefault();if(typed.length<12)typed+=e.key.toUpperCase();playSound(typeSound);render()}}
window.addEventListener('keydown',handleKey);bg.addEventListener('load',render);window.addEventListener('resize',render);Promise.all([preload(AVATAR_SRCS),fetch('/api/load-selection-buttons').then(r=>r.ok?r.json():null),fetch('/api/load-character-positions').then(r=>r.ok?r.json():null),fetch('/api/load-selection-name').then(r=>r.ok?r.json():null)]).then(([,buttonData,avatarData,nameData])=>{buttonPolygons=buttonData?.buttons?.map(b=>b.polygon||null)||null;avatarSlotData=avatarData?.slots||(avatarData?.polygons?.map(p=>p?.length>=3?{x:Math.min(...p.map(q=>q[0])),y:Math.min(...p.map(q=>q[1])),w:Math.max(...p.map(q=>q[0]))-Math.min(...p.map(q=>q[0])),h:Math.max(...p.map(q=>q[1]))-Math.min(...p.map(q=>q[1]))}:null))||null;legacyButtons=Boolean(buttonData&&!buttonData.coordinateSpace);legacyAvatars=Boolean(avatarData&&!avatarData.coordinateSpace);if(nameData?.w>0&&nameData?.h>0){nameArea=nameData;legacyName=!nameData.coordinateSpace}render()}).catch(()=>render());document.body.focus();
</script>
</body>
</html>
