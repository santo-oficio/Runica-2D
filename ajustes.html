<!DOCTYPE html>
<html lang="es">
<head>
<script src="/web/webdb.js"></script>
<script src="/web/solver.bundle.js"></script>
<script src="/web/api-shim.js"></script>
<script src="/web/tizen.js"></script>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title></title>
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #0a0805; overflow: hidden;
  }
  #stage {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #bg {
    width: 100%; height: 100%;
    object-fit: contain; display: block;
    position: relative; z-index: 1;
  }
  /* La imagen es 3:2: rellena los bordes del letterbox con una copia
     difuminada del mismo fondo, sin estirar ni recortar el arte */
  #fillbg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    filter: blur(45px) brightness(0.42) saturate(1.25);
    transform: scale(1.15);
    z-index: 0;
  }
  #overlay {
    position: absolute; inset: 0;
    z-index: 10; pointer-events: none;
  }
  #polys {
    position: absolute; inset: 0;
    z-index: 11; pointer-events: none;
  }
  .cfg-text {
    position: absolute;
    display: flex; align-items: center; justify-content: center;
    font-family: 'ChelseaMarket', cursive;
    color: #3a2410;
    text-shadow: 0 1px 1px rgba(255,240,200,0.35);
    white-space: nowrap; overflow: visible;
    pointer-events: auto; cursor: default;
    user-select: none;
  }
  .cfg-check {
    position: absolute;
    display: flex; align-items: center; justify-content: center;
    font-family: 'ChelseaMarket', cursive;
    color: #2a5a1a;
    pointer-events: auto; cursor: pointer;
    user-select: none;
  }
  .hot {
    position: absolute;
    pointer-events: auto; cursor: pointer;
    background: transparent; border: none;
  }
  .focus-ring {
    position: absolute;
    border: 2px solid rgba(240, 216, 144, 0.95);
    /* El único elemento con caja de foco es el botón atrás, que es
       circular — el ring abraza su forma */
    border-radius: 50%;
    box-shadow: 0 0 14px 3px rgba(240, 216, 144, 0.55),
                inset 0 0 8px rgba(240, 216, 144, 0.35);
    pointer-events: none;
    z-index: 12;
  }
  /* El foco en las opciones (sonido/música/idioma) es subrayar las
     palabras con el marrón oscuro de los iconos — nunca una caja */
  .cfg-text.focused {
    text-decoration: underline;
    text-decoration-color: #3a2410;
    text-decoration-thickness: max(2px, 0.055em);
    text-underline-offset: 0.14em;
  }
  #transition-overlay {
    position: fixed; inset: 0;
    z-index: 90; background: #000;
    opacity: 1; pointer-events: none;
    transition: opacity 0.45s ease;
  }
</style>
</head>
<body>

<div id="stage">
  <img id="fillbg" src="/assets/configuracion/configuracion.169.webp?v=cfgq-1" alt="">
  <img id="bg" alt="">
  <div id="overlay"></div>
  <svg id="polys"></svg>
  <div class="focus-ring" id="ring" style="display:none"></div>
</div>
<div id="transition-overlay"></div>

<script src="/assets-cache.js"></script>
<script>
  const LANGS = ['es', 'en', 'fr', 'de', 'it', 'ja', 'zh', 'ru', 'tr', 'pl'];
  const LANG_NAMES = { es: 'Español', en: 'English', fr: 'Français', de: 'Deutsch', it: 'Italiano', ja: '日本語', zh: '中文', ru: 'Русский', tr: 'Türkçe', pl: 'Polski' };
  const IMG_URL = '/assets/configuracion/configuracion.169.webp?v=cfgq-1';
  // Orden de navegacion vertical
  const FIELDS = ['sound', 'music', 'lang', 'back'];

  let areas = {};
  let translations = {};
  let fallback = {};
  let imgRect = { x: 0, y: 0, w: 0, h: 0 };
  let focusIdx = 0;
  let selVisible = false;
  let cfg = { sound: true, music: true, lang: 'es' };
  let bgImage = null; // referencia viva de la imagen decodificada

  function t(key) { return translations[key] ?? fallback[key] ?? key; }

  async function loadLang(lang) {
    const r = await fetch('/api/i18n' + (lang ? '/' + lang : ''));
    if (!r.ok) return {};
    return await r.json();
  }

  async function loadAreas() {
    const r = await fetch('/api/load-config-areas');
    if (!r.ok) return;
    const data = await r.json();
    areas = data.areas || {};
  }

  // Rect visible de la imagen (object-fit: contain, ratio 3:2)
  function updateImgRect() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const iw = bgImage ? bgImage.naturalWidth : 3;
    const ih = bgImage ? bgImage.naturalHeight : 2;
    const cs = bgImage ? getComputedStyle(bgImage) : null;
    if (cs && cs.objectFit === 'fill') {
      imgRect = { w: vw, h: vh, x: 0, y: 0 };
      return;
    }
    const scale = cs && cs.objectFit === 'cover'
      ? Math.max(vw / iw, vh / ih)
      : Math.min(vw / iw, vh / ih);
    const pos = cs ? (cs.objectPosition || '50% 50%').trim().split(/\s+/) : [];
    const ox = (parseFloat(pos[0]) || 50) / 100, oy = (parseFloat(pos[1] ?? pos[0]) || 50) / 100;
    imgRect = {
      w: iw * scale,
      h: ih * scale,
      x: (vw - iw * scale) * ox,
      y: (vh - ih * scale) * oy,
    };
  }
  const rx = x => imgRect.x + x * imgRect.w;
  const ry = y => imgRect.y + y * imgRect.h;
  const rw = w => w * imgRect.w;
  const rh = h => h * imgRect.h;

  function polyBounds(poly) {
    let minX = 1, minY = 1, maxX = 0, maxY = 0;
    for (const [x, y] of poly) {
      minX = Math.min(minX, x); maxX = Math.max(maxX, x);
      minY = Math.min(minY, y); maxY = Math.max(maxY, y);
    }
    return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
  }
  function unionRect(a, b) {
    const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
    return { x, y, w: Math.max(a.x + a.w, b.x + b.w) - x, h: Math.max(a.y + a.h, b.y + b.h) - y };
  }
  function fieldBounds(field) {
    if (field === 'sound') return unionRect(areas.soundText, areas.soundCheck);
    if (field === 'music') return unionRect(areas.musicText, areas.musicCheck);
    if (field === 'lang') {
      let u = unionRect(areas.langLabel, areas.langText);
      for (const k of ['langLeft', 'langRight']) {
        if (areas[k]?.polygon) u = unionRect(u, polyBounds(areas[k].polygon));
      }
      return u;
    }
    if (field === 'back') {
      const e = areas.back?.ring || areas.back?.ellipse;
      if (e) return { x: e.cx - e.rx, y: e.cy - e.ry, w: e.rx * 2, h: e.ry * 2 };
      if (areas.back?.polygon) return polyBounds(areas.back.polygon);
    }
    return null;
  }

  function fontSizeFor(area, text) {
    const px = area.h * imgRect.h * 0.62 * (area.fontScale || 1);
    return Math.max(8, px);
  }

  function makeText(area, text, field) {
    const el = document.createElement('div');
    el.className = 'cfg-text';
    if (field) el.dataset.field = field;
    el.style.left = rx(area.x) + 'px';
    el.style.top = ry(area.y) + 'px';
    el.style.width = rw(area.w) + 'px';
    el.style.height = rh(area.h) + 'px';
    const px = fontSizeFor(area, text);
    el.style.fontSize = px + 'px';
    el.textContent = text;
    return el;
  }

  // Ajuste de ancho DESPUÉS de insertar en el DOM (un elemento sin
  // adjuntar tiene scrollWidth = 0 y nunca encogería la fuente)
  function fitTexts() {
    for (const el of document.querySelectorAll('.cfg-text')) {
      const maxW = el.clientWidth;
      if (maxW <= 0) continue;
      const px = parseFloat(el.style.fontSize);
      if (el.scrollWidth > maxW) {
        el.style.fontSize = Math.max(8, px * maxW / el.scrollWidth) + 'px';
      }
    }
  }

  function makeCheck(area, on) {
    const el = document.createElement('div');
    el.className = 'cfg-check';
    el.style.left = rx(area.x) + 'px';
    el.style.top = ry(area.y) + 'px';
    el.style.width = rw(area.w) + 'px';
    el.style.height = rh(area.h) + 'px';
    el.style.fontSize = (area.h * imgRect.h * 0.9) + 'px';
    el.textContent = on ? '✓' : '';
    return el;
  }

  function render() {
    const ov = document.getElementById('overlay');
    const polys = document.getElementById('polys');
    ov.innerHTML = '';
    polys.innerHTML = '';
    polys.setAttribute('width', window.innerWidth);
    polys.setAttribute('height', window.innerHeight);
    if (!areas.soundText) return;

    // Textos
    ov.appendChild(makeText(areas.soundText, t('config.sound'), 'sound'));
    ov.appendChild(makeText(areas.musicText, t('config.music'), 'music'));
    if (areas.langLabel) ov.appendChild(makeText(areas.langLabel, t('menu.language'), 'lang'));
    ov.appendChild(makeText(areas.langText, LANG_NAMES[cfg.lang] || cfg.lang, 'lang'));
    fitTexts();

    // Checkboxes
    ov.appendChild(makeCheck(areas.soundCheck, cfg.sound !== false));
    ov.appendChild(makeCheck(areas.musicCheck, cfg.music !== false));

    // Hotspot fila sonido
    addHotspot(fieldBounds('sound'), () => toggle('sound'), 'sound');
    // Hotspot fila musica
    addHotspot(fieldBounds('music'), () => toggle('music'), 'music');
    // Hotspot fila idioma (etiqueta + texto, no las flechas)
    addHotspot(unionRect(areas.langLabel, areas.langText), () => {}, 'lang');

    // Flechas idioma (poligonos)
    for (const [key, dir] of [['langLeft', -1], ['langRight', 1]]) {
      const a = areas[key];
      if (!a?.polygon) continue;
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      p.setAttribute('points', a.polygon.map(([x, y]) => `${rx(x)},${ry(y)}`).join(' '));
      p.setAttribute('fill', 'rgba(0,0,0,0)');
      p.style.pointerEvents = 'all';
      p.style.cursor = 'pointer';
      p.addEventListener('click', () => { cycleLang(dir); });
      p.addEventListener('mouseenter', () => { if (FIELDS[focusIdx] !== 'lang') playHover(); setFocus('lang', true); });
      polys.appendChild(p);
    }

    // Atras (elipse calibrada; poligono legacy si no hay elipse)
    if (areas.back?.ellipse || areas.back?.polygon) {
      const e = areas.back.ellipse;
      const p = e
        ? (() => { const el = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
            el.setAttribute('cx', rx(e.cx)); el.setAttribute('cy', ry(e.cy));
            el.setAttribute('rx', rw(e.rx)); el.setAttribute('ry', rh(e.ry));
            return el; })()
        : (() => { const el = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
            el.setAttribute('points', areas.back.polygon.map(([x, y]) => `${rx(x)},${ry(y)}`).join(' '));
            return el; })();
      p.setAttribute('fill', 'rgba(0,0,0,0)');
      p.style.pointerEvents = 'all';
      p.style.cursor = 'pointer';
      p.addEventListener('click', () => goBack());
      p.addEventListener('mouseenter', () => { if (FIELDS[focusIdx] !== 'back') playHover(); setFocus('back', true); });
      polys.appendChild(p);
    }

    drawRing();
  }

  function addHotspot(rect, onClick, field) {
    if (!rect) return;
    const d = document.createElement('div');
    d.className = 'hot';
    d.style.left = rx(rect.x) + 'px';
    d.style.top = ry(rect.y) + 'px';
    d.style.width = rw(rect.w) + 'px';
    d.style.height = rh(rect.h) + 'px';
    d.addEventListener('click', onClick);
    d.addEventListener('mouseenter', () => { if (FIELDS[focusIdx] !== field) playHover(); setFocus(field, true); });
    document.getElementById('overlay').appendChild(d);
  }

  function drawRing() {
    const ring = document.getElementById('ring');
    const field = FIELDS[focusIdx];
    // Las opciones señalan el foco subrayando sus palabras; solo el
    // botón atrás conserva la caja de selección
    document.querySelectorAll('.cfg-text[data-field]').forEach(el =>
      el.classList.toggle('focused', selVisible && el.dataset.field === field));
    if (!selVisible || field !== 'back') { ring.style.display = 'none'; return; }
    const b = fieldBounds(field);
    if (!b) { ring.style.display = 'none'; return; }
    ring.style.display = 'block';
    ring.style.borderRadius = areas.back?.ellipse ? '50%' : '';
    ring.style.left = (rx(b.x) - 6) + 'px';
    ring.style.top = (ry(b.y) - 6) + 'px';
    ring.style.width = (rw(b.w) + 12) + 'px';
    ring.style.height = (rh(b.h) + 12) + 'px';
  }

  function setFocus(field, visible) {
    const i = FIELDS.indexOf(field);
    if (i === -1) return;
    focusIdx = i;
    selVisible = visible;
    drawRing();
  }

  async function toggle(key) {
    cfg[key] = !cfg[key];
    AssetsCache.setSetting(key, cfg[key]);
    AssetsCache.playSound('/assets/sounds/comun/press.wav', 0.6);
    render();
  }

  async function cycleLang(dir) {
    const i = LANGS.indexOf(cfg.lang);
    cfg.lang = LANGS[(i + dir + LANGS.length) % LANGS.length];
    AssetsCache.setSetting('lang', cfg.lang);
    AssetsCache.playSound('/assets/sounds/comun/press.wav', 0.6);
    translations = await loadLang();
    render();
  }

  // Audio: desbloqueo + retomar la musica de la pantalla anterior
  AssetsCache.unlockAudio();
  document.addEventListener('click', () => AssetsCache.unlockAudio(), { once: true });
  document.addEventListener('keydown', () => AssetsCache.unlockAudio(), { once: true });

  function playHover() {
    AssetsCache.playSound('/assets/sounds/comun/hover.wav', 0.45);
  }

  function goBack() {
    AssetsCache.playSound('/assets/sounds/comun/back.wav', 0.6);
    AssetsCache.transitionTo('/menu.html');
  }

  // Teclado
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { goBack(); return; }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      const dir = e.key === 'ArrowDown' ? 1 : -1;
      focusIdx = (focusIdx + dir + FIELDS.length) % FIELDS.length;
      selVisible = true;
      drawRing();
      AssetsCache.playSound('/assets/sounds/comun/move.wav', 0.5);
      return;
    }
    const field = FIELDS[focusIdx];
    if (field === 'lang' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
      e.preventDefault();
      cycleLang(e.key === 'ArrowLeft' ? -1 : 1);
      return;
    }
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      selVisible = true;
      if (field === 'sound') toggle('sound');
      else if (field === 'music') toggle('music');
      else if (field === 'lang') cycleLang(1);
      else if (field === 'back') goBack();
    }
  });

  window.addEventListener('resize', () => { updateImgRect(); render(); });

  // --- Init ---
  (async () => {
    try {
    cfg = await AssetsCache.loadSettings();
    fallback = await loadLang('es');
    translations = await loadLang();
    await loadAreas();
    AssetsCache.setMusicTrack(AssetsCache.MUSIC.main);

    // Precargar la imagen antes de mostrar (con red de seguridad por si decode cuelga)
    bgImage = new Image();
    bgImage.src = AssetsCache.getCachedImageUrl(IMG_URL);
    try {
      await Promise.race([
        bgImage.decode(),
        new Promise(r => setTimeout(r, 3000)),
      ]);
    } catch {}
    document.getElementById('bg').src = bgImage.src;

    // Esperar la fuente antes de medir textos (scrollWidth con la fuente de
    // sistema sale más estrecho y luego ChelseaMarket desborda el área)
    try {
      await Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]);
    } catch {}

    updateImgRect();
    render();
    document.fonts.ready.then(() => render()).catch(() => {});

    document.title = t('menu.settings') + ' — Runika 2D';
    // Fade-in
    const ov = document.getElementById('transition-overlay');
    requestAnimationFrame(() => { ov.style.opacity = '0'; });
    } catch (e) { console.error('[aj] init fail', e); }
  })();
</script>

</body>
</html>
