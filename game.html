<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Runika 2D</title>
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000; overflow: hidden;
    font-family: 'ChelseaMarket', cursive; color: #e0e0e0;
  }
  #stage {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  #image { width: 100%; height: 100%; object-fit: contain; display: block; }
  #selector {
    position: absolute; z-index: 15; pointer-events: none;
    transition: left 0.15s ease-in-out, top 0.15s ease-in-out;
  }
  #avatar {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
  }
  #entities {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none; z-index: 13;
  }
  .entity {
    position: absolute; pointer-events: none;
    transition: left 0.25s ease-in-out, top 0.25s ease-in-out;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
  }
  .entity.trap { animation: spin 3s linear infinite; }
  .entity.stunned {
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6)) brightness(0.55) saturate(0.4);
    opacity: 0.75;
  }
  .entity.wall {
    background: rgba(20, 20, 30, 0.85);
    border: 2px solid rgba(80, 80, 100, 0.6);
    border-radius: 4px;
    box-shadow: inset 0 0 8px rgba(0,0,0,0.5);
    filter: none;
    transition: none;
  }
  .entity.goal {
    filter: drop-shadow(0 0 8px #ff0) drop-shadow(0 0 4px #ff0);
    animation: goalPulse 1s ease-in-out infinite;
  }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes goalPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
  @keyframes trapShake {
    0% { transform: rotate(0deg) scale(1); }
    20% { transform: rotate(-15deg) scale(0.9) translateX(3px); }
    40% { transform: rotate(15deg) scale(1.1) translateX(-3px); }
    60% { transform: rotate(-10deg) scale(0.95) translateY(2px); }
    80% { transform: rotate(10deg) scale(1.05) translateY(-2px); }
    100% { transform: rotate(0deg) scale(1); }
  }
  #hud {
    position: absolute; top: 12px; left: 12px; z-index: 20;
    background: rgba(0,0,0,0.65); padding: 8px 14px;
    border-radius: 4px; border: 1px solid rgba(126,200,227,0.3);
    font-size: 0.8em;
  }
  #hud .world { color: #7ec8e3; font-weight: bold; }
  #hud .meta { color: #888; }
  #hud .pos { color: #0ff; }
  #hud .turn { color: #fc4; }
  #help {
    position: absolute; bottom: 12px; left: 50%;
    transform: translateX(-50%); z-index: 20;
    background: rgba(0,0,0,0.65); padding: 6px 14px;
    border-radius: 4px; font-size: 0.72em; color: #aaa;
    text-align: center; line-height: 1.5;
  }
  #help .key { color: #0ff; }
  #practice-tag {
    position: absolute; top: 12px; right: 12px; z-index: 20;
    background: rgba(255,204,68,0.15); color: #fc4;
    border: 1px solid rgba(255,204,68,0.5);
    padding: 6px 12px; border-radius: 4px; font-size: 0.72em;
  }
  #overlay {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%; z-index: 30;
    display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.7); flex-direction: column;
  }
  #overlay.show { display: flex; }
  #overlay .title {
    font-size: 2.5em; font-weight: bold; margin-bottom: 10px;
    text-shadow: 0 0 20px currentColor;
  }
  #overlay.win .title { color: #ff0; }
  #overlay.lose .title { color: #f44; }
  #overlay .subtitle { font-size: 1em; color: #aaa; margin-bottom: 20px; }
  #overlay .restart {
    font-size: 0.9em; color: #0ff; cursor: pointer;
    border: 1px solid #0ff; padding: 8px 20px; border-radius: 4px;
  }
  #overlay .restart:hover { background: rgba(0,255,255,0.1); }
  /* Modal de victoria (calibrado en calibrate-modal.html): rojo=reiniciar, verde=continuar */
  #modal-overlay{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;opacity:0;transition:opacity .3s ease}
  #modal-overlay.show{display:flex}#modal-overlay.visible{opacity:1}
  #modal-box{position:relative;width:min(80vh,64vw);aspect-ratio:3/2}
  #modal-img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}
  #modal-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  #modal-svg text{font-family:'ChelseaMarket',cursive;fill:#ffe9b0;paint-order:stroke;stroke:rgba(60,30,10,.7);stroke-width:1.5px}
  #modal-content{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;font-family:'ChelseaMarket',cursive;color:#3a2810;line-height:1.3;pointer-events:none}
  .modal-btn{position:absolute;display:flex;align-items:center;justify-content:center;font-family:'ChelseaMarket',cursive;color:#ffe9b0;text-shadow:0 1px 3px rgba(0,0,0,.75);cursor:pointer;user-select:none}
  polygon.modal-sel{fill:rgba(255,213,79,.08);stroke:#ffd54f;stroke-width:3px;display:none;filter:drop-shadow(0 0 6px rgba(255,213,79,.85))}
  polygon.modal-sel.focused{display:block}
  #boardtexts { position: fixed; inset: 0; pointer-events: none; z-index: 15; display: none; }
  .btext {
    position: absolute; display: flex; align-items: center; justify-content: center;
    color: #fff; font-family: 'ChelseaMarket','Trebuchet MS',sans-serif; font-weight: bold;
    text-align: center; text-shadow: 2px 2px 4px #000, 0 0 10px #000;
    white-space: nowrap; overflow: hidden;
  }
  .btext.gold {
    justify-content: flex-end; color: #ffd34e; text-align: right;
    text-shadow: 1px 1px 2px #000, 0 0 12px rgba(255,180,0,.8), 0 0 26px rgba(255,140,0,.5);
  }
  /* Cuenta atrás antes de empezar la pantallita (5 · 4 · 3 · 2 · 1 · YA) */
  #countdown {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    display: none; z-index: 40; pointer-events: none;
    font-family: 'ChelseaMarket','Trebuchet MS',sans-serif; font-weight: bold;
    font-size: min(24vh, 20vw); color: #ffd34e; line-height: 1;
    text-shadow: 3px 3px 0 #4a2c00, 6px 6px 14px #000,
      0 0 24px rgba(255,180,0,.9), 0 0 60px rgba(255,140,0,.6);
    -webkit-text-stroke: 4px #2a1600;
    animation: cdPop .8s ease-out;
  }
  @keyframes cdPop {
    0% { transform: translate(-50%,-50%) scale(1.8); opacity: 0; }
    18% { transform: translate(-50%,-50%) scale(1); opacity: 1; }
    80% { transform: translate(-50%,-50%) scale(1); opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(.85); opacity: 0; }
  }
  /* Golpe al ser atrapado: sacudida de pantalla + flash rojo */
  @keyframes screenShake {
    0%, 100% { transform: translate(0, 0); }
    10% { transform: translate(-14px, 9px); }
    20% { transform: translate(12px, -10px); }
    30% { transform: translate(-10px, -9px); }
    40% { transform: translate(9px, 8px); }
    50% { transform: translate(-8px, 6px); }
    60% { transform: translate(7px, -6px); }
    70% { transform: translate(-6px, -4px); }
    80% { transform: translate(5px, 4px); }
    90% { transform: translate(-3px, -2px); }
  }
  .shake { animation: screenShake .55s linear; }
  #hitflash {
    position: fixed; inset: 0; pointer-events: none; z-index: 35; display: none;
    background: radial-gradient(ellipse at center,
      rgba(255,30,10,0) 25%, rgba(255,30,10,.5) 78%, rgba(120,0,0,.75) 100%);
  }
  #hitflash.show { display: block; animation: hitFlash .7s ease-out forwards; }
  @keyframes hitFlash {
    0% { opacity: 0; } 12% { opacity: 1; } 100% { opacity: 0; }
  }
</style>
</head>
<body>
  <div id="stage"><img id="image" alt="fondo"></div>
  <div id="selector"><img id="avatar" alt="avatar"></div>
  <div id="entities"></div>
  <div id="boardtexts"></div>
  <div id="countdown"></div>
  <div id="hitflash"></div>
  <audio id="step-sound" preload="auto"></audio>

  <div id="hud">
    <div class="world" id="world-label"></div>
    <div class="meta" id="meta-label"></div>
    <div class="turn" id="turn-label"></div>
    <div class="pos" id="pos-label"></div>
  </div>

  <div id="practice-tag"></div>

  <div id="help"></div>

  <div id="overlay">
    <div class="title" id="overlay-title"></div>
    <div class="subtitle" id="overlay-subtitle"></div>
    <div class="restart" id="overlay-restart"></div>
  </div>

  <div id="modal-overlay"><div id="modal-box"><img id="modal-img" src="/assets/comunes/modal.webp" alt=""><svg id="modal-svg"></svg><div id="modal-content"></div><div id="modal-btn-l" class="modal-btn"></div><div id="modal-btn-r" class="modal-btn"></div></div></div>

<script src="/assets-cache.js"></script>
<script>
// Base URL: si estamos en un preview proxy (puerto != 3000), apuntar al 3000.
const BASE = (window.location.port && window.location.port !== '3000') ? 'http://localhost:3000' : '';

const img = document.getElementById('image');
const selector = document.getElementById('selector');
const avatarImg = document.getElementById('avatar');
const posLabel = document.getElementById('pos-label');
const turnLabel = document.getElementById('turn-label');
const metaLabel = document.getElementById('meta-label');
const worldLabel = document.getElementById('world-label');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlay-title');
const overlaySubtitle = document.getElementById('overlay-subtitle');

// === Práctica: tier seleccionable, pantalla al azar en cada recarga ===
let currentTier = 4; // la partida siempre empieza en el tier 4
const COLS = 8, ROWS = 6;

// === Modo real: ?world=X&level=N → la isla N del submundo X (progreso bbdd) ===
const PARAMS = new URLSearchParams(location.search);
const REAL_WORLD = PARAMS.get('world') || '';
const REAL_LEVEL = Math.max(0, parseInt(PARAMS.get('level') || '0', 10) || 0);
const REAL_MODE = !!REAL_WORLD;
// ?demo=win — tablero de práctica que se auto-gana para mostrar el vuelo
// de monedas + modal de victoria reales. No toca la bbdd.
const DEMO_WIN = PARAMS.get('demo') === 'win';
let playerData = null;
let T = {};
let currentMinMoves = 0;
function tt(k, ...a) { return (T[k] ?? k).replace(/\{(\d+)\}/g, (m, i) => String(a[+i] ?? m)); }
async function loadI18n() {
  try { const r = await fetch(BASE + '/api/i18n'); if (r.ok) T = await r.json(); } catch {}
}
// Textos del modo práctica (HUD + ayuda + etiqueta), todo desde i18n
function applyPracticeTexts() {
  worldLabel.textContent = tt('loading.text');
  document.getElementById('practice-tag').textContent = tt('game.practiceTag');
  document.getElementById('help').innerHTML =
    `<span class="key">${tt('game.keysMove')}</span>: ${tt('game.helpMove')} &nbsp;·&nbsp;` +
    `<span class="key">R</span>: ${tt('game.helpRandom')} &nbsp;·&nbsp;` +
    `<span class="key">[ ]</span>: ${tt('game.helpTier')} &nbsp;·&nbsp;` +
    `<span class="key">Enter</span>: ${tt('game.helpAvatar')} &nbsp;·&nbsp;` +
    `<span class="key">${tt('game.keySpace')}</span>: ${tt('game.helpWorld')}`;
}
const FINAL_ISLAND_IDX = 11;
function backToSubmundo() {
  location.href = '/submundo.html?world=' + encodeURIComponent(REAL_WORLD);
}
// Tras ganar: isla final (boss) -> mapamundi (el mundo queda completado y
// se desactiva); cualquier otra isla -> submundo donde estabas
function afterVictory() {
  if (REAL_LEVEL === FINAL_ISLAND_IDX) {
    // El mapamundi celebra la conquista del mundo (animación + B/N)
    sessionStorage.setItem('runika-world-done', REAL_WORLD);
    location.href = '/mapamundi.html';
  }
  else backToSubmundo();
}

// Avatares ligeros (display webp 2048px) — regla a fuego: nada de masters 8K en el hot path
const AVATARS = Array.from({ length: 8 }, (_, i) =>
  `/assets/avatars/display/avatar_${String(i + 1).padStart(2, '0')}.webp`);
let avatarIdx = parseInt(localStorage.getItem('Runika 2D-avatar-idx') ?? '0', 10) || 0;
avatarImg.src = BASE + AVATARS[avatarIdx];

// === Mundo actual y calibración ===
let worlds = [];
let worldIdx = 0;
let detection = null;
let ba = { x: 0, y: 0, width: 0, height: 0 };       // losas/obstáculos
let avatarBa = { x: 0, y: 0, width: 0, height: 0 }; // avatar/enemigos/meta
let board = { left: 0, top: 0, w: 0, h: 0 };
let avatarBoard = { left: 0, top: 0, w: 0, h: 0 };
let IMG_W = 7680, IMG_H = 4320;

// Rect de la imagen visible (descartando el letterbox de object-fit: contain)
function visibleImageRect() {
  const rect = img.getBoundingClientRect();
  if (!IMG_W || !IMG_H) return rect;
  const scale = Math.min(rect.width / IMG_W, rect.height / IMG_H);
  const w = IMG_W * scale;
  const h = IMG_H * scale;
  return {
    left: rect.left + (rect.width - w) / 2,
    top: rect.top + (rect.height - h) / 2,
    width: w, height: h,
  };
}

function layout() {
  const rect = visibleImageRect();
  board = {
    left: rect.left + ba.x * rect.width,
    top: rect.top + ba.y * rect.height,
    w: ba.width * rect.width,
    h: ba.height * rect.height,
  };
  avatarBoard = {
    left: rect.left + avatarBa.x * rect.width,
    top: rect.top + avatarBa.y * rect.height,
    w: avatarBa.width * rect.width,
    h: avatarBa.height * rect.height,
  };
}

// Posición de celda según el tipo de entidad
function cellPos(c, r, useAvatarArea) {
  const b = useAvatarArea ? avatarBoard : board;
  const cw = b.w / COLS;
  const ch = b.h / ROWS;
  return { left: b.left + c * cw, top: b.top + r * ch, w: cw, h: ch };
}

// === Textos calibrados del tablero (modo real) ===
// Áreas de assets/backgrounds/<M>/text-areas.json: etiqueta+número de turno,
// óptimo, nivel de juego (tier de la curva global) en info, y oro.
let textAreas = null;
let gameLevel = 1;
const BT_KINDS = ['turn', 'nTurn', 'optimal', 'nOptimal', 'info', 'gold'];
const btEls = {};
const boardTextsBox = () => document.getElementById('boardtexts');

function btValue(k) {
  if (k === 'turn') return tt('board.turn');
  if (k === 'nTurn') return String(turn);
  if (k === 'optimal') return tt('board.optimal');
  if (k === 'nOptimal') return String(currentMinMoves);
  if (k === 'gold') return String(playerData?.gold ?? 0);
  return tt('board.level', REAL_MODE ? REAL_LEVEL + 1 : gameLevel); // info → isla (modo real) o tier (práctica)
}

function renderBoardTexts() {
  const box = boardTextsBox();
  if (!(REAL_MODE || DEMO_WIN) || !textAreas) { box.style.display = 'none'; return; }
  box.style.display = 'block';
  const rect = visibleImageRect();
  for (const k of BT_KINDS) {
    const a = textAreas[k];
    if (!a) continue;
    let el = btEls[k];
    if (!el) {
      el = document.createElement('div');
      el.className = 'btext' + (k === 'gold' ? ' gold' : '');
      box.appendChild(el);
      btEls[k] = el;
    }
    const p = { x: rect.left + a.x * rect.width, y: rect.top + a.y * rect.height,
                w: a.w * rect.width, h: a.h * rect.height };
    el.style.cssText = `left:${p.x}px;top:${p.y}px;width:${p.w}px;height:${p.h}px`;
    if (k === 'gold') {
      // Regla a fuego: moneda a la izquierda del número, conjunto pegado a la
      // derecha con ~20px de margen (1% del ancho de imagen visible)
      el.style.paddingRight = (rect.width * 0.01) + 'px';
      el.innerHTML = '';
      const coin = document.createElement('img');
      coin.src = BASE + '/assets/comunes/monedas.webp';
      coin.style.cssText = `height:100%;width:auto;margin-right:${p.h * 0.06}px;flex:none`;
      const span = document.createElement('span');
      span.textContent = btValue(k);
      el.appendChild(coin); el.appendChild(span);
    } else {
      el.textContent = btValue(k);
    }
    let fs = Math.max(12, p.h * .62 * (a.fontScale || 1));
    el.style.fontSize = fs + 'px';
    while ((el.scrollWidth > p.w + 1 || el.scrollHeight > p.h + 1) && fs > 6) {
      fs--; el.style.fontSize = fs + 'px';
    }
  }
}

function updateTurnDisplay() {
  turnLabel.textContent = `${tt('board.turn')}: ${turn}`;
  if (btEls.nTurn) btEls.nTurn.textContent = String(turn);
}

// === Estado del juego ===
let player = { c: 0, r: 0 };
let goal = { c: 0, r: 0 };
let enemies = [];
let playerStunnedTurns = 0;
let obstacleCells = new Set();
let wallCells = new Set();
let trapCells = new Set();
let turn = 0;
let gameOver = false;
let won = false;
let moving = false;
let currentScreenId = null;

// === Sonidos ===
const stepAudio = document.getElementById('step-sound');
const bounceAudio = new Audio(`${BASE}/assets/sounds/comun/choque.wav`);
const trapAudio = new Audio(`${BASE}/assets/sounds/comun/trampa.wav`);
const victoryAudio = new Audio(`${BASE}/assets/sounds/comun/victoria.wav`);
const defeatAudio = new Audio(`${BASE}/assets/sounds/comun/derrota.wav`);
const backAudio = new Audio(`${BASE}/assets/sounds/comun/back.wav`);
const pressAudio = new Audio(`${BASE}/assets/sounds/comun/press.wav`);
const hoverAudio = new Audio(`${BASE}/assets/sounds/comun/hover.wav`);
[bounceAudio, trapAudio, victoryAudio, defeatAudio, backAudio, pressAudio].forEach(a => a.preload = true);

let sfxOn = true;
fetch('/api/settings').then(r => r.ok ? r.json() : null).then(d => { if (d) sfxOn = d.sound !== false; }).catch(() => {});
function play(a) { if (!sfxOn) return; a.pause(); a.currentTime = 0; a.play().catch(()=>{}); }
function playStep() { play(stepAudio); }

// === Cuenta atrás 5 · 4 · 3 · 2 · 1 · YA antes de cada pantallita ===
// Beeps retro (onda cuadrada WebAudio): agudo y largo en el "YA".
let countingDown = false;
let audioCtx = null;
const cdEl = document.getElementById('countdown');

function countBeep(isGo) {
  if (!sfxOn) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime;
    const dur = isGo ? 0.45 : 0.16;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'square';
    o.frequency.value = isGo ? 880 : 440;
    g.gain.setValueAtTime(0.10, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + dur);
  } catch (e) {}
}

function startCountdown(done) {
  if (!REAL_MODE) { done(); return; }
  countingDown = true;
  const seq = [5, 4, 3, 2, 1, 0]; // 0 = "¡YA!"
  let i = 0;
  const tick = () => {
    if (i >= seq.length) {
      cdEl.style.display = 'none';
      countingDown = false;
      done();
      return;
    }
    const v = seq[i++];
    cdEl.textContent = v === 0 ? tt('game.go') : String(v);
    cdEl.style.display = 'block';
    cdEl.style.animation = 'none';
    void cdEl.offsetWidth;
    cdEl.style.animation = '';
    countBeep(v === 0);
    setTimeout(tick, v === 0 ? 850 : 1000);
  };
  tick();
}

// === Assets por mundo (con fallback a AGUA si el mundo no los tiene) ===
const assetCache = {};
async function exists(path) {
  try { const r = await fetch(BASE + path, { method: 'HEAD' }); return r.ok; }
  catch (e) { return false; }
}
async function worldAsset(world, rel, fallbackWorld) {
  const key = world + '|' + rel;
  if (assetCache[key] !== undefined) return assetCache[key];
  const p = `/assets/${rel.replace('{W}', world)}`;
  assetCache[key] = (await exists(p)) ? BASE + p : BASE + `/assets/${rel.replace('{W}', fallbackWorld)}`;
  return assetCache[key];
}

// Assets del tablero por mundo via /api/board-sprites-assets (rutas reales,
// display webp preferido por el servidor; fallback por categoria a AGUA)
const boardAssetsCache = {};
let spriteAssets = null;
async function boardAssets(world) {
  if (boardAssetsCache[world] !== undefined) return boardAssetsCache[world];
  let a = null;
  try {
    const res = await fetch(`${BASE}/api/board-sprites-assets?world=${encodeURIComponent(world)}`);
    if (res.ok) a = await res.json();
  } catch (e) {}
  if (a && a.ok) {
    for (const k of ['enemy', 'boss', 'trap', 'exit', 'obstacle']) {
      if ((!a[k] || !a[k].length) && world !== 'AGUA') {
        const f = await boardAssets('AGUA');
        if (f) a[k] = f[k];
      }
    }
  } else { a = null; }
  boardAssetsCache[world] = a;
  return a;
}

// Imagenes decodificadas retenidas en memoria (referencia viva: el navegador
// no puede evictarlas, por mucho tiempo que pase)
const decodedImgs = new Map();
function decodeImg(src) {
  const hit = decodedImgs.get(src);
  if (hit !== undefined) return Promise.resolve(hit);
  return new Promise(res => {
    const im = new Image();
    im.onload = () => {
      // El decode() de un webp 8K puede no resolver nunca: no bloqueamos el
      // render — se retiene la imagen y se decodifica en segundo plano.
      decodedImgs.set(src, im); res(im);
      if (im.decode) im.decode().catch(() => {});
    };
    im.onerror = () => { decodedImgs.set(src, null); res(null); };
    im.src = src;
  });
}

// Calibración de sprites por mundo (sprites.json: global + por tipo/instancia)
// size = fracción de casilla; offsetX/Y = fracción de casilla desde el centro.
let spriteCalib = null;
const FINAL_ISLAND = 11;
const isBossLevel = () => REAL_MODE && REAL_LEVEL === FINAL_ISLAND;
function calibFor(type, inst) {
  const e = spriteCalib?.[type]?.[inst];
  const g = spriteCalib?.global;
  return {
    size: (e?.size ?? 1) * (g?.scale ?? 1),
    ox: (e?.offsetX ?? 0) + (g?.offsetX ?? 0),
    oy: (e?.offsetY ?? 0) + (g?.offsetY ?? 0),
  };
}

// Elegir N imágenes al azar sin repetir mientras sea posible (regla a fuego)
function pickRandomImages(pool, n) {
  if (!pool || !pool.length) return [];
  const avail = [...pool];
  const out = [];
  for (let i = 0; i < n; i++) {
    if (!avail.length) out.push(pool[Math.floor(Math.random() * pool.length)]);
    else out.push(avail.splice(Math.floor(Math.random() * avail.length), 1)[0]);
  }
  return out;
}

// === Cargar pantalla (práctica: al azar del tier; real: la asignada a la isla) ===
async function loadScreen() {
  const endpoint = REAL_MODE
    ? `${BASE}/api/level-screen?world=${encodeURIComponent(REAL_WORLD)}&level=${REAL_LEVEL}`
    : `${BASE}/api/practice-screen?tier=${currentTier}&t=${Date.now()}`;
  const res = await fetch(endpoint);
  const data = await res.json();
  if (!data.ok) {
    worldLabel.textContent = 'Error: ' + data.error;
    if (REAL_MODE) { overlay.classList.add('show', 'lose'); overlayTitle.textContent = data.error; }
    return;
  }
  const s = data.screen;
  currentScreenId = s.id;
  currentMinMoves = s.minMoves || 0;
  if (REAL_MODE && (data.tier || s.level)) gameLevel = data.tier ?? s.level;
  if (debugTierEl.style.display !== 'none') updateDebugTier();

  player = { c: s.player[0], r: s.player[1] };
  goal = { c: s.goal[0], r: s.goal[1] };
  enemies = s.enemies.map(e => ({ c: e.pos[0], r: e.pos[1], pattern: e.pattern, stunnedTurns: 0 }));
  playerStunnedTurns = 0;
  // Paredes (#) y obstáculos (X) por separado; ambos bloquean movimiento
  wallCells = new Set();
  obstacleCells = new Set();
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const ch = s.grid[r][c];
      if (ch === '#') wallCells.add(`${c},${r}`);
      else if (ch === 'X') obstacleCells.add(`${c},${r}`);
    }
  }
  trapCells = new Set(s.traps.map(([c, r]) => `${c},${r}`));

  turn = 0;
  gameOver = false;
  won = false;
  moving = false;
  selector.style.zIndex = '';
  overlay.classList.remove('show', 'win', 'lose');

  const world = detection.world;
  worldLabel.textContent = REAL_MODE
    ? `${tt('worlds.' + world)} — ${tt('submundo.level', REAL_LEVEL + 1, 12)}`
    : `${tt('worlds.' + world)} · ${tt('game.practiceTier', currentTier)}`;
  metaLabel.textContent = tt('game.practiceMeta', s.id, s.minMoves, COLS, ROWS);

  positionSelector();
  await renderEntities();
  renderBoardTexts();
  startCountdown(() => {});
}

function positionSelector() {
  const p = cellPos(player.c, player.r, true);
  selector.style.left = p.left + 'px';
  selector.style.top = p.top + 'px';
  selector.style.width = p.w + 'px';
  selector.style.height = p.h + 'px';
  // Calibración del avatar: el selector queda a tamaño casilla (el rebote y
  // el movimiento no se tocan); el img interno lleva size/offset calibrado.
  const cl = calibFor('avatar', avatarIdx);
  avatarImg.style.width = (p.w * cl.size) + 'px';
  avatarImg.style.height = (p.h * cl.size) + 'px';
  avatarImg.style.left = ((p.w - p.w * cl.size) / 2 + cl.ox * p.w) + 'px';
  avatarImg.style.top = ((p.h - p.h * cl.size) / 2 + cl.oy * p.h) + 'px';
  posLabel.textContent = tt('game.practiceCell', player.c, player.r);
  updateTurnDisplay();
}

function place(el, c, r, useAvatarArea) {
  const p = cellPos(c, r, useAvatarArea);
  // Calibración por tipo+instancia de sprites.json (la pared es un div sin imagen)
  const t = el.dataset.type;
  const ck = t === 'goal' ? 'exit' : (t === 'enemy' && isBossLevel() ? 'boss' : t);
  const cl = (ck && ck !== 'wall') ? calibFor(ck, +(el.dataset.inst || 0))
                                  : { size: 1, ox: 0, oy: 0 };
  const w = p.w * cl.size, h = p.h * cl.size;
  el.style.left = (p.left + (p.w - w) / 2 + cl.ox * p.w) + 'px';
  el.style.top = (p.top + (p.h - h) / 2 + cl.oy * p.h) + 'px';
  el.style.width = w + 'px';
  el.style.height = h + 'px';
}

async function renderEntities() {
  const container = document.getElementById('entities');
  container.innerHTML = '';
  const world = detection.world;
  const assets = spriteAssets || {};

  // Meta (salida)
  const goalEl = document.createElement('img');
  goalEl.className = 'entity goal';
  goalEl.src = BASE + (assets.exit?.[0] || '');
  goalEl.dataset.col = goal.c; goalEl.dataset.row = goal.r; goalEl.dataset.type = 'goal';
  goalEl.dataset.inst = '0';
  place(goalEl, goal.c, goal.r, true);
  container.appendChild(goalEl);

  // Enemigos — en la última isla del submundo (modo real) salen los bosses
  const enemyPool = isBossLevel() ? (assets.boss?.length ? assets.boss : assets.enemy) : assets.enemy;
  // Regla: los enemigos normales usan siempre la última variante del
  // mundo (enemy_XX_04 — la más nueva). Los bosses de la isla 12 no cambian.
  const enemyInst = enemyPool ? enemyPool.length - 1 : 0;
  const enemySrc = isBossLevel() ? null : (enemyPool?.[enemyInst] || '');
  const enemyPicks = isBossLevel() ? pickRandomImages(enemyPool, enemies.length)
                                : enemies.map(() => enemySrc);
  enemies.forEach((e, i) => {
    const el = document.createElement('img');
    el.className = 'entity';
    el.src = BASE + (enemyPicks[i] || '');
    el.dataset.col = e.c; el.dataset.row = e.r;
    el.dataset.type = 'enemy'; el.dataset.idx = i;
    el.dataset.inst = isBossLevel() ? Math.max(0, enemyPool.indexOf(enemyPicks[i])) : enemyInst;
    place(el, e.c, e.r, true);
    container.appendChild(el);
  });

  // Paredes (#): bloques visuales
  wallCells.forEach(key => {
    const [c, r] = key.split(',').map(Number);
    const el = document.createElement('div');
    el.className = 'entity wall';
    el.dataset.col = c; el.dataset.row = r; el.dataset.type = 'wall';
    place(el, c, r, false);
    container.appendChild(el);
  });

  // Obstáculos: imágenes del mundo, al azar sin repetir si se puede
  const pool = assets.obstacle || null;
  const picks = pickRandomImages(pool, obstacleCells.size);
  let i = 0;
  obstacleCells.forEach(key => {
    const [c, r] = key.split(',').map(Number);
    const src = picks[i++];
    if (!src) return;
    const el = document.createElement('img');
    el.className = 'entity';
    el.src = BASE + src;
    el.dataset.col = c; el.dataset.row = r; el.dataset.type = 'obstacle';
    el.dataset.inst = Math.max(0, pool.indexOf(src));
    place(el, c, r, false);
    container.appendChild(el);
  });

  // Trampas
  if (trapCells.size) {
    const trapSrc = BASE + (assets.trap?.[0] || '');
    trapCells.forEach(key => {
      const [c, r] = key.split(',').map(Number);
      const el = document.createElement('img');
      el.className = 'entity trap';
      el.src = trapSrc;
      el.dataset.col = c; el.dataset.row = r; el.dataset.type = 'trap';
      el.dataset.inst = '0';
      place(el, c, r, false);
      container.appendChild(el);
    });
  }
}

function repositionAll() {
  document.querySelectorAll('.entity').forEach(el => {
    const c = parseInt(el.dataset.col, 10);
    const r = parseInt(el.dataset.row, 10);
    const t = el.dataset.type;
    place(el, c, r, t === 'goal' || t === 'enemy');
  });
}

function updateEnemyPositions() {
  enemies.forEach((e, i) => {
    const el = document.querySelector(`.entity[data-idx="${i}"]`);
    if (!el) return;
    place(el, e.c, e.r, true);
    el.dataset.col = e.c; el.dataset.row = e.r;
    el.style.zIndex = (e.c === player.c && e.r === player.r) ? 20 : '';
    el.classList.toggle('stunned', e.stunnedTurns > 0);
  });
}

// === Reglas Wappo (idénticas al motor) ===
function isBlocked(c, r) {
  return wallCells.has(`${c},${r}`) || obstacleCells.has(`${c},${r}`);
}
function canEnter(c, r) {
  if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return false;
  if (isBlocked(c, r)) return false;
  return true;
}
function enemyAt(c, r) { return enemies.some(e => e.c === c && e.r === r); }

function canEnemyEnter(c, r) {
  if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return false;
  if (isBlocked(c, r)) return false;
  // Los enemigos PUEDEN solaparse entre sí (isWalkableForEnemy del motor
  // no lo bloquea — el solver calcula el óptimo con esa regla).
  return true;
}

function movePlayer(dc, dr) {
  if (moving || gameOver || countingDown) return;

  // Aturdido: input ignorado pero el turno avanza
  if (playerStunnedTurns > 0) {
    moving = true;
    playerStunnedTurns--;
    moveEnemiesAnimated().then(captured => {
      if (captured) { setTimeout(loseGame, 600); return; }
      turn++; updateTurnDisplay();
      moving = false;
    });
    return;
  }

  const nc = player.c + dc, nr = player.r + dr;

  // Movimiento inválido: rebote, NO cuenta turno
  if (!canEnter(nc, nr)) {
    moving = true;
    bounceSelector(dc, dr);
    play(bounceAudio);
    return;
  }

  moving = true;
  player.c = nc; player.r = nr;
  positionSelector();

  if (trapCells.has(`${nc},${nr}`)) {
    play(trapAudio); trapEffect(); playerStunnedTurns = 3;
  } else {
    playStep();
  }

  if (enemyAt(player.c, player.r)) {
    selector.style.zIndex = 20;
    setTimeout(loseGame, 600);
    return;
  }
  if (player.c === goal.c && player.r === goal.r) {
    setTimeout(winGame, 300);
    return;
  }

  setTimeout(() => {
    moveEnemiesAnimated().then(captured => {
      if (captured) { setTimeout(loseGame, 600); return; }
      if (player.c === goal.c && player.r === goal.r) { winGame(); return; }
      turn++; updateTurnDisplay();
      moving = false;
    });
  }, 80);
}

// 2 sub-pasos por turno, horizontal primero, luego vertical.
// Réplica del motor (engine/rules.ts): el aturdimiento descuenta UNA vez
// por turno y congela los DOS sub-pasos → 3 turnos completos inmóvil y
// al despertar se mueve sus 2 casillas. Pisar una trampa a mitad de turno
// aturde al instante y cancela el sub-paso que le quedaba.
function moveEnemiesAnimated() {
  return new Promise(resolve => {
    let step = 0;
    const frozen = new Set(); // enemigos que saltan el turno entero
    function doStep() {
      if (step >= 2) { resolve(false); return; }
      let anyMoved = false;
      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        // El descuento es por turno, no por sub-paso (antes se contaba 2
        // veces → solo esperaba 1.5 turnos y al salir movía 1 casilla).
        if (step === 0 && e.stunnedTurns > 0) { e.stunnedTurns--; frozen.add(i); }
        if (frozen.has(i)) continue;
        const dx = Math.sign(player.c - e.c);
        const dy = Math.sign(player.r - e.r);
        const cands = [];
        if (dx !== 0) cands.push([e.c + dx, e.r]);
        if (dy !== 0) cands.push([e.c, e.r + dy]);
        const bc = e.c, br = e.r;
        for (const [c, r] of cands) {
          if (canEnemyEnter(c, r)) { e.c = c; e.r = r; anyMoved = true; break; }
        }
        // Trampa (regla del generador): estar EN una trampa aturde 3 turnos
        // y cancela el sub-paso restante — también si no pudo moverse y
        // sigue encima, así un enemigo atrapado no se despierta jamás.
        // El sonido/efecto solo suena al entrar de verdad (se movió).
        if (trapCells.has(`${e.c},${e.r}`)) {
          const entered = bc !== e.c || br !== e.r;
          e.stunnedTurns = 3; frozen.add(i);
          if (entered) { play(trapAudio); enemyTrapFx(i); }
        }
      }
      updateEnemyPositions();
      if (enemyAt(player.c, player.r)) { resolve(true); return; }
      step++;
      anyMoved ? setTimeout(doStep, 350) : doStep();
    }
    doStep();
  });
}

// === Efectos ===
function bounceSelector(dc, dr) {
  const p = cellPos(player.c, player.r, true);
  const dx = dc * p.w * 0.25;
  const dy = dr * p.h * 0.25;
  selector.style.transition = 'left 0.08s ease-out, top 0.08s ease-out';
  selector.style.left = (p.left + dx) + 'px';
  selector.style.top = (p.top + dy) + 'px';
  setTimeout(() => {
    selector.style.transition = 'left 0.15s ease-in, top 0.15s ease-in';
    selector.style.left = p.left + 'px';
    selector.style.top = p.top + 'px';
    setTimeout(() => {
      selector.style.transition = 'left 0.15s ease-in-out, top 0.15s ease-in-out';
      moving = false;
    }, 160);
  }, 90);
}

function trapEffect() {
  avatarImg.style.animation = 'none';
  void avatarImg.offsetWidth;
  avatarImg.style.animation = 'trapShake 0.6s ease-out';
  setTimeout(() => { avatarImg.style.animation = ''; }, 600);
}

// El enemigo que pisa una trampa hace el mismo temblor que el jugador
function enemyTrapFx(i) {
  const el = document.querySelector(`.entity[data-idx="${i}"]`);
  if (!el) return;
  el.style.animation = 'none';
  void el.offsetWidth;
  el.style.animation = 'trapShake 0.6s ease-out';
  setTimeout(() => { el.style.animation = ''; }, 600);
}

// === Fin de partida ===
// Monedas que vuelan del cofre al contador de oro; cada una que llega
// incrementa el número mostrado. Al terminar se muestra el overlay.
function flyGoldToHud(fromX, fromY, goldBefore, earned, onDone) {
  const goldEl = btEls.gold;
  if (!goldEl || !earned) {
    if (playerData) playerData.gold = goldBefore + earned;
    renderBoardTexts(); onDone(); return;
  }
  const icon = goldEl.querySelector('img');
  const tr = (icon || goldEl).getBoundingClientRect();
  const tx = tr.left + tr.width / 2, ty = tr.top + tr.height / 2;
  const n = Math.min(9, Math.max(4, Math.round(earned / 8)));
  const per = Math.floor(earned / n);
  let arrived = 0, shown = goldBefore;
  for (let i = 0; i < n; i++) {
    const gain = i === n - 1 ? earned - per * (n - 1) : per;
    const size = 26 + Math.random() * 14;
    const c = document.createElement('img');
    c.src = BASE + '/assets/comunes/monedas.webp';
    c.style.cssText = `position:fixed;left:${fromX - size / 2}px;top:${fromY - size / 2}px;` +
      `width:${size}px;height:${size}px;object-fit:contain;z-index:60;pointer-events:none;` +
      `filter:drop-shadow(0 0 6px rgba(255,200,0,.85));`;
    document.body.appendChild(c);
    // Arco bezier: sube un poco antes de caer sobre el contador
    const mx = fromX + (tx - fromX) * 0.4 + (Math.random() - 0.5) * 220;
    const my = Math.min(fromY, ty) - 90 - Math.random() * 70;
    const t0 = performance.now() + i * 110, dur = 620 + Math.random() * 160;
    const step = (t) => {
      const k = Math.min(1, Math.max(0, (t - t0) / dur)), e = k * k * (3 - 2 * k);
      const u = 1 - e;
      c.style.left = (u * u * fromX + 2 * u * e * mx + e * e * tx - size / 2) + 'px';
      c.style.top = (u * u * fromY + 2 * u * e * my + e * e * ty - size / 2) + 'px';
      if (k < 1) { requestAnimationFrame(step); return; }
      c.remove();
      shown += gain;
      if (playerData) playerData.gold = shown;
      const s = goldEl.querySelector('span');
      if (s) s.textContent = String(shown);
      if (++arrived === n) onDone();
    };
    requestAnimationFrame(step);
  }
}

// === Modal de victoria (calibrado en calibrate-modal.html) ===
// Boton rojo (izq) = reiniciar la isla · boton verde (der) = continuar.
// La victoria solo se confirma al pulsar Continuar: reiniciar revierte
// el oro y re-juega el mismo puzzle (la isla sigue sin completarse).
const modalOverlay = document.getElementById('modal-overlay'),
      modalBox = document.getElementById('modal-box'),
      modalSvg = document.getElementById('modal-svg'),
      modalContent = document.getElementById('modal-content'),
      modalBtnL = document.getElementById('modal-btn-l'),
      modalBtnR = document.getElementById('modal-btn-r');
const MODAL_DEFAULTS = { title: { polygon: [[.30,.19],[.42,.115],[.58,.115],[.70,.19]], fontScale: 1 },
  content: { x: .20, y: .30, w: .60, h: .22, fontScale: 1 },
  buttonLeft: { x: .21, y: .60, w: .26, h: .13, fontScale: 1 },
  buttonRight: { x: .53, y: .60, w: .26, h: .13, fontScale: 1 },
  buttonLeftBorder: { x: .18, y: .55, w: .32, h: .20, fontScale: 1 },
  buttonRightBorder: { x: .50, y: .55, w: .32, h: .20, fontScale: 1 } };
let modalAreas = null, modalOpen = false, modalSel = 1; // 0=izq(rojo:reiniciar) 1=der(verde:continuar)
let winGoldEarned = 0, winGoldBefore = 0, winBodyText = '';

function modalCurvePath(poly, W, H) {
  if (!poly || poly.length < 2) return null;
  const pts = [];
  for (let i = 0; i < poly.length; i++) { const a = poly[i], b = poly[(i + 1) % poly.length];
    for (let t = 0; t < 400; t++) { const u = t / 400; pts.push([a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u]); } }
  const buckets = new Map();
  for (const p of pts) { const k = Math.round(p[0] * 160); if (!buckets.has(k)) buckets.set(k, []); buckets.get(k).push(p[1]); }
  const sorted = [...buckets].sort((a, b) => a[0] - b[0]);
  const thicks = sorted.map(([, ys]) => Math.max(...ys) - Math.min(...ys));
  const avgT = thicks.reduce((s, v) => s + v, 0) / thicks.length;
  let mid;
  if (avgT < 0.008) { mid = poly.slice(); if (mid[0][0] > mid[mid.length - 1][0]) mid.reverse(); }
  else mid = sorted.map(([k, ys]) => [k / 160, (Math.min(...ys) + Math.max(...ys)) / 2]);
  if (mid.length < 2) return null;
  return { d: 'M ' + mid.map(p => `${(p[0] * W).toFixed(1)} ${(p[1] * H).toFixed(1)}`).join(' L '), bandH: Math.max(avgT, .05) };
}

function renderModal() {
  const W = modalBox.clientWidth, H = modalBox.clientHeight;
  const A = k => Object.assign({}, MODAL_DEFAULTS[k], modalAreas?.[k]);
  modalSvg.setAttribute('viewBox', `0 0 ${W} ${H}`); modalSvg.innerHTML = '';
  const title = A('title');
  const curve = modalCurvePath(title.polygon, W, H);
  if (curve) {
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('id', 'modal-arc'); path.setAttribute('d', curve.d); path.setAttribute('fill', 'none');
    const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs'); defs.appendChild(path); modalSvg.appendChild(defs);
    const tx = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    const tp = document.createElementNS('http://www.w3.org/2000/svg', 'textPath');
    tp.setAttribute('href', '#modal-arc'); tp.setAttribute('startOffset', '50%'); tp.setAttribute('text-anchor', 'middle');
    tp.textContent = tt('game.victory');
    tx.setAttribute('font-size', Math.max(8, curve.bandH * H * .62 * (title.fontScale || 1)));
    tx.appendChild(tp); modalSvg.appendChild(tx);
  }
  const put = (el, a, text) => {
    el.style.left = a.x * W + 'px'; el.style.top = a.y * H + 'px';
    el.style.width = a.w * W + 'px'; el.style.height = a.h * H + 'px';
    el.textContent = text;
    let fs = Math.max(8, a.h * H * .62 * (a.fontScale || 1));
    el.style.fontSize = fs + 'px';
    while ((el.scrollWidth > a.w * W + 1 || el.scrollHeight > a.h * H + 1) && fs > 6) { fs--; el.style.fontSize = fs + 'px'; }
  };
  put(modalContent, A('content'), winBodyText);
  put(modalBtnL, A('buttonLeft'), tt('game.restart'));
  put(modalBtnR, A('buttonRight'), tt('menu.continue'));
  const polyOf = a => a.polygon?.length >= 3 ? a.polygon : [[a.x, a.y], [a.x + a.w, a.y], [a.x + a.w, a.y + a.h], [a.x, a.y + a.h]];
  for (const [k, on] of [['buttonLeftBorder', modalSel === 0], ['buttonRightBorder', modalSel === 1]]) {
    const pg = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    pg.setAttribute('points', polyOf(A(k)).map(p => `${(p[0] * W).toFixed(1)},${(p[1] * H).toFixed(1)}`).join(' '));
    pg.setAttribute('class', 'modal-sel' + (on ? ' focused' : '')); modalSvg.appendChild(pg);
  }
}

function openWinModal() {
  modalOpen = true; modalSel = 1;
  modalOverlay.classList.add('show');
  requestAnimationFrame(() => requestAnimationFrame(() => modalOverlay.classList.add('visible')));
  renderModal();
}
function closeWinModal() {
  modalOpen = false;
  modalOverlay.classList.remove('visible');
  setTimeout(() => modalOverlay.classList.remove('show'), 320);
}

// Continuar (verde): confirma la victoria — se guarda nivel+oro y se avanza
function confirmWin() {
  if (DEMO_WIN) { closeWinModal(); setTimeout(() => location.reload(), 350); return; }
  closeWinModal();
  fetch(BASE + '/api/level-complete', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ world: REAL_WORLD, level: REAL_LEVEL, gold: winGoldEarned, screenId: currentScreenId }),
  }).catch(() => {});
  afterVictory();
}
// Reiniciar (rojo): el oro vuelve al de antes y se repite la misma pantalla
// (la asignacion de la isla es sticky: como no se confirmo, es el mismo puzzle)
function restartWin() {
  if (DEMO_WIN) { closeWinModal(); setTimeout(() => location.reload(), 350); return; }
  closeWinModal();
  if (playerData) playerData.gold = winGoldBefore;
  renderBoardTexts();
  loadScreen();
}
modalBtnL.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); modalSel = 0; play(pressAudio); restartWin(); });
modalBtnR.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); modalSel = 1; play(pressAudio); confirmWin(); });
modalBtnL.addEventListener('pointerenter', () => { modalSel = 0; play(hoverAudio); renderModal(); });
modalBtnR.addEventListener('pointerenter', () => { modalSel = 1; play(hoverAudio); renderModal(); });
window.addEventListener('resize', () => { if (modalOpen) renderModal(); });

function winGame() {
  gameOver = true; won = true;
  play(victoryAudio);
  overlayTitle.textContent = tt('game.victory');
  if (REAL_MODE || DEMO_WIN) {
    if (DEMO_WIN) turn = currentMinMoves; // demo: cifra verosímil en el modal
    // Boss de mundo derrotado (isla 12, no MAZMORRA): fanfarria de mundo
    // que sigue sonando al volver al mapamundi
    if (REAL_LEVEL === FINAL_ISLAND_IDX && REAL_WORLD !== 'MAZMORRA') {
      AssetsCache.setMusicTrack(AssetsCache.MUSIC.worldWin);
      sessionStorage.setItem('runika-music-override', AssetsCache.MUSIC.worldWin);
    }
    // Oro por eficiencia: máximo si se resuelve en el mínimo de movimientos.
    // Solo la PRIMERA vez: re-jugar una isla ya completada no da oro (el
    // servidor tampoco lo suma). Se confirma al pulsar Continuar (Reiniciar
    // lo revierte).
    const isReplay = (playerData?.worldProgress?.[REAL_WORLD]?.completed ?? []).includes(REAL_LEVEL);
    winGoldEarned = isReplay ? 0 : Math.max(10, currentMinMoves * 5 - turn);
    winGoldBefore = playerData?.gold ?? 0;
    winBodyText = tt('game.levelDone', REAL_LEVEL + 1, turn)
      + (winGoldEarned > 0 ? ' · ' + tt('game.goldEarned', winGoldEarned) : '');
    renderBoardTexts();
    const gp = cellPos(goal.c, goal.r, true);
    flyGoldToHud(gp.left + gp.w / 2, gp.top + gp.h / 2, winGoldBefore, winGoldEarned, openWinModal);
    return;
  }
  overlay.classList.add('show', 'win');
  overlaySubtitle.textContent = tt('game.practiceDone', turn);
  document.getElementById('overlay-restart').textContent = tt('game.practiceNext');
}

// Golpe de cámara al ser atrapado: sacudida de todas las capas + flash rojo
function screenShake() {
  for (const id of ['stage', 'entities', 'boardtexts', 'selector']) {
    const el = document.getElementById(id);
    if (!el) continue;
    el.classList.remove('shake');
    void el.offsetWidth;
    el.classList.add('shake');
  }
  const f = document.getElementById('hitflash');
  f.classList.remove('show');
  void f.offsetWidth;
  f.classList.add('show');
}

function loseGame() {
  gameOver = true; won = false;
  play(defeatAudio);
  screenShake();
  overlay.classList.add('show', 'lose');
  overlayTitle.textContent = tt('game.defeat');
  overlaySubtitle.textContent = REAL_MODE ? tt('game.caught') : tt('game.practiceCaught');
  document.getElementById('overlay-restart').textContent = REAL_MODE ? tt('game.retry') : tt('game.practiceNext');
}

// === Mundo ===
async function loadWorld(idx) {
  worldIdx = ((idx % worlds.length) + worlds.length) % worlds.length;
  detection = worlds[worldIdx];
  ba = { ...detection.boardArea };
  avatarBa = detection.avatarArea ? { ...detection.avatarArea } : { ...detection.boardArea };
  IMG_W = detection.width || 7680;
  IMG_H = detection.height || 4320;

  // Sonido de paso del mundo (fallback a AGUA)
  stepAudio.src = await worldAsset(detection.world, 'sounds/{W}/paso.mp3', 'AGUA');

  await new Promise(res => {
    img.onload = res;
    img.onerror = res;
    img.src = `${BASE}/` + detection.image;
  });
  if (img.decode) await Promise.race([img.decode().catch(() => {}), new Promise(r => setTimeout(r, 3000))]);

  // Sprites del mundo: rutas reales + calibración + decodificados ANTES de pintar
  spriteAssets = await boardAssets(detection.world);
  try {
    const r = await fetch(`${BASE}/api/load-board-sprites?world=${encodeURIComponent(detection.world)}`);
    spriteCalib = r.ok ? await r.json() : null;
  } catch { spriteCalib = null; }
  if (spriteAssets) {
    const srcs = ['enemy', 'boss', 'trap', 'exit', 'obstacle']
      .flatMap(k => spriteAssets[k] || []).map(s => BASE + s);
    await Promise.all(srcs.map(decodeImg));
  }
  layout();
  await loadScreen();
}

function nextAvatar() {
  avatarIdx = (avatarIdx + 1) % AVATARS.length;
  localStorage.setItem('Runika 2D-avatar-idx', String(avatarIdx));
  avatarImg.src = BASE + AVATARS[avatarIdx];
}

// === Teclado ===
// T (de Tier): muestra/oculta el nivel de dificultad actual (debug,
// esquina sup-izq). No choca con el navegador ni con WASD/flechas.
const debugTierEl = document.createElement('div');
debugTierEl.style.cssText = 'position:fixed;left:8px;top:8px;z-index:300;display:none;' +
  'font:bold 14px monospace;color:#0f0;background:rgba(0,0,0,.75);padding:4px 8px;' +
  'border-radius:4px;pointer-events:none;';
document.body.appendChild(debugTierEl);
function updateDebugTier() {
  debugTierEl.textContent = tt('game.tier') + ' ' + (REAL_MODE ? gameLevel : currentTier);
}
document.addEventListener('keydown', (e) => {
  if (e.key === 't' || e.key === 'T') {
    e.preventDefault();
    const on = debugTierEl.style.display === 'none';
    debugTierEl.style.display = on ? 'block' : 'none';
    if (on) updateDebugTier();
    return;
  }
  if (REAL_MODE) {
    // Modal de victoria abierto: flechas eligen, Enter confirma, Esc = continuar
    if (modalOpen) {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault(); modalSel = modalSel === 0 ? 1 : 0; play(hoverAudio); renderModal();
      } else if (e.key === 'Enter' || e.code === 'Space') {
        e.preventDefault(); play(pressAudio); modalSel === 1 ? confirmWin() : restartWin();
      } else if (e.key === 'Escape') {
        e.preventDefault(); play(backAudio); confirmWin();
      }
      return;
    }
    if (e.key === 'Escape') { e.preventDefault(); play(backAudio); if (won) confirmWin(); else backToSubmundo(); return; }
    if (countingDown) return;
    if (e.key === 'r' || e.key === 'R' || e.code === 'Space' || e.key === 'Enter') {
      e.preventDefault();
      play(pressAudio);
      if (won) confirmWin(); else loadScreen();
      return;
    }
    if (gameOver) return;
    const dirs = {
      'ArrowUp': [0, -1], 'ArrowDown': [0, 1],
      'ArrowLeft': [-1, 0], 'ArrowRight': [1, 0],
      'w': [0, -1], 's': [0, 1], 'a': [-1, 0], 'd': [1, 0],
      'W': [0, -1], 'S': [0, 1], 'A': [-1, 0], 'D': [1, 0],
    };
    const d = dirs[e.key];
    if (d) { e.preventDefault(); movePlayer(d[0], d[1]); }
    return;
  }
  if (e.code === 'Enter') { e.preventDefault(); nextAvatar(); return; }
  if (e.key === 'r' || e.key === 'R') { e.preventDefault(); loadScreen(); return; }
  // Cambiar tier: [ ] o - / +
  if (e.key === '[' || e.key === '-') {
    e.preventDefault();
    currentTier = Math.max(4, currentTier - 1); // el nivel más bajo es el 4
    loadScreen();
    return;
  }
  if (e.key === ']' || e.key === '+' || e.key === '=') {
    e.preventDefault();
    currentTier = Math.min(14, currentTier + 1);
    loadScreen();
    return;
  }
  if (e.code === 'Space') { e.preventDefault(); loadWorld(worldIdx + 1); return; }
  if (gameOver) return;
  const dirs = {
    'ArrowUp': [0, -1], 'ArrowDown': [0, 1],
    'ArrowLeft': [-1, 0], 'ArrowRight': [1, 0],
    'w': [0, -1], 's': [0, 1], 'a': [-1, 0], 'd': [1, 0],
    'W': [0, -1], 'S': [0, 1], 'A': [-1, 0], 'D': [1, 0],
  };
  const d = dirs[e.key];
  if (d) { e.preventDefault(); movePlayer(d[0], d[1]); }
});

document.getElementById('overlay-restart').addEventListener('click', () => {
  if (REAL_MODE && won) { play(pressAudio); confirmWin(); return; }
  play(pressAudio);
  loadScreen();
});

window.addEventListener('resize', () => {
  if (!detection) return;
  layout();
  positionSelector();
  repositionAll();
  renderBoardTexts();
});

// === Init ===
async function init() {
  // De momento sin música dentro del tablero (solo SFX propios)
  const res = await fetch(`${BASE}/api/worlds?t=${Date.now()}`);
  worlds = await res.json();

  await loadI18n();
  applyPracticeTexts();

  if (REAL_MODE) {
    // Avatar de la partida (fijo, elegido en la selección de personaje)
    try {
      const r = await fetch(BASE + '/api/savegame');
      if (r.ok) { const d = await r.json(); playerData = d.player || null; }
    } catch {}
    if (playerData && typeof playerData.avatarIndex === 'number') {
      avatarIdx = playerData.avatarIndex;
      avatarImg.src = BASE + AVATARS[avatarIdx];
    }
    gameLevel = playerData?.gameLevel ?? 1;
    // Áreas de texto calibradas del mundo (turno, óptimo, nivel, oro)
    try {
      const r = await fetch(`${BASE}/api/load-board-text-areas?world=${encodeURIComponent(REAL_WORLD)}`);
      if (r.ok) { const d = await r.json(); textAreas = d.areas || null; }
    } catch {}
    // Áreas del modal de victoria (título en arco, contenido, botones)
    try {
      const r = await fetch(`${BASE}/api/load-modal-areas`);
      if (r.ok) { const d = await r.json(); modalAreas = d.areas || null; }
    } catch {}
    decodeImg(BASE + '/assets/comunes/modal.webp');
    document.getElementById('hud').style.display = 'none';
    document.getElementById('practice-tag').style.display = 'none';
    document.getElementById('help').style.display = 'none';
    const idx = worlds.findIndex(w => w.world === REAL_WORLD);
    await loadWorld(idx >= 0 ? idx : 0);
    return;
  }

  // Avatares decodificados de antemano (Enter los cicla en el hot path)
  AVATARS.forEach(a => decodeImg(BASE + a));
  // Mundo al azar en cada recarga
  const wi = Math.floor(Math.random() * worlds.length);
  if (DEMO_WIN) {
    // Demo de victoria real (monedas + modal) sobre una pantalla de
    // práctica: se viste como modo real pero no hay level-complete.
    try {
      const r = await fetch(BASE + '/api/savegame');
      if (r.ok) { const d = await r.json(); playerData = d.player || null; }
    } catch {}
    if (playerData && typeof playerData.avatarIndex === 'number') {
      avatarIdx = playerData.avatarIndex;
      avatarImg.src = BASE + AVATARS[avatarIdx];
    }
    gameLevel = playerData?.gameLevel ?? 1;
    try {
      const r = await fetch(`${BASE}/api/load-board-text-areas?world=${encodeURIComponent(worlds[wi].world)}`);
      if (r.ok) { const d = await r.json(); textAreas = d.areas || null; }
    } catch {}
    try {
      const r = await fetch(`${BASE}/api/load-modal-areas`);
      if (r.ok) { const d = await r.json(); modalAreas = d.areas || null; }
    } catch {}
    decodeImg(BASE + '/assets/comunes/modal.webp');
    document.getElementById('hud').style.display = 'none';
    document.getElementById('practice-tag').style.display = 'none';
    document.getElementById('help').style.display = 'none';
    await loadWorld(wi);
    setTimeout(winGame, 1200);
    return;
  }
  await loadWorld(wi);
}

init();
</script>
