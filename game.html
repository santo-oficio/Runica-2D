<!DOCTYPE html>
<html lang="es">
<head>
<script src="/web/webdb.js"></script>
<script src="/web/solver.bundle.js"></script>
<script src="/web/api-shim.js"></script>
<script src="/web/tizen.js"></script>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Runika 2D</title>
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000; overflow: hidden;
    font-family: 'ChelseaMarket', cursive; color: #e0e0e0;
  }
  #stage {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  #image { width: 100%; height: 100%; object-fit: contain; display: block; position: relative; z-index: 1; }
  /* Relleno de las bandas del letterbox (móvil 19-21:9 vs tablero 16:9):
     misma imagen difuminada y oscurecida detrás — nunca negro puro. */
  #fillbg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    filter: blur(45px) brightness(0.42) saturate(1.25);
    transform: scale(1.15);
    z-index: 0;
  }
  #selector {
    position: absolute; z-index: 15; pointer-events: none;
    transition: left 0.15s ease-in-out, top 0.15s ease-in-out;
  }
  #avatar {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
  }
  #entities {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none; z-index: 13;
  }
  #move-hints {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none; z-index: 12;
  }
  .move-hint {
    position: absolute; border-radius: 16%;
    background: radial-gradient(ellipse at center,
                rgba(255, 236, 140, 0.22) 0%,
                rgba(255, 236, 140, 0.10) 55%,
                rgba(255, 236, 140, 0.0) 80%);
    box-shadow: inset 0 0 0 2px rgba(255, 232, 140, 0.75),
                inset 0 0 22px rgba(255, 215, 90, 0.35);
    animation: mhint 1.8s ease-in-out infinite;
  }
  @keyframes mhint { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
  .entity {
    position: absolute; pointer-events: none;
    transition: left 0.25s ease-in-out, top 0.25s ease-in-out;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
  }
  /* Capas del tablero: trampas y meta son suelo; los enemigos (más
     grandes que la trampa) siempre por encima; el avatar va aún más
     arriba al estar fuera de #entities (z 15 vs z 13) */
  .entity.trap, .entity.goal { z-index: 1; }
  .entity[data-type="enemy"], .entity[data-type="boss"] { z-index: 2; }
  /* Las trampas son estáticas: nunca rotan */
  .entity.stunned {
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6)) brightness(0.55) saturate(0.4);
    opacity: 0.75;
  }
  .entity.wall {
    background: rgba(20, 20, 30, 0.85);
    border: 2px solid rgba(80, 80, 100, 0.6);
    border-radius: 4px;
    box-shadow: inset 0 0 8px rgba(0,0,0,0.5);
    filter: none;
    transition: none;
  }
  .entity.goal {
    filter: drop-shadow(0 0 8px #ff0) drop-shadow(0 0 4px #ff0);
    animation: goalPulse 1s ease-in-out infinite;
  }
  @keyframes goalPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
  @keyframes trapShake {
    0% { transform: rotate(0deg) scale(1); }
    20% { transform: rotate(-15deg) scale(0.9) translateX(3px); }
    40% { transform: rotate(15deg) scale(1.1) translateX(-3px); }
    60% { transform: rotate(-10deg) scale(0.95) translateY(2px); }
    80% { transform: rotate(10deg) scale(1.05) translateY(-2px); }
    100% { transform: rotate(0deg) scale(1); }
  }
  #hud {
    position: absolute; top: 12px; left: 12px; z-index: 20;
    background: rgba(0,0,0,0.65); padding: 8px 14px;
    border-radius: 4px; border: 1px solid rgba(126,200,227,0.3);
    font-size: 0.8em;
  }
  #hud .world { color: #7ec8e3; font-weight: bold; }
  #hud .meta { color: #888; }
  #hud .pos { color: #0ff; }
  #hud .turn { color: #fc4; }
  #help {
    position: absolute; bottom: 12px; left: 50%;
    transform: translateX(-50%); z-index: 20;
    background: rgba(0,0,0,0.65); padding: 6px 14px;
    border-radius: 4px; font-size: 0.72em; color: #aaa;
    text-align: center; line-height: 1.5;
  }
  #help .key { color: #0ff; }
  #practice-tag {
    position: absolute; top: 12px; right: 12px; z-index: 20;
    background: rgba(255,204,68,0.15); color: #fc4;
    border: 1px solid rgba(255,204,68,0.5);
    padding: 6px 12px; border-radius: 4px; font-size: 0.72em;
  }
  #overlay {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%; z-index: 30;
    display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.7); flex-direction: column;
  }
  #overlay.show { display: flex; }
  #overlay .title {
    font-size: 2.5em; font-weight: bold; margin-bottom: 10px;
    text-shadow: 0 0 20px currentColor;
  }
  #overlay.win .title { color: #ff0; }
  #overlay.lose .title { color: #f44; }
  #overlay .subtitle { font-size: 1em; color: #aaa; margin-bottom: 20px; }
  #overlay .restart {
    font-size: 0.9em; color: #0ff; cursor: pointer;
    border: 1px solid #0ff; padding: 8px 20px; border-radius: 4px;
  }
  #overlay .restart:hover { background: rgba(0,255,255,0.1); }
  /* Celebración de boss de mundo (isla 12): destello + anillos + chispas
     desde el cofre. Más épica que una isla normal, más ligera que fin.html */
  .win-flash{position:fixed;inset:0;z-index:64;pointer-events:none;animation:winFlash 1.1s ease-out forwards}
  @keyframes winFlash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
  .win-ring{position:fixed;width:120px;height:120px;border:4px solid rgba(255,210,90,.95);border-radius:50%;
    box-shadow:0 0 26px rgba(255,200,80,.85),inset 0 0 26px rgba(255,200,80,.5);
    animation:winRingOut 1.5s ease-out forwards;pointer-events:none;z-index:64}
  @keyframes winRingOut{0%{transform:scale(.15);opacity:1}100%{transform:scale(3.4);opacity:0}}
  .win-spark{position:fixed;border-radius:50%;background:radial-gradient(circle,#fff6c0,#ffc93c 60%,transparent);
    animation:winSparkFly 1.9s ease-out forwards;pointer-events:none;z-index:65}
  @keyframes winSparkFly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)}}
  /* Boss derrotado: el enemigo/boss cae grisáceo al ganar la isla 12 */
  .entity.defeated{filter:grayscale(1) brightness(.5)!important;transform:rotate(72deg) scale(.85)!important;
    opacity:.4;transition:filter .7s ease,transform .7s ease,opacity .7s ease;animation:none!important}
  /* Muerte dramática del boss: flash blanco, se hincha y cae girando.
     Se aplica ANTES que .defeated (que queda como estado final). */
  .entity.dying{animation:bossDie 1.15s ease-in forwards!important;transition:none!important}
  @keyframes bossDie{
    0%{filter:brightness(4) saturate(0);transform:scale(1)}
    18%{filter:brightness(3) saturate(0);transform:scale(1.35)}
    35%{filter:brightness(1.5);transform:scale(1.15) rotate(-8deg)}
    60%{filter:grayscale(.7) brightness(.8);transform:scale(.95) rotate(28deg) translateY(6%)}
    100%{filter:grayscale(1) brightness(.45);transform:rotate(75deg) scale(.8) translateY(12%);opacity:.35}
  }
  /* Rótulo "¡Guardián derrotado!" sobre el tablero antes del modal */
  #boss-down{
    position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);
    z-index:67;pointer-events:none;display:none;text-align:center;
    font-family:'ChelseaMarket',cursive;font-weight:bold;
    font-size:min(9vh,7vw);color:#ffd34e;line-height:1.1;
    text-shadow:3px 3px 0 #4a2c00,5px 5px 12px #000,
      0 0 22px rgba(255,180,0,.9),0 0 55px rgba(255,140,0,.6);
    -webkit-text-stroke:2px #2a1600;
  }
  #boss-down.show{display:block;animation:bossDownPop 2.1s ease-out forwards}
  @keyframes bossDownPop{
    0%{transform:translate(-50%,-50%) scale(.3);opacity:0}
    14%{transform:translate(-50%,-50%) scale(1.15);opacity:1}
    24%{transform:translate(-50%,-50%) scale(1)}
    78%{opacity:1}
    100%{transform:translate(-50%,-56%) scale(.95);opacity:0}
  }
  /* Derrumbe del mundo tras el boss: escombros cayendo, polvo al
     impactar y la estructura del tablero desmoronándose */
  .win-debris{position:fixed;z-index:66;pointer-events:none;
    background:radial-gradient(circle at 35% 28%,#9c8b74,#5b4a38 55%,#32271c);
    border-radius:42% 58% 55% 45%/48% 44% 56% 52%;
    box-shadow:inset -2px -3px 6px rgba(0,0,0,.55),0 3px 8px rgba(0,0,0,.45);
    animation:debrisFall var(--dur,1.2s) cubic-bezier(.55,.02,.9,.5) both}
  /* 0% opacity 0: durante el animation-delay la roca es invisible (fill
     backwards aplica el primer frame) y los primeros metros de caída la
     desvanecen desde arriba — aparece "de la nada", no levitando */
  @keyframes debrisFall{0%{transform:translate(0,-30px) rotate(0);opacity:0}
    8%{opacity:1}88%{opacity:1}
    100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
  .win-dust{position:fixed;z-index:62;pointer-events:none;border-radius:50%;
    background:radial-gradient(circle,rgba(160,140,105,.6),transparent 70%);
    animation:dustPuff 1s ease-out forwards}
  @keyframes dustPuff{0%{transform:scale(.3);opacity:0}18%{opacity:1}100%{transform:scale(2.4);opacity:0}}
  .entity.crumble{animation:crumbleFall 1.25s ease-in forwards!important}
  @keyframes crumbleFall{0%{transform:translate(0,0) rotate(0);opacity:1}
    100%{transform:translate(var(--cdx),var(--cdy)) rotate(var(--crot));opacity:0;filter:grayscale(1) brightness(.5)}}
  /* La pantalla se desquebraja tras el boss: la imagen entera se trocea en
     gajos radiales (clip-path sobre copias del fondo) que primero se separan
     abriendo grietas negras y luego caen girando al vacío */
  .win-void{position:fixed;z-index:11;pointer-events:none;
    background:radial-gradient(ellipse at 50% 38%,#241a12 0%,#0a0605 60%,#000 100%)}
  .win-shard{position:fixed;z-index:12;pointer-events:none;
    background-repeat:no-repeat;background-size:100% 100%;
    animation:shardBreak var(--dur,2s) cubic-bezier(.45,.05,.85,.45) both}
  @keyframes shardBreak{
    0%{transform:translate(0,0) rotate(0);opacity:1}
    14%{transform:translate(var(--sx),var(--sy)) rotate(calc(var(--rot)*.05));opacity:1}
    100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
  /* El héroe iluminado sobre el vacío: haz de luz cenital + halo dorado
     pulsante + brillo en el avatar */
  .win-beam{position:fixed;z-index:14;pointer-events:none;
    background:linear-gradient(to bottom,rgba(255,232,160,.55),rgba(255,200,90,.14) 78%,transparent);
    clip-path:polygon(36% 0,64% 0,92% 100%,8% 100%);
    animation:beamIn .9s ease-out both}
  @keyframes beamIn{from{opacity:0}to{opacity:1}}
  .win-hero{position:fixed;z-index:14;pointer-events:none;border-radius:50%;
    background:radial-gradient(circle,rgba(255,214,120,.5) 0%,rgba(255,180,70,.2) 42%,transparent 70%);
    animation:heroGlow 2.4s ease-in-out infinite alternate}
  @keyframes heroGlow{from{opacity:.7;transform:scale(.96)}to{opacity:1;transform:scale(1.07)}}
  #selector.hero #avatar{filter:drop-shadow(0 0 12px rgba(255,225,140,.95)) drop-shadow(0 0 38px rgba(255,170,60,.6))}
  /* El boss caído bajo el foco del héroe se ve algo mejor que el .defeated
     genérico (sigue gris y tumbado, pero visible en la penumbra) */
  .entity.defeated.spotlight{opacity:.8!important;filter:grayscale(1) brightness(.75)!important}
  /* Modal de victoria (calibrado en calibrate-modal.html): rojo=reiniciar, verde=continuar */
  #modal-overlay{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;opacity:0;transition:opacity .3s ease}
  /* Fundido entre pantallas: nace en negro y transitionIn() lo revela
     cuando la pantalla está montada — cero destello de contenido a medias */
  #transition-overlay{position:fixed;inset:0;z-index:200;background:#000;opacity:1;pointer-events:auto}
  #modal-overlay.show{display:flex}#modal-overlay.visible{opacity:1}
  #modal-box{position:relative;width:min(80vh,64vw);aspect-ratio:3/2}
  #modal-img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}
  #modal-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  #modal-svg text{font-family:'ChelseaMarket',cursive;fill:#ffe9b0;paint-order:stroke;stroke:rgba(60,30,10,.7);stroke-width:1.5px}
  #modal-content{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;font-family:'ChelseaMarket',cursive;color:#3a2810;line-height:1.3;pointer-events:none}
  #modal-gold{position:absolute;display:none;align-items:center;justify-content:center;gap:.35em;
    font-family:'ChelseaMarket',cursive;color:#3a2810;font-weight:bold;pointer-events:none}
  #modal-gold img{height:1.6em}
  .modal-btn{position:absolute;display:flex;align-items:center;justify-content:center;font-family:'ChelseaMarket',cursive;color:#ffe9b0;text-shadow:0 1px 3px rgba(0,0,0,.75);cursor:pointer;user-select:none}
  polygon.modal-sel{fill:rgba(255,213,79,.08);stroke:#ffd54f;stroke-width:3px;display:none;filter:drop-shadow(0 0 6px rgba(255,213,79,.85))}
  polygon.modal-sel.focused{display:block}
  #boardtexts { position: fixed; inset: 0; pointer-events: none; z-index: 15; display: none; }
  .btext {
    position: absolute; display: flex; align-items: center; justify-content: center;
    color: #fff; font-family: 'ChelseaMarket','Trebuchet MS',sans-serif; font-weight: bold;
    text-align: center; text-shadow: 2px 2px 4px #000, 0 0 10px #000;
    white-space: nowrap; overflow: hidden;
  }
  .btext.gold {
    justify-content: flex-end; color: #ffd34e; text-align: right;
    text-shadow: 1px 1px 2px #000, 0 0 12px rgba(255,180,0,.8), 0 0 26px rgba(255,140,0,.5);
  }
  .btext.info { flex-direction: column; line-height: 1.06; }
  .btext.info .info-name { color: #ffd34e; text-shadow: 2px 2px 4px #000, 0 0 12px rgba(255,180,0,.7); }
  /* Cuenta atrás antes de empezar la pantallita (5 · 4 · 3 · 2 · 1 · YA) */
  #countdown {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    display: none; z-index: 40; pointer-events: none;
    font-family: 'ChelseaMarket','Trebuchet MS',sans-serif; font-weight: bold;
    font-size: min(24vh, 20vw); color: #ffd34e; line-height: 1;
    text-shadow: 3px 3px 0 #4a2c00, 6px 6px 14px #000,
      0 0 24px rgba(255,180,0,.9), 0 0 60px rgba(255,140,0,.6);
    -webkit-text-stroke: 4px #2a1600;
    animation: cdPop .8s ease-out;
  }
  @keyframes cdPop {
    0% { transform: translate(-50%,-50%) scale(1.8); opacity: 0; }
    18% { transform: translate(-50%,-50%) scale(1); opacity: 1; }
    80% { transform: translate(-50%,-50%) scale(1); opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(.85); opacity: 0; }
  }
  /* Golpe al ser atrapado: sacudida de pantalla + flash rojo */
  @keyframes screenShake {
    0%, 100% { transform: translate(0, 0); }
    10% { transform: translate(-14px, 9px); }
    20% { transform: translate(12px, -10px); }
    30% { transform: translate(-10px, -9px); }
    40% { transform: translate(9px, 8px); }
    50% { transform: translate(-8px, 6px); }
    60% { transform: translate(7px, -6px); }
    70% { transform: translate(-6px, -4px); }
    80% { transform: translate(5px, 4px); }
    90% { transform: translate(-3px, -2px); }
  }
  .shake { animation: screenShake .55s linear; }
  @keyframes modalQuake {
    0%,100% { transform: translate(0,0) rotate(0); }
    12% { transform: translate(-7px,3px) rotate(-.5deg); }
    25% { transform: translate(6px,-3px) rotate(.5deg); }
    38% { transform: translate(-5px,-2px) rotate(-.4deg); }
    52% { transform: translate(5px,2px) rotate(.4deg); }
    68% { transform: translate(-3px,1px) rotate(-.25deg); }
    84% { transform: translate(2px,-1px) rotate(.15deg); }
  }
  .quake { animation: modalQuake .5s linear; }
  @media (prefers-reduced-motion: reduce) {
    .shake, .quake { animation: none !important; }
  }
  /* Consola de hacks (Tab) — estilo clásico, casi opaca sobre el juego */
  #hack-console {
    position: fixed; left: 0; right: 0; bottom: 0; height: 19vh; z-index: 600;
    background: rgba(6,12,8,.87);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    border-top: 1px solid #3f9b4f;
    font: 13px/1.55 Consolas, 'Courier New', monospace; color: #b8e0bc;
    display: none; flex-direction: column; text-align: left;
  }
  #hack-console.open { display: flex; }
  #hc-out { flex: 1; overflow-y: auto; padding: 8px 14px 4px; white-space: pre-wrap; word-break: break-word; }
  #hc-out .cmd  { color: #8ad4ff; }
  #hc-out .ok   { color: #7ee787; }
  #hc-out .err  { color: #ff8585; }
  #hc-out .warn { color: #f0b456; }
  #hc-out .dim  { color: #7d9179; }
  #hc-out .gold { color: #ffd76e; }
  #hc-row {
    display: flex; align-items: center; gap: 9px; padding: 6px 14px 9px;
    border-top: 1px solid rgba(63,155,79,.35);
  }
  #hc-row .prompt {
    color: #6fe08b; font-weight: bold; font-size: 15px;
    text-shadow: 0 0 7px rgba(111,224,139,.65);
  }
  #hc-in {
    flex: 1; background: rgba(255,255,255,.05); border: 0; outline: 0;
    color: #eafff0; font: inherit; caret-color: #6fe08b;
    padding: 4px 9px; border-radius: 4px;
  }
  #hc-debug {
    position: fixed; right: 8px; top: 8px; z-index: 590; display: none;
    font: bold 13px/1.5 monospace; color: #8fd; background: rgba(0,0,0,.75);
    padding: 6px 10px; border-radius: 4px; pointer-events: none; white-space: pre;
  }
  #hitflash {
    position: fixed; inset: 0; pointer-events: none; z-index: 35; display: none;
    background: radial-gradient(ellipse at center,
      rgba(255,30,10,0) 25%, rgba(255,30,10,.5) 78%, rgba(120,0,0,.75) 100%);
  }
  #hitflash.show { display: block; animation: hitFlash .7s ease-out forwards; }
  @keyframes hitFlash {
    0% { opacity: 0; } 12% { opacity: 1; } 100% { opacity: 0; }
  }
  /* Pedestal de reliquias (modo real, esquina inf-der del tablero): las
     reliquias compradas se sientan sobre el pedestal temático del mundo.
     pos = fracción del fondo 16:9; slots = fracciones de pedestal.webp. */
  #pedestal { position: fixed; z-index: 39; pointer-events: none; display: none; }
  #ped-img { width: 100%; display: block; }
  .ped-relic {
    position: absolute; display: none; justify-content: center;
    pointer-events: auto; cursor: pointer;
  }
  .ped-relic > img {
    display: block; width: 100%; height: 100%; object-fit: contain;
    filter: drop-shadow(0 3px 5px rgba(0,0,0,.65));
  }
  .ped-relic .cnt {
    position: absolute; right: -0.35em; top: -0.3em; z-index: 2;
    min-width: 1.15em; padding: 0 .25em; text-align: center;
    background: rgba(16,10,5,.85); border: 1.5px solid rgba(210,170,90,.8);
    border-radius: 1em; color: #ffe9a8; font-size: 1.7vh; line-height: 1.25;
    text-shadow: 1px 1px 2px #000;
  }
  .ped-relic.denied { animation: hintShake .35s ease; }
  .ped-relic.denied > img {
    filter: drop-shadow(0 0 8px rgba(255,90,70,.9)) drop-shadow(0 3px 5px rgba(0,0,0,.65));
  }
  .ped-relic .on {
    display: none; position: absolute; right: -0.5em; bottom: -0.2em;
    color: #7fe08f; font-weight: bold; font-size: 1.9vh;
    text-shadow: 1px 1px 3px #000;
  }
  .ped-relic.active > img {
    filter: drop-shadow(0 0 12px rgba(127,224,143,.85)) drop-shadow(0 3px 5px rgba(0,0,0,.65));
  }
  .ped-relic.active .on { display: block; }
  @keyframes hintShake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-7px); } 75% { transform: translateX(7px); }
  }
  /* Flecha de la pista: se dibuja sobre la casilla del jugador */
  .hint-arrow {
    position: fixed; z-index: 39; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    color: #ffd76a; text-shadow: 0 0 14px rgba(255,190,60,.95), 0 0 4px #000;
    animation: hintArrow 1.6s ease-out forwards;
  }
  /* Posición sin salvación: el orbe muestra una cruz roja (no consume) */
  .hint-arrow.dead {
    color: #ff6a5a; text-shadow: 0 0 14px rgba(255,90,60,.95), 0 0 4px #000;
  }
  @keyframes hintArrow {
    0% { opacity: 0; transform: scale(.5); }
    15% { opacity: 1; transform: scale(1.15); }
    70% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1); }
  }

const FINAL_ISLAND_IDX = 11;

// Avatares ligeros (display webp 2048px) — regla a fuego: nada de masters 8K en el hot path
const AVATARS = Array.from({ length: 8 }, (_, i) =>
  `/assets/avatars/display/avatar_${String(i + 1).padStart(2, '0')}.webp`);
let avatarIdx = parseInt(localStorage.getItem('Runika 2D-avatar-idx') ?? '0', 10) || 0;
avatarImg.src = BASE + AVATARS[avatarIdx];

// === Mundo actual y calibración ===
let worlds = [];
let worldIdx = 0;
let detection = null;
let ba = { x: 0, y: 0, width: 0, height: 0 };       // losas/obstáculos
let avatarBa = { x: 0, y: 0, width: 0, height: 0 }; // avatar/enemigos/meta
let board = { left: 0, top: 0, w: 0, h: 0 };
let avatarBoard = { left: 0, top: 0, w: 0, h: 0 };
let IMG_W = 7680, IMG_H = 4320;

// Rect de la imagen visible. contain → descuenta el letterbox; cover
// (móvil nativo) → la imagen desborda y se recorta por los márgenes que
// indica object-position.
function visibleImageRect() {
  const rect = img.getBoundingClientRect();
  if (!IMG_W || !IMG_H) return rect;
  const cs = getComputedStyle(img);
  if (cs.objectFit === 'fill') return rect; // nativo: imagen = elemento
  const cover = cs.objectFit === 'cover';
  const scale = cover ? Math.max(rect.width / IMG_W, rect.height / IMG_H)
                      : Math.min(rect.width / IMG_W, rect.height / IMG_H);
  const w = IMG_W * scale;
  const h = IMG_H * scale;
  const pos = (cs.objectPosition || '50% 50%').trim().split(/\s+/);
  const ox = (parseFloat(pos[0]) || 50) / 100;
  const oy = (parseFloat(pos[1] ?? pos[0]) || 50) / 100;
  return {
    left: rect.left + (rect.width - w) * ox,
    top: rect.top + (rect.height - h) * oy,
    width: w, height: h,
  };
}

function layout() {
  const rect = visibleImageRect();
  board = {
    left: rect.left + ba.x * rect.width,
    top: rect.top + ba.y * rect.height,
    w: ba.width * rect.width,
    h: ba.height * rect.height,
  };
  avatarBoard = {
    left: rect.left + avatarBa.x * rect.width,
    top: rect.top + avatarBa.y * rect.height,
    w: avatarBa.width * rect.width,
    h: avatarBa.height * rect.height,
  };
  layoutPedestal();
}

// Pedestal de reliquias por mundo (assets/backgrounds/<M>/pedestal.webp +
// pedestal.json): pos normalizada al fondo; slots a la imagen del pedestal.
// Cada reliquia se apoya con su base centrada en el hueco correspondiente.
// OCULTO hasta nuevo aviso: ni el mueble ni las insignias se muestran.
const PEDESTAL_ENABLED = false;
let pedestalCalib = null;
const PED_RELICS = ['hint-badge', 'badge-undo', 'badge-midas']; // huecos 0,1,2
function layoutPedestal() {
  const el = document.getElementById('pedestal');
  const im = document.getElementById('ped-img');
  if (!el || !PEDESTAL_ENABLED || !pedestalCalib || !REAL_MODE || !im.naturalWidth) {
    if (el) el.style.display = 'none';
    return;
  }
  const rect = visibleImageRect();
  const pos = pedestalCalib.pos || { x: 0.75, y: 0.78, w: 0.23 };
  const pw = pos.w * rect.width;
  const ph = pw * im.naturalHeight / im.naturalWidth;
  el.style.left = (rect.left + pos.x * rect.width) + 'px';
  el.style.top = (rect.top + pos.y * rect.height) + 'px';
  el.style.width = pw + 'px';
  el.style.height = ph + 'px';
  el.style.display = 'block';
  const slots = pedestalCalib.slots || [];
  PED_RELICS.forEach((id, i) => {
    const s = slots[i], r = document.getElementById(id);
    if (!s || !r) return;
    const rim = r.querySelector('img');
    const ar = rim && rim.naturalWidth ? rim.naturalHeight / rim.naturalWidth : 1;
    const iw = s.w * pw * 1.18;
    const cx = (s.x + s.w / 2) * pw;
    const by = (s.y + s.h * 0.88) * ph;
    r.style.width = iw + 'px';
    r.style.height = (iw * ar) + 'px';
    r.style.left = (cx - iw / 2) + 'px';
    r.style.top = (by - iw * ar) + 'px';
  });
}

// Posición de celda según el tipo de entidad
function cellPos(c, r, useAvatarArea) {
  const b = useAvatarArea ? avatarBoard : board;
  const cw = b.w / COLS;
  const ch = b.h / ROWS;
  return { left: b.left + c * cw, top: b.top + r * ch, w: cw, h: ch };
}

// === Textos calibrados del tablero (modo real) ===
// Áreas de assets/backgrounds/<M>/text-areas.json: etiqueta+número de turno,
// óptimo, nivel de juego (tier de la curva global) en info, y oro.
let textAreas = null;
let gameLevel = 1;
const BT_KINDS = ['turn', 'nTurn', 'optimal', 'nOptimal', 'info', 'gold'];
const btEls = {};
const boardTextsBox = () => document.getElementById('boardtexts');

function btValue(k) {
  if (k === 'turn') return tt('board.turn');
  if (k === 'nTurn') return String(turn);
  if (k === 'optimal') return tt('board.optimal');
  if (k === 'nOptimal') return String(currentMinMoves);
  if (k === 'gold') return String(playerData?.gold ?? 0);
  return REAL_MODE
    ? tt('board.levelOf', REAL_LEVEL + 1, FINAL_ISLAND_IDX + 1) // info → "Nivel isla de 12"
    : tt('board.level', gameLevel);                              // práctica → tier
}

function renderBoardTexts() {
  const box = boardTextsBox();
  if (!(REAL_MODE || DEMO_WIN) || !textAreas) { box.style.display = 'none'; return; }
  box.style.display = 'block';
  const rect = visibleImageRect();
  for (const k of BT_KINDS) {
    const a = textAreas[k];
    if (!a) continue;
    let el = btEls[k];
    if (!el) {
      el = document.createElement('div');
      el.className = 'btext' + (k === 'gold' ? ' gold' : '');
      box.appendChild(el);
      btEls[k] = el;
    }
    const p = { x: rect.left + a.x * rect.width, y: rect.top + a.y * rect.height,
                w: a.w * rect.width, h: a.h * rect.height };
    el.style.cssText = `left:${p.x}px;top:${p.y}px;width:${p.w}px;height:${p.h}px`;
    if (k === 'gold') {
      // Regla a fuego: moneda a la izquierda del número, conjunto pegado a la
      // derecha con ~20px de margen (1% del ancho de imagen visible)
      el.style.paddingRight = (rect.width * 0.01) + 'px';
      el.innerHTML = '';
      const coin = document.createElement('img');
      coin.src = BASE + '/assets/comunes/monedas.webp';
      coin.style.cssText = `height:100%;width:auto;margin-right:${p.h * 0.06}px;flex:none`;
      const span = document.createElement('span');
      span.textContent = btValue(k);
      el.appendChild(coin); el.appendChild(span);
    } else if (k === 'info' && REAL_MODE && playerData?.playerName) {
      el.classList.add('info');
      el.style.gap = Math.max(3, Math.round(p.h * 0.08)) + 'px';
      el.innerHTML = '';
      const nm = document.createElement('div'); nm.className = 'info-name';
      nm.textContent = playerData.playerName;
      const lv = document.createElement('div'); lv.className = 'info-level';
      lv.textContent = btValue(k);
      el.append(nm, lv);
      let nf = Math.max(10, p.h * 0.5 * (a.fontScale || 1));
      let lf = Math.max(8, p.h * 0.34 * (a.fontScale || 1));
      nm.style.fontSize = nf + 'px'; lv.style.fontSize = lf + 'px';
      while (nm.scrollWidth > p.w + 1 && nf > 6) { nf--; nm.style.fontSize = nf + 'px'; }
      while (lv.scrollWidth > p.w + 1 && lf > 6) { lf--; lv.style.fontSize = lf + 'px'; }
      continue;
    } else {
      el.classList.remove('info');
      el.style.gap = '';
      el.textContent = btValue(k);
    }
    let fs = Math.max(12, p.h * .62 * (a.fontScale || 1));
    el.style.fontSize = fs + 'px';
    while ((el.scrollWidth > p.w + 1 || el.scrollHeight > p.h + 1) && fs > 6) {
      fs--; el.style.fontSize = fs + 'px';
    }
  }
}

function updateTurnDisplay() {
  turnLabel.textContent = `${tt('board.turn')}: ${turn}`;
  if (btEls.nTurn) btEls.nTurn.textContent = String(turn);
}

// === Estado del juego ===
let player = { c: 0, r: 0 };
let goal = { c: 0, r: 0 };
let enemies = [];
let playerStunnedTurns = 0;
let obstacleCells = new Set();
let wallCells = new Set();
let trapCells = new Set();
let turn = 0;
let gameOver = false;
let won = false;
let moving = false;
let currentScreenId = null;
let godMode = false; // consola de hacks: invulnerabilidad

// === Sonidos ===
const stepAudio = document.getElementById('step-sound');
const bounceAudio = new Audio(`${BASE}/assets/sounds/comun/choque.wav`);
const trapAudio = new Audio(`${BASE}/assets/sounds/comun/trampa.wav`);
const crumbleAudio = new Audio(`${BASE}/assets/sounds/comun/derrumbe.mp3`);
const backAudio = new Audio(`${BASE}/assets/sounds/comun/back.wav`);
const pressAudio = new Audio(`${BASE}/assets/sounds/comun/press.wav`);
const hoverAudio = new Audio(`${BASE}/assets/sounds/comun/hover.wav`);

[bounceAudio, trapAudio, crumbleAudio, backAudio, pressAudio, coinAudio].forEach(a => a.preload = true);

let sfxOn = true;
fetch('/api/settings').then(r => r.ok ? r.json() : null).then(d => { if (d) sfxOn = d.sound !== false; }).catch(() => {});
function play(a) { if (!sfxOn) return; a.pause(); a.currentTime = 0; a.play().catch(()=>{}); }
// One-shot que no se corta a sí mismo (monedas llegando seguidas)
function playOnce(a, vol = 1, rate = 1) {
  if (!sfxOn) return;
  const c = a.cloneNode();
  c.volume = vol; c.playbackRate = rate;
  c.play().catch(() => {});
}
// Suena y se desvanece en los últimos `fadeSec` segundos — el clip
// sobrevive al modal y un corte seco quedaría a "cosa suelta".
function playFading(a, fadeSec = 2) {
  if (!sfxOn) return;
  a.pause(); a.currentTime = 0; a.volume = 1;
  a.play().catch(() => {});
  const arm = () => {
    if (!isFinite(a.duration) || a.duration <= fadeSec) return;
    setTimeout(() => {
      const iv = setInterval(() => {
        a.volume = Math.max(0, a.volume - 1 / 24);
        if (a.volume <= 0 || a.paused) { clearInterval(iv); a.pause(); a.volume = 1; }
      }, fadeSec * 1000 / 24);
    }, (a.duration - fadeSec) * 1000);
  };
  if (a.readyState >= 1) arm(); else a.addEventListener('loadedmetadata', arm, { once: true });
}
function playStep() { play(stepAudio); }

// === Cuenta atrás 5 · 4 · 3 · 2 · 1 · YA antes de cada pantallita ===
// Beeps retro (onda cuadrada WebAudio): agudo y largo en el "YA".
let countingDown = false;
let audioCtx = null;
const cdEl = document.getElementById('countdown');

function countBeep(isGo) {
  if (!sfxOn) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime;
    const dur = isGo ? 0.45 : 0.16;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'square';
    o.frequency.value = isGo ? 880 : 440;
    g.gain.setValueAtTime(0.10, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + dur);
  } catch (e) {}
}

function startCountdown(done) {
  if (!REAL_MODE) { done(); return; }
  countingDown = true;
  renderMoveHints();
  const seq = [5, 4, 3, 2, 1, 0]; // 0 = "¡YA!"
  let i = 0;
  const tick = () => {
    if (i >= seq.length) {
      cdEl.style.display = 'none';
      countingDown = false;
      renderMoveHints();
      done();
      return;
    }
    const v = seq[i++];
    cdEl.textContent = v === 0 ? tt('game.go') : String(v);
    cdEl.style.display = 'block';
    cdEl.style.animation = 'none';
    void cdEl.offsetWidth;
    cdEl.style.animation = '';
    countBeep(v === 0);
    setTimeout(tick, v === 0 ? 850 : 1000);
  };
  tick();
}

// === Assets por mundo (con fallback a AGUA si el mundo no los tiene) ===
const assetCache = {};
async function exists(path) {
  try { const r = await fetch(BASE + path, { method: 'HEAD' }); return r.ok; }
  catch (e) { return false; }
}
async function worldAsset(world, rel, fallbackWorld) {
  const key = world + '|' + rel;
  if (assetCache[key] !== undefined) return assetCache[key];
  const p = `/assets/${rel.replace('{W}', world)}`;
  assetCache[key] = (await exists(p)) ? BASE + p : BASE + `/assets/${rel.replace('{W}', fallbackWorld)}`;
  return assetCache[key];
}

// Assets del tablero por mundo via /api/board-sprites-assets (rutas reales,
// display webp preferido por el servidor; fallback por categoria a AGUA)
const boardAssetsCache = {};
let spriteAssets = null;
async function boardAssets(world) {
  if (boardAssetsCache[world] !== undefined) return boardAssetsCache[world];
  let a = null;
  try {
    const res = await fetch(`${BASE}/api/board-sprites-assets?world=${encodeURIComponent(world)}`);
    if (res.ok) a = await res.json();
  } catch (e) {}
  if (a && a.ok) {
    for (const k of ['enemy', 'boss', 'trap', 'exit', 'obstacle']) {
      if ((!a[k] || !a[k].length) && world !== 'AGUA') {
        const f = await boardAssets('AGUA');
        if (f) a[k] = f[k];
      }
    }
  } else { a = null; }
  boardAssetsCache[world] = a;
  return a;
}

// Imagenes decodificadas retenidas en memoria (referencia viva: el navegador
// no puede evictarlas, por mucho tiempo que pase)
const decodedImgs = new Map();
function decodeImg(src) {
  const hit = decodedImgs.get(src);
  if (hit !== undefined) return Promise.resolve(hit);
  return new Promise(res => {
    const im = new Image();
    im.onload = () => {
      // El decode() de un webp 8K puede no resolver nunca: no bloqueamos el
      // render — se retiene la imagen y se decodifica en segundo plano.
      decodedImgs.set(src, im); res(im);
      if (im.decode) im.decode().catch(() => {});
    };
    im.onerror = () => { decodedImgs.set(src, null); res(null); };
    im.src = src;
  });
}

// Calibración de sprites por mundo (sprites.json: global + por tipo/instancia)
// size = fracción de casilla; offsetX/Y = fracción de casilla desde el centro.
let spriteCalib = null;
const FINAL_ISLAND = 11;
const isBossLevel = () => REAL_MODE && REAL_LEVEL === FINAL_ISLAND;
function calibFor(type, inst) {
  const e = spriteCalib?.[type]?.[inst];
  const g = spriteCalib?.global;
  return {
    size: (e?.size ?? 1) * (g?.scale ?? 1),
    ox: (e?.offsetX ?? 0) + (g?.offsetX ?? 0),
    oy: (e?.offsetY ?? 0) + (g?.offsetY ?? 0),
  };
}

// Elegir N imágenes al azar sin repetir mientras sea posible (regla a fuego)
function pickRandomImages(pool, n) {
  if (!pool || !pool.length) return [];
  const avail = [...pool];
  const out = [];
  for (let i = 0; i < n; i++) {
    if (!avail.length) out.push(pool[Math.floor(Math.random() * pool.length)]);
    else out.push(avail.splice(Math.floor(Math.random() * avail.length), 1)[0]);
  }
  return out;
}

// === Cargar pantalla (práctica: al azar del tier; real: la asignada a la isla) ===
async function loadScreen() {
  // Todo puzle nuevo arranca con el audio en su sitio: corta jingles a
  // medio sonar (victoria/derrota) y el derrumbe, y retoma el loop.
  AssetsCache.endMusicSting();
  crumbleAudio.pause(); crumbleAudio.currentTime = 0; crumbleAudio.volume = 1;
  // Si venimos de Reiniciar tras una victoria de boss, el mundo quedó
  // desquebrajado: restaura imagen/textos y retira gajos y escombros
  img.style.opacity = '';
  const bt0 = document.getElementById('boardtexts');
  if (bt0) bt0.style.opacity = '';
  document.querySelectorAll('.win-shard,.win-void,.win-debris,.win-dust,.win-flash,.win-ring,.win-spark,.win-hero,.win-beam,.flycoin')
    .forEach(e => e.remove());
  selector.classList.remove('hero');
  selector.style.transition = '';
  const bd = document.getElementById('boss-down');
  if (bd) { bd.classList.remove('show'); bd.textContent = ''; }
  const tierQ = parseInt(PARAMS.get('tier') || '', 10);
  const tierSel = Number.isFinite(tierQ) ? tierQ : (DEMO_RUN ? 6 : currentTier);
  const endpoint = (REAL_MODE && !DEMO_RUN)
    ? `${BASE}/api/level-screen?world=${encodeURIComponent(REAL_WORLD)}&level=${REAL_LEVEL}`
    : `${BASE}/api/practice-screen?tier=${tierSel}&t=${Date.now()}`;
  const res = await fetch(endpoint);
  const data = await res.json();
  if (!data.ok) {
    worldLabel.textContent = tt('game.loadError') + ' ' + (data.error || '');
    if (REAL_MODE) { overlay.classList.add('show', 'lose'); overlayTitle.textContent = tt('game.loadError'); }
    return;
  }
  await applyScreen(data.screen, data.tier);
}

// Inicializa tablero/entidades/estado a partir de los datos de una pantalla
// (la usa loadScreen y los comandos de la consola de hacks).
let lastScreen = null;
async function applyScreen(s, tier) {
  lastScreen = s;
  currentScreenId = s.id;
  currentMinMoves = s.minMoves || 0;
  currentTrueMin = s.trueMin || 0; // 0 = servidor sin el campo → par mostrado
  if (REAL_MODE && (tier || s.level)) gameLevel = tier ?? s.level;
  if (debugTierEl.style.display !== 'none') updateDebugTier();

  player = { c: s.player[0], r: s.player[1] };
  goal = { c: s.goal[0], r: s.goal[1] };
  enemies = s.enemies.map(e => ({ c: e.pos[0], r: e.pos[1], pattern: e.pattern, stunnedTurns: 0 }));
  playerStunnedTurns = 0;
  // Paredes (#) y obstáculos (X) por separado; ambos bloquean movimiento
  wallCells = new Set();
  obstacleCells = new Set();
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const ch = s.grid[r][c];
      if (ch === '#') wallCells.add(`${c},${r}`);
      else if (ch === 'X') obstacleCells.add(`${c},${r}`);
    }
  }
  trapCells = new Set(s.traps.map(([c, r]) => `${c},${r}`));

  turn = 0;
  gameOver = false;
  won = false;
  moving = false;
  undoStack.length = 0;
  hackSolve = null; // la solución en caché deja de valer con otra pantalla
  selector.style.zIndex = '';
  overlay.classList.remove('show', 'win', 'lose');

  const world = detection.world;
  worldLabel.textContent = REAL_MODE
    ? `${tt('worlds.' + world)} — ${tt('submundo.level', REAL_LEVEL + 1, 12)}`
    : `${tt('worlds.' + world)} · ${tt('game.practiceTier', currentTier)}`;
  metaLabel.textContent = tt('game.practiceMeta', s.id, s.minMoves, COLS, ROWS);

  positionSelector();
  await renderEntities();
  renderBoardTexts();
  startCountdown(() => {
    if (!AUTO_WIN) return;
    player.c = goal.c; player.r = goal.r;
    positionSelector();
    setTimeout(winGame, 450);
  });
}

function positionSelector() {
  const p = cellPos(player.c, player.r, true);
  selector.style.left = p.left + 'px';
  selector.style.top = p.top + 'px';
  selector.style.width = p.w + 'px';
  selector.style.height = p.h + 'px';
  // Calibración del avatar: el selector queda a tamaño casilla (el rebote y
  // el movimiento no se tocan); el img interno lleva size/offset calibrado.
  const cl = calibFor('avatar', avatarIdx);
  avatarImg.style.width = (p.w * cl.size) + 'px';
  avatarImg.style.height = (p.h * cl.size) + 'px';
  avatarImg.style.left = ((p.w - p.w * cl.size) / 2 + cl.ox * p.w) + 'px';
  avatarImg.style.top = ((p.h - p.h * cl.size) / 2 + cl.oy * p.h) + 'px';
  posLabel.textContent = tt('game.practiceCell', player.c, player.r);
  updateTurnDisplay();
  renderMoveHints();
}

// Guía visual: ilumina las casillas adyacentes a las que el avatar puede
// entrar en su turno (misma regla que movePlayer → canEnter). No es una
// pista: solo marca destinos legales, sin sugerir ninguna jugada.
const MOVE_DIRS = [[0, -1], [0, 1], [-1, 0], [1, 0]];
function renderMoveHints() {
  const layer = document.getElementById('move-hints');
  if (!layer) return;
  layer.innerHTML = '';
  if (moving || gameOver || won || countingDown || modalOpen || playerStunnedTurns > 0) return;
  for (const [dc, dr] of MOVE_DIRS) {
    const nc = player.c + dc, nr = player.r + dr;
    if (!canEnter(nc, nr)) continue;
    const p = cellPos(nc, nr, true);
    const d = document.createElement('div');
    d.className = 'move-hint';
    d.style.left = p.left + 'px';
    d.style.top = p.top + 'px';
    d.style.width = p.w + 'px';
    d.style.height = p.h + 'px';
    layer.appendChild(d);
  }
}

function place(el, c, r, useAvatarArea) {
  const p = cellPos(c, r, useAvatarArea);
  // Calibración por tipo+instancia de sprites.json (la pared es un div sin imagen)
  const t = el.dataset.type;
  const ck = t === 'goal' ? 'exit' : (t === 'enemy' && isBossLevel() ? 'boss' : t);
  const cl = (ck && ck !== 'wall') ? calibFor(ck, +(el.dataset.inst || 0))
                                  : { size: 1, ox: 0, oy: 0 };
  const w = p.w * cl.size, h = p.h * cl.size;
  el.style.left = (p.left + (p.w - w) / 2 + cl.ox * p.w) + 'px';
  el.style.top = (p.top + (p.h - h) / 2 + cl.oy * p.h) + 'px';
  el.style.width = w + 'px';
  el.style.height = h + 'px';
}

async function renderEntities() {
  const container = document.getElementById('entities');
  container.innerHTML = '';
  const world = detection.world;
  const assets = spriteAssets || {};

  // Meta (salida)
  const goalEl = document.createElement('img');
  goalEl.className = 'entity goal';
  goalEl.src = BASE + (assets.exit?.[0] || '');
  goalEl.dataset.col = goal.c; goalEl.dataset.row = goal.r; goalEl.dataset.type = 'goal';
  goalEl.dataset.inst = '0';
  place(goalEl, goal.c, goal.r, true);
  container.appendChild(goalEl);

  // Enemigos — en la última isla del submundo (modo real) salen los bosses
  const enemyPool = isBossLevel() ? (assets.boss?.length ? assets.boss : assets.enemy) : assets.enemy;
  // Regla: los enemigos normales usan la variante "criatura" del mundo
  // (enemy_XX_03 — índice 2). La última variante (esqueleto pirata)
  // se reserva al parecer un mini-boss y confunde con el boss real.
  const enemyInst = enemyPool ? Math.min(2, enemyPool.length - 1) : 0;
  const enemySrc = isBossLevel() ? null : (enemyPool?.[enemyInst] || '');
  const enemyPicks = isBossLevel() ? pickRandomImages(enemyPool, enemies.length)
                                : enemies.map(() => enemySrc);
  enemies.forEach((e, i) => {
    const el = document.createElement('img');
    el.className = 'entity';
    el.src = BASE + (enemyPicks[i] || '');
    el.dataset.col = e.c; el.dataset.row = e.r;
    el.dataset.type = 'enemy'; el.dataset.idx = i;
    el.dataset.inst = isBossLevel() ? Math.max(0, enemyPool.indexOf(enemyPicks[i])) : enemyInst;
    place(el, e.c, e.r, true);
    container.appendChild(el);
  });

  // Paredes (#): bloques visuales
  wallCells.forEach(key => {
    const [c, r] = key.split(',').map(Number);
    const el = document.createElement('div');
    el.className = 'entity wall';
    el.dataset.col = c; el.dataset.row = r; el.dataset.type = 'wall';
    place(el, c, r, false);
    container.appendChild(el);
  });

  // Obstáculos: imágenes del mundo, al azar sin repetir si se puede
  const pool = assets.obstacle || null;
  const picks = pickRandomImages(pool, obstacleCells.size);
  let i = 0;
  obstacleCells.forEach(key => {
    const [c, r] = key.split(',').map(Number);
    const src = picks[i++];
    if (!src) return;
    const el = document.createElement('img');
    el.className = 'entity';
    el.src = BASE + src;
    el.dataset.col = c; el.dataset.row = r; el.dataset.type = 'obstacle';
    el.dataset.inst = Math.max(0, pool.indexOf(src));
    place(el, c, r, false);
    container.appendChild(el);
  });

  // Trampas
  if (trapCells.size) {
    const trapSrc = BASE + (assets.trap?.[0] || '');
    trapCells.forEach(key => {
      const [c, r] = key.split(',').map(Number);
      const el = document.createElement('img');
      el.className = 'entity trap';
      el.src = trapSrc;
      el.dataset.col = c; el.dataset.row = r; el.dataset.type = 'trap';
      el.dataset.inst = '0';
      place(el, c, r, false);
      container.appendChild(el);
    });
  }
}

function repositionAll() {
  document.querySelectorAll('.entity').forEach(el => {
    const c = parseInt(el.dataset.col, 10);
    const r = parseInt(el.dataset.row, 10);
    const t = el.dataset.type;
    place(el, c, r, t === 'goal' || t === 'enemy');
  });
}

function updateEnemyPositions() {
  enemies.forEach((e, i) => {
    const el = document.querySelector(`.entity[data-idx="${i}"]`);
    if (!el) return;
    place(el, e.c, e.r, true);
    el.dataset.col = e.c; el.dataset.row = e.r;
    el.style.zIndex = (e.c === player.c && e.r === player.r) ? 20 : '';
    el.classList.toggle('stunned', e.stunnedTurns > 0);
  });
}

// === Reglas del juego (idénticas al motor) ===
function isBlocked(c, r) {
  return wallCells.has(`${c},${r}`) || obstacleCells.has(`${c},${r}`);
}
function canEnter(c, r) {
  if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return false;
  if (isBlocked(c, r)) return false;
  return true;
}
function enemyAt(c, r) { return enemies.some(e => e.c === c && e.r === r); }

function canEnemyEnter(c, r) {
  if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return false;
  if (isBlocked(c, r)) return false;
  // Los enemigos PUEDEN solaparse entre sí (isWalkableForEnemy del motor
  // no lo bloquea — el solver calcula el óptimo con esa regla).
  return true;
}

// Pila de estados para el `undo` de la consola de hacks
const undoStack = [];
function pushUndo() {
  undoStack.push({
    p: { c: player.c, r: player.r },
    e: enemies.map(e => ({ c: e.c, r: e.r, st: e.stunnedTurns })),
    ps: playerStunnedTurns,
    turn,
  });
  if (undoStack.length > 200) undoStack.shift();
}

function movePlayer(dc, dr) {
  if (moving || gameOver || countingDown) return;
  pushUndo();

  // Aturdido: input ignorado pero el turno avanza
  if (playerStunnedTurns > 0) {
    moving = true;
    renderMoveHints();
    playerStunnedTurns--;
    moveEnemiesAnimated().then(captured => {
      // El cazador que captura se dibuja por encima del avatar
      if (captured) { selector.style.zIndex = 12; setTimeout(loseGame, 600); return; }
      turn++; updateTurnDisplay();
      moving = false;
      renderMoveHints();
    });
    return;
  }

  const nc = player.c + dc, nr = player.r + dr;

  // Movimiento inválido: rebote, NO cuenta turno
  if (!canEnter(nc, nr)) {
    moving = true;
    renderMoveHints();
    bounceSelector(dc, dr);
    play(bounceAudio);
    return;
  }

  moving = true;
  player.c = nc; player.r = nr;
  positionSelector();

  if (trapCells.has(`${nc},${nr}`)) {
    play(trapAudio); trapEffect(); playerStunnedTurns = 3;
  } else {
    playStep();
  }

  if (!godMode && enemyAt(player.c, player.r)) {
    // Capturado: el enemigo se dibuja POR ENCIMA del avatar (#entities
    // va a z 13; bajar el selector por debajo deja al cazador visible)
    selector.style.zIndex = 12;
    setTimeout(loseGame, 600);
    return;
  }
  if (player.c === goal.c && player.r === goal.r) {
    turn++; updateTurnDisplay();
    setTimeout(winGame, 300);
    return;
  }

  setTimeout(() => {
    moveEnemiesAnimated().then(captured => {
      if (captured) { selector.style.zIndex = 12; setTimeout(loseGame, 600); return; }
      if (player.c === goal.c && player.r === goal.r) { turn++; updateTurnDisplay(); winGame(); return; }
      turn++; updateTurnDisplay();
      moving = false;
      renderMoveHints();
    });
  }, 80);
}

// 2 sub-pasos por turno, horizontal primero, luego vertical.
// Réplica del motor (engine/rules.ts): el aturdimiento descuenta UNA vez
// por turno y congela los DOS sub-pasos → 3 turnos completos inmóvil y
// al despertar se mueve sus 2 casillas. Pisar una trampa a mitad de turno
// aturde al instante y cancela el sub-paso que le quedaba.
function moveEnemiesAnimated() {
  return new Promise(resolve => {
    let step = 0;
    const frozen = new Set(); // enemigos que saltan el turno entero
    function doStep() {
      if (step >= 2) { resolve(false); return; }
      let anyMoved = false;
      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        // El descuento es por turno, no por sub-paso (antes se contaba 2
        // veces → solo esperaba 1.5 turnos y al salir movía 1 casilla).
        if (step === 0 && e.stunnedTurns > 0) { e.stunnedTurns--; frozen.add(i); }
        if (frozen.has(i)) continue;
        const dx = Math.sign(player.c - e.c);
        const dy = Math.sign(player.r - e.r);
        const cands = [];
        if (dx !== 0) cands.push([e.c + dx, e.r]);
        if (dy !== 0) cands.push([e.c, e.r + dy]);
        const bc = e.c, br = e.r;
        for (const [c, r] of cands) {
          if (canEnemyEnter(c, r)) { e.c = c; e.r = r; anyMoved = true; break; }
        }
        // Trampa (regla del motor): solo aturde al ENTRAR — si este
        // sub-paso lo movió a una casilla de trampa. Un enemigo quieto
        // sobre una trampa NO se re-aturde: antes se reiniciaba el
        // contador cada sub-paso y quedaba congelado para siempre
        // (turnos libres de más para el jugador).
        const entered = bc !== e.c || br !== e.r;
        if (entered && trapCells.has(`${e.c},${e.r}`)) {
          e.stunnedTurns = 3; frozen.add(i);
          play(trapAudio); enemyTrapFx(i);
        }
      }
      updateEnemyPositions();
      if (!godMode && enemyAt(player.c, player.r)) { resolve(true); return; }
      step++;
      anyMoved ? setTimeout(doStep, 350) : doStep();
    }
    doStep();
  });
}

// === Efectos ===
function bounceSelector(dc, dr) {
  const p = cellPos(player.c, player.r, true);
  const dx = dc * p.w * 0.25;
  const dy = dr * p.h * 0.25;
  selector.style.transition = 'left 0.08s ease-out, top 0.08s ease-out';
  selector.style.left = (p.left + dx) + 'px';
  selector.style.top = (p.top + dy) + 'px';
  setTimeout(() => {
    selector.style.transition = 'left 0.15s ease-in, top 0.15s ease-in';
    selector.style.left = p.left + 'px';
    selector.style.top = p.top + 'px';
    setTimeout(() => {
      selector.style.transition = 'left 0.15s ease-in-out, top 0.15s ease-in-out';
      moving = false;
      renderMoveHints();
    }, 160);
  }, 90);
}

function trapEffect() {
  avatarImg.style.animation = 'none';
  void avatarImg.offsetWidth;
  avatarImg.style.animation = 'trapShake 0.6s ease-out';
  setTimeout(() => { avatarImg.style.animation = ''; }, 600);
}

// El enemigo que pisa una trampa hace el mismo temblor que el jugador
function enemyTrapFx(i) {
  const el = document.querySelector(`.entity[data-idx="${i}"]`);
  if (!el) return;
  el.style.animation = 'none';
  void el.offsetWidth;
  el.style.animation = 'trapShake 0.6s ease-out';
  setTimeout(() => { el.style.animation = ''; }, 600);
}

// === Fin de partida ===
// Monedas que vuelan del cofre al contador de oro; cada una que llega
// incrementa el número mostrado. Al terminar se muestra el overlay.
function flyGoldToHud(fromX, fromY, goldBefore, earned, onDone) {
  const goldEl = btEls.gold;
  if (!goldEl || !earned) {
    if (playerData) playerData.gold = goldBefore + earned;
    renderBoardTexts(); onDone(); return;
  }
  const icon = goldEl.querySelector('img');
  const tr = (icon || goldEl).getBoundingClientRect();
  const tx = tr.left + tr.width / 2, ty = tr.top + tr.height / 2;
  const n = Math.min(9, Math.max(4, Math.round(earned / 8)));
  const per = Math.floor(earned / n);
  let arrived = 0, shown = goldBefore, finished = false;
  const finish = () => {
    if (finished) return; finished = true;
    document.querySelectorAll('img.flycoin').forEach(x => x.remove());
    shown = goldBefore + earned;
    if (playerData) playerData.gold = shown;
    const s = goldEl.querySelector('span');
    if (s) s.textContent = String(shown);
    onDone();
  };
  // Red de seguridad: si rAF se estrangula (iframe dormido, ahorro de
  // energía), el vuelo termina por tiempo y el modal llega siempre.
  setTimeout(finish, n * 110 + 1200);
  for (let i = 0; i < n; i++) {
    const gain = i === n - 1 ? earned - per * (n - 1) : per;
    const size = 26 + Math.random() * 14;
    const c = document.createElement('img');
    c.className = 'flycoin';
    c.src = BASE + '/assets/comunes/monedas.webp';
    c.style.cssText = `position:fixed;left:${fromX - size / 2}px;top:${fromY - size / 2}px;` +
      `width:${size}px;height:${size}px;object-fit:contain;z-index:60;pointer-events:none;` +
      `filter:drop-shadow(0 0 6px rgba(255,200,0,.85));`;
    document.body.appendChild(c);
    // Arco bezier: sube un poco antes de caer sobre el contador
    const mx = fromX + (tx - fromX) * 0.4 + (Math.random() - 0.5) * 220;
    const my = Math.min(fromY, ty) - 90 - Math.random() * 70;
    const t0 = performance.now() + i * 110, dur = 620 + Math.random() * 160;
    const step = (t) => {
      if (finished) return;
      const k = Math.min(1, Math.max(0, (t - t0) / dur)), e = k * k * (3 - 2 * k);
      const u = 1 - e;
      c.style.left = (u * u * fromX + 2 * u * e * mx + e * e * tx - size / 2) + 'px';
      c.style.top = (u * u * fromY + 2 * u * e * my + e * e * ty - size / 2) + 'px';
      if (k < 1) { requestAnimationFrame(step); return; }
      c.remove();
      playOnce(coinAudio, 0.3, 0.9 + Math.random() * 0.25);
      shown += gain;
      if (playerData) playerData.gold = shown;
      const s = goldEl.querySelector('span');
      if (s) s.textContent = String(shown);
      if (++arrived === n) finish();
    };
    requestAnimationFrame(step);
  }
}

// La pantalla se desquebraja: trocea la imagen visible en gajos radiales
// desde el punto de impacto (fan de triangulos centro→borde). Cada gajo es
// una copia del fondo recortada con clip-path — juntos reproducen la imagen
// intacta; al separarse abren grietas negras y al caer revelan el vacío.
function shatterScreen(cx, cy) {
  const ir = visibleImageRect();
  if (!ir.width) return;
  const src = img.currentSrc || img.src;
  const voidEl = document.createElement('div');
  voidEl.className = 'win-void';
  voidEl.style.left = ir.left + 'px'; voidEl.style.top = ir.top + 'px';
  voidEl.style.width = ir.width + 'px'; voidEl.style.height = ir.height + 'px';
  document.body.appendChild(voidEl);

  const cxr = cx - ir.left, cyr = cy - ir.top;
  const M = 18, ring = [];
  for (let i = 0; i < M; i++) {
    const a = (i / M) * Math.PI * 2 + (Math.random() - 0.5) * 0.24;
    const dx = Math.cos(a), dy = Math.sin(a);
    const tx = dx > 0 ? (ir.width - cxr) / dx : dx < 0 ? -cxr / dx : 1e9;
    const ty = dy > 0 ? (ir.height - cyr) / dy : dy < 0 ? -cyr / dy : 1e9;
    const t = Math.max(0, Math.min(Math.abs(tx), Math.abs(ty)));
    ring.push([cxr + dx * t, cyr + dy * t]);
  }
  for (let i = 0; i < M; i++) {
    const p1 = ring[i], p2 = ring[(i + 1) % M];
    const sh = document.createElement('div');
    sh.className = 'win-shard';
    sh.style.left = ir.left + 'px'; sh.style.top = ir.top + 'px';
    sh.style.width = ir.width + 'px'; sh.style.height = ir.height + 'px';
    sh.style.backgroundImage = `url("${src}")`;
    sh.style.clipPath = `polygon(${cxr.toFixed(1)}px ${cyr.toFixed(1)}px, ` +
      `${p1[0].toFixed(1)}px ${p1[1].toFixed(1)}px, ${p2[0].toFixed(1)}px ${p2[1].toFixed(1)}px)`;
    // Direccion de salida = centroide del gajo respecto al centro
    const gx = (p1[0] + p2[0]) / 3 - cxr * 2 / 3, gy = (p1[1] + p2[1]) / 3 - cyr * 2 / 3;
    const gl = Math.hypot(gx, gy) || 1;
    const ux = gx / gl, uy = gy / gl;
    sh.style.setProperty('--sx', (ux * 8).toFixed(1) + 'px');
    sh.style.setProperty('--sy', (uy * 8).toFixed(1) + 'px');
    sh.style.setProperty('--dx', (ux * (60 + Math.random() * 90)).toFixed(1) + 'px');
    sh.style.setProperty('--dy', (uy * 40 + 380 + Math.random() * 280).toFixed(1) + 'px');
    sh.style.setProperty('--rot', ((Math.random() - 0.5) * 240).toFixed(0) + 'deg');
    sh.style.setProperty('--dur', (1.7 + Math.random() * 0.9).toFixed(2) + 's');
    // La grieta avanza desde el centro: gajos cercanos rompen antes
    const delay = gl * 0.0011 + Math.random() * 0.2;
    sh.style.animationDelay = delay.toFixed(2) + 's';
    document.body.appendChild(sh);
    setTimeout(() => sh.remove(), (delay + 2.8) * 1000);
  }
  // Los gajos ya reproducen la imagen: apagamos la original sin salto visual
  img.style.opacity = '0';
  const bt = document.getElementById('boardtexts');

// Celebración de boss de mundo (isla 12): el mundo se derrumba —
// terremoto prolongado, lluvia de escombros sobre el tablero, nubes de
// polvo al impactar, muros/obstáculos/trampas desmoronándose, el boss
// cayendo grisáceo y la pantalla desquebrajándose en gajos al vacío.
// Más épica que una isla normal, más ligera que la cinemática de fin.html.
function bossWinFx(x, y) {
  // 1) MUERTE DEL BOSS: flash blanco, se hincha y cae girando.
  //    El rótulo "¡Guardián derrotado!" corona el momento.
  document.querySelectorAll('.entity[data-type="enemy"], .entity[data-type="boss"]')
    .forEach(e => e.classList.add('dying'));
  const down = document.getElementById('boss-down');
  down.textContent = tt('game.bossDown');
  down.classList.add('show');
  setTimeout(() => { down.classList.remove('show'); down.textContent = ''; }, 2200);
  // Al acabar la animación de muerte, queda el estado .defeated
  setTimeout(() => {
    document.querySelectorAll('.entity.dying').forEach(e => {
      e.classList.remove('dying'); e.classList.add('defeated');
    });
  }, 1150);

  // 2) DERRUMBE: terremoto + escombros + estructura cayendo, ~0.6s
  //    después de la muerte para que se lea primero la muerte
  const rumble = () => {
    shakeLayers();
    for (const t of [500, 1000, 1500, 2000, 2500, 3000, 3500, 4000, 4500]) setTimeout(shakeLayers, t);
  };
  setTimeout(() => { playFading(crumbleAudio); rumble(); }, 600);
  // La pantalla se desquebraja ~4.6s después: muerte + rótulo + monedas al
  // contador ya se han leído y las entidades están cayendo
  setTimeout(() => shatterScreen(x, y), 4600);

  // La estructura del tablero se desmorona (muros, obstáculos, trampas y
  // el propio cofre/meta) a partir de ~0.7s, tras la muerte del boss
  document.querySelectorAll('.entity[data-type="wall"], .entity[data-type="obstacle"], .entity[data-type="trap"], .entity[data-type="goal"]')
    .forEach(e => {
      e.style.setProperty('--cdx', (Math.random() * 60 - 30) + 'px');
      e.style.setProperty('--cdy', (30 + Math.random() * 60) + 'px');
      e.style.setProperty('--crot', (Math.random() * 120 - 60) + 'deg');
      e.style.animationDelay = (0.7 + Math.random() * 0.8) + 's';
      e.classList.add('crumble');
    });

  // Lluvia de escombros: rocas cayendo desde arriba del tablero,
  // con nube de polvo al impactar contra el suelo del área de juego
  const b = avatarBoard;
  for (let i = 0; i < 46; i++) {
    const d = document.createElement('div');
    d.className = 'win-debris';
    const sz = 14 + Math.random() * 34;
    const dx = b.left + Math.random() * b.w;
    const dur = 1.2 + Math.random() * 1.0;
    const delay = 0.6 + Math.random() * 5.2;
    d.style.width = d.style.height = sz + 'px';
    d.style.left = (dx - sz / 2) + 'px';
    d.style.top = (b.top - sz - Math.random() * 60) + 'px';
    d.style.setProperty('--dx', (Math.random() * 50 - 25) + 'px');
    d.style.setProperty('--dy', (b.h + sz + 80) + 'px');
    d.style.setProperty('--rot', (Math.random() * 540 - 270) + 'deg');
    d.style.setProperty('--dur', dur + 's');
    d.style.animationDelay = delay + 's';
    document.body.appendChild(d);
    setTimeout(() => d.remove(), (delay + dur) * 1000 + 400);
    // Polvo al impactar (justo cuando la roca llega al suelo del área)
    setTimeout(() => {
      const puff = document.createElement('div');
      puff.className = 'win-dust';
      const psz = sz * 2.2;
      puff.style.width = puff.style.height = psz + 'px';
      puff.style.left = (dx - psz / 2) + 'px';
      puff.style.top = (b.top + b.h - psz * 0.4) + 'px';
      document.body.appendChild(puff);
      setTimeout(() => puff.remove(), 1100);
    }, (delay + dur * 0.82) * 1000);
  }

  // Destello dorado + anillos + doble oleada de chispas
  const flash = document.createElement('div');
  flash.className = 'win-flash';
  flash.style.background = `radial-gradient(circle at ${x}px ${y}px, rgba(255,222,120,.6), transparent 55%)`;
  document.body.appendChild(flash);
  setTimeout(() => flash.remove(), 1200);
  for (let i = 0; i < 3; i++) {
    const ring = document.createElement('div');
    ring.className = 'win-ring';
    ring.style.left = (x - 60) + 'px'; ring.style.top = (y - 60) + 'px';
    ring.style.animationDelay = (i * 0.25) + 's';
    document.body.appendChild(ring);
    setTimeout(() => ring.remove(), 1900 + i * 250);
  }
  const sparks = () => {
    for (let i = 0; i < 36; i++) {
      const sp = document.createElement('div');
      sp.className = 'win-spark';
      const ang = Math.random() * Math.PI * 2;
      const dist = 90 + Math.random() * 280;
      const sz = 5 + Math.random() * 10;
      sp.style.width = sp.style.height = sz + 'px';
      sp.style.left = (x - sz / 2) + 'px'; sp.style.top = (y - sz / 2) + 'px';
      sp.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
      sp.style.setProperty('--dy', Math.sin(ang) * dist - 70 + 'px');
      sp.style.animationDelay = (Math.random() * .3) + 's';
      document.body.appendChild(sp);
      setTimeout(() => sp.remove(), 2500);
    }
  };
  sparks();
  setTimeout(sparks, 600); // segunda oleada
}

// === Modal de victoria (calibrado en calibrate-modal.html) ===
// Boton rojo (izq) = reiniciar la isla · boton verde (der) = continuar.
// La victoria solo se confirma al pulsar Continuar: reiniciar revierte
// el oro y re-juega el mismo puzzle (la isla sigue sin completarse).
const modalOverlay = document.getElementById('modal-overlay'),
      modalBox = document.getElementById('modal-box'),
      modalSvg = document.getElementById('modal-svg'),
      modalContent = document.getElementById('modal-content'),
      modalBtnL = document.getElementById('modal-btn-l'),
      modalBtnR = document.getElementById('modal-btn-r');
const MODAL_DEFAULTS = { title: { polygon: [[.30,.19],[.42,.115],[.58,.115],[.70,.19]], fontScale: 1 },
  content: { x: .20, y: .30, w: .60, h: .22, fontScale: 1 },
  buttonLeft: { x: .21, y: .60, w: .26, h: .13, fontScale: 1 },
  buttonRight: { x: .53, y: .60, w: .26, h: .13, fontScale: 1 },
  buttonLeftBorder: { x: .18, y: .55, w: .32, h: .20, fontScale: 1 },
  buttonRightBorder: { x: .50, y: .55, w: .32, h: .20, fontScale: 1 } };
// Modal de derrota (modal-reintentar.webp): un solo botón rojo centrado
const MODAL_LOSE_DEFAULTS = { title: { polygon: [[.25,.28],[.33,.07],[.67,.07],[.75,.28]], fontScale: 1 },
  content: { x: .16, y: .33, w: .68, h: .22, fontScale: 1 },
  buttonCenter: { x: .35, y: .595, w: .31, h: .135, fontScale: 1 },
  buttonCenterBorder: { polygon: [[.335,.575],[.665,.575],[.665,.75],[.335,.75]], fontScale: 1 } };
let modalAreas = null, modalLoseAreas = null;
let modalOpen = false, modalSel = 1, modalMode = 'win'; // 'win' | 'lose'
let winGoldEarned = 0, winGoldBefore = 0, winFinalBonus = 0, winBodyText = '', winTitleText = '';

function modalCurvePath(poly, W, H) {
  if (!poly || poly.length < 2) return null;
  const pts = [];
  for (let i = 0; i < poly.length; i++) { const a = poly[i], b = poly[(i + 1) % poly.length];
    for (let t = 0; t < 400; t++) { const u = t / 400; pts.push([a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u]); } }
  const buckets = new Map();
  for (const p of pts) { const k = Math.round(p[0] * 160); if (!buckets.has(k)) buckets.set(k, []); buckets.get(k).push(p[1]); }
  const sorted = [...buckets].sort((a, b) => a[0] - b[0]);
  const thicks = sorted.map(([, ys]) => Math.max(...ys) - Math.min(...ys));
  const avgT = thicks.reduce((s, v) => s + v, 0) / thicks.length;
  let mid;
  if (avgT < 0.008) { mid = poly.slice(); if (mid[0][0] > mid[mid.length - 1][0]) mid.reverse(); }
  else mid = sorted.map(([k, ys]) => [k / 160, (Math.min(...ys) + Math.max(...ys)) / 2]);
  if (mid.length < 2) return null;
  return { mid, d: 'M ' + mid.map(p => `${(p[0] * W).toFixed(1)} ${(p[1] * H).toFixed(1)}`).join(' L '), bandH: Math.max(avgT, .05) };
}

function renderModal() {
  const W = modalBox.clientWidth, H = modalBox.clientHeight;
  const isLose = modalMode === 'lose';
  const A = k => Object.assign({}, (isLose ? MODAL_LOSE_DEFAULTS : MODAL_DEFAULTS)[k],
    (isLose ? modalLoseAreas : modalAreas)?.[k]);
  modalSvg.setAttribute('viewBox', `0 0 ${W} ${H}`); modalSvg.innerHTML = '';
  const title = A('title');
  const curve = modalCurvePath(title.polygon, W, H);
  const titleStr = winTitleText || tt(isLose ? 'game.defeat' : 'game.victory');
  if (curve) {
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('id', 'modal-arc'); path.setAttribute('fill', 'none');
    let d = curve.d;
    // Títulos largos ("¡Mundo conquistado!"): mismo arco pero APLANADO —
    // la línea media del cartel curva demasiado en los extremos y los
    // glifos de fuera (¡ ! M…) se rotaban mucho. Suavizarla a la mitad
    // mantiene la forma del cartel sin deformar las letras.
    if (titleStr.length > 14 && curve.mid.length >= 2) {
      const ys = curve.mid.map(p => p[1]);
      const yAvg = ys.reduce((s, v) => s + v, 0) / ys.length;
      const flat = curve.mid.map(p => [p[0], yAvg + (p[1] - yAvg) * .45]);
      d = 'M ' + flat.map(p => `${(p[0] * W).toFixed(1)} ${(p[1] * H).toFixed(1)}`).join(' L ');
    }
    path.setAttribute('d', d);
    const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs'); defs.appendChild(path); modalSvg.appendChild(defs);
    const tx = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    const tp = document.createElementNS('http://www.w3.org/2000/svg', 'textPath');
    tp.setAttribute('href', '#modal-arc'); tp.setAttribute('startOffset', '50%'); tp.setAttribute('text-anchor', 'middle');
    tp.textContent = titleStr;
    let tfs = Math.max(8, curve.bandH * H * .62 * (title.fontScale || 1));
    tx.setAttribute('font-size', tfs);
    tx.appendChild(tp); modalSvg.appendChild(tx);
    const pathLen = path.getTotalLength();
    const tlen = tp.getComputedTextLength ? tp.getComputedTextLength() : 0;
    if (tlen > pathLen * 0.96) {
      tx.setAttribute('font-size', Math.max(8, tfs * pathLen * 0.96 / tlen));
    }
  }
  const put = (el, a, text) => {
    el.style.left = a.x * W + 'px'; el.style.top = a.y * H + 'px';
    el.style.width = a.w * W + 'px'; el.style.height = a.h * H + 'px';
    el.textContent = text;
    let fs = Math.max(8, a.h * H * .62 * (a.fontScale || 1));
    el.style.fontSize = fs + 'px';
    while ((el.scrollWidth > a.w * W + 1 || el.scrollHeight > a.h * H + 1) && fs > 6) { fs--; el.style.fontSize = fs + 'px'; }
  };
  // El texto ocupa la mitad superior del área cuando hay fila de oro
  const ca = A('content');
  const showGold = !isLose && winGoldEarned > 0;
  put(modalContent, { ...ca, h: showGold ? ca.h * 0.58 : ca.h }, winBodyText);
  // Fila de oro: icono monedas.webp + cantidad (en vez de "+N de oro")
  const goldRow = document.getElementById('modal-gold');
  if (showGold) {
    const gh = ca.h * 0.42;
    goldRow.style.display = 'flex';
    goldRow.style.left = ca.x * W + 'px';
    goldRow.style.top = (ca.y + ca.h * 0.58) * H + 'px';
    goldRow.style.width = ca.w * W + 'px';
    goldRow.style.height = gh * H + 'px';
    goldRow.style.fontSize = Math.max(10, gh * H * .62 * (ca.fontScale || 1)) + 'px';
    document.getElementById('modal-gold-n').textContent = '+' + winGoldEarned;
  } else goldRow.style.display = 'none';
  const polyOf = a => a.polygon?.length >= 3 ? a.polygon : [[a.x, a.y], [a.x + a.w, a.y], [a.x + a.w, a.y + a.h], [a.x, a.y + a.h]];
  if (isLose) {
    // Un solo botón rojo centrado = Reintentar
    modalBtnL.style.display = 'none';
    put(modalBtnR, A('buttonCenter'), tt(REAL_MODE ? 'game.retry' : 'game.practiceNext'));
    const pg = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    pg.setAttribute('points', polyOf(A('buttonCenterBorder')).map(p => `${(p[0] * W).toFixed(1)},${(p[1] * H).toFixed(1)}`).join(' '));
    pg.setAttribute('class', 'modal-sel focused'); modalSvg.appendChild(pg);
    return;
  }
  modalBtnL.style.display = '';
  put(modalBtnL, A('buttonLeft'), tt('game.restart'));
  put(modalBtnR, A('buttonRight'), tt('menu.continue'));
  for (const [k, on] of [['buttonLeftBorder', modalSel === 0], ['buttonRightBorder', modalSel === 1]]) {
    const pg = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    pg.setAttribute('points', polyOf(A(k)).map(p => `${(p[0] * W).toFixed(1)},${(p[1] * H).toFixed(1)}`).join(' '));
    pg.setAttribute('class', 'modal-sel' + (on ? ' focused' : '')); modalSvg.appendChild(pg);
  }
}

// Continuar (verde): confirma la victoria — se guarda nivel+oro y se avanza
function confirmWin() {
  // Demo de partida real a boss: el mapamundi celebra la conquista como
  // en el flujo real (runika-world-done + fanfarria worldWin + ?demo=B/N)
  if (DEMO_RUN) {
    closeWinModal();
    if (REAL_WORLD === FINAL_WORLD) { setTimeout(() => AssetsCache.transitionTo('/creditos.html'), 350); return; }
    sessionStorage.setItem('runika-world-done', REAL_WORLD);
    // &mapdemo=all7: demo del último boss normal → mapa con los 7 mundos
    // conquistados y MAZMORRA desbloqueada a color
    const mapDemo = PARAMS.get('mapdemo') === 'all7' ? 'all7' : REAL_WORLD;
    setTimeout(() => location.href = '/mapamundi.html?demo=' + mapDemo, 350);
    return;
  }
  if (DEMO_WIN) {
    closeWinModal();
    if (DEMO_FINAL) { setTimeout(() => AssetsCache.transitionTo('/creditos.html'), 350); return; }
    // Demo boss: sigue el flujo real → mapamundi con el mundo recién
    // conquistado (celebración + drenaje a B/N), sin tocar la partida
    if (DEMO_BOSS) {
      const w = worlds[worldIdx] && worlds[worldIdx].world;
      if (w) {
        sessionStorage.setItem('runika-world-done', w);
        setTimeout(() => location.href = '/mapamundi.html?demo=' + w, 350);
        return;
      }
    }
    setTimeout(() => location.reload(), 350);
    return;
  }
  closeWinModal();
  fetch(BASE + '/api/level-complete', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    keepalive: true, // la navegación siguiente no puede cancelar el guardado
    body: JSON.stringify({ world: REAL_WORLD, level: REAL_LEVEL, gold: winGoldEarned, screenId: currentScreenId }),
  }).catch(() => {});
  afterVictory();
}
// Reiniciar (rojo): el oro vuelve al de antes y se repite la misma pantalla
// (la asignacion de la isla es sticky: como no se confirmo, es el mismo puzzle)
function restartWin() {
  if (DEMO_WIN) { closeWinModal(); setTimeout(() => location.reload(), 350); return; }
  closeWinModal();
  if (playerData) playerData.gold = winGoldBefore;
  // La victoria se revirtió: si sonaba la fanfarria de boss (worldWin +
  // override), vuelve la pista del submundo y se limpia el override
  sessionStorage.removeItem('runika-music-override');
  AssetsCache.setMusicTrack(AssetsCache.musicForWorld(REAL_WORLD));
  renderBoardTexts();
  loadScreen();
}

function winGame() {
  gameOver = true; won = true;
  renderMoveHints();
  // Victoria de boss = isla final de cualquier mundo (MAZMORRA incluida:
  // ahí no hay celebración genérica — empieza la batalla final)
  const isBossWin = DEMO_BOSS ||
    (REAL_MODE && REAL_LEVEL === FINAL_ISLAND_IDX);
  // Jingle de victoria — salvo en boss de mundo (worldWin lo sustituiría)
  // y en el boss FINAL: la batalla pone su propia canción
  const worldFanfare = isBossWin && REAL_MODE && REAL_WORLD !== FINAL_WORLD;
  const finalSting = (isBossWin && REAL_MODE && REAL_WORLD === FINAL_WORLD) || DEMO_FINAL;
  if (!worldFanfare && !finalSting) AssetsCache.playMusicSting(AssetsCache.MUSIC.victoria);
  overlayTitle.textContent = tt('game.victory');
  if (REAL_MODE || DEMO_WIN) {
    if (DEMO_WIN) turn = currentMinMoves; // demo: cifra verosímil en el modal
    // Boss de mundo derrotado: fanfarria que suena una sola vez en el
    // tablero (al volver al mapamundi retoma el tema principal; en
    // MAZMORRA la canción del final la pone la batalla)
    if (worldFanfare) AssetsCache.setMusicTrack(AssetsCache.MUSIC.worldWin);
    // Título del modal: "¡Mundo conquistado!" si es boss, "¡Victoria!" si no
    const bossWorld = REAL_MODE ? REAL_WORLD : (worlds[worldIdx] && worlds[worldIdx].world);
    // "del Viento"/"of Fire"/"du Feu"…: la preposición va en la propia
    // clave por mundo (cada idioma contrae distinto según el género)
    const bossWorldOf = tt('worlds.of.' + bossWorld);
    winTitleText = isBossWin ? tt('game.bossTitle') : '';
    // Oro progresivo: la base crece con el nivel de dificultad (tier) y el
    // multiplicador premia la eficiencia respecto al MÍNIMO REAL del solver
    // (trueMin). El "Óptimo" que ve el jugador lleva +1/+2 de holgura a
    // propósito (par batible); medir el oro contra ese par inflado clavaba
    // el ×2 para cualquier solución decente y el premio quedaba plano.
    //   movimientos = trueMin → ×2 (solución perfecta)
    //   movimientos = par mostrado → ~×1.5
    //   cada movimiento extra baja el multiplicador, suelo ×0.3
    // `turn` ya incluye el movimiento ganador (se cuenta al pisar la meta).
    // El boss de mundo duplica la recompensa.
    // Solo la PRIMERA vez: re-jugar una isla ya completada no da oro (el
    // servidor tampoco lo suma). Se confirma al pulsar Continuar (Reiniciar
    // lo revierte).
    const isReplay = (playerData?.worldProgress?.[REAL_WORLD]?.completed ?? []).includes(REAL_LEVEL);
    const par = Math.max(1, currentTrueMin || currentMinMoves);
    const goldTier = lastScreen?.level ?? (REAL_MODE ? gameLevel : currentTier);
    const goldBase = 50 + goldTier * 25;
    const goldMult = Math.min(2, Math.max(0.3, 2 * par / Math.max(turn, par)));
    // Suelo +25: por muy lejos del óptimo que quede la solución, completar
    // una isla nunca paga menos de eso (los ×2 de boss/Midas no lo doblan).
    winGoldEarned = isReplay ? 0
      : Math.max(25, Math.round(goldBase * goldMult * (isBossWin ? 2 : 1) * (midasOn() ? 2 : 1)));
    winGoldBefore = playerData?.gold ?? 0;
    const isFinalWin = (REAL_MODE && REAL_WORLD === FINAL_WORLD) || DEMO_FINAL;
    // Botín del guardián final: el tesoro que despierta en la batalla se
    // suma de verdad al oro — premio cuantioso que crece con la dificultad
    // (también lo dobla el Toque de Midas si el mundo lo tiene activo).
    winFinalBonus = (isFinalWin && !isReplay)
      ? Math.round((2500 + goldTier * 250) * (midasOn() ? 2 : 1)) : 0;
    winBodyText = isBossWin
        ? tt('game.bossBody', bossWorldOf, turn)
        : tt('game.levelDone', REAL_LEVEL + 1, turn);
    renderBoardTexts();
    const gp = cellPos(goal.c, goal.r, true);
    if (isFinalWin) {
      // El boss FINAL: ni modal ni cinemática aparte — la batalla final
      // sigue aquí mismo, con el héroe y el guardián en sus casillas
      startFinalBattle();
    } else if (isBossWin) {
      bossWinFx(gp.left + gp.w / 2, gp.top + gp.h / 2);
      // Las monedas vuelan ~2.2s tras la victoria — se cobra el tesoro del
      // guardián ANTES de que la pantalla se desquebraje (~4.6s). El modal
      // llega ~7.4s, con el mundo ya roto detrás
      setTimeout(() => flyGoldToHud(gp.left + gp.w / 2, gp.top + gp.h / 2, winGoldBefore, winGoldEarned, () => {}), 2200);
      setTimeout(openWinModal, 7400);
    } else {
      flyGoldToHud(gp.left + gp.w / 2, gp.top + gp.h / 2, winGoldBefore, winGoldEarned, openWinModal);
    }
    return;
  }
  overlay.classList.add('show', 'win');
  overlaySubtitle.textContent = tt('game.practiceDone', turn);
  document.getElementById('overlay-restart').textContent = tt('game.practiceNext');
}

// Victoria del boss FINAL (MAZMORRA:11): la batalla final (final-battle.js)
// continúa sobre este mismo tablero. La partida se guarda al empezar, así
// que cerrar a mitad no pierde el final; al terminar → créditos.
function startFinalBattle() {
  if (REAL_MODE && !DEMO_RUN) {
    fetch(BASE + '/api/level-complete', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      keepalive: true, // la navegación siguiente no puede cancelar el guardado
      body: JSON.stringify({ world: REAL_WORLD, level: REAL_LEVEL, gold: winGoldEarned + winFinalBonus, screenId: currentScreenId }),
    }).catch(() => {});
  }
  const foes = [...document.querySelectorAll('#entities .entity[data-type="enemy"]')];
  const bossEl = foes.find(e => e.dataset.idx === '0') || foes[0];
  const boss = enemies[+(bossEl?.dataset.idx || 0)] || enemies[0];
  if (!bossEl || !boss || !window.FinalBattle) { AssetsCache.transitionTo('/creditos.html'); return; }
  FinalBattle.run({
    hero: selector, heroImg: avatarImg, boss: bossEl,
    others: foes.filter(e => e !== bossEl),
    goal: document.querySelector('#entities .entity[data-type="goal"]'),
    heroCell: [player.c, player.r], bossCell: [boss.c, boss.r],
    cell: (c, r) => cellPos(c, r, true), cols: COLS, rows: ROWS,
    image: img, imgRect: visibleImageRect,
    goldBefore: winGoldBefore, goldEarned: winGoldEarned,
    goldBonus: winFinalBonus,
    goldTotal: winGoldBefore + winGoldEarned + winFinalBonus,
    flyGold: flyGoldToHud,
    name: playerData?.playerName || '',
    tt, shake: shakeLayers, step: playStep,
    hideHud: () => {
      const bt = document.getElementById('boardtexts');
      if (bt) { bt.style.transition = 'opacity 1s ease'; bt.style.opacity = '0'; }
    },
    finish: () => AssetsCache.transitionTo('/creditos.html'),
    exit: () => AssetsCache.transitionTo('/menu.html'),
  });
}

// Sacudida de las capas del tablero (sin flash — reusable para el

function shakeLayers() {
  for (const id of ['stage', 'entities', 'boardtexts', 'selector']) {

// === Mundo ===
async function loadWorld(idx) {
  worldIdx = ((idx % worlds.length) + worlds.length) % worlds.length;
  detection = worlds[worldIdx];
  ba = { ...detection.boardArea };
  avatarBa = detection.avatarArea ? { ...detection.avatarArea } : { ...detection.boardArea };
  IMG_W = detection.width || 7680;
  IMG_H = detection.height || 4320;

  // Sonido de paso del mundo (fallback a AGUA)
  stepAudio.src = await worldAsset(detection.world, 'sounds/{W}/paso.mp3', 'AGUA');

  await new Promise(res => {
    img.onload = res;
    img.onerror = res;
    img.src = `${BASE}/` + detection.image;
    const fill = document.getElementById('fillbg');
    if (fill && !fill.src) fill.src = img.src;
  });
  if (img.decode) await Promise.race([img.decode().catch(() => {}), new Promise(r => setTimeout(r, 3000))]);

  // Sprites del mundo: rutas reales + calibración + decodificados ANTES de pintar
  spriteAssets = await boardAssets(detection.world);
  try {
    const r = await fetch(`${BASE}/api/load-board-sprites?world=${encodeURIComponent(detection.world)}`);
    spriteCalib = r.ok ? await r.json() : null;
  } catch { spriteCalib = null; }
  if (PEDESTAL_ENABLED) {
    try {
      const r = await fetch(`${BASE}/api/load-pedestal?world=${encodeURIComponent(detection.world)}`);
      pedestalCalib = r.ok ? await r.json() : null;
    } catch { pedestalCalib = null; }
    const pedImg = document.getElementById('ped-img');
    pedImg.onload = () => layoutPedestal();
    pedImg.src = `${BASE}/assets/backgrounds/${detection.world}/pedestal.webp`;
  }
  if (spriteAssets) {
    const srcs = ['enemy', 'boss', 'trap', 'exit', 'obstacle']
      .flatMap(k => spriteAssets[k] || []).map(s => BASE + s);
    await Promise.all(srcs.map(decodeImg));
  }
  layout();
  await loadScreen();
}

function nextAvatar() {
  avatarIdx = (avatarIdx + 1) % AVATARS.length;
