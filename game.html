// === Teclado ===
// T (de Tier): muestra/oculta el nivel de dificultad actual (debug,
// esquina sup-izq). No choca con el navegador ni con WASD/flechas.
const debugTierEl = document.createElement('div');
debugTierEl.style.cssText = 'position:fixed;left:8px;top:8px;z-index:300;display:none;' +
  'font:bold 14px monospace;color:#0f0;background:rgba(0,0,0,.75);padding:4px 8px;' +
  'border-radius:4px;pointer-events:none;';
document.body.appendChild(debugTierEl);
function updateDebugTier() {
  // gameLevel ya es el tier real de la pantalla cargada (incl. tier 18
  // del boss final y el tier elegido en la demo bossrun)
  debugTierEl.textContent = tt('game.tier') + ' ' + (REAL_MODE ? gameLevel : currentTier);
}
document.addEventListener('pointerdown', () => { if (window.FinalBattle?.active) FinalBattle.onPointer(); });
document.addEventListener('keydown', (e) => {
  // Consola de hacks: Tab la abre/cierra siempre; abierta, el input
  // gestiona sus teclas y el avatar no se mueve
  if (e.key === 'Tab') { e.preventDefault(); hackToggle(); return; }
  if (hackOpen) return;
  // Batalla final en curso: ella gestiona el teclado (Continuar / Esc)
  if (window.FinalBattle?.active) { FinalBattle.onKey(e); return; }
  if (e.key === 't' || e.key === 'T' || e.key === 'p' || e.key === 'P') {
    e.preventDefault();
    const on = debugTierEl.style.display === 'none';
    debugTierEl.style.display = on ? 'block' : 'none';
    if (on) updateDebugTier();
    return;
  }
  // Modal abierto (victoria o derrota): lo gestiona antes que el resto
  if (modalOpen) {
    if (modalMode === 'lose') {
      if (e.key === 'Enter' || e.code === 'Space' || e.key === 'r' || e.key === 'R') {
        e.preventDefault(); play(pressAudio); retryLose();
      } else if (e.key === 'Escape') {
        e.preventDefault(); play(backAudio);
        if (REAL_MODE) backToSubmundo(); else retryLose();
      }
      return;
    }
    // Modal de victoria abierto: flechas eligen, Enter confirma, Esc = continuar
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      e.preventDefault(); modalSel = modalSel === 0 ? 1 : 0; play(hoverAudio); renderModal();
    } else if (e.key === 'Enter' || e.code === 'Space') {
      e.preventDefault(); play(pressAudio); modalSel === 1 ? confirmWin() : restartWin();
    } else if (e.key === 'Escape') {
      e.preventDefault(); play(backAudio); confirmWin();
    }
    return;
  }
  if (REAL_MODE) {
    if (e.key === 'Escape') { e.preventDefault(); play(backAudio); if (won) confirmWin(); else backToSubmundo(); return; }
    if (countingDown) return;
    if (e.key === 'r' || e.key === 'R' || e.code === 'Space' || e.key === 'Enter') {
      e.preventDefault();
      play(pressAudio);
      if (won) confirmWin(); else loadScreen();
      return;
    }
    if (gameOver) return;
    if (e.key === 'h' || e.key === 'H') { e.preventDefault(); useHintItem(); return; }
    if (e.key === 'u' || e.key === 'U') { e.preventDefault(); useUndoItem(); return; }
    if (e.key === 'm' || e.key === 'M') { e.preventDefault(); useMidasItem(); return; }

    const dirs = {
      'ArrowUp': [0, -1], 'ArrowDown': [0, 1],
      'ArrowLeft': [-1, 0], 'ArrowRight': [1, 0],
      'w': [0, -1], 's': [0, 1], 'a': [-1, 0], 'd': [1, 0],
      'W': [0, -1], 'S': [0, 1], 'A': [-1, 0], 'D': [1, 0],
    };
    const d = dirs[e.key];
    if (d) { e.preventDefault(); movePlayer(d[0], d[1]); }
    return;
  }
  if (e.code === 'Enter') { e.preventDefault(); nextAvatar(); return; }
  if (e.key === 'r' || e.key === 'R') { e.preventDefault(); loadScreen(); return; }
  // Cambiar tier: [ ] o - / +
  if (e.key === '[' || e.key === '-') {
    e.preventDefault();
    currentTier = Math.max(6, currentTier - 1); // el nivel más bajo es el 6
    loadScreen();
    return;
  }
  if (e.key === ']' || e.key === '+' || e.key === '=') {
    e.preventDefault();
    currentTier = Math.min(18, currentTier + 1);
    loadScreen();
    return;
  }
  if (e.code === 'Space') { e.preventDefault(); loadWorld(worldIdx + 1); return; }
  if (gameOver) return;
  const dirs = {
    'ArrowUp': [0, -1], 'ArrowDown': [0, 1],
    'ArrowLeft': [-1, 0], 'ArrowRight': [1, 0],
    'w': [0, -1], 's': [0, 1], 'a': [-1, 0], 'd': [1, 0],
    'W': [0, -1], 'S': [0, 1], 'A': [-1, 0], 'D': [1, 0],
  };
  const d = dirs[e.key];
  if (d) { e.preventDefault(); movePlayer(d[0], d[1]); }
});

// === Ítems de la tienda (modo real; badges táctiles abajo-derecha) ===
// pista → flecha del movimiento óptimo (H) · deshacer → rebobina el último
// turno (U) · midas → aplica al MUNDO entero (M): el oro de las islas
// posteriores a la activación se duplica para siempre (wp.midasAt).
// El nivel donde se activa NO se duplica: se aplica "del siguiente en
// adelante" — activarlo en el nivel 3 dobla del 4 al 12.
function midasAt() {
  return playerData?.worldProgress?.[REAL_WORLD]?.midasAt;
}
function midasOn() {
  const m = midasAt();
  return m != null && REAL_LEVEL > m;
}
function updateItemBadges() {
  if (!REAL_MODE) return;
  const inv = playerData?.inventory || {};
  const show = (id, n, active) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.style.display = (n > 0 || active) ? 'flex' : 'none';
    el.classList.toggle('active', !!active);
  };
  show('hint-badge', inv.pista || 0);
  show('badge-undo', inv.deshacer || 0);
  show('badge-midas', inv.midas || 0, midasAt() != null);
  document.getElementById('hint-count').textContent = String(inv.pista || 0);
  document.getElementById('undo-count').textContent = String(inv.deshacer || 0);
  document.getElementById('midas-count').textContent = String(inv.midas || 0);
}
function denyBadge(id) {
  const badge = document.getElementById(id);
  if (!badge) return;
  badge.classList.remove('denied'); void badge.offsetWidth;
  badge.classList.add('denied');
  AssetsCache.playSound('/assets/sounds/comun/choque.wav', 0.45);
}
async function consumeShopItem(itemId) {
  const r = await fetch(`${BASE}/api/consume-item`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ itemId }),
  });
  const d = await r.json();
  if (d.player) playerData = d.player;
  return d.ok;
}
// Deshacer: la pila de estados ya guarda posición/enemigos/turno
function undoLastMove() {
  const s = undoStack.pop();
  if (!s) return false;
  player.c = s.p.c; player.r = s.p.r;
  s.e.forEach((e, i) => { if (enemies[i]) { enemies[i].c = e.c; enemies[i].r = e.r; enemies[i].stunnedTurns = e.st; } });
  playerStunnedTurns = s.ps; turn = s.turn;
  positionSelector(); updateEnemyPositions(); updateTurnDisplay();
  return true;
}
async function useUndoItem() {
  if (!REAL_MODE || gameOver || countingDown || modalOpen || moving) return;
  if (!undoStack.length || !((playerData?.inventory?.deshacer) > 0)) { denyBadge('badge-undo'); return; }
  try {
    if (!(await consumeShopItem('deshacer'))) { denyBadge('badge-undo'); return; }
    undoLastMove();
    updateItemBadges();
    AssetsCache.playSound('/assets/sounds/comun/orbe.wav', 0.55);
  } catch { denyBadge('badge-undo'); }
}
// Midas: se aplica al mundo entero — el oro de las islas posteriores a la
// activación queda duplicado para siempre (persistido en wp.midasAt). Si
// el mundo ya lo tiene, no se consume (badge denegado).
async function useMidasItem() {
  if (!REAL_MODE || gameOver || countingDown || modalOpen) return;
  if (midasAt() != null || !((playerData?.inventory?.midas) > 0)) {
    denyBadge('badge-midas'); return;
  }
  try {
    const r = await fetch(`${BASE}/api/midas-activate`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ world: REAL_WORLD, level: REAL_LEVEL }),
    });
    const d = await r.json();
    if (!d.ok) { denyBadge('badge-midas'); return; }
    if (d.player) playerData = d.player;
    updateItemBadges();
    AssetsCache.playSound('/assets/sounds/comun/moneda.wav', 0.7);
  } catch { denyBadge('badge-midas'); }
}

async function useHintItem() {
  if (!REAL_MODE || gameOver || countingDown || modalOpen) return;
  const badge = document.getElementById('hint-badge');
  const deny = () => denyBadge('hint-badge');
  if (!((playerData?.inventory?.pista) > 0)) { deny(); return; }
  try {
    const q = `id=${encodeURIComponent(currentScreenId)}&p=${player.c},${player.r}` +
      `&e=${enemies.map(e => `${e.c},${e.r}`).join(';')}` +
      `&ps=${playerStunnedTurns}&es=${enemies.map(e => e.stunnedTurns).join(',')}`;
    // La pista se consulta ANTES de consumir: si la posición no tiene
    // salvación, el orbe muestra ✕ y el ítem NO se gasta.
    const rHint = await fetch(`${BASE}/api/hint?${q}`);
    const dHint = await rHint.json();
    const cell = cellPos(player.c, player.r, true);
    const el = document.createElement('div');
    el.className = 'hint-arrow';
    el.style.left = cell.left + 'px';
    el.style.top = cell.top + 'px';
    el.style.width = cell.w + 'px';
    el.style.height = cell.h + 'px';
    el.style.fontSize = Math.round(cell.h * 0.9) + 'px';
    if (!dHint.ok) {
      el.classList.add('dead');
      el.textContent = '✕';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1650);
      AssetsCache.playSound('/assets/sounds/comun/choque.wav', 0.5);
      return;
    }
    const rCons = await fetch(`${BASE}/api/consume-item`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ itemId: 'pista' }),
    });
    const dCons = await rCons.json();
    if (!dCons.ok) { el.remove(); deny(); return; }
    if (dCons.player) playerData = dCons.player;
    updateItemBadges();
    AssetsCache.playSound('/assets/sounds/comun/orbe.wav', 0.55);
    const [dc, dr] = dHint.move;
    el.textContent = dc === 1 ? '→' : dc === -1 ? '←' : dr === -1 ? '↑' : dr === 1 ? '↓' : '·';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1650);
  } catch { deny(); }
}
document.getElementById('hint-badge').addEventListener('pointerdown', e => {
  e.preventDefault(); e.stopPropagation(); useHintItem();
});
document.getElementById('badge-undo').addEventListener('pointerdown', e => {
  e.preventDefault(); e.stopPropagation(); useUndoItem();
});
document.getElementById('badge-midas').addEventListener('pointerdown', e => {
  e.preventDefault(); e.stopPropagation(); useMidasItem();
});


// === Puente táctil (web/tizen.js, Android) ===
// Un tap sobre una casilla adyacente mueve el avatar hasta ella; sobre el
// resto del tablero, un paso en la dirección dominante hacia el punto
// tocado. Sin este hook el tap no haría nada (solo se mueve con
// flechas/WASD o gestos de swipe).
window.touchTapMove = function (x, y) {
  if (!board.w || gameOver || won || modalOpen || countingDown || moving) return;
  // Solo la casilla adyacente ortogonal mueve un paso: un tap lejano no
  // hace nada; una adyacente bloqueada cae en movePlayer, que ya hace
  // la animación de rebote + sonido de choque.
  const cw = avatarBoard.w / COLS, ch = avatarBoard.h / ROWS;
  const dc = Math.floor((x - avatarBoard.left) / cw) - player.c;
  const dr = Math.floor((y - avatarBoard.top) / ch) - player.r;
  if (Math.abs(dc) + Math.abs(dr) === 1) movePlayer(dc, dr);
};

// === Consola de hacks (Tab) ===
// Panel inferior semitransparente con historial y mapa de comandos
// extensible (HACK_CMDS). Abierta, bloquea el input del juego.
let hackOpen = false;
let hackSpeed = 1;      // multiplicador de la animación de `complete`
let hackReplaying = false;
let hackSolve = null;   // caché de /api/solve-screen por pantalla
let hackDebug = false;
const hcEl = document.createElement('div');
hcEl.id = 'hack-console';

document.body.appendChild(hcEl);

const hcIn = hcEl.querySelector('#hc-in');
const hcDebugEl = document.createElement('div');
hcDebugEl.id = 'hc-debug';
document.body.appendChild(hcDebugEl);
const hcHistory = [];
let hcHistIdx = -1;

function hk(key, ...args) { try { return tt(key, ...args); } catch { return key; } }
function hcPrint(text, cls) {
  const d = document.createElement('div');
  if (cls) d.className = cls;
  d.textContent = text;
  hcOut.appendChild(d);
  hcOut.scrollTop = hcOut.scrollHeight;
}
function hackToggle() {
  hackOpen = !hackOpen;
  hcEl.classList.toggle('open', hackOpen);
  if (hackOpen) {
    if (!hcOut.children.length) hcPrint(hk('hack.help'), 'dim');

  } else hcIn.blur();
}
hcIn.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (hcHistory.length) { hcHistIdx = Math.max(0, hcHistIdx < 0 ? hcHistory.length - 1 : hcHistIdx - 1); hcIn.value = hcHistory[hcHistIdx] || ''; }
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (hcHistIdx >= 0) { hcHistIdx++; if (hcHistIdx >= hcHistory.length) { hcHistIdx = -1; hcIn.value = ''; } else hcIn.value = hcHistory[hcHistIdx]; }
  } else if (e.key === 'Enter') {
    e.preventDefault();
    const line = hcIn.value.trim();
    hcIn.value = '';
    if (!line) return;
    hcHistory.push(line); hcHistIdx = -1;
    hcPrint('❯ ' + line, 'cmd');
    hackRun(line);
  } else if (e.key === 'Escape') {
    e.preventDefault(); hackToggle();
  }
});

const sleep = (ms) => new Promise(r => setTimeout(r, ms));
async function waitIdle() {
  while ((moving || countingDown) && !gameOver) await sleep(60);
}
async function fetchSolve() {
  if (hackSolve && hackSolve.id === currentScreenId) return hackSolve.data;
  try {
    const r = await fetch(`${BASE}/api/solve-screen?id=${encodeURIComponent(currentScreenId)}`);
    const d = await r.json();
    if (d.ok) { hackSolve = { id: currentScreenId, data: d }; return d; }
  } catch {}
  return null;
}
async function hackLoadScreen(url) {
  try {
    const r = await fetch(url);
    const d = await r.json();
    if (!d.ok) { hcPrint(hk('hack.notfound', ''), 'err'); return null; }
    await applyScreen(d.screen);
    hcPrint(hk('hack.loaded', d.screen.id), 'ok');
    return d.screen;
  } catch { hcPrint(hk('hack.notfound', ''), 'err'); return null; }
}
const hackTier = () => (REAL_MODE ? gameLevel : currentTier);

// Mapa de comandos — añadir uno nuevo = una entrada aquí
const HACK_CMDS = {
  help: () => hcPrint(hk('hack.help'), 'dim'),
  clear: () => { hcOut.innerHTML = ''; },
  level: async (args) => {
    if (!args.length) { hcPrint(hk('hack.tier', hackTier()), 'gold'); return; }
    const n = parseInt(args[0], 10);
    if (!Number.isFinite(n) || n < 1 || n > 15) { hcPrint(hk('hack.usageLevel'), 'warn'); return; }
    currentTier = n;
    await hackLoadScreen(`${BASE}/api/practice-screen?tier=${n}&t=${Date.now()}`);
  },
  seed: async (args) => {
    let id = args[0] || '';
    const m = id.match(/^(\d+)[-:](\d+)$/);
    if (m) id = `l${m[1]}-s${m[2]}`;
    if (!id) { hcPrint(hk('hack.usageSeed'), 'warn'); return; }
    await hackLoadScreen(`${BASE}/api/screen?id=${encodeURIComponent(id)}`);
  },
  next: () => hackLoadScreen(`${BASE}/api/screen-nav?id=${encodeURIComponent(currentScreenId)}&dir=next`),
  prev: () => hackLoadScreen(`${BASE}/api/screen-nav?id=${encodeURIComponent(currentScreenId)}&dir=prev`),
  restart: async () => { if (lastScreen) await applyScreen(lastScreen); },
  undo: () => {
    if (!undoLastMove()) { hcPrint(hk('hack.noUndo'), 'err'); }
  },
  optimal: async () => {
    const sol = await fetchSolve();
    hcPrint(hk('hack.optimal', sol?.par ?? lastScreen?.par ?? currentMinMoves), 'gold');
  },
  turns: () => hcPrint(hk('hack.turns', turn), 'gold'),
  solutions: async () => {
    const sol = await fetchSolve();
    if (!sol || !sol.sols) { hcPrint(hk('hack.nosol'), 'err'); return; }
    hcPrint(hk('hack.solutions', sol.sols[0] ?? 0, sol.sols[1] ?? 0, sol.sols[2] ?? 0), 'gold');
  },
  hint: async () => {
    const q = `id=${encodeURIComponent(currentScreenId)}&p=${player.c},${player.r}` +
      `&e=${enemies.map(e => `${e.c},${e.r}`).join(';')}` +
      `&ps=${playerStunnedTurns}&es=${enemies.map(e => e.stunnedTurns).join(',')}`;
    try {
      const r = await fetch(`${BASE}/api/hint?${q}`);
      const d = await r.json();
      if (!d.ok) { hcPrint(hk('hack.nosol'), 'err'); return; }
      const [dc, dr] = d.move;
      hcPrint(hk('hack.hint', dc === 1 ? '→' : dc === -1 ? '←' : dr === -1 ? '↑' : dr === 1 ? '↓' : '·'), 'gold');
      movePlayer(dc, dr);
    } catch { hcPrint(hk('hack.nosol'), 'err'); }
  },
  god: () => { godMode = !godMode; hcPrint(hk('hack.god', hk(godMode ? 'hack.on' : 'hack.off')), godMode ? 'ok' : 'warn'); },
  speed: (args) => {
    const x = parseFloat(args[0]);
    if (!Number.isFinite(x) || x <= 0) { hcPrint(hk('hack.speed', hackSpeed), 'gold'); return; }
    hackSpeed = Math.min(16, Math.max(0.25, x));
    hcPrint(hk('hack.speed', hackSpeed), 'ok');
  },
  debug: async () => {
    hackDebug = !hackDebug;
    hcDebugEl.style.display = hackDebug ? 'block' : 'none';
    hcPrint(hk('hack.debug', hk(hackDebug ? 'hack.on' : 'hack.off')), hackDebug ? 'ok' : 'warn');
    if (hackDebug) hackDebugUpdate();
  },
  complete: async () => {
    if (!lastScreen) { hcPrint(hk('hack.nosol'), 'err'); return; }
    hackReplaying = false;
    await applyScreen(lastScreen); // reinicia la pantalla
    const sol = await fetchSolve();
    if (!sol || !sol.moves || !sol.moves.length) { hcPrint(hk('hack.nosol'), 'err'); return; }
    hcPrint(hk('hack.replaying'), 'dim');
    hackReplaying = true;
    try {
      for (const [dc, dr] of sol.moves) {
        await waitIdle();
        if (!hackReplaying || gameOver) break;
        while (playerStunnedTurns > 0 && !gameOver) { movePlayer(1, 0); await waitIdle(); }
        if (gameOver || !hackReplaying) break;
        movePlayer(dc, dr);
        await sleep(Math.max(80, 380 / hackSpeed));
      }
      await waitIdle();
      hcPrint(hk('hack.done'), 'ok');
    } finally { hackReplaying = false; }
  },
};
function hackRun(line) {
  const [name, ...args] = line.split(/\s+/);
  const cmd = HACK_CMDS[name.toLowerCase()];
  if (!cmd) { hcPrint(hk('hack.unknown', name), 'err'); return; }
  Promise.resolve(cmd(args)).catch(() => hcPrint(hk('hack.notfound', name), 'err'));
}
async function hackDebugUpdate() {
  if (!hackDebug) return;
  const sol = await fetchSolve();
  // Métricas: distancias Manhattan entre enemigos, nº de obstáculos+trampas y
  // % de casillas usadas (camino de la solución ∪ elementos).
  const dists = [];
  for (let i = 0; i < enemies.length; i++)
    for (let j = i + 1; j < enemies.length; j++)
      dists.push(Math.abs(enemies[i].c - enemies[j].c) + Math.abs(enemies[i].r - enemies[j].r));
  const obsTraps = obstacleCells.size + trapCells.size;
  let use = 0;
  if (sol && sol.path) {
    const used = new Set(sol.path.map(([c, r]) => `${c},${r}`));
    for (const k of obstacleCells) used.add(k);
    for (const k of trapCells) used.add(k);
    for (const e of enemies) used.add(`${e.c},${e.r}`);
    used.add(`${goal.c},${goal.r}`);
    use = Math.round(used.size / (COLS * ROWS) * 100);
  }
  hcDebugEl.textContent = hk('hack.metrics',
    enemies.length, dists.length ? dists.join('/') : '-', obsTraps, use);
}
document.getElementById('overlay-restart').addEventListener('click', () => {
  if (REAL_MODE && won) { play(pressAudio); confirmWin(); return; }
  play(pressAudio);
  loadScreen();
});

window.addEventListener('resize', () => {
  if (!detection) return;
  layout();
  positionSelector();
  repositionAll();
  renderBoardTexts();
});

// === Init ===
// La pantalla nace tras un fundido negro: hay que revelarla solo cuando
// las imágenes del primer render ya están decodificadas — sin esto el
// fundido descubre un tablero a medias (flicker).
function revealWhenReady() {
  // Solo imágenes con src de verdad: un <img> sin src (p.ej. el pedestal,
  // deshabilitado) tiene complete=true pero nunca dispara load/error —
  // esperarlo dejaba el velo negro puesto hasta el watchdog.
  const imgs = [...document.querySelectorAll('#stage img, #entities img, #selector img, #pedestal img')]
    .filter(im => im.getAttribute('src'));
  const wait = Promise.all(imgs.map(im =>
    (im.complete && im.naturalWidth) ? Promise.resolve()
      : new Promise(res => {
        im.addEventListener('load', res, { once: true });
        im.addEventListener('error', res, { once: true });
      })));
  // sin tope duro: tarde lo que tarde, pero el watchdog de AssetsCache
  // evita un negro eterno si algo se rompe de verdad
  wait.then(() => AssetsCache.transitionIn());
}

async function init() {
  // De momento sin música dentro del tablero (solo SFX propios)
  const res = await fetch(`${BASE}/api/worlds?t=${Date.now()}`);
  worlds = await res.json();

  await loadI18n();
  applyPracticeTexts();

  if (REAL_MODE) {
    // Avatar de la partida (fijo, elegido en la selección de personaje)
    try {
      const r = await fetch(BASE + '/api/savegame');
      if (r.ok) { const d = await r.json(); playerData = d.player || null; renderBoardTexts(); updateItemBadges(); }
    } catch {}
    if (playerData && typeof playerData.avatarIndex === 'number') {
      avatarIdx = playerData.avatarIndex;
      avatarImg.src = BASE + AVATARS[avatarIdx];
    }
    gameLevel = playerData?.gameLevel ?? 1;
    // Áreas de texto calibradas del mundo (turno, óptimo, nivel, oro)
    try {
      const r = await fetch(`${BASE}/api/load-board-text-areas?world=${encodeURIComponent(REAL_WORLD)}`);
      if (r.ok) { const d = await r.json(); textAreas = d.areas || null; }
    } catch {}
    // Áreas del modal de victoria (título en arco, contenido, botones)
    try {
      const r = await fetch(`${BASE}/api/load-modal-areas`);
      if (r.ok) { const d = await r.json(); modalAreas = d.areas || null; }
    } catch {}
    // Áreas del modal de derrota (un solo botón centrado)
    try {
      const r = await fetch(`${BASE}/api/load-modal-areas?which=reintentar`);
      if (r.ok) { const d = await r.json(); modalLoseAreas = d.areas || null; }
    } catch {}
    decodeImg(BASE + '/assets/comunes/modal.webp');
    decodeImg(BASE + '/assets/comunes/modal-reintentar.webp');
    // Demo de partida real a boss: la música del submundo suena desde el
    // inicio (en el flujo real la fija submundo.html al entrar)
    if (DEMO_RUN) AssetsCache.setMusicTrack(AssetsCache.musicForWorld(REAL_WORLD));
    document.getElementById('hud').style.display = 'none';
    document.getElementById('practice-tag').style.display = 'none';
    document.getElementById('help').style.display = 'none';
    const idx = worlds.findIndex(w => w.world === REAL_WORLD);
    await loadWorld(idx >= 0 ? idx : 0);
    revealWhenReady();
    return;
  }

  // Avatares decodificados de antemano (Enter los cicla en el hot path)
  AVATARS.forEach(a => decodeImg(BASE + a));
  // Mundo al azar en cada recarga — la demo del boss final fuerza MAZMORRA
  const wi = DEMO_FINAL
    ? Math.max(0, worlds.findIndex(w => w.world === FINAL_WORLD))
    : Math.floor(Math.random() * worlds.length);
  if (DEMO_WIN) {
    // Demo de victoria real (monedas + modal) sobre una pantalla de
    // práctica: se viste como modo real pero no hay level-complete.
    try {
      const r = await fetch(BASE + '/api/savegame');
      if (r.ok) { const d = await r.json(); playerData = d.player || null; renderBoardTexts(); updateItemBadges(); }
    } catch {}
    if (playerData && typeof playerData.avatarIndex === 'number') {
      avatarIdx = playerData.avatarIndex;
      avatarImg.src = BASE + AVATARS[avatarIdx];
    }
    gameLevel = playerData?.gameLevel ?? 1;
    try {
      const r = await fetch(`${BASE}/api/load-board-text-areas?world=${encodeURIComponent(worlds[wi].world)}`);
      if (r.ok) { const d = await r.json(); textAreas = d.areas || null; }
    } catch {}
    try {
      const r = await fetch(`${BASE}/api/load-modal-areas`);
      if (r.ok) { const d = await r.json(); modalAreas = d.areas || null; }
    } catch {}
    try {
      const r = await fetch(`${BASE}/api/load-modal-areas?which=reintentar`);
      if (r.ok) { const d = await r.json(); modalLoseAreas = d.areas || null; }
    } catch {}
    decodeImg(BASE + '/assets/comunes/modal.webp');
    decodeImg(BASE + '/assets/comunes/modal-reintentar.webp');
    document.getElementById('hud').style.display = 'none';
    document.getElementById('practice-tag').style.display = 'none';
    document.getElementById('help').style.display = 'none';
    await loadWorld(wi);
    revealWhenReady();
    setTimeout(winGame, 1200);
    return;
  }
  // Modo práctica también usa el modal de derrota
  try {
    const r = await fetch(`${BASE}/api/load-modal-areas?which=reintentar`);
    if (r.ok) { const d = await r.json(); modalLoseAreas = d.areas || null; }
  } catch {}
  decodeImg(BASE + '/assets/comunes/modal-reintentar.webp');
  await loadWorld(wi);
  revealWhenReady();
}

// === Autopiloto (?auto=1) — grabación de demos: el solver juega el nivel
// real con pausas legibles y confirma la victoria tras la fanfarria ===
async function autoplay() {
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const idle = () => new Promise(res => {
    const t = setInterval(() => {
      if ((!moving && !countingDown) || won || gameOver || modalOpen) { clearInterval(t); res(); }
    }, 120);
  });
  await sleep(900);
  while (true) {
    await idle();
    if (won || gameOver || modalOpen) break;
    if (!currentScreenId) { await sleep(300); continue; }
    let moves = [];
    try {
      const r = await fetch(`${BASE}/api/solve-screen?id=${encodeURIComponent(currentScreenId)}`);
      const d = await r.json();
      if (d.ok && d.moves) moves = d.moves;
    } catch {}
    if (!moves.length) { await sleep(1500); continue; }
    for (const m of moves) {
      await idle();
      if (won || gameOver || modalOpen) break;
      movePlayer(m[0], m[1]);
      await sleep(260);
    }
    if (won || gameOver || modalOpen) break;
    await sleep(900);
  }
  if (modalOpen && modalMode === 'lose') { await sleep(1800); retryLose(); return void setTimeout(autoplay, 1800); }
  // El modal de victoria de boss llega ~7.4s tras la victoria (tras la
  // fanfarria y el desquebrajado) — esperar a que abra, no a un plazo fijo
  for (let t0 = Date.now(); !modalOpen && Date.now() - t0 < 15000;) await sleep(300);
  if (modalOpen) { modalSel = 1; await sleep(400); confirmWin(); }
}

init().then(() => { if (AUTOPLAY && REAL_MODE && !DEMO_RUN) autoplay(); });
