<!DOCTYPE html>
<html lang="es">
<head>
<script src="/web/webdb.js"></script>
<script src="/web/solver.bundle.js"></script>
<script src="/web/api-shim.js"></script>
<script src="/web/tizen.js"></script>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Runika 2D</title>
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; background: #000; overflow: hidden;
    font-family: 'ChelseaMarket', cursive;
    user-select: none;
  }
  #loading-screen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 100; background: #0a0806;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #e8d4a8;
  }
  #loading-screen .title {
    font-size: 2.5em; color: #f0d890;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    margin-bottom: 30px; letter-spacing: 3px;
  }
  #loading-bar-bg {
    width: 300px; height: 8px;
    background: rgba(60, 42, 20, 0.5);
    border: 1px solid rgba(180, 150, 80, 0.4);
    border-radius: 4px; overflow: hidden;
  }
  #loading-bar {
    width: 0%; height: 100%;
    background: linear-gradient(90deg, #c4a050, #f0d890);
    transition: width 0.2s ease;
  }
  #loading-text { margin-top: 12px; font-size: 0.9em; color: #a08850; }
  #transition-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 90; background: #000;
    opacity: 1; pointer-events: auto; /* nace en negro: cero destello al entrar */
  }
  #bg {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: contain; object-position: center;
    z-index: 1;
  }
  /* Letterbox cinemático como el resto del juego: la tienda es ~16:9
     pero el viewport puede no serlo — los bordes se rellenan con una
     copia difuminada, sin estirar ni recortar el arte */
  #fillbg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    filter: blur(45px) brightness(0.42) saturate(1.25);
    transform: scale(1.15);
    z-index: 0;
  }
  /* Viñeta suave para que el texto respire sobre el arte */
  #vignette {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background:
      linear-gradient(to bottom, rgba(0,0,0,0.35) 0%, transparent 12%, transparent 84%, rgba(0,0,0,0.55) 100%);
  }

  /* Overlay en coordenadas de IMAGEN (como el resto del juego) */
  #overlay { position: absolute; inset: 0; z-index: 10; pointer-events: none; }

  /* ── Título sobre el cartelón de madera ─────────────────────── */
  #shop-title {
    position: absolute; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    color: #ffd76a; font-size: 4vh; letter-spacing: 1px;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.9), 0 0 18px rgba(255,190,60,0.3);
    pointer-events: none; white-space: nowrap; overflow: hidden;
  }
  /* ── Oro dentro de la placa pintada (arriba-derecha) ────────── */
  #gold-num {
    position: absolute; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    color: #ffe9a8; font-size: 3.4vh;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.95);
    background: rgba(20, 12, 6, 0.45); border-radius: 8px;
    pointer-events: none;
  }

  /* ── Bocadillo del tendero (posición calibrada por mundo) ────── */
  #bubble {
    position: absolute; z-index: 12;
    background: rgba(24, 16, 8, 0.85);
    border: 2px solid rgba(210, 170, 90, 0.75);
    border-radius: 14px;
    padding: 1.4vh 1.1vw;
    color: #f2e0b8; font-size: 2vh; line-height: 1.45;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
  }
  #bubble::after {
    content: '';
    position: absolute; right: -14px; top: 60%;
    border: 8px solid transparent;
    border-left-color: rgba(210, 170, 90, 0.75);
    border-top-color: rgba(210, 170, 90, 0.75);
  }
  #keeper-name {
    display: block; color: #ffd76a; font-size: 1.05em;
    margin-bottom: 0.4em;
  }

  /* ── Ítems dentro de los cofres-expositores del mostrador ────── */
  .item-slot {
    position: absolute; z-index: 11;
    pointer-events: none;
    border: 2px solid transparent; border-radius: 8px;
    transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
  }
  .item-slot.selected {
    border-color: rgba(255, 204, 68, 0.95);
    background: rgba(60, 40, 14, 0.35);
    box-shadow: 0 0 20px rgba(255, 204, 68, 0.35), inset 0 0 24px rgba(255, 190, 80, 0.12);
  }
  .item-slot.bought { animation: boughtFlash 0.5s ease; }
  .item-slot.denied { animation: deniedShake 0.35s ease; }
  /* Ya tienes el máximo (1 por tipo): apagado, sin brillo */
  .item-slot.disabled { filter: grayscale(0.85) brightness(0.6); }
  @keyframes boughtFlash {
    0% { background: rgba(120, 160, 60, 0.7); }
    100% { background: rgba(60, 40, 14, 0.35); }
  }
  @keyframes deniedShake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }
  /* Marco de selección poligonal (slotNsel de areas.json) que abraza
     el trapecio del cofre pintado. Fallback: borde recto de .item-slot */
  #seldraw { position: absolute; inset: 0; z-index: 12; pointer-events: none; }
  #seldraw polygon.sel {
    fill: rgba(255, 204, 68, 0.10);
    stroke: rgba(255, 204, 68, 0.95); stroke-width: 3px;
    filter: drop-shadow(0 0 10px rgba(255, 190, 80, 0.55));
  }
  #seldraw polygon.bought { animation: polyBought 0.5s ease; }
  #seldraw polygon.denied { animation: deniedShake 0.35s ease; }
  @keyframes polyBought {
    0% { fill: rgba(120, 160, 60, 0.7); stroke: rgba(160, 220, 110, 0.95); }
    100% { fill: rgba(255, 204, 68, 0.10); }
  }
  .item-icon {
    position: absolute; object-fit: contain;
    filter: drop-shadow(0 0 8px rgba(0,0,0,0.8));
    pointer-events: none;
  }
  /* --fs: escala de texto calibrada por zona (calibrate-tienda.html).
     Nombre y precio son zonas calibrables independientes (slotNname /
     slotNprice en areas.json). */
  .item-name {
    position: absolute; pointer-events: none;
    color: #f2e0b8; font-size: calc(1.9vh * var(--fs, 1)); text-align: center;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.95);
  }
  .item-price {
    position: absolute; pointer-events: none;
    display: flex; align-items: center; justify-content: center; gap: 0.35em;
    color: #ffd76a; font-size: calc(1.8vh * var(--fs, 1));
    text-shadow: 1px 1px 3px rgba(0,0,0,0.95);
  }
  .item-price img { height: 1em; }
  #slots { position: absolute; inset: 0; z-index: 11; pointer-events: auto; }

  /* Descripción del ítem seleccionado (zona común `desc` de areas.json) */
  #item-desc {
    position: absolute; z-index: 11; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    text-align: center; color: #f2e0b8;
    background: rgba(20, 12, 6, 0.5); border-radius: 10px;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.95);
  }

  /* ── Pie: controles ─────────────────────────────────────────── */
  #controls-hint {
    position: absolute; left: 0; bottom: 2.4vh; width: 100%; z-index: 11;
    text-align: center;
    color: #c9b48a; font-size: 1.9vh;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
    pointer-events: none;
  }
  #controls-hint .key {
    display: inline-block;
    border: 1.5px solid rgba(220, 190, 120, 0.7);
    border-radius: 6px;
    padding: 0.15em 0.55em; margin: 0 0.25em;
    background: rgba(30, 20, 10, 0.8);
    color: #ffe9a8;
  }
  #back-btn {
    position: absolute; bottom: 12px; left: 12px; z-index: 20;
    font-family: 'ChelseaMarket', cursive;
    font-size: 1em; color: #e8d4a8;
    padding: 8px 24px;
    background: linear-gradient(180deg, rgba(60, 42, 20, 0.9), rgba(35, 24, 10, 0.95));
    border: 2px solid rgba(180, 150, 80, 0.5);
    border-radius: 8px; cursor: pointer;
    box-shadow: 0 4px 0 rgba(20, 12, 4, 0.8), 0 6px 10px rgba(0,0,0,0.5);
    text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
    transition: all 0.15s ease;
  }
  #back-btn:hover {
    background: linear-gradient(180deg, rgba(80, 58, 28, 0.9), rgba(50, 34, 14, 0.95));
    border-color: rgba(232, 212, 168, 0.7); color: #fff8e0;
  }
  #back-btn:active { transform: translateY(3px); }
</style>
</head>
<body>

<div id="loading-screen">
  <div class="title" data-i18n="menu.title"></div>
  <div id="loading-bar-bg"><div id="loading-bar"></div></div>
  <div id="loading-text"></div>
</div>

<div id="transition-overlay"></div>

<img id="fillbg" alt="">
<img id="bg" alt="">
<div id="vignette"></div>

<div id="overlay">
  <div id="shop-title"></div>
  <div id="gold-num">0</div>
</div>

<div id="bubble"><span id="keeper-name"></span><span id="keeper-speech"></span></div>

<div id="slots"></div>
<div id="item-desc"></div>
<svg id="seldraw"></svg>
<div id="controls-hint"></div>
<button id="back-btn" data-i18n="instructions.back"></button>

<script src="/assets-cache.js"></script>
<script>
  let translations = {};
  let fallback = {};
  let currentWorld = 'ESPACIO';
  let player = null;
  let catalog = [];
  let selectedItem = 0;
  let buying = false;
  // demo=1: vista de testing — oro/inventario falsos, compras simuladas
  // en memoria. Nunca toca la bbdd.
  const DEMO = new URLSearchParams(window.location.search).get('demo') === '1';

  const WORLD_ORDER = ['ESPACIO','AGUA','TIERRA','FUEGO','HIELO','VIENTO','INFRAMUNDO','MAZMORRA'];

  async function loadLang(lang) {
    const r = await fetch('/api/i18n' + (lang ? '/' + lang : ''));
    if (!r.ok) return {};
    return await r.json();
  }
  function t(key) { return translations[key] ?? fallback[key] ?? key; }
  function format(key, ...args) {
    return t(key).replace(/\{(\d+)\}/g, (m, i) => String(args[+i] ?? m));
  }

  async function loadPlayer() {
    // Una pista ya comprada para ver el estado deshabilitado
    if (DEMO) { player = { gold: 5000, inventory: { pista: 1 } }; return; }
    try {
      const r = await fetch('/api/savegame');
      if (r.ok) { const d = await r.json(); player = d.player || null; }
    } catch {}
  }
  async function loadCatalog() {
    try {
      const r = await fetch('/api/shop-items');
      if (r.ok) { const d = await r.json(); catalog = d.items || []; }
    } catch {}
  }

  const bg = document.getElementById('bg');

  /* Zonas del arte de la tienda (coords normalizadas de imagen):
     el cartelón para el título, la placa pintada para el oro, el
     bocadillo junto al tendero y los tres cofres del mostrador para
     los ítems. Defaults; la calibración por mundo vive en
     assets/tienda/<M>/areas.json (calibrate-tienda.html). */
  const HUD = {
    title:  { x: 0.20, y: 0.035, w: 0.40, h: 0.105 },
    gold:   { x: 0.815, y: 0.045, w: 0.115, h: 0.08 },
    bubble: { x: 0.04, y: 0.20, w: 0.24, h: 0 },
    // Zona común de descripción del ítem seleccionado (bajo los cofres)
    desc:   { x: 0.20, y: 0.865, w: 0.60, h: 0.065 },
    icons: [
      { x: 0.305, y: 0.630, w: 0.120, h: 0.135 },
      { x: 0.470, y: 0.630, w: 0.120, h: 0.135 },
      { x: 0.640, y: 0.630, w: 0.120, h: 0.135 },
    ],
    texts: [
      { x: 0.290, y: 0.775, w: 0.150, h: 0.085 },
      { x: 0.455, y: 0.775, w: 0.150, h: 0.085 },
      { x: 0.625, y: 0.775, w: 0.150, h: 0.085 },
    ],
    // Marcos de selección poligonales (trapecios que abrazan cada cofre)
    sels: [
      [[0.297, 0.632], [0.433, 0.632], [0.448, 0.863], [0.282, 0.863]],
      [[0.462, 0.632], [0.598, 0.632], [0.613, 0.863], [0.447, 0.863]],
      [[0.632, 0.632], [0.768, 0.632], [0.783, 0.863], [0.617, 0.863]],
    ],
  };
  let hudAreas = null; // areas.json del mundo, si existe

  async function loadAreas() {
    try {
      const r = await fetch('/api/shop-areas?world=' + encodeURIComponent(currentWorld));
      if (r.ok) { const d = await r.json(); if (d && d.areas) hudAreas = d.areas; }
    } catch {}
  }
  // Zona calibrada sobre el default (title/gold/bubble/slotNicon/slotNtext)
  function zone(k) {
    let a = hudAreas && hudAreas[k];
    const m = k.match(/^slot(\d)(icon|text)$/);
    if (!a && m && m[2] === 'icon' && hudAreas) a = hudAreas['slot' + m[1]]; // formato antiguo
    const def = m
      ? (m[2] === 'icon' ? HUD.icons : HUD.texts)[(+m[1] - 1) % 3]
      : HUD[k];
    return a ? { ...def, ...a } : def;
  }

  // Nombre y precio son zonas separadas (slotNname / slotNprice). Si un
  // mundo solo tiene el formato antiguo slotNtext, se reparte: nombre =
  // 55% superior, precio = 45% inferior.
  function textZone(n, part) {
    const c = hudAreas && hudAreas['slot' + n + part];
    if (c) return { x: 0, y: 0, w: 0, h: 0, ...c };
    const t = zone('slot' + n + 'text');
    return part === 'name'
      ? { ...t, h: t.h * 0.55 }
      : { ...t, y: t.y + t.h * 0.55, h: t.h * 0.45 };
  }

  // Zonas de un ítem: icono + nombre + precio + polígono de selección
  // (slotNsel). La fila 2+ repite el patrón desplazado hacia abajo.
  function slotAreas(i) {
    const n = (i % 3) + 1;
    let ia = zone('slot' + n + 'icon'), na = textZone(n, 'name'), pa = textZone(n, 'price');
    const s = hudAreas && hudAreas['slot' + n + 'sel'];
    let poly = (s && s.polygon && s.polygon.length >= 3)
      ? s.polygon.map(p => [...p])
      : HUD.sels[n - 1].map(p => [...p]);
    if (i >= 3) {
      // Ítem 4+ sin cofre pintado: si el mundo tiene slot4* calibrado lo
      // usa; si no, flota sobre el mostrador a la izquierda.
      const c4i = hudAreas && hudAreas['slot' + (i + 1) + 'icon'];
      const c4n = hudAreas && hudAreas['slot' + (i + 1) + 'name'];
      const c4p = hudAreas && hudAreas['slot' + (i + 1) + 'price'];
      const c4t = hudAreas && hudAreas['slot' + (i + 1) + 'text']; // formato antiguo
      const c4s = hudAreas && hudAreas['slot' + (i + 1) + 'sel'];
      if (c4i || c4n || c4p || c4t || c4s) {
        if (c4i) ia = { ...ia, ...c4i };
        const t4 = c4n || c4p ? null : c4t;
        if (c4n) na = { x: 0, y: 0, w: 0, h: 0, ...c4n };
        else if (t4) na = { ...t4, h: t4.h * 0.55 };
        if (c4p) pa = { x: 0, y: 0, w: 0, h: 0, ...c4p };
        else if (t4) pa = { ...t4, y: t4.y + t4.h * 0.55, h: t4.h * 0.45 };
        if (c4s && c4s.polygon && c4s.polygon.length >= 3) poly = c4s.polygon.map(p => [...p]);
      } else {
        const k = i - 3, ox = 0.055 + k * 0.17, oy = 0.57;
        ia = { ...ia, x: ox, y: oy };
        na = { ...na, x: ox - 0.025, y: oy + ia.h + 0.01, w: ia.w + 0.05 };
        pa = { ...pa, x: na.x, y: na.y + na.h, w: na.w };
        poly = [[ox - 0.008, oy - 0.005], [ox + ia.w + 0.008, oy - 0.005],
                [ox + ia.w + 0.018, pa.y + pa.h + 0.005], [ox - 0.028, pa.y + pa.h + 0.005]];
      }
    }
    const rs = [ia, na, pa];
    const u = { x: Math.min(...rs.map(q => q.x)), y: Math.min(...rs.map(q => q.y)) };
    u.w = Math.max(...rs.map(q => q.x + q.w)) - u.x;
    u.h = Math.max(...rs.map(q => q.y + q.h)) - u.y;
    return { icon: ia, name: na, price: pa, poly, union: u };
  }

  function imgRect() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const iw = bg.naturalWidth || 1670, ih = bg.naturalHeight || 941;
    const cs = getComputedStyle(bg);
    const s = cs.objectFit === 'cover'
      ? Math.max(vw / iw, vh / ih)
      : Math.min(vw / iw, vh / ih); // contain + fillbg en desktop
    const w = iw * s, h = ih * s;
    const pos = (cs.objectPosition || '50% 50%').trim().split(/\s+/);
    const ox = (parseFloat(pos[0]) || 50) / 100, oy = (parseFloat(pos[1] ?? pos[0]) || 50) / 100;
    return { left: (vw - w) * ox, top: (vh - h) * oy, w, h };
  }
  function place(el, a, r) {
    el.style.left = (r.left + a.x * r.w) + 'px';
    el.style.top = (r.top + a.y * r.h) + 'px';
    el.style.width = (a.w * r.w) + 'px';
    el.style.height = (a.h * r.h) + 'px';
  }
  const SVGNS = 'http://www.w3.org/2000/svg';
  function layout() {
    const r = imgRect();
    const title = zone('title'), gold = zone('gold'), bubble = zone('bubble');
    const tEl = document.getElementById('shop-title');
    place(tEl, title, r);
    tEl.style.fontSize = (4 * (title.fontScale || 1)) + 'vh';
    const gEl = document.getElementById('gold-num');
    place(gEl, gold, r);
    gEl.style.fontSize = (3.4 * (gold.fontScale || 1)) + 'vh';
    const bEl = document.getElementById('bubble');
    bEl.style.left = (r.left + bubble.x * r.w) + 'px';
    bEl.style.top = (r.top + bubble.y * r.h) + 'px';
    bEl.style.width = (bubble.w * r.w) + 'px';
    bEl.style.minHeight = ((bubble.h || 0) * r.h) + 'px';
    bEl.style.fontSize = (2 * (bubble.fontScale || 1)) + 'vh';
    const dEl = document.getElementById('item-desc');
    const desc = zone('desc');
    place(dEl, desc, r);
    dEl.style.fontSize = (2.1 * (desc.fontScale || 1)) + 'vh';
    document.querySelectorAll('.item-slot').forEach((slot, i) => {
      const { icon: ia, name: na, price: pa, union: u } = slotAreas(i);
      place(slot, u, r);
      const ic = slot.querySelector('.item-icon'),
            nm = slot.querySelector('.item-name'),
            pr = slot.querySelector('.item-price');
      ic.style.left = ((ia.x - u.x) * r.w) + 'px';
      ic.style.top = ((ia.y - u.y) * r.h) + 'px';
      ic.style.width = (ia.w * r.w) + 'px';
      ic.style.height = (ia.h * r.h) + 'px';
      for (const [el, a] of [[nm, na], [pr, pa]]) {
        el.style.left = ((a.x - u.x) * r.w) + 'px';
        el.style.top = ((a.y - u.y) * r.h) + 'px';
        el.style.width = (a.w * r.w) + 'px';
        el.style.height = (a.h * r.h) + 'px';
        el.style.setProperty('--fs', a.fontScale || 1);
      }
    });
    // Marco de selección poligonal sobre el cofre elegido
    const svg = document.getElementById('seldraw');
    svg.setAttribute('viewBox', `0 0 ${window.innerWidth} ${window.innerHeight}`);
    svg.innerHTML = '';
    const poly = catalog[selectedItem] && slotAreas(selectedItem).poly;
    if (poly) {
      const el = document.createElementNS(SVGNS, 'polygon');
      el.setAttribute('class', 'sel');
      el.setAttribute('points', poly.map(p =>
        (r.left + p[0] * r.w).toFixed(1) + ',' + (r.top + p[1] * r.h).toFixed(1)).join(' '));
      svg.appendChild(el);
    }
  }
  window.addEventListener('resize', layout);

  // Punto-en-polígono para el hit area exacta de cada cofre
  function inPoly(x, y, poly) {
    let s = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
      if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) s = !s;
    }
    return s;
  }
  function hitIndex(e) {
    const r = imgRect();
    const nx = (e.clientX - r.left) / r.w, ny = (e.clientY - r.top) / r.h;
    for (let i = 0; i < catalog.length; i++) {
      const { poly, union: u } = slotAreas(i);
      if ((poly && inPoly(nx, ny, poly)) ||
          (!poly && nx >= u.x && nx <= u.x + u.w && ny >= u.y && ny <= u.y + u.h)) return i;
    }
    return -1;
  }

  function ownedCount(id) {
    return (player && player.inventory && player.inventory[id]) || 0;
  }

  // Precio efectivo: los ítems con priceGrowth (midas ×1.8) encarecen cada
  // compra — el contador vive en player.itemPurchases y lo valida el server.
  function itemPrice(item) {
    const n = (player && player.itemPurchases && player.itemPurchases[item.id]) || 0;
    return (item.priceGrowth > 1)
      ? Math.round(item.price * Math.pow(item.priceGrowth, n))
      : item.price;
  }

  function renderItems() {
    const panel = document.getElementById('slots');
    panel.innerHTML = '';
    catalog.forEach((item, i) => {
      const slot = document.createElement('div');
      // Con polígono calibrado el marco lo dibuja el SVG; si no, borde recto
      slot.className = 'item-slot' + (i === selectedItem && !slotAreas(i).poly ? ' selected' : '');
      slot.dataset.itemId = item.id;

      const icon = document.createElement('img');
      icon.className = 'item-icon';
      icon.src = (item.icon || '/assets/comunes/monedas.webp') + '?v=p9';
      icon.alt = '';
      icon.onerror = () => { icon.src = '/assets/comunes/monedas.webp'; };
      slot.appendChild(icon);

      const name = document.createElement('div');
      name.className = 'item-name';
      name.textContent = t('shop.item.' + item.id + '.name');
      slot.appendChild(name);

      const price = document.createElement('div');
      price.className = 'item-price';
      price.innerHTML = '<img src="/assets/comunes/monedas.webp" alt="">';
      price.appendChild(document.createTextNode(String(itemPrice(item))));
      slot.appendChild(price);

      // Deshabilitado = ya lo tienes (máx. 1 por tipo); no hace falta texto
      if (ownedCount(item.id) >= (item.max || 1)) slot.classList.add('disabled');

      panel.appendChild(slot);
    });
    document.getElementById('gold-num').textContent = String(player?.gold ?? 0);
    const it = catalog[selectedItem];
    document.getElementById('item-desc').textContent =
      it ? t('shop.item.' + it.id + '.desc') : '';
    layout();
  }

  // Hit-testing sobre los polígonos de selección (o el rect unión si un
  // mundo no los tiene calibrados). Válido para ratón y táctil.
  const slotLayer = document.getElementById('slots');
  slotLayer.addEventListener('pointermove', (e) => {
    const i = hitIndex(e);
    slotLayer.style.cursor = i >= 0 ? 'pointer' : 'default';
    if (i >= 0 && i !== selectedItem) { selectedItem = i; renderItems(); playHover(); }
  });
  slotLayer.addEventListener('pointerdown', (e) => {
    const i = hitIndex(e);
    if (i < 0) return;
    selectedItem = i; renderItems(); buySelected();
  });

  function setSpeech(key, ...args) {
    document.getElementById('keeper-speech').textContent = format(key, ...args);
  }

  function flashRow(id, cls) {
    const row = document.querySelector(`.item-slot[data-item-id="${id}"]`);
    const poly = document.querySelector('#seldraw polygon.sel');
    for (const el of [row, poly]) {
      if (!el) continue;
      el.classList.remove('bought', 'denied');
      void el.getBoundingClientRect(); // reinicia la animación
      el.classList.add(cls);
    }
  }

  async function buySelected() {
    if (buying || !catalog[selectedItem]) return;
    const item = catalog[selectedItem];
    // Máximo 1 por tipo: ya lo llevas
    if (ownedCount(item.id) >= (item.max || 1)) {
      AssetsCache.playSound('/assets/sounds/comun/choque.wav', 0.5);
      flashRow(item.id, 'denied');
      setSpeech('shop.already');
      return;
    }
    buying = true;
    try {
      let d;
      if (DEMO) {
        const eff = itemPrice(item);
        const ok = (player.gold ?? 0) >= eff;
        if (ok) {
          player.gold -= eff;
          player.inventory = player.inventory || {};
          player.inventory[item.id] = (player.inventory[item.id] || 0) + (item.uses || 1);
          if (item.priceGrowth > 1) {
            player.itemPurchases = player.itemPurchases || {};
            player.itemPurchases[item.id] = (player.itemPurchases[item.id] || 0) + 1;
          }
        }
        d = { ok, player };
      } else {
        const r = await fetch('/api/buy-item', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ itemId: item.id }),
        });
        d = await r.json();
      }
      if (d.ok) {
        player = d.player;
        AssetsCache.playSound('/assets/sounds/comun/moneda.wav', 0.8);
        flashRow(item.id, 'bought');
        setSpeech('shop.thanks.' + Math.floor(Math.random() * 3));
      } else {
        AssetsCache.playSound('/assets/sounds/comun/choque.wav', 0.5);
        flashRow(item.id, 'denied');
        setSpeech('shop.noGold');
      }
    } catch {
      AssetsCache.playSound('/assets/sounds/comun/choque.wav', 0.5);
      setSpeech('shop.noGold');
    }
    renderItems();
    buying = false;
  }

  function playHover() { AssetsCache.playSound('/assets/sounds/comun/hover.wav', 0.45); }
  function playMove() { AssetsCache.playSound('/assets/sounds/comun/move.wav', 0.5); }
  document.getElementById('back-btn').addEventListener('click', () => goBack());
  document.getElementById('back-btn').addEventListener('mouseenter', () => {
    AssetsCache.playSound('/assets/sounds/comun/hover.wav', 0.45);
  });
  function goBack() {
    AssetsCache.playSound('/assets/sounds/comun/back.wav', 0.6);
    if (DEMO) {
      if (window.parent !== window) { window.parent.postMessage({ runika: 'shop-demo-exit' }, '*'); return; }
      history.back();
      return;
    }
    const demoParam = new URLSearchParams(window.location.search).get('demo');
    AssetsCache.transitionTo('/submundo.html?world=' + encodeURIComponent(currentWorld) + '&from=shop' +
      (demoParam ? '&demo=' + encodeURIComponent(demoParam) : ''));
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { e.preventDefault(); goBack(); return; }
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' ||
        e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
      e.preventDefault();
      if (catalog.length) {
        selectedItem = (selectedItem - 1 + catalog.length) % catalog.length;
        renderItems(); playMove();
      }
    } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S' ||
               e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
      e.preventDefault();
      if (catalog.length) {
        selectedItem = (selectedItem + 1) % catalog.length;
        renderItems(); playMove();
      }
    } else if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      buySelected();
    }
  });

  AssetsCache.unlockAudio();
  document.addEventListener('click', () => AssetsCache.unlockAudio(), { once: true });
  document.addEventListener('keydown', () => AssetsCache.unlockAudio(), { once: true });

  (async () => {
    const params = new URLSearchParams(window.location.search);
    currentWorld = params.get('world') || 'ESPACIO';
    if (!WORLD_ORDER.includes(currentWorld)) currentWorld = 'ESPACIO';

    // Fondo del interior de la tienda del mundo; si falta el arte se queda
    // la viñeta oscura (la página sigue siendo usable).
    bg.addEventListener('load', layout);
    bg.src = '/assets/tienda/' + currentWorld + '/tienda.webp?v=p5';
    document.getElementById('fillbg').src = bg.src;
    bg.onerror = () => { bg.style.display = 'none'; };

    await AssetsCache.loadSettings();
    AssetsCache.setMusicTrack(AssetsCache.musicForWorld(currentWorld));
    fallback = await loadLang('es');
    translations = await loadLang();
    document.querySelectorAll('[data-i18n]').forEach(el => {
      el.textContent = t(el.getAttribute('data-i18n'));
    });

    await loadPlayer();
    await loadCatalog();
    await loadAreas();

    document.getElementById('shop-title').textContent =
      t('shop.title') + ' — ' + t('worlds.' + currentWorld);
    document.getElementById('keeper-name').textContent = t('shop.keeper.' + currentWorld);
    setSpeech('shop.welcome');
    const k = (s) => `<span class="key">${s}</span>`;
    document.getElementById('controls-hint').innerHTML =
      k('←→') + ' ' + t('shop.choose') + ' · ' + k('Enter') + ' ' + t('shop.buy')
      + ' · ' + k('Esc') + ' ' + t('shop.leave');
    renderItems();

    if (sessionStorage.getItem('runika-session') === 'active' || DEMO) {
      // Demo/sesión activa: sin precarga del manifiesto — la tienda solo
      // necesita su fondo e iconos (8 iframes del mosaico no deben
      // descargar ~300 MB cada una).
      AssetsCache.unlockAudio();
      AssetsCache.revealPage();
      return;
    }
    AssetsCache.showLoading();
    const loadingBar = document.getElementById('loading-bar');
    const loadingText = document.getElementById('loading-text');
    await AssetsCache.preloadAll((loaded, total) => {
      const pct = Math.round((loaded / total) * 100);
      loadingBar.style.width = pct + '%';
      loadingText.textContent = t('loading.text') + ' ' + pct + '%';
    });
    AssetsCache.revealPage();
  })();
</script>

</body>
</html>
