<!DOCTYPE html>
<html lang="es">
<head>
<script src="/web/webdb.js"></script>
<script src="/web/solver.bundle.js"></script>
<script src="/web/api-shim.js"></script>
<script src="/web/tizen.js"></script>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Runika 2D — Submundo</title>
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000; font-family: 'ChelseaMarket', cursive;
  }
  #loading-screen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 100; background: #0a0806;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #e8d4a8;
  }
  #loading-screen .title {
    font-family: 'ChelseaMarket', cursive;
    font-size: 2.5em; color: #f0d890;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    margin-bottom: 30px; letter-spacing: 3px;
  }
  #loading-bar-bg {
    width: 300px; height: 8px;
    background: rgba(60, 42, 20, 0.5);
    border: 1px solid rgba(180, 150, 80, 0.4);
    border-radius: 4px; overflow: hidden;
  }
  #loading-bar {
    width: 0%; height: 100%;
    background: linear-gradient(90deg, #c4a050, #f0d890);
    transition: width 0.2s ease;
  }
  #loading-text {
    margin-top: 12px; font-size: 0.9em; color: #a08850;
    font-family: 'ChelseaMarket', cursive;
  }
  #transition-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 90; background: #000;
    opacity: 1; pointer-events: auto; /* nace en negro: cero destello al entrar */
  }
  #stage {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  /* Los mapas actuales son 16:9 y encajan completos en esa proporción.
     En ventanas más panorámicas, cover puede recortar algo arriba/abajo.
     En nativo (móvil 19-21:9) se fuerza contain — ver getImgRect. */
  #bg {
    width: 100%; height: 100%;
    object-fit: cover; object-position: 50% 0%;
    display: block;
    position: relative; z-index: 1;
  }
  /* Relleno de las bandas laterales cuando #bg pasa a contain (móvil). */
  #fillbg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    filter: blur(45px) brightness(0.42) saturate(1.25);
    transform: scale(1.15);
    z-index: 0;
  }
  #overlay {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 10; pointer-events: none;
  }
  #dynamic-text {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 13; pointer-events: none;
  }
  .world-text {
    position: absolute;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    color: #fff8df;
    font-family: 'ChelseaMarket', cursive;
    font-weight: bold;
    text-align: center;
    white-space: nowrap;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.95), 0 0 10px rgba(255,200,80,0.75);
  }
  .cell-marker {
    position: absolute;
    z-index: 11;
    pointer-events: none;
    border: none;
    background: transparent;
    transition: transform 0.2s ease, opacity 0.2s ease;
  }
  .cell-marker.completed {
    border: none;
    background: transparent;
  }
  /* Isla completada o bloqueada: copia gris del fondo con bordes
     difuminados (mask radial). Una img clonada, no backdrop-filter,
     porque el filtro de fondo no hereda la mascara. */
  .island-fx {
    position: absolute;
    z-index: 9;
    pointer-events: none;
    /* El div se coloca exactamente sobre el rect dibujado de #bg:
       estirar la copia a 100%×100% la alinea pixel a pixel sea cual sea
       el object-fit (contain, cover o fill — en nativo era el "descuadre"
       de las islas en negro). */
    background-size: 100% 100%;
    background-position: 0 0;
    background-repeat: no-repeat;
  }
  .island-fx.done {
    filter: grayscale(1) brightness(0.55);
  }
  .island-fx.locked {
    /* oscuro pronunciado: sobre los mapas ya oscuros (INFRAMUNDO,
       MAZMORRA, FUEGO) un dim suave no se percibe como "bloqueada" */
    filter: grayscale(0.8) brightness(0.22) contrast(1.05);
  }
  /* Isla tienda desaparecida: la misma zona muy difuminada — sus propios
     colores se deshacen en una nube que se funde con el cielo vecino. */
  .island-fx.shopgone {
    filter: blur(11px) brightness(1.06) saturate(0.9);
    animation: shopGoneFade 0.9s ease-out both;
  }
  @keyframes shopGoneFade {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .shop-ladder-path {
    position: absolute;
    z-index: 11;
    overflow: hidden;
    pointer-events: none;
  }
  .shop-ladder-path img {
    position: absolute;
    top: 0;
    left: 0;
    display: block;
    object-fit: fill;
  }
  .shop-ladder-path .shaft-clip {
    position: absolute;
    overflow: hidden;
  }
  .shop-ladder-path .shaft-clip.flip { transform: scaleX(-1); }
  .shop-ladder-path .shaft-clip .shaft-tiles {
    position: absolute; top: 0; left: 0; width: 100%;
    background-repeat: repeat-y;
    background-position: top center;
  }
  .shop-ladder-path .shaft-clip.grow {
    animation: shopShaftGrow 1.6s cubic-bezier(0.3, 0.55, 0.3, 1) 0.4s both;
  }
  .shop-ladder-path .shaft-clip.shrink {
    animation: shopShaftShrink 0.7s ease-in both;
  }
  .shop-ladder-path .sign-pop {
    transform-origin: 46.9% 76.1%;
    animation: shopSignPop 0.55s cubic-bezier(0.2, 1.4, 0.4, 1) both;
  }
  .shop-ladder-path.inviting .sign-anim {
    transform-origin: 50% 100%;
    animation: shopInvite 1.1s ease-in-out infinite;
  }
  .shop-ladder-path .shop-name {
    position: absolute;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    font-family: 'ChelseaMarket', cursive;
    font-weight: bold;
    text-align: center;
    white-space: nowrap;
    color: #33200c;
    text-shadow: 1px 1px 0 rgba(255, 214, 160, 0.4),
                 -1px -1px 0 rgba(30, 16, 4, 0.35);
    pointer-events: none;
  }
  @keyframes shopShaftGrow {
    from { clip-path: inset(0 0 100.5% 0); }
    to { clip-path: inset(0 0 -1% 0); }
  }
  @keyframes shopShaftShrink {
    from { clip-path: inset(0 0 -1% 0); }
    to { clip-path: inset(0 0 100.5% 0); }
  }
  @keyframes shopSignPop {
    0% { transform: scale(0); opacity: 0; }
    60% { transform: scale(1.12); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes shopInvite {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-7px) rotate(1.6deg); }
  }
  #avatar {
    position: absolute;
    z-index: 12;
    pointer-events: none;
    display: none;
  }
  #avatar img {
    width: 100%; height: 100%;
    object-fit: contain;
    filter: drop-shadow(2px 2px 8px rgba(0,0,0,0.8));
    position: relative;
    z-index: 3;
  }
  #avatar::before {
    content: '';
    position: absolute;
    top: -20%; left: -20%;
    width: 140%; height: 140%;
    z-index: 1;
    background: radial-gradient(ellipse 60% 80% at 40% 35%, rgba(255, 240, 180, 0.5) 0%, rgba(232, 180, 80, 0.3) 30%, rgba(180, 120, 40, 0.1) 55%, transparent 75%);
    border-radius: 48% 52% 55% 45% / 60% 40% 55% 45%;
    box-shadow:
      0 0 20px 8px rgba(255, 200, 80, 0.3),
      0 0 40px 15px rgba(232, 160, 60, 0.2),
      0 0 60px 25px rgba(200, 120, 30, 0.1);
    animation: auraPulse 1.8s ease-in-out infinite;
  }
  #avatar::after {
    content: '';
    position: absolute;
    z-index: 2;
    left: 16%;
    width: 68%;
    height: 18%;
    bottom: calc(var(--avatar-pad, 0) * 100%);
    transform: translateY(50%);
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(12, 9, 6, 0.78), rgba(12, 9, 6, 0.46) 52%, transparent 82%);
    filter: blur(2px);
    pointer-events: none;
  }
  @keyframes auraPulse {
    0%, 100% {
      box-shadow:
        0 0 20px 8px rgba(255, 200, 80, 0.3),
        0 0 40px 15px rgba(232, 160, 60, 0.2),
        0 0 60px 25px rgba(200, 120, 30, 0.1);
      transform: scale(1) rotate(0deg);
      border-radius: 48% 52% 55% 45% / 60% 40% 55% 45%;
    }
    33% {
      box-shadow:
        0 0 25px 10px rgba(255, 220, 100, 0.4),
        0 0 50px 20px rgba(232, 180, 80, 0.25),
        0 0 70px 30px rgba(200, 140, 50, 0.15);
      transform: scale(1.08) rotate(2deg);
      border-radius: 55% 45% 48% 52% / 50% 55% 45% 50%;
    }
    66% {
      box-shadow:
        0 0 22px 9px rgba(255, 210, 90, 0.35),
        0 0 45px 18px rgba(232, 170, 70, 0.22),
        0 0 65px 28px rgba(200, 130, 40, 0.12);
      transform: scale(1.04) rotate(-1deg);
      border-radius: 45% 55% 52% 48% / 55% 48% 52% 45%;
    }
  }
  #hud {
    position: absolute; top: 12px; left: 12px; z-index: 20;
    background: rgba(0,0,0,0.7); padding: 8px 14px;
    border-radius: 4px; font-family: 'ChelseaMarket', cursive;
    font-size: 0.8em; color: #aaa; line-height: 1.7;
    display: none;
  }
  #hud.debug { display: block; }
  #hud .key { color: #fc4; }
  #hud b { color: #0ff; }
  #hud .green { color: #0f0; }
  #back-btn {
    position: absolute; bottom: 12px; left: 12px; z-index: 20;
    font-family: 'ChelseaMarket', cursive;
    font-size: 1em; color: #e8d4a8;
    padding: 8px 24px;
    background: linear-gradient(180deg, rgba(60, 42, 20, 0.9), rgba(35, 24, 10, 0.95));
    border: 2px solid rgba(180, 150, 80, 0.5);
    border-radius: 8px; cursor: pointer;
    box-shadow: 0 4px 0 rgba(20, 12, 4, 0.8), 0 6px 10px rgba(0,0,0,0.5);
    text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
    transition: all 0.15s ease;
  }
  #back-btn:hover {
    background: linear-gradient(180deg, rgba(80, 58, 28, 0.9), rgba(50, 34, 14, 0.95));
    border-color: rgba(232, 212, 168, 0.7); color: #fff8e0;
  }
  #back-btn:active { transform: translateY(3px); }
</style>
</head>
<body>

<div id="loading-screen">
  <div class="title">RUNIKA 2D</div>
  <div id="loading-bar-bg"><div id="loading-bar"></div></div>
  <div id="loading-text"></div>
</div>

<div id="transition-overlay"></div>

<div id="stage">
  <img id="fillbg" src="" alt="" />
  <img id="bg" src="" />
  <div id="overlay"></div>
  <div id="dynamic-text"></div>
  <div id="avatar"><img src="/assets/avatars/display/avatar_06.webp" alt="" /></div>
</div>

<div id="hud">
  <b id="world-name" data-i18n="submundo.title"></b><br>
  <span class="key">Flechas</span> = mover por casilla<br>
  <span class="key">Enter</span> = entrar al nivel<br>
  <span class="key">ESC</span> = volver al mapamundi<br>
  <br>
  <span id="pos-info" style="color:#0f0"></span>
</div>

<button id="back-btn" data-i18n="instructions.back"></button>

<script src="/assets-cache.js"></script>
<script>
  let translations = {};
  let fallback = {};

  const WORLD_ORDER = ['ESPACIO', 'AGUA', 'TIERRA', 'FUEGO', 'HIELO', 'VIENTO', 'INFRAMUNDO', 'MAZMORRA'];
  const NUM_LEVELS = 12;
  const COLS = 4;
  const ROWS = 3;

  // En nativo tizen.js fuerza cover centrado en #bg (una sola imagen a
  // sangre completa); el fillbg queda oculto por la misma regla. Aquí solo
  // se alimenta el fillbg para el letterbox de escritorio.
  function setBg(src) {
    const fill = document.getElementById('fillbg');
    if (fill && !fill.src) fill.src = src;
    bg.src = src;
  }

  const WORLD_IMAGES = {
    ESPACIO: '/assets/submundos/ESPACIO/submundo-espacio.16x9.webp?v=f1',
    AGUA: '/assets/submundos/AGUA/submundo agua.16x9.webp?v=f1',
    TIERRA: '/assets/submundos/TIERRA/submundo tierra.16x9.webp?v=f1',
    FUEGO: '/assets/submundos/FUEGO/submundo fuego.16x9.webp?v=f1',
    HIELO: '/assets/submundos/HIELO/submundo hielo.16x9.webp?v=f1',
    VIENTO: '/assets/submundos/VIENTO/submundo viento.16x9.webp?v=f1',
    INFRAMUNDO: '/assets/submundos/INFRAMUNDO/submundo inframundo.16x9.webp?v=f1',
    MAZMORRA: '/assets/submundos/MAZMORRA/submundo mazmorra.16x9.webp?v=f1',
  };

  // Grid 4x3 con numeracion en serpiente:
  //  8  9 10 11
  //  7  6  5  4
  //  0  1  2  3
  // levelToGrid[level] = { col, row }
  const LEVEL_TO_GRID = [
    { col: 0, row: 2 }, // 0
    { col: 1, row: 2 }, // 1
    { col: 2, row: 2 }, // 2
    { col: 3, row: 2 }, // 3
    { col: 3, row: 1 }, // 4
    { col: 2, row: 1 }, // 5
    { col: 1, row: 1 }, // 6
    { col: 0, row: 1 }, // 7
    { col: 0, row: 0 }, // 8
    { col: 1, row: 0 }, // 9
    { col: 2, row: 0 }, // 10
    { col: 3, row: 0 }, // 11
  ];

  // gridToLevel[col][row] = level
  const GRID_TO_LEVEL = {};
  LEVEL_TO_GRID.forEach((g, level) => {
    if (!GRID_TO_LEVEL[g.col]) GRID_TO_LEVEL[g.col] = {};
    GRID_TO_LEVEL[g.col][g.row] = level;
  });

  // Estado de la partida (bbdd): avatar elegido, oro, progreso del mundo
  let player = null;
  let completedLevels = new Set();
  function playerAvatarSrc() {
    const idx = (player && typeof player.avatarIndex === 'number') ? player.avatarIndex : 0;
    return `/assets/avatars/display/avatar_${String(idx + 1).padStart(2, '0')}.webp`;
  }
  async function loadPlayer() {
    try {
      const r = await fetch('/api/savegame');
      if (r.ok) { const d = await r.json(); player = d.player || null; }
    } catch {}
    // ?avatar=N (1-8): override de pruebas — fuerza el sprite elegido
    // sin tocar la bbdd (p.ej. avatar=2 = loro para testear el bonus).
    const av = parseInt(new URLSearchParams(location.search).get('avatar') || '', 10);
    if (av >= 1 && av <= 8 && player) player = { ...player, avatarIndex: av - 1 };
  }
  // Isla desbloqueada: la primera siempre; las demás solo si la anterior
  // está completada (no se puede saltar islas)
  function isLevelUnlocked(i) {
    return i === 0 || completedLevels.has(i - 1);
  }

  // Fracción del sprite transparente bajo los pies de cada avatar (0-7).
  // El ancla calibrada espera los pies en el borde inferior de la caja;
  // sin compensar este padding el avatar "flota" sobre la isla.
  const avatarPad = new Array(8).fill(0);
  function measureAvatarPads() {
    for (let i = 0; i < 8; i++) {
      const img = new Image();
      img.onload = () => {
        try {
          const w = 64, h = Math.max(1, Math.round(img.naturalHeight * w / img.naturalWidth));
          const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
          const cx = cv.getContext('2d', { willReadFrequently: true });
          cx.drawImage(img, 0, 0, w, h);
          const d = cx.getImageData(0, 0, w, h).data;
          let pad = 0;
          scan: for (let y = h - 1; y >= 0; y--) {
            for (let x = 0; x < w; x++) if (d[(y * w + x) * 4 + 3] > 24) break scan;
            pad++;
          }
          avatarPad[i] = pad / h;
          const idx = (player && typeof player.avatarIndex === 'number') ? player.avatarIndex : 0;
          if (i === idx && avatarEl.style.display === 'block') {
            const r = getImgRect();
            const pos = currentAvatarPosition();
            if (pos) avatarEl.style.top = avatarBaseTop(pos, resolvedAvatarSize() * r.width, r) + 'px';
          }
        } catch (e) {}
      };
      img.src = `/assets/avatars/display/avatar_${String(i + 1).padStart(2, '0')}.webp`;
    }
  }
  // Top de la caja del avatar: centro en pos.y menos media caja, más el
  // padding transparente del sprite para que los pies pisen el suelo.
  // Con cover-top las islas inferiores salen del plano: los pies nunca
  // quedan por debajo del borde visible de la ventana.
  function avatarBaseTop(pos, sz, r) {
    const idx = (player && typeof player.avatarIndex === 'number') ? player.avatarIndex : 0;
    const pad = avatarPad[idx] || 0;
    avatarEl.style.setProperty('--avatar-pad', String(pad));
    // La caja del avatar es cuadrada en píxeles de IMAGEN: el ancla es su
    // centro y los pies quedan media caja de imagen más abajo. Bajo
    // object-fit:fill (nativo) la imagen se estira anamórficamente y
    // sz (= size·r.width) no equivale a media caja en vertical — hay que
    // convertir por el ratio real de la imagen o los pies quedan bajos.
    const iw = bg.naturalWidth || 0, ih = bg.naturalHeight || 0;
    const feetOff = (iw > 0 && ih > 0)
      ? (sz / r.width) * iw * (r.height / ih) / 2
      : sz / 2;
    const base = r.top + pos.y * r.height + feetOff - (1 - pad) * sz;
    return Math.min(base, window.innerHeight - 2 - sz * (1 - pad));
  }

  let positions = {};
  // Isla tienda (shop.json por mundo): nodo extra que cuelga de una isla
  // (`from`) en una dirección (`dir`) y se desbloquea al completar
  // `unlockAfter` niveles. No cuenta como nivel ni altera la serpiente.
  // Tiendas del mundo (shop.json `nodes[]`): cada nodo cuelga de una isla
  // (`from`) en una dirección (`dir`) y se desbloquea al completar
  // `unlockAfter` niveles. No cuentan como nivel ni alteran la serpiente.
  // Tienda 1 tras el nivel 3; tienda 2 tras el nivel 9.
  let shopNodes = [];
  let atShop = -1; // índice del nodo donde está el avatar (-1 = en una isla)
  let atLadder = -1; // índice del camino en cuyo pie (punto medio) para el avatar
  // Cada tienda desaparece por separado si se pasa de largo sin entrar.
  let shopGone = new Set();
  // Tiendas ya visitadas: también están en shopGone pero no dejan mancha
  // (la casa se marcha volando, no se disuelve).
  let shopVisited = new Set();
  let shopPathSeen = new Set();
  let shopDescending = new Set(); // caminos renderizados ocultos (bajada desde tienda)
  let pendingShopDescent = -1;   // nodo que bajará al cargar (from=shop)
  const params = new URLSearchParams(window.location.search);
  // ?auto=1 — autopiloto de grabación (tools/record-demo.mjs): entra en la
  // isla actual solo; al volver (from=level/from=shop) sube al bonus si la
  // casa está posada o regresa al mapamundi para cerrar la toma.
  const AUTO_RUN = params.get('auto') === '1';
  let shopClimbing = new Set();
  let shopLadderRects = {}; // índice nodo -> rect px del camino (para taps)
  const DEMO_SHOP = new URLSearchParams(window.location.search).get('demo') || '';
  function isShopUnlocked(node) {
    return !!node && !shopGone.has(shopNodes.indexOf(node)) &&
      completedLevels.has((node.unlockAfter ?? 1) - 1);
  }

  // La isla pintada en el fondo no se puede borrar: se cubre con una copia
  // muy difuminada de su propia zona — la isla se deshace en una nube que
  // se funde con el cielo y "desaparece" del mapa. Devuelve los gradientes
  // de la mancha para la mascara combinada (un solo div para todas).
  function shopGoneMasks(r, sz, node) {
    const pos = shopDoorPos(node);
    const px = pos.x * r.width, py = pos.y * r.height, rr = sz * 1.45;
    const g = (x, y, rad, s, f) => ({ x, y, rx: rad, s, f });
    return [
      g(px, py, rr, 42, 82),
      g(px - rr * 0.35, py - rr * 0.3, rr * 0.55, 28, 65),
      g(px + rr * 0.4, py + rr * 0.3, rr * 0.5, 28, 65),
    ];
  }
  const SHOP_SIGN_SRC = '/assets/tienda/camino-tienda-house.webp';
  const SHOP_RUNG_SRC = '/assets/tienda/camino-tienda-rung.webp';
  const SHOP_FOOT_SRC = '/assets/tienda/camino-tienda-foot.webp';
  const SHOP_PLANK_X = 0.4977; // centro de la puerta dentro de la casa
  const SHOP_PLANK_Y = 0.961;  // suelo del porche = pies del avatar
  const SHOP_SIGN_ASPECT = 640 / 864;
  // El tramo se compone de tiles de UN periodo (120×50) + la punta natural
  // (120×177). Todos son recortes del master 864×2688 al mismo scale, así
  // los peldaños continúan exactos bajo la casa sin desencaje.
  const SHOP_SRC_W = 864;
  const SHOP_SHAFT_SRC_W = 120;
  const SHOP_TILE_SRC_H = 50;
  const SHOP_FOOT_SRC_H = 177;
  const SHOP_SHAFT_DX = 0; // la escalera cuelga justo bajo la puerta
  // Área del nombre sobre el cartel (normalizada a la casa, 0-1; rotate en
  // grados). Calibrable con calibrate-tienda-nombre.html; la tienda 2 va
  // espejada y el texto se contra-espeja para seguir legible.
  let shopNameArea = null;
  let fitTextProbe = null;
  async function loadShopNameArea() {
    try {
      const r = await fetch('/api/shop-name-area');
      if (r.ok) {
        const d = await r.json();
        if (d && typeof d.x === 'number' && typeof d.w === 'number') shopNameArea = d;
      }
    } catch {}
  }

  // Pie de la escalera: el centro del puente pintado entre la isla `from`
  // y la siguiente (calibrable con `mid` en shop.json; sin él, la media de
  // las posiciones de avatar). Ahí para el avatar al pasar entre ambas y
  // decide izquierda/derecha/subir.
  function shopMid(node) {
    if (node.mid) return node.mid;
    const a = resolvedLevelPosition(node.from), b = resolvedLevelPosition(node.from + 1);
    if (!a || !b) return null;
    return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
  }

  // Puerta de la casa: cuelga exactamente sobre el punto medio RESUELTO
  // (donde para el avatar), para que la trepa sea una línea recta pie→puerta.
  // pos.x del JSON queda como fallback cuando aún no hay posiciones cargadas.
  function shopDoorPos(node) {
    const mid = shopMid(node);
    return { x: mid ? mid.x : node.pos.x, y: node.pos.y };
  }

  function shopLadderLayout(r, node) {
    const mid = shopMid(node);
    if (!mid) return null;
    const signW = 0.15 * r.width;
    const signH = signW * SHOP_SIGN_ASPECT;
    const k = signW / SHOP_SRC_W; // px de pantalla por px del master
    const shaftW = SHOP_SHAFT_SRC_W * k;
    const tileH = SHOP_TILE_SRC_H * k;
    const footH = SHOP_FOOT_SRC_H * k;
    const mirror = node.mirror ? -1 : 1;
    const plankX = r.left + mid.x * r.width;
    const plankY = r.top + node.pos.y * r.height;
    const top = plankY - SHOP_PLANK_Y * signH;
    const seamTop = top + signH; // borde inferior del cartel (master y=645)
    const footY = r.top + mid.y * r.height;
    // Tiles enteros entre la costura y la punta: la punta se coloca en un
    // borde de periodo (su primer píxel es fase 645+35·47 del master), así
    // los peldaños nunca se rompen ni en la unión ni en el pie.
    const tilesN = Math.max(0, Math.round((footY - seamTop - footH) / tileH));
    const tilesH = tilesN * tileH;
    const shaftCX = plankX + mirror * SHOP_SHAFT_DX * signW;
    return {
      top,
      height: Math.max(0, seamTop + tilesH + footH - top),
      mirror,
      sign: { left: plankX - SHOP_PLANK_X * signW, top: 0, w: signW, h: signH },
      shaft: {
        left: shaftCX - shaftW / 2,
        top: seamTop - top, w: shaftW, tilesN, tilesH, tileH, footH,
      },
    };
  }

  function renderShopLadders(r, sz) {
    shopNodes.forEach((node, index) => {
      if (shopGone.has(index) || !isShopUnlocked(node)) { delete shopLadderRects[index]; return; }
      const layout = shopLadderLayout(r, node);
      if (!layout) return;
      shopLadderRects[index] = {
        left: Math.min(layout.sign.left, layout.shaft.left),
        right: Math.max(layout.sign.left + layout.sign.w, layout.shaft.left + layout.shaft.w),
        top: layout.top,
        bottom: layout.top + layout.height,
      };

      // Casa en vuelo/creciendo: re-anexar el elemento vivo con su
      // animación intacta en vez de reconstruirlo ya posado.
      const keep = preservedShopPaths.get(index);
      if (keep) {
        keep.classList.toggle('inviting', atLadder === index);
        overlay.appendChild(keep);
        return;
      }

      const path = document.createElement('div');
      path.className = 'shop-ladder-path';
      path.dataset.shopPath = String(index);
      path.style.left = '0px';
      path.style.top = layout.top + 'px';
      path.style.width = '100%';
      path.style.height = layout.height + 'px';
      if (atLadder === index) path.classList.add('inviting');

      const mirror = document.createElement('div');
      mirror.style.cssText = `position:absolute;left:${layout.sign.left}px;top:${layout.sign.top}px;` +
        `width:${layout.sign.w}px;height:${layout.sign.h}px` +
        (layout.mirror < 0 ? ';transform:scaleX(-1)' : '');
      const signAnim = document.createElement('div');
      signAnim.className = 'sign-anim';
      signAnim.style.cssText = 'position:absolute;inset:0;transform-origin:50% 100%';
      const sign = document.createElement('img');
      sign.src = AssetsCache.getCachedImageUrl(SHOP_SIGN_SRC);
      sign.alt = '';
      sign.style.width = '100%';
      sign.style.height = '100%';
      signAnim.appendChild(sign);
      // Nombre del tendero sobre el cartel: va DENTRO de sign-anim (hereda
      // el vaivén) y fuera del <img>; con casa espejada el texto se
      // contra-espeja (scaleX + rotación inversa) para no salir al revés.
      if (shopNameArea) {
        const na = shopNameArea;
        const nm = document.createElement('div');
        nm.className = 'shop-name';
        nm.textContent = t('shop.sign');
        nm.style.left = (na.x * 100) + '%';
        nm.style.top = (na.y * 100) + '%';
        nm.style.width = (na.w * 100) + '%';
        nm.style.height = (na.h * 100) + '%';
        // El mirror padre ya voltea la posición; el scaleX propio devuelve
        // el texto legible y la rotación se invierte con el espejado.
        nm.style.transform = layout.mirror < 0
          ? `scaleX(-1) rotate(${-(na.rotate || 0)}deg)`
          : `rotate(${na.rotate || 0}deg)`;
        // El path aún no está en el DOM: scrollWidth daría 0. Se mide el
        // texto con un canvas 2D y se reduce la fuente si desborda el área.
        let fs = Math.max(8,
          na.h * layout.sign.h * 0.62 * (na.fontScale || 1));
        const probe = (fitTextProbe ||= document.createElement('canvas').getContext('2d'));
        probe.font = `bold ${fs}px ChelseaMarket, "Trebuchet MS", sans-serif`;
        const tw = probe.measureText(nm.textContent).width;
        const maxW = na.w * layout.sign.w;
        if (tw > maxW) fs = Math.max(8, Math.floor(fs * maxW / tw));
        nm.style.fontSize = fs + 'px';
        signAnim.appendChild(nm);
      }
      mirror.appendChild(signAnim);
      path.appendChild(mirror);

      const shaftClip = document.createElement('div');
      shaftClip.className = 'shaft-clip' + (layout.mirror < 0 ? ' flip' : '');
      shaftClip.style.left = layout.shaft.left + 'px';
      shaftClip.style.top = layout.shaft.top + 'px';
      shaftClip.style.width = layout.shaft.w + 'px';
      shaftClip.style.height = (layout.shaft.tilesH + layout.shaft.footH) + 'px';
      const tiles = document.createElement('div');
      tiles.className = 'shaft-tiles';
      tiles.style.height = layout.shaft.tilesH + 'px';
      tiles.style.backgroundImage =
        `url("${AssetsCache.getCachedImageUrl(SHOP_RUNG_SRC)}")`;
      tiles.style.backgroundSize = `100% ${layout.shaft.tileH}px`;
      shaftClip.appendChild(tiles);
      const foot = document.createElement('img');
      foot.src = AssetsCache.getCachedImageUrl(SHOP_FOOT_SRC);
      foot.alt = '';
      foot.style.width = '100%';
      foot.style.height = layout.shaft.footH + 'px';
      foot.style.top = layout.shaft.tilesH + 'px';
      shaftClip.appendChild(foot);
      path.appendChild(shaftClip);

      if (!shopClimbing.has(index) && !shopPathSeen.has(index)) {
        if (shopDescending.has(index)) {
          // Vuelta de la tienda: tramo oculto hasta que arranca la bajada
          shaftClip.style.clipPath = 'inset(0 0 100.5% 0)';
        } else {
          // La casa entra volando desde una esquina; la escalera sale luego
          flyShopHouseIn(path, shaftClip, layout, index);
        }
        shopPathSeen.add(index);
      }
      overlay.appendChild(path);
    });
  }

  // Entrada de la tienda: la casa (con la escalera recogida) aparece desde
  // la esquina superior IZQUIERDA y revolotea de lado a lado como un
  // pájaro hasta posarse en su sitio; solo entonces despliega la escalera.
  let shopFlying = new Set(); // nodos cuya casa aún está en vuelo/crecida
  let shopFlyHold = false;   // true: retener el despegue hasta el reveal
  let pendingFlyStart = null; // callback que arranca el vuelo al revelar
  let preservedShopPaths = new Map(); // paths en vuelo que sobreviven al re-render
  function flyShopHouseIn(path, clip, layout, index) {
    shopFlying.add(index);
    clip.style.clipPath = 'inset(0 0 100.5% 0)';
    const vw = window.innerWidth, vh = window.innerHeight;
    // La casa espejada (mirror, segunda tienda) mira a la IZQUIERDA: si
    // entra por la izquierda volando a la derecha se ve "marcha atrás".
    // Entra por la derecha volando a la izquierda — sprite mirando hacia
    // el sentido del vuelo, igual que la casa normal mira a la derecha.
    const fromLeft = layout.mirror >= 0;
    const sx = fromLeft
      ? vw * 0.01 - layout.sign.left
      : vw * 0.99 - layout.sign.left - layout.sign.w;
    const sy = vh * 0.01 - layout.top - layout.sign.top;
    const R = fromLeft ? 1 : -1; // signo de rotación: el vaivén se espeja
    const W = fromLeft ? 1 : -1; // zigzag lateral espejado
    const anim = path.animate([
      { transform: `translate(${sx}px, ${sy}px) rotate(${14 * R}deg)`, offset: 0 },
      { transform: `translate(${sx * 0.7 + vw * 0.05 * W}px, ${sy * 0.7 - vh * 0.09}px) rotate(${-10 * R}deg)`, offset: 0.26 },
      { transform: `translate(${sx * 0.48}px, ${sy * 0.48 + vh * 0.07}px) rotate(${9 * R}deg)`, offset: 0.5 },
      { transform: `translate(${sx * 0.26 - vw * 0.05 * W}px, ${sy * 0.26 - vh * 0.05}px) rotate(${-8 * R}deg)`, offset: 0.74 },
      { transform: `translate(${vw * 0.015 * W}px, ${vh * 0.015}px) rotate(${3 * R}deg)`, offset: 0.88 },
      { transform: 'translate(0px, 0px) rotate(0deg)', offset: 1 },
    ], { duration: 3800, easing: 'ease-in-out', fill: 'both' });
    // Si el mundo aún se está revelando, el despegue espera a que el
    // fundido termine — si no, la casa aparece a mitad de vuelo.
    const startFlight = () => {
      anim.play();
      AssetsCache.playSound('/assets/sounds/comun/casa-vuela.wav', 0.8);
    };
    if (shopFlyHold) {
      anim.pause();
      shopFlyHold = false;
      pendingFlyStart = startFlight;
    } else {
      startFlight();
    }
    // Si el path quedó huerfano (nunca con preservación, pero por si
    // acaso), no desplegar la escalera ni sonar sobre un DOM muerto.
    anim.onfinish = () => {
      if (path.isConnected) deployShopLadder(clip, layout, index);
      else shopFlying.delete(index);
    };
    // Un re-render (movimiento a mitad de vuelo) ya NO destruye el
    // elemento: render() preserva los paths en vuelo vía preservedShopPaths.
    anim.oncancel = () => shopFlying.delete(index);
  }

  // Despliegue de la escalera: un salto de clip-path por periodo de
  // peldaño, duración proporcional al largo de la escalera.
  function deployShopLadder(clip, layout, index) {
    clip.style.clipPath = '';
    clip.style.animationDelay = '0s';
    const dur = 0.7 + layout.shaft.tilesN * 0.1;
    clip.style.animationTimingFunction =
      `steps(${Math.max(2, layout.shaft.tilesN + 1)})`;
    clip.style.animationDuration = dur + 's';
    clip.classList.add('grow');
    AssetsCache.playSound('/assets/sounds/comun/escalera-crece.wav', 0.6);
    setTimeout(() => AssetsCache.playSound('/assets/sounds/comun/escalera-crece.wav', 0.5), dur * 550);
    setTimeout(() => shopFlying.delete(index), dur * 1000 + 100);
  }

  // Tienda ya visitada: la escalera se recoge y la casa se marcha volando
  // a una esquina. Queda persistida como visitada: no reaparece aunque se
  // repita el nivel (salvo en demo=shop, para poder probarla siempre).
  function retireShopHouse(index) {
    const path = overlay.querySelector(`[data-shop-path="${index}"]`);
    const clip = path && path.querySelector('.shaft-clip');
    const node = shopNodes[index];
    const finish = () => {
      shopGone.add(index);
      shopVisited.add(index);
      atLadder = -1;
      isMoving = false;
      fetch('/api/shop-visit', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ world: currentWorld, index }),
      }).catch(() => {});
      render();
    };
    if (!path || !node || !clip) { finish(); return; }
    isMoving = true;
    clip.classList.add('shrink');
    AssetsCache.playSound('/assets/sounds/comun/escalera-encoge.wav', 0.6);
    const vw = window.innerWidth, vh = window.innerHeight;
    const r = getImgRect();
    const layout = shopLadderLayout(r, node);
    // Salida por la esquina por la que "mira" la casa: normal → izquierda
    // (voló izq→der); espejada → derecha (voló der→izq). Siempre sale
    // volando hacia adelante, nunca marcha atrás.
    const exitLeft = !layout || layout.mirror >= 0;
    const tx = !layout ? -vw
      : exitLeft ? -layout.sign.left - layout.sign.w - vw * 0.05
      : vw - layout.sign.left + vw * 0.05;
    const ty = layout ? -layout.top - layout.sign.h - vh * 0.05 : -vh;
    const ER = exitLeft ? 1 : -1; // alabeo espejado según la dirección de salida
    setTimeout(() => {
      path.animate([
        { transform: 'translate(0px, 0px) rotate(0deg)', offset: 0 },
        { transform: `translate(${tx * 0.15}px, ${-vh * 0.07}px) rotate(${-6 * ER}deg)`, offset: 0.3 },
        { transform: `translate(${tx}px, ${ty}px) rotate(${-14 * ER}deg)`, offset: 1 },
      ], { duration: 1600, easing: 'ease-in', fill: 'forwards' });
      setTimeout(finish, 1600);
    }, 750);
  }

  function retractShopLadder(index) {
    const clip = overlay.querySelector(`[data-shop-path="${index}"] .shaft-clip`);
    let finished = false;
    const finish = () => {
      if (finished) return;
      finished = true;
      shopClimbing.delete(index);
      if (atShop === index) enterCurrent();
    };
    if (!clip) { finish(); return; }
    clip.classList.add('shrink');
    AssetsCache.playSound('/assets/sounds/comun/escalera-encoge.wav', 0.6);
    clip.addEventListener('animationend', finish, { once: true });
    setTimeout(finish, 750);
  }

  // Subida por la escala: el avatar trepa en línea recta por el eje de la
  // escalera (un salto por tramo) y el último salto aterriza en el tablón;
  // luego la escalera se encoge y se entra en la tienda.
  function startLadderClimb(index) {
    const node = shopNodes[index];
    if (!node || !isShopUnlocked(node) || shopFlying.has(index)) { bounceAvatar('down'); return; }
    const mid = shopMid(node);
    if (!mid) return;
    const r = getImgRect();
    const layout = shopLadderLayout(r, node);
    const axisX = layout
      ? (layout.shaft.left + layout.shaft.w / 2 - r.left) / r.width
      : mid.x;
    atLadder = -1;
    atShop = index;
    shopClimbing.add(index);
    AssetsCache.playSound('/assets/sounds/comun/escalera-sube.wav', 0.7);
    setTimeout(() => AssetsCache.playSound('/assets/sounds/comun/escalera-sube.wav', 0.5), 800);
    document.getElementById('pos-info').textContent = t('shop.sign');
    isMoving = true;
    const total = 9;
    let s = 0;
    const step = () => {
      s++;
      const sz = resolvedAvatarSize() * r.width;
      const x = axisX;
      const y = mid.y + (node.pos.y - mid.y) * (s / total);
      glideTo(avatarEl, r.left + x * r.width - sz / 2,
              avatarBaseTop({ x, y }, sz, r), 0.17, 'ease-out');
      if (s < total) { setTimeout(step, 170); return; }
      isMoving = false;
      render();
      retractShopLadder(index);
    };
    // render() recoloca el avatar en la puerta (atShop ya está puesto):
    // conservamos su posición real al pie para que la trepa empiece ahí
    // y no dé un salto hacia arriba antes del primer peldaño.
    const keepX = avatarEl.style.left, keepY = avatarEl.style.top;
    render();
    avatarEl.style.left = keepX;
    avatarEl.style.top = keepY;
    step();
  }

  // Vuelta de la tienda: la escalera se despliega poco a poco mientras el
  // avatar baja con su punta hasta el pie (punto medio entre islas).
  function descendWithShopLadder(index) {
    const node = shopNodes[index];
    const mid = node && shopMid(node);
    if (!mid) { isMoving = false; atShop = -1; atLadder = index; render(); return; }
    shopDescending.delete(index);
    const r = getImgRect();
    const layout = shopLadderLayout(r, node);
    const dur = 0.7 + (layout ? layout.shaft.tilesN : 8) * 0.1;
    const clip = overlay.querySelector(`[data-shop-path="${index}"] .shaft-clip`);
    if (clip && layout) {
      clip.style.clipPath = '';
      clip.style.animationDelay = '0s';
      clip.style.animationTimingFunction =
        `steps(${Math.max(2, layout.shaft.tilesN + 1)})`;
      clip.style.animationDuration = dur + 's';
      clip.classList.add('grow');
    }
    AssetsCache.playSound('/assets/sounds/comun/escalera-crece.wav', 0.6);
    setTimeout(() => AssetsCache.playSound('/assets/sounds/comun/escalera-crece.wav', 0.5), dur * 550);
    isMoving = true;
    const sz = resolvedAvatarSize() * r.width;
    glideTo(avatarEl, r.left + mid.x * r.width - sz / 2,
            avatarBaseTop(mid, sz, r), dur, 'linear');
    setTimeout(() => {
      isMoving = false;
      atShop = -1;
      atLadder = -1;
      // Baja a la isla de la que partió (`from`): el tablón desaparece con
      // la casa, así que el avatar no puede quedarse en el pie. Paso corto
      // mientras la escalera se recoge; la isla nueva (from+1) queda a un
      // movimiento del jugador.
      currentLevel = node.from;
      document.getElementById('pos-info').textContent =
        format('submundo.level', currentLevel + 1, NUM_LEVELS);
      // render() colocaría al avatar directo en la isla: conservamos su
      // posición al pie de la escalera para que animateAvatarTo lo lleve
      // volando de verdad (antes teletransportaba — dist 0, sin animación).
      const keepX = avatarEl.style.left, keepY = avatarEl.style.top;
      render();
      avatarEl.style.left = keepX;
      avatarEl.style.top = keepY;
      // La tienda ya usada se marcha volando y no vuelve (en demo queda)
      if (!DEMO_SHOP) retireShopHouse(index);
      animateAvatarTo(resolvedLevelPosition(currentLevel));
    }, dur * 1000 + 80);
  }

  let textAreas = {
    worldName: { x: 0.35, y: 0.08, w: 0.3, h: 0.08 },
    level: { x: 0.4, y: 0.18, w: 0.2, h: 0.07 },
  };
  let avatarSize = 0.06;       // fallback legacy
  let avatarSizes = {};        // avatarSizes[world] = [size0..size7]
  let avatarPositionOverrides = {}; // sparse [world][avatar][level] landing overrides
  let maskOverrides = {};      // masks[world][level] = {x,y,r} mancha bloqueo calibrada
  let unlockIsland = -1;       // isla recién desbloqueada (from=level) pendiente de revelar
  let unlockStage = 0;         // 0 = oscura, 1 = despejando, 2 = revelada
  let currentWorld = 'ESPACIO';
  let currentLevel = 0; // Siempre empieza en el nivel 1 (indice 0)
  let isMoving = false;

  // avatars[8] del json = tamaño por avatar del JUGADOR (0-7), no por mundo
  function resolvedAvatarSize() {
    const arr = avatarSizes[currentWorld];
    const i = (player && typeof player.avatarIndex === 'number') ? player.avatarIndex : 0;
    if (arr && arr[i] != null) return arr[i];
    return avatarSize;
  }

  function resolvedLevelPosition(level) {
    const idx = (player && typeof player.avatarIndex === 'number') ? player.avatarIndex : 0;
    return avatarPositionOverrides[currentWorld]?.[idx]?.[level] || positions[level];
  }

  function currentAvatarPosition() {
    if (atShop >= 0 && shopNodes[atShop]) return shopDoorPos(shopNodes[atShop]);
    if (atLadder >= 0 && shopNodes[atLadder]) return shopMid(shopNodes[atLadder]);
    return resolvedLevelPosition(currentLevel);
  }

  // El nivel inicial = última isla jugada en este mundo (bbdd); 0 si no hay
  function getStartLevel(world) {
    const wp = player?.worldProgress?.[world];
    let last = wp && typeof wp.last === 'number' ? Math.max(0, Math.min(NUM_LEVELS - 1, wp.last)) : 0;
    // Si el último quedara bloqueado (datos raros), ir a la frontera:
    // la primera isla sin completar, que siempre está desbloqueada
    if (!isLevelUnlocked(last)) {
      for (let i = 0; i < NUM_LEVELS; i++) { if (!completedLevels.has(i)) { last = i; break; } }
    }
    return last;
  }

  async function loadLang(lang) {
    const r = await fetch('/api/i18n' + (lang ? '/' + lang : ''));
    if (!r.ok) return {};
    return await r.json();
  }
  function t(key) { return translations[key] ?? fallback[key] ?? key; }
  function format(key, ...args) {
    return t(key).replace(/\{(\d+)\}/g, (m, i) => String(args[+i] ?? m));
  }

  function applyI18n() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
      el.textContent = t(el.getAttribute('data-i18n'));
    });
  }

  const bg = document.getElementById('bg');

  const overlay = document.getElementById('overlay');
  const dynamicText = document.getElementById('dynamic-text');
  const avatarEl = document.getElementById('avatar');
  const avatarImg = avatarEl.querySelector('img');

  // Rect visible de la imagen del mapa. Desktop: object-fit cover con
  // object-position 50% 0% (recorta abajo en ventanas panorámicas).
  // Nativo (móvil/TV): contain — el mapa entero cabe y ninguna isla queda
  // recortada; las bandas laterales las rellena #fillbg.
  function getImgRect() {
    const er = AssetsCache.layoutRect(bg);
    const iw = bg.naturalWidth || 1536, ih = bg.naturalHeight || 1024;
    const cs = getComputedStyle(bg);
    if (cs.objectFit === 'fill')
      return { left: er.left, top: er.top, width: er.width, height: er.height, right: er.right, bottom: er.bottom };
    const s = cs.objectFit === 'cover'
      ? Math.max(er.width / iw, er.height / ih)
      : Math.min(er.width / iw, er.height / ih);
    const w = iw * s, h = ih * s;
    const pos = (cs.objectPosition || '50% 50%').trim().split(/\s+/);
    const ox = (parseFloat(pos[0]) || 50) / 100, oy = (parseFloat(pos[1] ?? pos[0]) || 50) / 100;
    const left = er.left + (er.width - w) * ox, top = er.top + (er.height - h) * oy;
    return { left, top, width: w, height: h, right: left + w, bottom: top + h };
  }

  async function loadPositions(world) {
    try {
      const r = await fetch('/api/load-subworld-positions?world=' + encodeURIComponent(world));
      if (r.ok) {
        const data = await r.json();
        if (data.positions) positions = data.positions;
        if (data.avatarSize) avatarSize = data.avatarSize;
        if (data.masks) maskOverrides[world] = data.masks;
        if (data.avatars) {
          avatarSizes[world] = data.avatars.map(e => (e && e.size != null) ? e.size : avatarSize);
          avatarPositionOverrides[world] = data.avatars.map(e =>
            e && e.positions && typeof e.positions === 'object' ? e.positions : {});
        } else {
          avatarPositionOverrides[world] = [];
        }
      }
    } catch {}
    // Defaults
    for (let i = 0; i < NUM_LEVELS; i++) {
      if (!positions[i]) positions[i] = { x: 0.5, y: 0.5 };
    }
  }

  async function loadTextAreas(world) {
    try {
      const r = await fetch('/api/load-subworld-text-areas?world=' + encodeURIComponent(world));
      if (r.ok) {
        const data = await r.json();
        if (data.areas) textAreas = { ...textAreas, ...data.areas };
      }
    } catch {}
  }

  // from=shop en la URL: el jugador vuelve de la tienda — el avatar empieza
  // en el tablón y bajará con la escalera desplegándose (ver descendWithShopLadder)
  function armShopDescent() {
    if (params.get('from') !== 'shop' || pendingShopDescent >= 0) return;
    // Solo puede volverse de la tienda visible: desbloqueada y aún no
    // consumida (shopGone). Sin el check de gone, con nivel ≥4 completado
    // siempre elegiría el nodo 0 aunque se volviera de la tienda 2.
    const idx = shopNodes.findIndex((n, i) => isShopUnlocked(n) && !shopGone.has(i));
    if (idx < 0) return;
    atShop = idx;
    atLadder = -1;
    currentLevel = shopNodes[idx].from;
    shopDescending.add(idx);
    pendingShopDescent = idx;
    // Input bloqueado desde ya: entre el reveal y la bajada automática hay
    // ~600ms con atShop puesto — un Enter ahí reabría el bonus.
    isMoving = true;
  }

  async function loadShop(world) {
    shopNodes = [];
    shopPathSeen = new Set();
    shopClimbing = new Set();
    try {
      const r = await fetch('/api/load-shop?world=' + encodeURIComponent(world));
      if (r.ok) {
        const data = await r.json();
        // Esquema actual: nodes[]; el antiguo (campos planos) es un solo nodo
        const raw = Array.isArray(data?.nodes) ? data.nodes
          : (data && data.pos && typeof data.from === 'number' && data.dir ? [data] : []);
        shopNodes = raw.filter(n => n && n.pos && typeof n.from === 'number' && n.dir);
        // Una tienda desaparece al COMPLETAR el nivel de la isla
        // siguiente a la suya (from+1): moverse hasta ella no la quita —
        // solo entrar y superar ese nivel. Derivado del progreso.
        shopNodes.forEach((node, ni) => {
          if (completedLevels.has(node.from + 1)) shopGone.add(ni);
        });
      }
    } catch {}
  }

  function render() {
    const r = getImgRect();
    const sz = resolvedAvatarSize() * r.width;
    // Una casa en vuelo (o desplegando su escalera) no se reconstruye:
    // recrear su path mataría la animación WAAPI y la casa aparecería
    // ya posada — y el sonido del despliegue sonaría después, suelto.
    preservedShopPaths = new Map();
    for (const idx of shopFlying) {
      const p = overlay.querySelector(`[data-shop-path="${idx}"]`);
      if (p) preservedShopPaths.set(idx, p);
    }
    overlay.innerHTML = '';

    // Las manchas de islas bloqueadas van en UN solo div con la lista de
    // gradientes como máscara: N divs con background-image del mapa 10K +
    // filter disparaban la presion de memoria y Chrome rasterizaba toda la
    // pagina (incluido #bg) a baja resolucion — se veia todo borroso.
    const g = (x, y, rad, s, f) => ({ x, y, rx: rad, s, f });
    const maskCss = (b) =>
      `radial-gradient(ellipse ${b.rx.toFixed(1)}px ${(b.ry ?? b.rx).toFixed(1)}px at ${b.x.toFixed(1)}px ${b.y.toFixed(1)}px, #000 ${b.s}%, transparent ${b.f}%)`;
    const lockedMasks = [];
    const unlockMasks = []; // isla recién abierta: mancha propia (se despeja)
    const goneMasks = [];

    // Marcadores de casillas
    for (let i = 0; i < NUM_LEVELS; i++) {
      const pos = positions[i];
      if (!pos) continue;
      const div = document.createElement('div');
      div.className = 'cell-marker' + (i === currentLevel ? ' selected' : '')
        + (completedLevels.has(i) ? ' completed' : '');
      div.style.left = (r.left + pos.x * r.width - sz / 2) + 'px';
      div.style.top = (r.top + pos.y * r.height - sz / 2) + 'px';
      div.style.width = sz + 'px';
      div.style.height = sz + 'px';
      overlay.appendChild(div);

      // Máscara visual sobre la isla: completada (B/N) o bloqueada (oscura)
      const unlocking = (i === unlockIsland && unlockStage < 2);
      if ((i !== currentLevel && !isLevelUnlocked(i)) || unlocking) {
        // Mancha: por isla puede venir calibrada en avatar-positions.json
        // (masks[i] = [{x,y,r}, ...] generado por tools/sam-island-masks.py
        // con la silueta real de la isla). Sin calibrar, mancha organica por
        // defecto: nucleo bajo el pie + 3 blobs desplazados de forma
        // determinista (nunca un circulo perfecto).
        const mo = maskOverrides[currentWorld]?.[i];
        const bucket = unlocking ? unlockMasks : lockedMasks;
        if (mo) {
          for (const b of (Array.isArray(mo) ? mo : [mo])) {
            const px = (b.x ?? pos.x) * r.width;
            const py = (b.y ?? pos.y) * r.height;
            const rpx = (b.r ?? 0.12) * r.width;
            const rpy = (b.ry != null) ? b.ry * r.height : rpx;
            bucket.push({ x: px, y: py, rx: rpx, ry: rpy, s: 55, f: 86 });
          }
        } else {
          const rr = sz * 1.5;
          const px = pos.x * r.width;
          const py = pos.y * r.height + rr * 0.35;
          const a = i * 2.399963; // angulo dorado: dispersa los blobs por isla
          bucket.push(
            g(px, py, rr, 58, 88),
            g(px + Math.cos(a) * rr * 0.55, py + Math.sin(a) * rr * 0.55, rr * 0.6, 42, 80),
            g(px + Math.cos(a + 2.1) * rr * 0.6, py + Math.sin(a + 2.1) * rr * 0.6, rr * 0.55, 42, 80),
            g(px + Math.cos(a + 4.2) * rr * 0.5, py + Math.sin(a + 4.2) * rr * 0.5, rr * 0.5, 42, 80),
          );
        }
      }
    }
    // Islas tienda: misma máscara oscura que las islas bloqueadas hasta
    // completar `unlockAfter`; sin marcador de nivel (no son jugables).
    // Las pasadas de largo (shopGone) se disuelven en el cielo.
    // Nodos con `painted:false` aún no tienen isla dibujada en el mapa —
    // no se pinta ninguna mancha (el nodo sigue siendo navegable).
    shopNodes.forEach((node, ni) => {
      if (atShop === ni || atLadder === ni) {
        const mp = atLadder === ni ? shopMid(node) : shopDoorPos(node);
        if (mp) {
          const div = document.createElement('div');
          div.className = 'cell-marker selected';
          div.style.left = (r.left + mp.x * r.width - sz / 2) + 'px';
          div.style.top = (r.top + mp.y * r.height - sz / 2) + 'px';
          div.style.width = sz + 'px';
          div.style.height = sz + 'px';
          overlay.appendChild(div);
        }
      }
      if (node.painted === false) return;
      if (shopGone.has(ni) && !shopVisited.has(ni)) {
        goneMasks.push(...shopGoneMasks(r, sz, node));
      } else if (!isShopUnlocked(node)) {
        const dp = shopDoorPos(node);
        const px = dp.x * r.width, py = dp.y * r.height, rr = sz * 1.3;
        lockedMasks.push(
          g(px, py, rr, 58, 88),
          g(px + rr * 0.5, py - rr * 0.3, rr * 0.6, 42, 80),
          g(px - rr * 0.55, py + rr * 0.25, rr * 0.55, 42, 80),
        );
      }
    });
    // Un solo div oscurece todas las islas bloqueadas. Con background (no
    // <img>): los backgrounds se repintan solos al decodificar; un <img> con
    // mask+filter pre-decode rasterizaba vacio y jamas se repintaba.
    // En nativo (WebView sin compositor): la capa se hornea UNA vez a canvas
    // — el mask+filter de pantalla completa se re-evaluaba por frame dañado.
    const putFx = (cls, blobs, filterCss) => {
      if (!blobs.length) return;
      if (document.documentElement.classList.contains('runika-native')
          && bg.complete && bg.naturalWidth) {
        const cv = AssetsCache.bakeMaskedLayer(bg, r.width, r.height, blobs, filterCss);
        if (cv) {
          cv.className = 'island-fx ' + cls;
          cv.style.left = r.left + 'px';
          cv.style.top = r.top + 'px';
          cv.style.width = r.width + 'px';
          cv.style.height = r.height + 'px';
          cv.style.filter = 'none';
          overlay.appendChild(cv);
          return;
        }
      }
      const fx = document.createElement('div');
      fx.className = 'island-fx ' + cls;
      fx.style.left = r.left + 'px';
      fx.style.top = r.top + 'px';
      fx.style.width = r.width + 'px';
      fx.style.height = r.height + 'px';
      fx.style.backgroundImage = `url("${bg.src}")`;
      fx.style.webkitMaskImage = fx.style.maskImage = blobs.map(maskCss).join(',');
      overlay.appendChild(fx);
    };
    putFx('locked', lockedMasks, 'grayscale(0.8) brightness(0.22) contrast(1.05)');
    // Mancha de la isla recién desbloqueada: idéntica a las bloqueadas pero
    // en su propio div — se desvanece con el efecto de "se despeja".
    putFx('locked unlocking', unlockMasks, 'grayscale(0.8) brightness(0.22) contrast(1.05)');
    putFx('shopgone', goneMasks, 'blur(11px) brightness(1.06) saturate(0.9)');
    renderShopLadders(r, sz);

    // Avatar en la casilla actual (o en la tienda)
    const pos = currentAvatarPosition();
    if (pos) {
      const avatarSrc = playerAvatarSrc();
      avatarImg.src = AssetsCache.getCachedImageUrl(avatarSrc);
      avatarImg.alt = currentWorld;
      const top = avatarBaseTop(pos, sz, r);
      avatarEl.style.display = 'block';
      avatarEl.style.left = (r.left + pos.x * r.width - sz / 2) + 'px';
      avatarEl.style.top = top + 'px';
      avatarEl.style.width = sz + 'px';
      avatarEl.style.height = sz + 'px';
    }

    dynamicText.innerHTML = '';
    // Ancla horizontal data-driven: por defecto x/w son fracciones de imagen;
    // con anchorX 'viewLeft'/'viewRight' son fracciones del ancho VISIBLE del
    // viewport y x mide el margen desde ese borde — el HUD usa todo el lienzo
    // panorámico aunque la imagen desborde la pantalla.
    const vw = AssetsCache.layoutRect(bg).width;
    // Margen seguro TV: en nativo los textos anclados a un borde no pueden
    // quedar a menos del 2.5% del lateral (quedaban "pegadísimos" al borde).
    const SAFE_X = document.documentElement.classList.contains('runika-native') ? 0.025 : 0;
    const areaX = (area) => {
      if (area.anchorX === 'viewRight') return { left: vw * (1 - Math.max(area.x, SAFE_X) - area.w), w: area.w * vw };
      if (area.anchorX === 'viewLeft') return { left: Math.max(area.x, SAFE_X) * vw, w: area.w * vw };
      return { left: r.left + area.x * r.width, w: area.w * r.width };
    };
    const dynamicValues = {
      worldName: t('worlds.' + currentWorld),
      level: atShop >= 0 ? t('shop.sign') : format('submundo.level', currentLevel + 1, NUM_LEVELS),
    };
    for (const type of ['worldName', 'level']) {
      const area = textAreas[type];
      if (!area) continue;
      const text = document.createElement('div');
      text.className = 'world-text';
      text.textContent = dynamicValues[type];
      const ax = areaX(area);
      text.style.left = ax.left + 'px';
      text.style.top = (r.top + area.y * r.height) + 'px';
      text.style.width = ax.w + 'px';
      text.style.height = (area.h * r.height) + 'px';
      const fs = Math.max(14, area.h * r.height * 0.62 * (area.fontScale || 1));
      text.style.fontSize = fs + 'px';
      dynamicText.appendChild(text);
      // Nombres de mundo largos (p.ej. "Szmaragdowe Morze"): encoger la
      // fuente hasta que quepa en la placa en vez de recortarlo.
      // OJO: con justify-content:center, scrollWidth no refleja el
      // desbordamiento — se mide temporalmente alineado a la izquierda.
      text.style.justifyContent = 'flex-start';
      const over = text.scrollWidth / Math.max(1, text.clientWidth);
      text.style.justifyContent = '';
      if (over > 1) text.style.fontSize = Math.max(12, Math.floor(fs / over)) + 'px';
    }
    // Oro: alineado a la derecha con el icono de monedas a la izquierda
    const goldArea = textAreas.gold;
    if (goldArea && player) {
      const goldEl = document.createElement('div');
      goldEl.className = 'world-text gold-text';
      const ax = areaX(goldArea);
      goldEl.style.left = ax.left + 'px';
      goldEl.style.top = (r.top + goldArea.y * r.height) + 'px';
      goldEl.style.width = ax.w + 'px';
      goldEl.style.height = (goldArea.h * r.height) + 'px';
      goldEl.style.fontSize = Math.max(14, goldArea.h * r.height * 0.62 * (goldArea.fontScale || 1)) + 'px';
      goldEl.style.justifyContent = 'flex-end';
      goldEl.style.paddingRight = (r.width * 0.01) + 'px';
      const coin = document.createElement('img');
      coin.src = AssetsCache.getCachedImageUrl('/assets/comunes/monedas.webp');
      coin.alt = '';
      coin.style.height = '100%';
      coin.style.marginRight = '0.1em';
      goldEl.appendChild(coin);
      goldEl.appendChild(document.createTextNode(String(player.gold ?? 0)));
      dynamicText.appendChild(goldEl);
    }

    document.getElementById('pos-info').textContent = atShop >= 0
      ? t('shop.sign')
      : format('submundo.level', currentLevel + 1, NUM_LEVELS);
    document.getElementById('world-name').textContent = t('worlds.' + currentWorld);
  }

  // Direcciones entre niveles consecutivos segun la serpiente
  // 0→1:right, 1→2:right, 2→3:right, 3→4:up, 4→5:left, 5→6:left, 6→7:left,
  // 7→8:up, 8→9:right, 9→10:right, 10→11:right
  const NEXT_DIR = ['right','right','right','up','left','left','left','up','right','right','right'];
  const INV = {right:'left',left:'right',up:'down',down:'up'};
  // Para volver de i a i-1, se usa la inversa de NEXT_DIR[i-1]
  // PREV_DIR[i] = INV[NEXT_DIR[i-1]]
  const PREV_DIR = [null]; // indice 0 no tiene anterior
  for (let i = 1; i < NUM_LEVELS; i++) {
    PREV_DIR[i] = INV[NEXT_DIR[i - 1]];
  }

  function moveByCell(dir) {
    if (isMoving) return;

    // En el tablón (tras trepar): solo se puede bajar al pie de la escalera
    const shopNode = shopNodes[atShop];
    if (shopNode) {
      if (dir !== INV[shopNode.dir]) { bounceAvatar(dir); return; }
      atShop = -1;
      atLadder = shopNodes.indexOf(shopNode);
      AssetsCache.playSound('/assets/sounds/comun/move.wav', 0.5);
      animateAvatarTo(shopMid(shopNode));
      document.getElementById('pos-info').textContent =
        format('submundo.level', currentLevel + 1, NUM_LEVELS);
      render();
      return;
    }

    // En el pie de la escalera (punto medio entre islas): un lado u otro
    // lleva a cada isla; `dir` del nodo (up) trepa hasta el tablón
    const ladderNode = shopNodes[atLadder];
    if (ladderNode) {
      const mid = shopMid(ladderNode);
      if (dir === ladderNode.dir) {
        if (!isShopUnlocked(ladderNode)) { bounceAvatar(dir); return; }
        startLadderClimb(atLadder);
        return;
      }
      const fromPos = resolvedLevelPosition(ladderNode.from);
      const toFrom = mid && fromPos.x <= mid.x ? 'left' : 'right';
      let target = null;
      if (dir === toFrom) target = ladderNode.from;
      else if (dir === INV[toFrom]) target = ladderNode.from + 1;
      if (target === null || !isLevelUnlocked(target)) { bounceAvatar(dir); return; }
      atLadder = -1;
      currentLevel = target;
      AssetsCache.playSound('/assets/sounds/comun/move.wav', 0.5);
      animateAvatarTo(resolvedLevelPosition(currentLevel));
      document.getElementById('pos-info').textContent =
        format('submundo.level', currentLevel + 1, NUM_LEVELS);
      render();
      return;
    }

    let newLevel = -1;
    // Intentar ir al siguiente nivel
    if (currentLevel < NUM_LEVELS - 1 && NEXT_DIR[currentLevel] === dir) {
      newLevel = currentLevel + 1;
    }
    // Intentar ir al nivel anterior
    else if (currentLevel > 0 && PREV_DIR[currentLevel] === dir) {
      newLevel = currentLevel - 1;
    }

    // Ir al pie de la escalera también con un movimiento DELIBERADO hacia
    // ella: estando en una isla flanqueante (from / from+1), pulsar la
    // dirección del nodo lleva al punto medio (desde ahí, otro `dir` trepa).
    if (newLevel < 0) {
      const ni = shopNodes.findIndex(n =>
        isShopUnlocked(n) && n.dir === dir &&
        (currentLevel === n.from || currentLevel === n.from + 1));
      if (ni >= 0) {
        atLadder = ni;
        AssetsCache.playSound('/assets/sounds/comun/move.wav', 0.5);
        animateAvatarTo(shopMid(shopNodes[ni]));
        render();
        return;
      }
      bounceAvatar(dir);
      return;
    }
    if (!isLevelUnlocked(newLevel)) {
      // Sin pasar a la siguiente isla si la actual no está completada
      bounceAvatar(dir);
      return;
    }

    // Si el salto entre islas cruza el pie de una escalera activa, el avatar
    // para en el medio: ahí decide si seguir a un lado, al otro o subir
    const cross = shopNodes.findIndex(n =>
      ((currentLevel === n.from && newLevel === n.from + 1) ||
       (currentLevel === n.from + 1 && newLevel === n.from)) &&
      isShopUnlocked(n));
    if (cross >= 0) {
      atLadder = cross;
      AssetsCache.playSound('/assets/sounds/comun/move.wav', 0.5);
      animateAvatarTo(shopMid(shopNodes[cross]));
      render();
      return;
    }

    currentLevel = newLevel;
    AssetsCache.playSound('/assets/sounds/comun/move.wav', 0.5);
    animateAvatarTo(resolvedLevelPosition(currentLevel));
    document.getElementById('pos-info').textContent = format('submundo.level', currentLevel + 1, NUM_LEVELS);
  }

  // Desplazamiento visual por transform (compositado en GPU): left/top quedan
  // en el destino y el viaje se dibuja como translate inverso con WAAPI
  // (fill none — no pisa transform de clases). En el WebView de TV animar
  // left/top repintaba el sprite cada frame → todo iba a saltos.
  function glideTo(el, x, y, dur, ease) {
    const ox = parseFloat(el.style.left), oy = parseFloat(el.style.top);
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    if (isFinite(ox) && isFinite(oy) && (Math.abs(ox - x) > .5 || Math.abs(oy - y) > .5) && el.animate) {
      el.animate(
        [{ transform: 'translate(' + (ox - x) + 'px,' + (oy - y) + 'px)' },
         { transform: 'translate(0px,0px)' }],
        { duration: dur * 1000, easing: ease || 'ease-in-out' }
      );
    }
  }

  // Vuelo del avatar hasta una posición (isla o tienda) con duración
  // proporcional a la distancia.
  function animateAvatarTo(pos) {
    if (!pos) return 0;
    isMoving = true;
    const r = getImgRect();
    const sz = resolvedAvatarSize() * r.width;
    const oldX = parseFloat(avatarEl.style.left) || 0;
    const oldY = parseFloat(avatarEl.style.top) || 0;
    const newX = r.left + pos.x * r.width - sz / 2;
    const newY = avatarBaseTop(pos, sz, r);
    const dist = Math.hypot(newX - oldX, newY - oldY);
    const speed = 1400;
    const duration = Math.max(0.15, Math.min(0.7, dist / speed));

    // Viaje por transform (compositado en GPU): animar left/top fuerza
    // layout+paint por frame — en WebView de TV se veía a tirones.
    avatarEl.style.transition = 'none';
    avatarEl.style.left = newX + 'px';
    avatarEl.style.top = newY + 'px';
    avatarEl.style.transform = dist > 1
      ? 'translate(' + (oldX - newX) + 'px,' + (oldY - newY) + 'px)' : 'none';
    if (dist > 1) {
      void avatarEl.offsetWidth;
      avatarEl.style.transition = 'transform ' + duration + 's linear';
      avatarEl.style.transform = 'translate(0px,0px)';
    }

    setTimeout(() => { isMoving = false; }, duration * 1000);
    return duration;
  }

  function bounceAvatar(dir) {
    const offsets = { up: [0, -0.05], down: [0, 0.05], left: [-0.05, 0], right: [0.05, 0] };
    const [dx, dy] = offsets[dir];
    const r = getImgRect();
    const sz = resolvedAvatarSize() * r.width;
    const pos = currentAvatarPosition();
    if (!pos) return;
    const baseX = r.left + pos.x * r.width - sz / 2;
    const baseY = avatarBaseTop(pos, sz, r);
    const bounceX = Math.max(r.left, Math.min(r.right - sz, baseX + dx * r.width));
    const bounceY = Math.max(r.top, Math.min(r.bottom - sz, baseY + dy * r.height));

    // Rebote por transform (compositado): left/top repintan cada frame.
    avatarEl.style.transition = 'transform 0.15s ease-out';
    avatarEl.style.transform = 'translate(' + (bounceX - baseX) + 'px,' + (bounceY - baseY) + 'px)';
    AssetsCache.playSound('/assets/sounds/comun/choque.wav', 0.4);

    setTimeout(() => {
      avatarEl.style.transition = 'transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1)';
      avatarEl.style.transform = 'translate(0px,0px)';
    }, 150);
  }

  // Desbloquear audio
  AssetsCache.unlockAudio();
  document.addEventListener('click', () => AssetsCache.unlockAudio(), { once: true });
  document.addEventListener('keydown', () => AssetsCache.unlockAudio(), { once: true });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      AssetsCache.playSound('/assets/sounds/comun/back.wav', 0.6);
      AssetsCache.transitionTo('/mapamundi.html');
      return;
    }
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { e.preventDefault(); moveByCell('left'); }
    else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { e.preventDefault(); moveByCell('right'); }
    else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') { e.preventDefault(); moveByCell('up'); }
    else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') { e.preventDefault(); moveByCell('down'); }
    else if (e.key === 'Enter') { e.preventDefault(); enterCurrent(); }
  });

  // Entrar en la isla (o tienda) donde está el avatar — Enter o tap táctil.
  function enterCurrent() {
    if (isMoving) return;
    if (atLadder >= 0 && shopNodes[atLadder]) { startLadderClimb(atLadder); return; }
    if (atShop >= 0 && shopNodes[atShop]) {
      if (!isShopUnlocked(shopNodes[atShop])) { bounceAvatar('down'); return; }
      AssetsCache.playSound('/assets/sounds/comun/press.wav', 0.7);
      // La casa voladora ahora lleva a la pantalla BONUS (minijuego de
      // cestas); demo=shop/shop2 sigue abriendo la tienda para probarla.
      const shopDemo = DEMO_SHOP === 'shop' || DEMO_SHOP === 'shop2';
      const avParam = new URLSearchParams(location.search).get('avatar');
      AssetsCache.transitionTo('/' + (shopDemo ? 'shop' : 'bonus') + '.html?world=' + encodeURIComponent(currentWorld) +
        '&node=' + atShop +
        (DEMO_SHOP ? '&demo=' + encodeURIComponent(DEMO_SHOP) : '') +
        (AUTO_RUN ? '&auto=1' : '') +
        (avParam ? '&avatar=' + encodeURIComponent(avParam) : ''));
      return;
    }
    if (!isLevelUnlocked(currentLevel)) { bounceAvatar('down'); return; }
    AssetsCache.playSound('/assets/sounds/comun/press.wav', 0.7);
    // La isla jugada se recuerda en la bbdd (completada o no)
    fetch('/api/level-position', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      keepalive: true, // la petición sobrevive a la navegación
      body: JSON.stringify({ world: currentWorld, level: currentLevel }),
    }).catch(() => {});
    AssetsCache.transitionTo('/game.html?world=' + encodeURIComponent(currentWorld) + '&level=' + currentLevel +
      (AUTO_RUN ? '&auto=1' : ''));
  }

  // Puente táctil (web/tizen.js, Android): tap sobre la isla donde está el
  // avatar entra en ella; tap sobre una isla adyacente (o la tienda desde
  // su isla) mueve el avatar hacia allí.
  window.touchTapMove = function (x, y) {
    if (isMoving || !positions) return;
    const r = getImgRect();
    const sz = resolvedAvatarSize() * r.width;
    const hit = pos => pos &&
      Math.abs(x - (r.left + pos.x * r.width)) < sz * 0.9 &&
      Math.abs(y - (r.top + pos.y * r.height)) < sz * 0.9;
    if (atShop >= 0 && shopNodes[atShop]) {
      const nd = shopNodes[atShop];
      if (hit(shopDoorPos(nd))) { enterCurrent(); return; }
      if (hit(resolvedLevelPosition(nd.from)) || hit(shopMid(nd))) { moveByCell(INV[nd.dir]); return; }
      return;
    }
    if (atLadder >= 0 && shopNodes[atLadder]) {
      const nd = shopNodes[atLadder];
      const mid = shopMid(nd);
      const rc = shopLadderRects[atLadder];
      if (hit(shopDoorPos(nd)) || (rc && x >= rc.left && x <= rc.right && y >= rc.top && y <= rc.bottom)) {
        startLadderClimb(atLadder); return;
      }
      const toFrom = mid && resolvedLevelPosition(nd.from).x <= mid.x ? 'left' : 'right';
      if (hit(resolvedLevelPosition(nd.from))) { moveByCell(toFrom); return; }
      if (hit(resolvedLevelPosition(nd.from + 1))) { moveByCell(INV[toFrom]); return; }
      return;
    }
    if (hit(resolvedLevelPosition(currentLevel))) { enterCurrent(); return; }
    const tapShop = shopNodes.findIndex((n, ni) => {
      if ((currentLevel !== n.from && currentLevel !== n.from + 1) || !isShopUnlocked(n)) return false;
      const mid = shopMid(n);
      if (mid && hit(mid)) return true;
      const rc = shopLadderRects[ni];
      return !!rc && x >= rc.left && x <= rc.right && y >= rc.top && y <= rc.bottom;
    });
    if (tapShop >= 0) {
      atLadder = tapShop;
      AssetsCache.playSound('/assets/sounds/comun/move.wav', 0.5);
      animateAvatarTo(shopMid(shopNodes[tapShop]));
      render();
      return;
    }
    if (currentLevel < NUM_LEVELS - 1 && hit(resolvedLevelPosition(currentLevel + 1))) {
      moveByCell(NEXT_DIR[currentLevel]); return;
    }
    if (currentLevel > 0 && hit(resolvedLevelPosition(currentLevel - 1))) {
      moveByCell(PREV_DIR[currentLevel]);
    }
  };

  document.getElementById('back-btn').addEventListener('click', () => {
    AssetsCache.playSound('/assets/sounds/comun/back.wav', 0.6);
    AssetsCache.transitionTo('/mapamundi.html');
  });
  document.getElementById('back-btn').addEventListener('mouseenter', () => {
    AssetsCache.playSound('/assets/sounds/comun/hover.wav', 0.45);
  });

  (async () => {
    // Obtener mundo de la URL
    if (params.has('debug')) document.getElementById('hud').classList.add('debug');
    currentWorld = params.get('world') || 'ESPACIO';
    if (!WORLD_ORDER.includes(currentWorld)) currentWorld = 'ESPACIO';
    // Progreso de la bbdd: ultima isla jugada + islas completadas
    await loadPlayer();
    measureAvatarPads();
    completedLevels = new Set(player?.worldProgress?.[currentWorld]?.completed ?? []);
    // Índices de tiendas ya consumidas (persistidos por compat con
    // partidas que lo guardaban como flag; la fuente de verdad es
    // "nivel from+1 completado", derivado en loadShop).
    const sg = player?.worldProgress?.[currentWorld]?.shopGone;
    shopGone = new Set(sg === true ? [0] : (Array.isArray(sg) ? sg : []));
    const sv = player?.worldProgress?.[currentWorld]?.shopVisited;
    shopVisited = new Set(Array.isArray(sv) ? sv : []);
    // demo=shop / demo=shop2: tienda 1 o 2 desbloqueada sin tocar la bbdd;
    // demo=bonus: igual que shop pero la casa lleva a la pantalla bonus
    if (params.get('demo') === 'shop' || params.get('demo') === 'bonus') {
      completedLevels = new Set([0, 1, 2]);
      shopGone = new Set();
      shopVisited = new Set();
      currentLevel = 2; // isla 3: a un ↑ de la tienda 1
    } else if (params.get('demo') === 'shop2') {
      completedLevels = new Set([0, 1, 2, 3, 4, 5, 6, 7, 8]);
      shopGone = new Set([0]); // la 1ª oportunidad ya la dejaste pasar
      shopVisited = new Set();
      currentLevel = 8; // isla 9: a un ↑ de la tienda 2
    } else {
      currentLevel = getStartLevel(currentWorld);
    }

    // from=level (vuelta tras ganar una isla): la primera isla incompleta
    // se acaba de desbloquear — arranca tapada y se despeja tras el reveal.
    // El input queda bloqueado desde YA hasta que termine la animación.
    if (params.get('from') === 'level') {
      for (let i = 0; i < NUM_LEVELS; i++) {
        if (!completedLevels.has(i)) { unlockIsland = isLevelUnlocked(i) ? i : -1; break; }
      }
      if (unlockIsland >= 0) isMoving = true;
    }

    // El fondo decide cuándo quitar la carga, pero NUNCA puede colgarla:
    // si ya está cacheada (complete), si falla (error) o si tarda >8s,
    // se pinta igual (un fondo que falta es mejor que una pantalla muerta).
    let bgDone = false;
    const onBgReady = (delay) => {
      if (bgDone) return;
      bgDone = true;
      // El vuelo de la casa arranca cuando el fundido ya casi ha revelado
      // el mundo — si empieza en render() se ve a mitad de vuelo.
      shopFlyHold = true;
      render();
      // La pantalla de carga sigue visible mientras se decodifican las
      // imágenes nuevas del render (casa, escalera, avatar) — si se funde
      // antes que el overlay negro aparece un latigazo de negro puro.
      // decodificadas ANTES de revelar: al volver de la tienda/bonus no hay
      // pantalla de carga y sin esto aparecen tarde (pop-in).
      const imgs = [...document.querySelectorAll('#overlay img, #avatar img')];
      const imgWait = Promise.all(imgs.map(im =>
        (im.complete && im.naturalWidth) ? Promise.resolve()
          : new Promise(res => {
            im.addEventListener('load', res, { once: true });
            im.addEventListener('error', res, { once: true });
          })));
      // Nunca bloquear: como mucho 800ms de espera extra
      Promise.race([imgWait, new Promise(r => setTimeout(r, 800))])
        .then(() => new Promise(r => setTimeout(r, delay)))
        .then(() => {
          AssetsCache.revealPage();
          // La casa despega a mitad del fundido: se ve entrar volando
          // desde la esquina justo al aparecer el mundo
          setTimeout(() => { pendingFlyStart && pendingFlyStart(); }, 300);
          // Vuelta de la tienda: tras la transición, la escalera se
          // despliega y el avatar baja con su punta hasta el punto medio
          kickShopDescent(450);
          // Isla recién completada: la siguiente se despeja tras el reveal
          setTimeout(kickUnlockFx, 400);
        });
    };

    // Calienta una imagen: decode() la deja en la caché de bitmap del
    // navegador para que cualquier <img> con la misma URL pinte al instante.
    function warmImage(url) {
      return new Promise(res => {
        const im = new Image();
        im.onload = () => (im.decode ? im.decode() : Promise.resolve()).then(res, res);
        im.onerror = res;
        im.src = url;
      });
    }

    // Isla recién desbloqueada (from=level): la mancha se despeja poco a
    // poco con un sonido misterioso; mientras tanto el input queda bloqueado.
    function kickUnlockFx() {
      if (unlockIsland < 0 || unlockStage !== 0) return;
      unlockStage = 1;
      isMoving = true;
      setTimeout(() => {
        const fx = overlay.querySelector('.island-fx.unlocking');
        AssetsCache.playSound('/assets/sounds/comun/orbe.wav', 0.85);
        if (fx) {
          fx.style.transition = 'opacity 1.8s ease-in-out';
          fx.style.opacity = '0';
        }
        setTimeout(() => {
          unlockStage = 2;
          isMoving = false;
          render();
        }, 1900);
      }, 900);
    }

    // Dispara la bajada pendiente (una sola vez). Se llama tanto desde
    // onBgReady como tras armShopDescent cuando el fondo ya estaba listo.
    function kickShopDescent(delayMs) {
      if (pendingShopDescent < 0) return;
      const idx = pendingShopDescent;
      pendingShopDescent = -1;
      setTimeout(() => descendWithShopLadder(idx), delayMs);
    }
    bg.addEventListener('load', () => onBgReady(100), { once: true });
    bg.addEventListener('error', () => onBgReady(100), { once: true });
    setTimeout(() => onBgReady(100), 8000);

    // Idioma y ajustes ANTES de la carga: así la pantalla de carga ya
    // muestra los textos traducidos (nunca un literal)
    await AssetsCache.loadSettings();
    AssetsCache.setMusicTrack(AssetsCache.musicForWorld(currentWorld));
    fallback = await loadLang('es');
    translations = await loadLang();
    applyI18n();

    if (sessionStorage.getItem('runika-session') === 'active') {
      AssetsCache.unlockAudio();
      // La caché de AssetsCache es por página y se pierde al navegar: al
      // volver del juego/tienda/bonus todo lo que pinta el mapa debe estar
      // DECODIFICADO antes de revelar, o el mundo parpadea (pop-in). Se
      // calienta tras la pantalla de carga — tarde lo que tarde.
      AssetsCache.showLoading();
      const warm = [
        WORLD_IMAGES[currentWorld],
        SHOP_SIGN_SRC, SHOP_RUNG_SRC, SHOP_FOOT_SRC,
        '/assets/comunes/monedas.webp',
        ...Array.from({ length: 8 }, (_, i) => `/assets/avatars/display/avatar_0${i + 1}.webp`),
      ];
      await Promise.all(warm.map(warmImage));
      setBg(WORLD_IMAGES[currentWorld]);
      await loadPositions(currentWorld);
      await loadTextAreas(currentWorld);
      await loadShop(currentWorld);
      await loadShopNameArea();
      armShopDescent();
      if (bgDone) { render(); kickShopDescent(600); }
      else if (bg.complete && bg.naturalWidth) onBgReady(100);
      return;
    }

    AssetsCache.showLoading();
    const loadingBar = document.getElementById('loading-bar');
    const loadingText = document.getElementById('loading-text');

    await AssetsCache.preloadAll((loaded, total) => {
      const pct = Math.round((loaded / total) * 100);
      loadingBar.style.width = pct + '%';
      loadingText.textContent = t('loading.text') + ' ' + pct + '%';
    });

    setBg(WORLD_IMAGES[currentWorld]);
    await loadPositions(currentWorld);
    await loadTextAreas(currentWorld);
    await loadShop(currentWorld);
    await loadShopNameArea();
    armShopDescent();
    if (bgDone) { render(); kickShopDescent(600); }
    else if (bg.complete && bg.naturalWidth) onBgReady(500);
  })();

  // === Autopiloto ?auto=1: entra en la isla actual; al volver de un nivel
  // (from=level) espera la animación de desbloqueo + vuelo de la casa y
  // sube al bonus si hay tienda posada; si no, regresa al mapamundi para
  // que el grabador cierre la toma (window.__autoDone) ===
  if (AUTO_RUN) (async () => {
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    const idle = () => new Promise(res => {
      const t = setInterval(() => { if (!isMoving) { clearInterval(t); res(); } }, 220);
    });
    while (!positions) await sleep(300);
    await sleep(1800); await idle(); await sleep(1400);
    const from = params.get('from');
    if (from === 'level' || from === 'shop') {
      // Llegar al pie de la escalera como un jugador: moverse hacia el
      // punto medio — el cruce entre las islas flanqueantes para en el pie.
      for (let i = 0; i < 3 && atLadder < 0 && atShop < 0; i++) {
        const ni = shopNodes.findIndex((n, k) => isShopUnlocked(n) && !shopGone.has(k));
        if (ni < 0) break;
        const mid = shopMid(shopNodes[ni]), here = resolvedLevelPosition(currentLevel);
        if (!mid || !here) break;
        moveByCell(here.x > mid.x ? 'left' : 'right');
        await idle(); await sleep(500);
      }
      if (atLadder >= 0 || atShop >= 0) { enterCurrent(); return; }
      sessionStorage.setItem('runika-auto-done', '1');
      AssetsCache.transitionTo('/mapamundi.html?auto=1');
      return;
    }
    enterCurrent();
  })();

  window.addEventListener('resize', () => {
    if (bg.complete) render();
  });
</script>
