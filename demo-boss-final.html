<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Demo — boss final</title>
<style>
  html, body { margin: 0; height: 100%; background: #14100c; color: #f0d890;
    font-family: 'ChelseaMarket', 'Segoe UI', cursive; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    background: #1d1712; border-bottom: 2px solid #5c3a00; flex-wrap: wrap; }
  select, button { font: inherit; padding: 6px 12px; border-radius: 6px;
    border: 1px solid #8a6a30; background: #2a2016; color: #f0d890; cursor: pointer; }
  button:hover { background: #3a2c1a; }
  .hint { font-size: 12px; opacity: .6; }
  iframe { width: 100%; height: calc(100% - 58px); border: 0; display: block; }
</style>
</head>
<body>
<div class="bar">
  <label><span data-i18n="game.tier">Nivel:</span>
    <select id="tier"></select>
  </label>
  <button id="go" data-i18n="demo.bossfinal.launch">Jugar boss final</button>
  <button id="cine" data-i18n="demo.bossfinal.cine">Solo cinemática</button>
  <span class="hint" data-i18n="demo.bossfinal.hint">partida real al boss de MAZMORRA (isla 12): gana para encadenar directo con la cinemática final completa — sin modal. No se guarda nada.</span>
</div>
<iframe id="f"></iframe>
<script type="module">
// Demo de la victoria del boss final:
//  - "Jugar boss final": game.html?world=MAZMORRA&level=11&demo=bossrun&tier=N
//    — partida real simulada; al ganar no hay modal, encadena sola con
//    /fin.html?auto=1 (pelea cinematográfica + explosión + mundos cayendo
//    + gran final + créditos).
//  - "Solo cinemática": fin.html?auto=1 directo, sin pelear el tablero.
// NADA escribe en la bbdd. sessionStorage es compartido con el iframe.
const selTier = document.getElementById('tier');
const f = document.getElementById('f');
let tr = {};
try {
  const r = await fetch('/api/i18n');
  if (r.ok) tr = await r.json();
} catch {}
const tt = k => tr[k] ?? k;
document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = tt(el.dataset.i18n); });
// Tier de la pantalla de práctica que se juega como boss final
for (let i = 4; i <= 15; i++) {
  const o = document.createElement('option');
  o.value = String(i); o.textContent = String(i);
  selTier.appendChild(o);
}
selTier.value = '6';
function go() {
  sessionStorage.setItem('runika-session', 'active');
  sessionStorage.removeItem('runika-world-done');
  sessionStorage.removeItem('runika-music-override');
  f.src = '/game.html?world=MAZMORRA&level=11&demo=bossrun&tier=' + selTier.value + '&t=' + Date.now();
}
function cine() {
  sessionStorage.setItem('runika-session', 'active');
  f.src = '/fin.html?auto=1&t=' + Date.now();
}
selTier.addEventListener('change', go);
document.getElementById('go').addEventListener('click', go);
document.getElementById('cine').addEventListener('click', cine);
go();
</script>
</body>
</html>
