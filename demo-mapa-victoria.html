<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Demo — victoria de mundo</title>
<style>
  html, body { margin: 0; height: 100%; background: #14100c; color: #f0d890;
    font-family: 'ChelseaMarket', 'Segoe UI', cursive; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    background: #1d1712; border-bottom: 2px solid #5c3a00; flex-wrap: wrap; }
  select, button { font: inherit; padding: 6px 12px; border-radius: 6px;
    border: 1px solid #8a6a30; background: #2a2016; color: #f0d890; cursor: pointer; }
  button:hover { background: #3a2c1a; }
  .hint { font-size: 12px; opacity: .6; }
  iframe { width: 100%; height: calc(100% - 58px); border: 0; display: block; }
</style>
</head>
<body>
<div class="bar">
  <label><span data-i18n="demo.mode">Ver:</span>
    <select id="mode">
      <option value="map" data-i18n="demo.modeMap">Celebración mapa</option>
      <option value="board" data-i18n="demo.modeBoard">Victoria tablero</option>
    </select>
  </label>
  <label id="worldRow"><span data-i18n="demo.worldLabel">Mundo:</span>
    <select id="world"></select>
  </label>
  <button id="go" data-i18n="demo.launch">Lanzar celebración</button>
  <span class="hint" data-i18n="demo.hint">marca el mundo como recién conquistado y recarga el mapamundi</span>
</div>
<iframe id="f"></iframe>
<script type="module">
// Demo: victoria de mundo sin jugar.
//  - "mapa": mapamundi con el mundo fingido como conquistado (B/N permanente
//    vía ?demo=<MUNDO>) + celebración (anillos/chispas/rótulo) vía el flag
//    runika-world-done de sessionStorage, igual que hace game.html.
//  - "tablero": game.html?demo=win auto-gana una pantalla de práctica y
//    muestra el vuelo de monedas + modal Reiniciar/Continuar reales.
// Nada de esto escribe en la bbdd.
const WORLDS = ['ESPACIO','AGUA','TIERRA','FUEGO','HIELO','VIENTO','INFRAMUNDO','MAZMORRA'];
const selMode = document.getElementById('mode');
const selWorld = document.getElementById('world');
const worldRow = document.getElementById('worldRow');
const f = document.getElementById('f');
let tr = {};
try {
  const r = await fetch('/api/i18n');
  if (r.ok) tr = await r.json();
} catch {}
const tt = k => tr[k] ?? k;
document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = tt(el.dataset.i18n); });
for (const w of WORLDS) {
  const o = document.createElement('option');
  o.value = w;
  o.textContent = tt('worlds.' + w);
  selWorld.appendChild(o);
}
selWorld.value = 'INFRAMUNDO';
function go() {
  if (selMode.value === 'board') {
    worldRow.style.display = 'none';
    f.src = '/game.html?demo=win&t=' + Date.now();
    return;
  }
  worldRow.style.display = '';
  // sessionStorage es compartido con el iframe (mismo origen/pestaña)
  sessionStorage.setItem('runika-session', 'active');
  sessionStorage.setItem('runika-world-done', selWorld.value);
  f.src = '/mapamundi.html?demo=' + selWorld.value + '&t=' + Date.now();
}
selMode.addEventListener('change', go);
document.getElementById('go').addEventListener('click', go);
go();
</script>
</body>
</html>
