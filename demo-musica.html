<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Demo — música de submundo</title>
<style>
  html, body { margin: 0; height: 100%; background: #14100c; color: #f0d890;
    font-family: 'ChelseaMarket', 'Segoe UI', cursive; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    background: #1d1712; border-bottom: 2px solid #5c3a00; flex-wrap: wrap; }
  select, button { font: inherit; padding: 6px 12px; border-radius: 6px;
    border: 1px solid #8a6a30; background: #2a2016; color: #f0d890; cursor: pointer; }
  button:hover { background: #3a2c1a; }
  .hint { font-size: 12px; opacity: .6; }
  iframe { width: 100%; height: calc(100% - 58px); border: 0; display: block; }
</style>
</head>
<body>
<div class="bar">
  <label><span data-i18n="demo.worldLabel">Mundo:</span>
    <select id="world"></select>
  </label>
  <button id="go" data-i18n="demo.musica.launch">Escuchar submundo</button>
  <button id="toMap" data-i18n="demo.musica.toMap">Volver al mapamundi</button>
  <span class="hint" data-i18n="demo.musica.hint">cada submundo suena con su pista propia; si el navegador bloquea el audio, haz click dentro del marco</span>
</div>
<iframe id="f"></iframe>
<script type="module">
// Demo: música por submundo sin jugar.
//  - El selector carga submundo.html?world=<M> en el iframe: al entrar, esa
//    pantalla ya activa su propia pista (MUSIC.worlds / musicForWorld).
//  - "Volver al mapamundi" carga el mapamundi para comprobar que retoma el
//    tema principal (MUSIC.main), no la música del submundo.
//  - Respeta el ajuste global de música (settings.music).
// sessionStorage es compartido con el iframe (mismo origen/pestaña).
// Nada de esto escribe en la bbdd.
const WORLDS = ['ESPACIO','AGUA','TIERRA','FUEGO','HIELO','VIENTO','INFRAMUNDO','MAZMORRA'];
const selWorld = document.getElementById('world');
const f = document.getElementById('f');
let tr = {};
try {
  const r = await fetch('/api/i18n');
  if (r.ok) tr = await r.json();
} catch {}
const tt = k => tr[k] ?? k;
document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = tt(el.dataset.i18n); });
for (const w of WORLDS) {
  const o = document.createElement('option');
  o.value = w;
  o.textContent = tt('worlds.' + w);
  selWorld.appendChild(o);
}
selWorld.value = 'AGUA';
function go() {
  sessionStorage.setItem('runika-session', 'active');
  f.src = '/submundo.html?world=' + selWorld.value + '&t=' + Date.now();
}
selWorld.addEventListener('change', go);
document.getElementById('go').addEventListener('click', go);
document.getElementById('toMap').addEventListener('click', () => {
  f.src = '/mapamundi.html?t=' + Date.now();
});
go();
</script>
</body>
</html>
