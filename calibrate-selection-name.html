<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calibrar nombre del personaje</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font:14px Arial,sans-serif}#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}#image{width:100%;height:100%;object-fit:contain;display:block}#area{position:absolute;border:4px solid #0ff;background:rgba(0,220,255,.18);box-shadow:0 0 18px #0ff;pointer-events:none;display:none}#panel{position:absolute;z-index:5;top:12px;left:12px;width:280px;padding:13px;background:rgba(0,0,0,.88);border:1px solid #789;border-radius:6px;line-height:1.5}button{width:100%;margin:3px 0;padding:7px;background:#17212b;color:#fff;border:1px solid #789;border-radius:4px;cursor:pointer}.key{color:#ffd54f}.status{position:absolute;z-index:5;bottom:12px;left:50%;transform:translateX(-50%);padding:8px 15px;background:rgba(0,0,0,.88);border-radius:4px;color:#9de}.ok{color:#7f7}</style></head>
<body><div id="stage"><img id="image" src="/assets/menu%20principal/seleccion_personaje.png?v=template-8k" alt=""><div id="area"></div></div><div id="panel"><b>Área del nombre del personaje</b><br><span class="key">Arrastrar</span>: crear o reemplazar el área<br><span class="key">Flechas</span>: mover · <span class="key">Shift + flechas</span>: movimiento fino<br><span class="key">+ / -</span>: cambiar tamaño<br><button id="clear">Empezar de cero</button><button id="save">Guardar</button><button id="load">Cargar</button><div id="coords"></div></div><div id="status">Arrastra sobre el pergamino donde irá el nombre</div>
<script>
const image=document.getElementById('image'),area=document.getElementById('area'),coords=document.getElementById('coords'),status=document.getElementById('status');let value=null,dragging=false,start=null,current=null;
function rect(){const w=innerWidth,h=innerHeight,ratio=1.5;let width=w,height=w/ratio;if(height>h){height=h;width=h*ratio}return{left:(w-width)/2,top:(h-height)/2,width,height,right:(w+width)/2,bottom:(h+height)/2}}function norm(x,y){const r=rect();return{x:Math.max(0,Math.min(1,(x-r.left)/r.width)),y:Math.max(0,Math.min(1,(y-r.top)/r.height))}}function place(v){if(!v){area.style.display='none';coords.textContent='Sin calibrar';return}const r=rect();area.style.display='block';area.style.left=r.left+v.x*r.width+'px';area.style.top=r.top+v.y*r.height+'px';area.style.width=v.w*r.width+'px';area.style.height=v.h*r.height+'px';coords.textContent=`x:${v.x.toFixed(4)} y:${v.y.toFixed(4)} w:${v.w.toFixed(4)} h:${v.h.toFixed(4)}`}
function render(){place(value)}function clear(){value=null;render();status.textContent='Área vacía. Arrastra para marcarla.'}function adjust(dx,dy,dw,dh,fine=false){if(!value)return;const step=(fine||document.getElementById('fine')?.checked)?0.0005:0.003;value.x=Math.max(0,Math.min(1-value.w,value.x+dx*step));value.y=Math.max(0,Math.min(1-value.h,value.y+dy*step));value.w=Math.max(.01,Math.min(1-value.x,value.w+dw*step));value.h=Math.max(.01,Math.min(1-value.y,value.h+dh*step));render()}
document.addEventListener('mousedown',e=>{const r=rect();if(e.target.closest('#panel')||e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)return;start=norm(e.clientX,e.clientY);current={...start,w:0,h:0};dragging=true});document.addEventListener('mousemove',e=>{if(!dragging)return;const p=norm(e.clientX,e.clientY);current.x=Math.min(start.x,p.x);current.y=Math.min(start.y,p.y);current.w=Math.abs(p.x-start.x);current.h=Math.abs(p.y-start.y);value=current;render()});document.addEventListener('mouseup',()=>{if(!dragging)return;dragging=false;current=null;status.textContent='Área creada. Pulsa Guardar.'});document.addEventListener('keydown',e=>{if(e.key==='Escape'){clear();return}if(e.key==='ArrowLeft'){e.preventDefault();adjust(-1,0,0,0,e.shiftKey)}else if(e.key==='ArrowRight'){e.preventDefault();adjust(1,0,0,0,e.shiftKey)}else if(e.key==='ArrowUp'){e.preventDefault();adjust(0,-1,0,0,e.shiftKey)}else if(e.key==='ArrowDown'){e.preventDefault();adjust(0,1,0,0,e.shiftKey)}else if(e.key==='+'||e.key==='='){e.preventDefault();adjust(0,0,1,1,e.shiftKey)}else if(e.key==='-'){e.preventDefault();adjust(0,0,-1,-1,e.shiftKey)}});document.getElementById('clear').onclick=clear;document.getElementById('save').onclick=()=>{fetch('/api/save-selection-name',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(value?{...value,coordinateSpace:'image-content'}:value,null,2)}).then(r=>{if(!r.ok)throw Error();status.innerHTML='<span class="ok">Área guardada</span>'}).catch(()=>status.textContent='Error al guardar')};document.getElementById('load').onclick=load;function load(){fetch('/api/load-selection-name').then(r=>{if(!r.ok)throw Error();return r.json()}).then(v=>{value=v;render();status.innerHTML='<span class="ok">Área cargada</span>'}).catch(()=>clear())}window.addEventListener('resize',render);image.onload=render;load();
</script></body></html>
