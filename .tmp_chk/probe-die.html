<!DOCTYPE html><html><body><script>
const f = document.createElement('iframe');
f.src = '/game.html?demo=winboss'; f.width = 1280; f.height = 720;
document.body.appendChild(f);
const log = [];
const check = (tag) => {
  const d = f.contentDocument;
  if (!d) return;
  log.push(tag + '=' + JSON.stringify({
    dying: d.querySelectorAll('.entity.dying').length,
    defeated: d.querySelectorAll('.entity.defeated').length,
    banner: d.getElementById('boss-down').className,
    bannerTxt: d.getElementById('boss-down').textContent,
    modal: d.getElementById('modal-overlay').className,
  }));
};
f.onload = () => {
  setTimeout(() => check('t800'), 800);
  setTimeout(() => check('t1600'), 1600);
  setTimeout(() => check('t3000'), 3000);
  setTimeout(() => { check('t4500'); document.title = log.join(' | '); }, 4500);
};
</script></body></html>
