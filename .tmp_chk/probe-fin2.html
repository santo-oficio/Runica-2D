<!DOCTYPE html><html><body style="margin:0">
<iframe id="f" src="/fin.html" style="width:1280px;height:720px;border:0"></iframe>
<script>
sessionStorage.setItem('runika-session','active');
const f = document.getElementById('f');
const tap = () => { try { f.contentWindow.document.dispatchEvent(new KeyboardEvent('keydown',{key:' '})); } catch(e){} };
setTimeout(tap, 2500);          // press start -> escena 1
setTimeout(tap, 14000);         // avanza escena 1 -> escena 2 (si no busy)
setTimeout(tap, 28000);         // avanza escena 2 -> escena 3
setTimeout(() => {
  try {
    console.log('SCENE', f.contentWindow.scene, 'BUSY', f.contentWindow.busy);
    tap();                       // avanza escena 3 -> creditos
  } catch(e) { console.log('ERR', e.message); }
}, 42000);
setTimeout(() => { try { console.log('HREF', f.contentWindow.location.href); } catch(e){ console.log('NAV-OK (cross-frame durante transicion)') } }, 45000);
</script></body></html>
