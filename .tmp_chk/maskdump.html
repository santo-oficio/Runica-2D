<!DOCTYPE html><meta charset="utf-8"><body style="margin:0">
<iframe id="f" src="/mapamundi.html?demo=INFRAMUNDO" style="width:1280px;height:700px;border:0"></iframe>
<script>
const f=document.getElementById('f');
f.onload=()=>setTimeout(()=>{
  const fx=f.contentDocument.querySelector('.world-fx.done');
  const w=f.contentWindow.getComputedStyle(fx);
  document.title=JSON.stringify({mask:w.maskImage||w.webkitMaskImage});
},12000);
</script>
