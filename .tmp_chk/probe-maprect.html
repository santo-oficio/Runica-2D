<!DOCTYPE html><html><body style="margin:0">
<iframe src="/mapamundi.html?demo=INFRAMUNDO" style="width:1280px;height:662px;border:0"></iframe>
<script>
setTimeout(() => {
  const d = document.querySelector('iframe').contentDocument;
  const bg = d.getElementById('bg');
  const er = bg.getBoundingClientRect();
  const s = Math.min(er.width/bg.naturalWidth, er.height/bg.naturalHeight);
  const w = bg.naturalWidth*s, h = bg.naturalHeight*s;
  const ir = {left: er.left+(er.width-w)/2, top: er.top+(er.height-h)/2, width:w, height:h};
  console.log('ELEMENT', JSON.stringify(er));
  console.log('IMAGE', JSON.stringify(ir));
  console.log('AVATAR', JSON.stringify(d.getElementById('avatar').getBoundingClientRect()));
  console.log('NATURAL', bg.naturalWidth, bg.naturalHeight);
}, 12000);
</script></body></html>
