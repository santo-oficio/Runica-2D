<!DOCTYPE html><meta charset="utf-8"><body style="margin:0">
<iframe id="f" src="/game.html?demo=winboss" style="width:1280px;height:700px;border:0"></iframe>
<script>
const f=document.getElementById('f'),out=[];
f.onload=()=>{
  const t0=Date.now();
  const iv=setInterval(()=>{
    const d=f.contentDocument;
    out.push({t:Date.now()-t0,rings:d.querySelectorAll('.win-ring').length,
      sparks:d.querySelectorAll('.win-spark').length,
      modal:d.getElementById('modal-overlay').className});
    if(Date.now()-t0>12000){clearInterval(iv);document.title=JSON.stringify(out.filter(o=>o.rings||o.modal));}
  },400);
};
</script>
