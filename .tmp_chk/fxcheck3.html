<!DOCTYPE html><meta charset="utf-8"><body style="margin:0">
<iframe id="f" src="/mapamundi.html?demo=INFRAMUNDO" style="width:1280px;height:700px;border:0"></iframe>
<script>
const f=document.getElementById('f');
f.onload=()=>setTimeout(()=>{
  const d=f.contentDocument;
  const fx=d.querySelector('.world-fx.done');
  // quitar máscara → si aparece una capa gris entera, la máscara es el fallo
  fx.style.webkitMaskImage='none';fx.style.maskImage='none';
  setTimeout(()=>{ document.title='unmasked'; },1500);
},12000);
</script>
