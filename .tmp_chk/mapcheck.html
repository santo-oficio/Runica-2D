<!DOCTYPE html><meta charset="utf-8"><body style="margin:0">
<iframe id="f" src="/mapamundi.html?demo=FUEGO" style="width:1280px;height:700px;border:0"></iframe>
<script>
const f=document.getElementById('f');
f.onload=()=>setTimeout(()=>{
  const d=f.contentDocument;
  document.title=JSON.stringify({
    fx:[...d.querySelectorAll('.world-fx')].map(e=>e.className),
    avatar:{l:d.getElementById('avatar').style.left,t:d.getElementById('avatar').style.top},
    auraKeys: f.contentWindow.FIN_AREAS?Object.keys(f.contentWindow.FIN_AREAS.aura||{}):null
  });
},12000);
</script>
