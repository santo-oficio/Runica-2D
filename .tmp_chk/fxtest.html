<!doctype html>
<html><body style="margin:0;background:#000">
<div id="stage" style="position:relative;width:800px;height:500px">
  <img id="bg" src="/assets/mapamundi/mapamundi.webp" style="width:100%;height:100%;object-fit:contain;display:block">
  <div id="ov" style="position:absolute;inset:0"></div>
</div>
<script>
const bg = document.getElementById('bg');
bg.onload = () => {
  const sw = 800, sh = 500;
  const ir = bg.naturalWidth / bg.naturalHeight, sr = sw / sh;
  let w, h;
  if (sr > ir) { h = sh; w = h * ir; } else { w = sw; h = w / ir; }
  const r = { left: (sw - w) / 2, top: (sh - h) / 2, width: w, height: h };
  const circ = { cx: 0.5, cy: 0.52, r: 0.16 };
  const ov = document.getElementById('ov');
  const fx = document.createElement('img');
  fx.src = bg.src;
  fx.style.cssText = `position:absolute;left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;object-fit:fill;filter:grayscale(1) brightness(0.55);pointer-events:none`;
  const mask = `radial-gradient(circle ${(circ.r * 1.12 * r.width).toFixed(1)}px at ${(circ.cx * r.width).toFixed(1)}px ${(circ.cy * r.height).toFixed(1)}px, #000 55%, transparent 92%)`;
  fx.style.webkitMaskImage = mask; fx.style.maskImage = mask;
  ov.appendChild(fx);
  document.title = 'done';
};
</script>
</body></html>
