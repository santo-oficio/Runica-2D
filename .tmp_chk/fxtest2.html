<!doctype html>
<html><body style="margin:0;background:#000">
<div id="stage" style="position:relative;width:1280px;height:800px">
  <img id="bg" src="/assets/mapamundi/mapamundi.webp" style="width:100%;height:100%;object-fit:contain;display:block">
  <div id="ov" style="position:absolute;inset:0"></div>
</div>
<script>
const bg = document.getElementById('bg');
bg.onload = () => {
  // replica mapamundi: r = getBoundingClientRect del elemento (no drawn rect)
  const r = bg.getBoundingClientRect();
  const circ = { cx: 0.5004, cy: 0.3929, r: 0.1346 }; // MAZMORRA aprox
  const ov = document.getElementById('ov');
  const fx = document.createElement('img');
  fx.src = bg.src;
  fx.style.cssText = `position:absolute;left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;object-fit:fill;filter:grayscale(0.6) brightness(0.35);pointer-events:none`;
  // clip irregular sencillo alrededor del centro
  const pts = [[0.62,0.41],[0.55,0.60],[0.44,0.68],[0.36,0.53],[0.34,0.32],[0.40,0.22],[0.48,0.16],[0.54,0.23],[0.61,0.26]];
  fx.style.clipPath = `polygon(${pts.map(p => `${p[0] * r.width}px ${p[1] * r.height}px`).join(',')})`;
  const mask = `radial-gradient(circle ${(circ.r * 1.12 * r.width).toFixed(1)}px at ${(circ.cx * r.width).toFixed(1)}px ${(circ.cy * r.height).toFixed(1)}px, #000 55%, transparent 92%)`;
  fx.style.webkitMaskImage = mask; fx.style.maskImage = mask;
  ov.appendChild(fx);
  document.title = 'done';
};
</script>
</body></html>
