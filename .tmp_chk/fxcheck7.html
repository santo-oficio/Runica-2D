<!DOCTYPE html><meta charset="utf-8"><body style="margin:0">
<iframe id="f" src="/mapamundi.html?demo=INFRAMUNDO" style="width:1280px;height:700px;border:0"></iframe>
<script>
const f=document.getElementById('f');
f.onload=()=>setTimeout(()=>{
  const d=f.contentDocument;
  const ov=d.getElementById('overlay');
  const their=d.querySelector('.world-fx.done');
  // Reporte: ¿su elemento pinta? posición + máscara efectiva
  const cs=f.contentWindow.getComputedStyle(their);
  const info={theirExists:!!their,anim:cs.animationName};
  // Mi clon con la MISMA clase css
  const e=d.createElement('img');
  e.className='world-fx done';
  e.style.left=their.style.left;e.style.top=their.style.top;
  e.style.width=their.style.width;e.style.height=their.style.height;
  const m=cs.maskImage;
  e.onload=()=>{e.style.webkitMaskImage=m;e.style.maskImage=m;};
  ov.appendChild(e);
  e.src=d.getElementById('bg').src;
  document.title=JSON.stringify(info);
},14000);
</script>
