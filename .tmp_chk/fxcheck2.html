<!DOCTYPE html><meta charset="utf-8"><body style="margin:0">
<iframe id="f" src="/mapamundi.html?demo=INFRAMUNDO" style="width:1280px;height:700px;border:0"></iframe>
<script>
const f=document.getElementById('f');
f.onload=()=>setTimeout(()=>{
  const d=f.contentDocument, w=f.contentWindow;
  const hit=d.elementFromPoint(1116,597);
  const fx=d.querySelector('.world-fx.done');
  const cs=w.getComputedStyle(fx);
  const ov=w.getComputedStyle(d.getElementById('overlay'));
  document.title=JSON.stringify({
    hit: hit ? (hit.className||hit.id||hit.tagName) : 'none',
    fxFilter: cs.filter, fxZ: cs.zIndex, fxPos: cs.position,
    fxParent: fx.parentElement.id,
    ovZ: ov.zIndex, ovPos: ov.position, ovPF: ov.pointerEvents,
    anim: cs.animationName, disp: cs.display,
    rect: fx.getBoundingClientRect().toJSON()
  });
},12000);
</script>
