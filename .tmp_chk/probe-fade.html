<!DOCTYPE html><html><body><script>
sessionStorage.setItem('runika-world-done', 'FUEGO');
const f = document.createElement('iframe');
f.src = '/mapamundi.html?demo=FUEGO'; f.width = 1280; f.height = 720;
document.body.appendChild(f);
const log = [];
const check = (tag) => {
  const d = f.contentDocument;
  const fx = d && d.querySelector('.world-fx.done');
  log.push(tag + ':' + (fx ? (fx.classList.contains('start-color') ? 'COLOR' : 'GRAY') : 'none'));
};
f.onload = () => {
  setTimeout(() => check('t1'), 800);
  setTimeout(() => check('t2'), 1800);
  setTimeout(() => { check('t3'); document.title = log.join(' | '); }, 4200);
};
</script></body></html>
