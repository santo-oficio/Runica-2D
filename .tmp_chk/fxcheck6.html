<!DOCTYPE html><meta charset="utf-8"><body style="margin:0">
<iframe id="f" src="/mapamundi.html" style="width:1280px;height:700px;border:0"></iframe>
<script>
const f=document.getElementById('f');
f.onload=()=>setTimeout(()=>{
  const d=f.contentDocument, w=f.contentWindow;
  const ov=d.getElementById('overlay');
  const bg=d.getElementById('bg');
  // Crear MI propio fx dentro del overlay real, máscara sobre INFRAMUNDO
  const mask='radial-gradient(130px at 1116px 597px, #000 60%, transparent 88%)';
  const mk=(parent)=>{
    const e=d.createElement('img');
    e.src=bg.src;
    e.style.cssText='position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;z-index:9;pointer-events:none;filter:grayscale(1) brightness(.55)';
    e.style.webkitMaskImage=mask; e.style.maskImage=mask;
    parent.appendChild(e); return e;
  };
  mk(ov); // A: dentro de #overlay
  document.title='added';
},12000);
</script>
