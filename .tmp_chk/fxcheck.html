<!DOCTYPE html><meta charset="utf-8"><body style="margin:0">
<iframe id="f" src="/mapamundi.html?demo=INFRAMUNDO" style="width:1280px;height:700px;border:0"></iframe>
<script>
const f=document.getElementById('f');
f.onload=()=>setTimeout(()=>{
  const d=f.contentDocument;
  const fx=[...d.querySelectorAll('.world-fx')].map(e=>{
    const cs=f.contentWindow.getComputedStyle(e);
    return {cls:e.className,w:e.offsetWidth,h:e.offsetHeight,
      mask:(cs.maskImage||cs.webkitMaskImage||'').slice(0,80),
      complete:e.complete,src:e.src.slice(0,60),op:cs.opacity};
  });
  document.title=JSON.stringify(fx);
},12000);
</script>
