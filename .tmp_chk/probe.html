<!doctype html><body>
<script>sessionStorage.setItem('runika-session','active');sessionStorage.setItem('runika-world-done','INFRAMUNDO');</script>
<iframe id="f" src="/mapamundi.html" style="width:1200px;height:750px"></iframe>
<pre id="out"></pre>
<script>
setTimeout(()=>{
  try{
    const d=document.getElementById('f').contentDocument;
    const b=d.getElementById('world-done-banner');
    document.getElementById('out').textContent = b ? ('BANNER: '+b.textContent) : 'NO BANNER; keys:'+JSON.stringify(Object.keys(d.defaultView||{}).length);
  }catch(e){document.getElementById('out').textContent='ERR '+e.message}
},1800);
</script>
</body>
