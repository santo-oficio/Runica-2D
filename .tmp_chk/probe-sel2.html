<!DOCTYPE html><html><body style="margin:0">
<iframe id="f" src="/seleccion-personaje.html" style="width:1280px;height:720px;border:0"></iframe>
<script>
sessionStorage.setItem('runika-session','active');
const f = document.getElementById('f');
const poll = setInterval(() => {
  try {
    const w = f.contentWindow;
    if (w.document.body.classList.contains('ready') && typeof w.doConfirm === 'function') {
      clearInterval(poll);
      w.doConfirm();
      setTimeout(() => {
        const c = w.document.getElementById('confirm');
        const cs = w.getComputedStyle(c);
        console.log('FLASH show=' + c.classList.contains('show'),
          'fx=' + c.style.getPropertyValue('--fx'),
          'fy=' + c.style.getPropertyValue('--fy'),
          'bg=' + cs.backgroundImage.slice(0,80),
          'opacity=' + cs.opacity);
      }, 250);
    }
  } catch(e){}
}, 150);
setTimeout(() => clearInterval(poll), 60000);
</script></body></html>
