<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Runika 2D — Mapamundi</title>
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000; font-family: 'ChelseaMarket', cursive;
  }
  #loading-screen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 100; background: #0a0806;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #e8d4a8;
  }
  #loading-screen .title {
    font-family: 'ChelseaMarket', cursive;
    font-size: 2.5em; color: #f0d890;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    margin-bottom: 30px; letter-spacing: 3px;
  }
  #loading-bar-bg {
    width: 300px; height: 8px;
    background: rgba(60, 42, 20, 0.5);
    border: 1px solid rgba(180, 150, 80, 0.4);
    border-radius: 4px; overflow: hidden;
  }
  #loading-bar {
    width: 0%; height: 100%;
    background: linear-gradient(90deg, #c4a050, #f0d890);
    transition: width 0.2s ease;
  }
  #loading-text {
    margin-top: 12px; font-size: 0.9em; color: #a08850;
    font-family: 'ChelseaMarket', cursive;
  }
  #transition-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 90; background: #000;
    opacity: 0; pointer-events: none; display: none;
  }
  #stage {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  #bg {
    width: 100%; height: 100%;
    object-fit: contain; display: block;
  }
  #overlay {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 10; pointer-events: none;
  }
  .world-marker {
    position: absolute;
    z-index: 11;
    pointer-events: auto;
    cursor: pointer;
    transition: transform 0.2s ease;
  }
  .world-marker:hover { transform: scale(1.2); }
  .world-marker.selected { transform: scale(1.3); }
  .world-marker .dot {
    width: 100%; height: 100%;
    border: none;
    background: transparent;
    transition: all 0.2s ease;
  }
  .world-marker.selected .dot {
    background: transparent;
    box-shadow: none;
  }
  .world-marker.reachable .dot {
    background: transparent;
    box-shadow: none;
  }
  /* Mundo completado: la zona queda en blanco y negro, "vencida" */
  /* Mundo completado/bloqueado: copia gris del mapa recortada con la
     forma del aura y bordes difuminados (mask radial). Una img clonada,
     no backdrop-filter, porque el filtro de fondo no hereda la mascara. */
  .world-fx {
    position: absolute;
    z-index: 9;
    pointer-events: none;
    object-fit: contain; /* mismo fit que #bg para que la copia coincida pixel a pixel */
  }
  .world-fx.done {
    filter: grayscale(1) brightness(0.55);
    animation: auraFade 4s ease-in-out infinite;
  }
  .world-fx.locked {
    filter: grayscale(0.6) brightness(0.35);
    animation: auraFade 5s ease-in-out infinite;
  }
  /* Aura "viva": respiracion de intensidad (sin escalar la imagen, que
     desalinearia la copia respecto al fondo) */
  @keyframes auraFade {
    0%,100% { opacity: 0.9; }
    50% { opacity: 1; }
  }
  /* Contador de oro (área calibrada, alineado a la derecha) */
  .gold-text {
    position: absolute;
    display: flex; align-items: center; justify-content: flex-end;
    font-family: 'ChelseaMarket', cursive;
    color: #f0d890;
    text-shadow: -1px -1px 0 #20140a, 1px -1px 0 #20140a,
                 -1px 1px 0 #20140a, 1px 1px 0 #20140a;
    pointer-events: none; z-index: 20;
    white-space: nowrap;
  }
  .gold-text img {
    height: 100%;
    object-fit: contain;
    margin-right: 0.1em;
  }
  #avatar {
    position: absolute;
    z-index: 12;
    pointer-events: none;
    display: none;
  }
  #avatar img {
    width: 100%; height: 100%;
    object-fit: contain;
    filter: drop-shadow(2px 2px 8px rgba(0,0,0,0.8));
    position: relative;
    z-index: 2;
  }
  #avatar::before {
    content: '';
    position: absolute;
    top: -20%; left: -20%;
    width: 140%; height: 140%;
    z-index: 1;
    background: radial-gradient(ellipse 60% 80% at 40% 35%, rgba(255, 240, 180, 0.5) 0%, rgba(232, 180, 80, 0.3) 30%, rgba(180, 120, 40, 0.1) 55%, transparent 75%);
    border-radius: 48% 52% 55% 45% / 60% 40% 55% 45%;
    box-shadow:
      0 0 20px 8px rgba(255, 200, 80, 0.3),
      0 0 40px 15px rgba(232, 160, 60, 0.2),
      0 0 60px 25px rgba(200, 120, 30, 0.1);
    animation: auraPulse 1.8s ease-in-out infinite;
  }
  @keyframes auraPulse {
    0%, 100% {
      box-shadow:
        0 0 20px 8px rgba(255, 200, 80, 0.3),
        0 0 40px 15px rgba(232, 160, 60, 0.2),
        0 0 60px 25px rgba(200, 120, 30, 0.1);
      transform: scale(1) rotate(0deg);
      border-radius: 48% 52% 55% 45% / 60% 40% 55% 45%;
    }
    33% {
      box-shadow:
        0 0 25px 10px rgba(255, 220, 100, 0.4),
        0 0 50px 20px rgba(232, 180, 80, 0.25),
        0 0 70px 30px rgba(200, 140, 50, 0.15);
      transform: scale(1.08) rotate(2deg);
      border-radius: 55% 45% 48% 52% / 50% 55% 45% 50%;
    }
    66% {
      box-shadow:
        0 0 22px 9px rgba(255, 210, 90, 0.35),
        0 0 45px 18px rgba(232, 170, 70, 0.22),
        0 0 65px 28px rgba(200, 130, 40, 0.12);
      transform: scale(1.04) rotate(-1deg);
      border-radius: 45% 55% 52% 48% / 55% 48% 52% 45%;
    }
  }
  #hud {
    position: absolute; top: 12px; left: 12px; z-index: 20;
    background: rgba(0,0,0,0.7); padding: 8px 14px;
    border-radius: 4px; font-family: 'ChelseaMarket', cursive;
    font-size: 0.8em; color: #aaa; line-height: 1.7;
  }
  #hud .key { color: #fc4; }
  #hud b { color: #0ff; }
  #hud .green { color: #0f0; }
  #lang-bar {
    position: absolute; bottom: 12px; right: 12px; z-index: 20;
    background: rgba(0,0,0,0.7); padding: 6px 12px;
    border-radius: 4px; font-family: 'ChelseaMarket', cursive;
    font-size: 0.8em; color: #aaa;
  }
  #lang-bar select {
    background: #1a1a2e; color: #e0e0e0;
    border: 1px solid #555; border-radius: 3px;
    padding: 2px 6px; font-size: 0.9em; cursor: pointer;
  }
  #back-btn {
    position: absolute; bottom: 12px; left: 12px; z-index: 20;
    font-family: 'ChelseaMarket', cursive;
    font-size: 1em; color: #e8d4a8;
    padding: 8px 24px;
    background: linear-gradient(180deg, rgba(60, 42, 20, 0.9), rgba(35, 24, 10, 0.95));
    border: 2px solid rgba(180, 150, 80, 0.5);
    border-radius: 8px; cursor: pointer;
    box-shadow: 0 4px 0 rgba(20, 12, 4, 0.8), 0 6px 10px rgba(0,0,0,0.5);
    text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
    transition: all 0.15s ease;
  }
  #back-btn:hover {
    background: linear-gradient(180deg, rgba(80, 58, 28, 0.9), rgba(50, 34, 14, 0.95));
    border-color: rgba(232, 212, 168, 0.7); color: #fff8e0;
  }
  #back-btn:active { transform: translateY(3px); }
</style>
</head>
<body>

<div id="loading-screen">
  <div class="title">RUNIKA 2D</div>
  <div id="loading-bar-bg"><div id="loading-bar"></div></div>
  <div id="loading-text">Cargando... 0%</div>
</div>

<div id="transition-overlay"></div>

<div id="stage">
  <img id="bg" src="/assets/mapamundi/mapamundi.webp" />
  <div id="overlay"></div>
  <div id="avatar"><img src="" alt="" /></div>
</div>

<div id="hud">
  <b>Mapamundi</b><br>
  <span class="key">Flechas</span> = mover entre mundos con camino<br>
  <span class="green">Verde</span> = mundo accesible<br>
  <span class="key">Enter</span> = entrar al mundo<br>
  <span class="key">ESC</span> = volver al menu<br>
  <br>
  <span id="pos-info" style="color:#0f0">Mundo: --</span>
</div>

<button id="back-btn" data-i18n="instructions.back"></button>

<div id="lang-bar">
  <select id="lang-select">
    <option value="es">Español</option>
    <option value="en">English</option>
    <option value="fr">Français</option>
    <option value="de">Deutsch</option>
    <option value="it">Italiano</option>
  </select>
</div>

<script src="/assets-cache.js"></script>
<script>
  let translations = {};
  let fallback = {};

  const WORLD_ORDER = ['ESPACIO', 'AGUA', 'TIERRA', 'FUEGO', 'HIELO', 'VIENTO', 'INFRAMUNDO', 'MAZMORRA'];
  const FINAL_WORLD = 'MAZMORRA'; // centro del mapa: solo con todos los demás completados
  const LEVELS_PER_WORLD = 12;
  const DIRS = ['up', 'down', 'left', 'right'];

  let WORLD_POSITIONS = {};
  let WORLD_AVATAR_POS = {};
  let WORLD_PATHS = {};
  let FIN_AREAS = null; // assets/comunes/fin-areas.json: auras irregulares por mundo
  let avatarSize = 0.06;
  function worldAvatarIdx(w) { return WORLD_ORDER.indexOf(w); }
  function avatarPos(w) { const i = worldAvatarIdx(w); return (WORLD_AVATAR_POS[w] && WORLD_AVATAR_POS[w][i]) || WORLD_POSITIONS[w]; }
  function worldSize(w) { const i = worldAvatarIdx(w); return (WORLD_AVATAR_POS[w] && WORLD_AVATAR_POS[w][i] && WORLD_AVATAR_POS[w][i].size) || (WORLD_POSITIONS[w] && WORLD_POSITIONS[w].size) || avatarSize; }

  // Estado de la partida (bbdd): avatar elegido, oro, progreso por mundo
  let player = null;
  function playerAvatarSrc() {
    const idx = (player && typeof player.avatarIndex === 'number') ? player.avatarIndex : 0;
    return `/assets/avatars/display/avatar_${String(idx + 1).padStart(2, '0')}.webp`;
  }
  function worldCompleted(w) {
    return ((player?.worldProgress?.[w]?.completed?.length) ?? 0) >= LEVELS_PER_WORLD;
  }
  function worldLocked(w) {
    if (worldCompleted(w)) return true;      // completado = vencido, no se re-entra
    if (w !== FINAL_WORLD) return false;
    return !WORLD_ORDER.filter(x => x !== FINAL_WORLD).every(worldCompleted);
  }
  async function loadPlayer() {
    try {
      const r = await fetch('/api/savegame');
      if (r.ok) { const d = await r.json(); player = d.player || null; }
    } catch {}
  }
  function saveMapPosition() {
    fetch('/api/map-position', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ world: WORLD_ORDER[selectedWorld] }),
    }).catch(() => {});
  }
  // Al volver al mapa, el avatar aparece en el último mundo guardado
  function restoreLastWorld() {
    const lw = player?.lastWorld;
    const idx = lw ? WORLD_ORDER.indexOf(lw) : -1;
    if (idx >= 0) selectedWorld = idx;
  }

  let selectedWorld = 0; // ESPACIO por defecto; luego manda player.lastWorld

  async function loadLang(lang) {
    const r = await fetch('/api/i18n' + (lang ? '/' + lang : ''));
    if (!r.ok) return {};
    return await r.json();
  }
  function t(key) { return translations[key] ?? fallback[key] ?? key; }

  function applyI18n() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
      el.textContent = t(el.getAttribute('data-i18n'));
    });
  }

  const bg = document.getElementById('bg');
  const overlay = document.getElementById('overlay');
  const avatarEl = document.getElementById('avatar');
  const avatarImg = avatarEl.querySelector('img');

  function getImgRect() { return bg.getBoundingClientRect(); }
  // Rect de la imagen dibujada (descuenta el letterbox de object-fit: contain);
  // los textos calibrados (text-areas.json) viven en ese espacio.
  function imageRect() {
    const er = getImgRect();
    const iw = bg.naturalWidth || 1536, ih = bg.naturalHeight || 1024;
    const s = Math.min(er.width / iw, er.height / ih);
    const w = iw * s, h = ih * s;
    return { left: er.left + (er.width - w) / 2, top: er.top + (er.height - h) / 2, width: w, height: h };
  }

  function render() {
    const r = getImgRect();
    overlay.innerHTML = '';
    const world = WORLD_ORDER[selectedWorld];
    const paths = WORLD_PATHS[world] || {};

    WORLD_ORDER.forEach((w, i) => {
      const pos = WORLD_POSITIONS[w];
      if (!pos) return;
      const sz = worldSize(w) * r.width;

      // Máscara visual: completado (B/N) o mundo central bloqueado.
      // Copia gris del mapa con mascara organica: nucleo difuminado +
      // un blob suave en cada vertice irregular del aura calibrada
      // (determinista por mundo). Sin clip-path: cero bordes duros.
      if (worldLocked(w) && !worldCompleted(w)) { // solo lo bloqueado se oscurece; lo completado queda a color
        const fx = document.createElement('img');
        fx.src = document.getElementById('bg').src;
        fx.className = 'world-fx locked';
        fx.style.left = r.left + 'px';
        fx.style.top = r.top + 'px';
        fx.style.width = r.width + 'px';
        fx.style.height = r.height + 'px';
        const circ = FIN_AREAS?.aura?.[w];
        const grads = [];
        const grad = (px, py, rr, solid, fade) =>
          `radial-gradient(circle ${rr.toFixed(1)}px at ${px.toFixed(1)}px ${py.toFixed(1)}px, #000 ${solid}%, transparent ${fade}%)`;
        if (circ && circ.r > 0) {
          const coreR = circ.r * r.width * 1.05;
          const blobR = coreR * 0.55;
          grads.push(grad(circ.cx * r.width, circ.cy * r.height, coreR, 60, 88));
          for (const p of AssetsCache.auraPoints(circ.cx, circ.cy, circ.r, w, r.width / r.height)) {
            grads.push(grad(p[0] * r.width, p[1] * r.height, blobR, 45, 82));
          }
        } else {
          grads.push(grad(pos.x * r.width, pos.y * r.height, sz * 1.2, 55, 90));
        }
        fx.style.webkitMaskImage = grads.join(',');
        fx.style.maskImage = fx.style.webkitMaskImage;
        overlay.appendChild(fx);
      }

      const div = document.createElement('div');
      let cls = 'world-marker';
      if (i === selectedWorld) cls += ' selected';
      // Es alcanzable desde el mundo actual?
      if (DIRS.some(d => paths[d] === w)) cls += ' reachable';
      div.className = cls;
      div.style.left = (r.left + pos.x * r.width - sz / 2) + 'px';
      div.style.top = (r.top + pos.y * r.height - sz / 2) + 'px';
      div.style.width = sz + 'px';
      div.style.height = sz + 'px';

      const dot = document.createElement('div');
      dot.className = 'dot';
      div.appendChild(dot);

      div.addEventListener('click', () => {
        // Solo permitir si es alcanzable desde el mundo actual
        const dir = DIRS.find(d => paths[d] === w);
        if (!dir) return;
        // Mundo completado o bloqueado: no se puede entrar
        if (worldLocked(w)) { bounceAvatar(dir); return; }
        // Mover el avatar primero, luego entrar al submundo
        moveByPath(dir);
        const world = WORLD_ORDER[selectedWorld];
        saveMapPosition();
        // Esperar a que termine el movimiento antes de entrar
        const r = getImgRect();
        const pos = avatarPos(w);
        const sz = worldSize(w) * r.width;
        const oldX = parseFloat(avatarEl.style.left) || 0;
        const oldY = parseFloat(avatarEl.style.top) || 0;
        const newX = r.left + pos.x * r.width - sz / 2;
        const newY = r.top + pos.y * r.height - sz / 2;
        const dist = Math.hypot(newX - oldX, newY - oldY);
        const speed = 800;
        const duration = Math.max(0.3, Math.min(1.5, dist / speed));
        setTimeout(() => {
          AssetsCache.transitionTo('/submundo.html?world=' + encodeURIComponent(world));
        }, duration * 1000 + 100);
      });

      overlay.appendChild(div);
    });

    // Oro acumulado (área calibrada, alineado a la derecha con moneda)
    if (GOLD_AREA && player) {
      const ir = imageRect();
      const goldEl = document.createElement('div');
      goldEl.className = 'gold-text';
      goldEl.style.left = (ir.left + GOLD_AREA.x * ir.width) + 'px';
      goldEl.style.top = (ir.top + GOLD_AREA.y * ir.height) + 'px';
      goldEl.style.width = (GOLD_AREA.w * ir.width) + 'px';
      goldEl.style.height = (GOLD_AREA.h * ir.height) + 'px';
      goldEl.style.fontSize = Math.max(10, GOLD_AREA.h * ir.height * 0.62 * (GOLD_AREA.fontScale || 1)) + 'px';
      goldEl.style.paddingRight = (ir.width * 0.01) + 'px';
      const coin = document.createElement('img');
      coin.src = AssetsCache.getCachedImageUrl('/assets/comunes/monedas.webp');
      coin.alt = '';
      goldEl.appendChild(coin);
      goldEl.appendChild(document.createTextNode(String(player.gold ?? 0)));
      overlay.appendChild(goldEl);
    }

    // Mostrar avatar siempre (el elegido en la seleccion de personaje)
    const pos = avatarPos(world);
    if (pos) {
      const src = playerAvatarSrc();
      avatarImg.src = AssetsCache.getCachedImageUrl(src);
      avatarImg.alt = world;
      avatarImg.onerror = () => {
        avatarImg.src = src;
      };
      avatarEl.style.display = 'block';
      const asz = worldSize(world) * r.width;
      const newX = r.left + pos.x * r.width - asz / 2;
      const newY = r.top + pos.y * r.height - asz / 2;
      // Calcular duracion segun distancia para velocidad constante
      const oldX = parseFloat(avatarEl.style.left) || newX;
      const oldY = parseFloat(avatarEl.style.top) || newY;
      const dist = Math.hypot(newX - oldX, newY - oldY);
      const speed = 800; // px por segundo
      const duration = Math.max(0.3, Math.min(1.5, dist / speed));
      avatarEl.style.transition = 'left ' + duration + 's linear, top ' + duration + 's linear, width ' + duration + 's linear, height ' + duration + 's linear';
      avatarEl.style.left = newX + 'px';
      avatarEl.style.top = newY + 'px';
      avatarEl.style.width = asz + 'px';
      avatarEl.style.height = asz + 'px';
    }

    document.getElementById('pos-info').textContent = 'Mundo: ' + world;
  }

  let isMoving = false;

  // Desbloquear audio al primer gesto
  AssetsCache.unlockAudio();
  document.addEventListener('click', () => AssetsCache.unlockAudio(), { once: true });
  document.addEventListener('keydown', () => AssetsCache.unlockAudio(), { once: true });

  function moveByPath(dir) {
    if (isMoving) return; // Bloquear mientras se mueve
    const world = WORLD_ORDER[selectedWorld];
    const paths = WORLD_PATHS[world];
    if (!paths || !paths[dir]) {
      bounceAvatar(dir);
      return;
    }
    const targetWorld = paths[dir];
    const targetIdx = WORLD_ORDER.indexOf(targetWorld);
    if (targetIdx < 0) return;
    selectedWorld = targetIdx;
    AssetsCache.playSound('/assets/sounds/comun/move.wav', 0.5);
    isMoving = true;
    render();
    // Calcular duracion segun distancia para velocidad constante
    const r = getImgRect();
    const pos = avatarPos(targetWorld);
    const sz = worldSize(targetWorld) * r.width;
    const oldX = parseFloat(avatarEl.style.left) || 0;
    const oldY = parseFloat(avatarEl.style.top) || 0;
    const newX = r.left + pos.x * r.width - sz / 2;
    const newY = r.top + pos.y * r.height - sz / 2;
    const dist = Math.hypot(newX - oldX, newY - oldY);
    const speed = 800;
    const duration = Math.max(0.3, Math.min(1.5, dist / speed));
    setTimeout(() => { isMoving = false; }, duration * 1000);
  }

  function bounceAvatar(dir) {
    const offsets = { up: [0, -0.08], down: [0, 0.08], left: [-0.08, 0], right: [0.08, 0] };
    const [dx, dy] = offsets[dir];
    const r = getImgRect();
    const world = WORLD_ORDER[selectedWorld];
    const sz = worldSize(world) * r.width;
    const pos = avatarPos(world);
    if (!pos) return;
    const baseX = r.left + pos.x * r.width - sz / 2;
    const baseY = r.top + pos.y * r.height - sz / 2;
    // Limitar el rebote para no salir de la imagen
    const bounceX = Math.max(r.left, Math.min(r.right - sz, baseX + dx * r.width));
    const bounceY = Math.max(r.top, Math.min(r.bottom - sz, baseY + dy * r.height));

    // Quitar transicion temporalmente para el primer salto
    avatarEl.style.transition = 'left 0.15s ease-out, top 0.15s ease-out';
    avatarEl.style.left = bounceX + 'px';
    avatarEl.style.top = bounceY + 'px';
    AssetsCache.playSound('/assets/sounds/comun/choque.wav', 0.7);

    // Volver con rebote elastico
    setTimeout(() => {
      avatarEl.style.transition = 'left 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), top 0.3s cubic-bezier(0.34, 1.56, 0.64, 1)';
      avatarEl.style.left = baseX + 'px';
      avatarEl.style.top = baseY + 'px';
      // Restaurar transicion normal
      setTimeout(() => {
        avatarEl.style.transition = 'left 0.5s ease, top 0.5s ease';
      }, 350);
    }, 150);
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { AssetsCache.playSound('/assets/sounds/comun/back.wav', 0.6); AssetsCache.transitionTo('/menu.html'); return; }

    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { e.preventDefault(); moveByPath('left'); }
    else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { e.preventDefault(); moveByPath('right'); }
    else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') { e.preventDefault(); moveByPath('up'); }
    else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') { e.preventDefault(); moveByPath('down'); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      const world = WORLD_ORDER[selectedWorld];
      // Mundo completado o bloqueado: rebote, no se entra
      if (worldLocked(world)) { bounceAvatar('down'); return; }
      AssetsCache.playSound('/assets/sounds/comun/press.wav', 0.6);
      saveMapPosition();
      AssetsCache.transitionTo('/submundo.html?world=' + encodeURIComponent(world));
    }
  });

  document.getElementById('back-btn').addEventListener('click', () => {
    AssetsCache.playSound('/assets/sounds/comun/back.wav', 0.6);
    AssetsCache.transitionTo('/menu.html');
  });

  document.getElementById('lang-select').addEventListener('change', async (e) => {
    AssetsCache.setSetting('lang', e.target.value);
    translations = await loadLang(e.target.value);
    applyI18n();
    render();
  });

  async function loadPositions() {
    try {
      const r = await fetch('/api/load-avatar-positions');
      if (r.ok) {
        const data = await r.json();
        if (data.positions) Object.assign(WORLD_POSITIONS, data.positions);
        if (data.avatars) WORLD_AVATAR_POS = data.avatars;
        if (data.avatarSize) avatarSize = data.avatarSize;
      }
    } catch {}
    WORLD_ORDER.forEach(w => {
      if (!WORLD_POSITIONS[w]) WORLD_POSITIONS[w] = { x: 0.5, y: 0.5 };
    });
  }

  async function loadFinAreas() {
    try {
      const r = await fetch('/api/load-fin-areas');
      if (r.ok) FIN_AREAS = await r.json();
    } catch {}
  }

  async function loadPaths() {
    try {
      const r = await fetch('/api/load-world-paths');
      if (r.ok) {
        const data = await r.json();
        if (data.paths) Object.assign(WORLD_PATHS, data.paths);
      }
    } catch {}
    WORLD_ORDER.forEach(w => {
      if (!WORLD_PATHS[w]) WORLD_PATHS[w] = { up: null, down: null, left: null, right: null };
    });
  }

  let GOLD_AREA = null;
  async function loadTextAreas() {
    try {
      const r = await fetch('/api/load-mapamundi-text-areas');
      if (r.ok) {
        const data = await r.json();
        if (data.areas?.gold) GOLD_AREA = data.areas.gold;
      }
    } catch {}
  }

  // Pista forzada por la pantalla anterior (p.ej. victoria de mundo):
  // se consume una sola vez y retoma su posicion guardada.
  function consumeMusicOverride() {
    const ov = sessionStorage.getItem('runika-music-override');
    if (ov) { sessionStorage.removeItem('runika-music-override'); AssetsCache.setMusicTrack(ov); }
    else AssetsCache.setMusicTrack(AssetsCache.MUSIC.main);
  }

  (async () => {
    if (sessionStorage.getItem('runika-session') === 'active') {
      // Ya en sesion, ir directo
      await AssetsCache.loadSettings();
      consumeMusicOverride();
      fallback = await loadLang('es');
      translations = await loadLang();
      applyI18n();
      await loadPlayer();
      restoreLastWorld();
      await loadPositions();
      await loadPaths();
      await loadTextAreas();
      await loadFinAreas();
      render();
      AssetsCache.hideLoading();
      setTimeout(() => AssetsCache.transitionIn(), 100);
      return;
    }

    AssetsCache.showLoading();
    const loadingBar = document.getElementById('loading-bar');
    const loadingText = document.getElementById('loading-text');

    await AssetsCache.preloadAll((loaded, total) => {
      const pct = Math.round((loaded / total) * 100);
      loadingBar.style.width = pct + '%';
      loadingText.textContent = 'Cargando... ' + pct + '%';
    });

    await AssetsCache.loadSettings();
    consumeMusicOverride();
    fallback = await loadLang('es');
    translations = await loadLang();
    applyI18n();
    await loadPlayer();
    restoreLastWorld();
    await loadPositions();
    await loadPaths();
    await loadTextAreas();
    await loadFinAreas();
    render();

    AssetsCache.hideLoading();
    setTimeout(() => AssetsCache.transitionIn(), 500);
  })();

  bg.addEventListener('load', render);
  window.addEventListener('resize', render);
</script>

</body>
</html>
