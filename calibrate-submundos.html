<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calibrar posiciones de avatar en submundos</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; background: #000; overflow: hidden;
    font-family: 'Courier New', monospace; color: #e0e0e0;
  }
  #stage {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  #image { width: 100%; height: 100%; object-fit: contain; display: block; }
  #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 12; pointer-events: none; }
  .marker {
    position: absolute; z-index: 12; pointer-events: none;
    border: 2px solid rgba(0, 255, 0, 0.75);
    border-radius: 50%;
    background: transparent;
  }
  .marker.active {
    border-color: #fc0;
    box-shadow: 0 0 20px rgba(255, 204, 0, 0.5);
    background: transparent;
  }
  .marker .tag {
    position: absolute; top: -22px; left: 50%;
    transform: translateX(-50%);
    font-size: 11px; padding: 2px 8px; border-radius: 2px;
    background: #0f0; color: #000; white-space: nowrap;
  }
  .marker.active .tag { background: #fc0; }
  #avatar-previews {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 13; pointer-events: none;
  }
  .phase-avatar {
    position: absolute;
    display: block;
    pointer-events: none;
    overflow: visible;
    transition: transform 0.15s ease, filter 0.15s ease;
  }
  .phase-avatar img {
    width: 100%; height: 100%; object-fit: contain;
    opacity: 0.9;
    image-rendering: auto;
    filter: drop-shadow(2px 2px 8px rgba(0,0,0,0.85));
  }
  .phase-avatar.selected {
    transform: scale(1.15);
    z-index: 2;
  }
  .phase-avatar.selected img {
    opacity: 1;
    filter: drop-shadow(0 0 8px rgba(255,210,80,0.95)) drop-shadow(2px 2px 8px rgba(0,0,0,0.85));
  }
  #hud {
    position: absolute; top: 12px; left: 12px; z-index: 20;
    background: rgba(0,0,0,0.75); padding: 10px 16px;
    border-radius: 4px; border: 1px solid rgba(126,200,227,0.3);
    font-size: 0.85em; line-height: 1.7;
  }
  #hud b { color: #0ff; }
  #hud .key { color: #fc4; }
  select {
    background: #1a1a2e; color: #e0e0e0;
    border: 1px solid #555; border-radius: 3px;
    padding: 4px 8px; font-size: 0.9em; cursor: pointer;
    margin: 2px 0;
  }
  #status {
    position: absolute; bottom: 12px; left: 50%;
    transform: translateX(-50%); z-index: 20;
    background: rgba(0,0,0,0.75); padding: 6px 16px;
    border-radius: 4px; font-size: 0.8em; color: #aaa;
  }
  #status .ok { color: #0f0; }
  #status .err { color: #f44; }
  #status .info { color: #fc4; }
</style>
</head>
<body>

<div id="stage">
  <img id="image" src="" />
  <div id="overlay"></div>
  <div id="avatar-previews"></div>
</div>

<div id="hud">
  <b>Calibrar posiciones de avatar</b><br>
  Submundo: <select id="world-select"></select><br>
  Nivel: <select id="level-select"></select><br>
  <br>
  <span class="key">Click</span> en el mapa = colocar avatar<br>
  <span class="key">Flechas</span> = mover (Shift = fino)<br>
  <span class="key">+ / -</span> = tamano del avatar<br>
  <span class="key">G</span> = guardar<br>
  <span class="key">C</span> = cargar<br>
  <br>
  <span id="coords" style="color:#0f0">Sin seleccion</span>
</div>

<div id="status">Elige submundo y nivel, click para colocar</div>

<script>
  const img = document.getElementById('image');
  const overlay = document.getElementById('overlay');
  const avatarPreviews = document.getElementById('avatar-previews');
  const coordsEl = document.getElementById('coords');
  const statusEl = document.getElementById('status');
  const worldSelect = document.getElementById('world-select');
  const levelSelect = document.getElementById('level-select');

  const WORLD_ORDER = ['ESPACIO', 'AGUA', 'TIERRA', 'FUEGO', 'HIELO', 'VIENTO', 'INFRAMUNDO', 'MAZMORRA'];
  const NUM_LEVELS = 12;
  const AVATAR_SIZE = 0.04;

  const WORLD_IMAGES = {
    ESPACIO: '/assets/submundos/ESPACIO/submundo-espacio.png?v=8k-v3',
    AGUA: '/assets/submundos/AGUA/submundo agua.png?v=8k-v3',
    TIERRA: '/assets/submundos/TIERRA/submundo tierra.png?v=8k-v3',
    FUEGO: '/assets/submundos/FUEGO/submundo fuego.png?v=8k-v3',
    HIELO: '/assets/submundos/HIELO/submundo hielo.png?v=8k-v3',
    VIENTO: '/assets/submundos/VIENTO/submundo viento.png?v=8k-v3',
    INFRAMUNDO: '/assets/submundos/INFRAMUNDO/submundo inframundo.png?v=8k-v3',
    MAZMORRA: '/assets/submundos/MAZMORRA/submundo inframundo.png?v=8k-v3',
  };

  const WORLD_AVATARS = {
    ESPACIO: '/assets/avatars/avatar_01.png',
    AGUA: '/assets/avatars/avatar_02.png',
    TIERRA: '/assets/avatars/avatar_03.png',
    FUEGO: '/assets/avatars/avatar_04.png',
    HIELO: '/assets/avatars/avatar_05.png',
    VIENTO: '/assets/avatars/avatar_06.png',
    INFRAMUNDO: '/assets/avatars/avatar_07.png',
    MAZMORRA: '/assets/avatars/avatar_08.png',
  };

  // positions[world][level] = { x, y }
  let positions = {};
  let avatarSizes = {};
  let avatarSize = 0.06;
  let selectedWorld = 0;
  let selectedLevel = 0;

  // Inicializar
  WORLD_ORDER.forEach(w => {
    positions[w] = {};
    avatarSizes[w] = 0.06;
    for (let i = 0; i < NUM_LEVELS; i++) {
      positions[w][i] = { x: 0.5, y: 0.5 };
    }
  });

  // Llenar selects
  WORLD_ORDER.forEach((w, i) => {
    const opt = document.createElement('option');
    opt.value = i; opt.textContent = w;
    worldSelect.appendChild(opt);
  });
  for (let i = 0; i < NUM_LEVELS; i++) {
    const opt = document.createElement('option');
    opt.value = i; opt.textContent = 'Nivel ' + (i + 1);
    levelSelect.appendChild(opt);
  }

  worldSelect.addEventListener('change', (e) => {
    selectedWorld = parseInt(e.target.value);
    avatarSize = avatarSizes[WORLD_ORDER[selectedWorld]] || 0.06;
    img.src = WORLD_IMAGES[WORLD_ORDER[selectedWorld]];
    render(); updateCoords();
  });

  levelSelect.addEventListener('change', (e) => {
    selectedLevel = parseInt(e.target.value);
    render(); updateCoords();
  });

  function getImgRect() { return img.getBoundingClientRect(); }

  function render() {
    overlay.innerHTML = '';
    const r = getImgRect();
    const sz = avatarSize * r.width;
    const world = WORLD_ORDER[selectedWorld];

    // Marcadores de todos los niveles del submundo actual
    for (let i = 0; i < NUM_LEVELS; i++) {
      const pos = positions[world][i];
      const div = document.createElement('div');
      div.className = 'marker' + (i === selectedLevel ? ' active' : '');
      div.style.left = (r.left + pos.x * r.width - sz / 2) + 'px';
      div.style.top = (r.top + pos.y * r.height - sz / 2) + 'px';
      div.style.width = sz + 'px';
      div.style.height = sz + 'px';
      const tag = document.createElement('div');
      tag.className = 'tag';
      tag.textContent = (i + 1);
      div.appendChild(tag);
      overlay.appendChild(div);
    }

    // Mostrar un avatar de referencia en cada una de las 12 fases.
    // Se usa avatar_01 para todas, facilitando comparar las posiciones.
    avatarPreviews.innerHTML = '';
    for (let i = 0; i < NUM_LEVELS; i++) {
      const pos = positions[world][i];
      const preview = document.createElement('div');
      preview.className = 'phase-avatar' + (i === selectedLevel ? ' selected' : '');
      preview.style.left = (r.left + pos.x * r.width - sz / 2) + 'px';
      preview.style.top = (r.top + pos.y * r.height - sz / 2) + 'px';
      preview.style.width = sz + 'px';
      preview.style.height = sz + 'px';
      const avatarImg = document.createElement('img');
      avatarImg.src = '/assets/avatars/avatar_01.png';
      avatarImg.alt = 'Nivel ' + (i + 1);
      preview.appendChild(avatarImg);
      avatarPreviews.appendChild(preview);
    }
  }

  function updateCoords() {
    const world = WORLD_ORDER[selectedWorld];
    const pos = positions[world][selectedLevel];
    coordsEl.textContent = world + ' N' + (selectedLevel + 1) + ': x=' + pos.x.toFixed(4) + ' y=' + pos.y.toFixed(4) + ' sz=' + avatarSize.toFixed(3);
  }

  // Click para colocar
  document.addEventListener('click', (e) => {
    if (e.target.closest('#hud') || e.target.closest('#status') || e.target.closest('select')) return;
    const r = getImgRect();
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) return;
    const x = (e.clientX - r.left) / r.width;
    const y = (e.clientY - r.top) / r.height;
    const world = WORLD_ORDER[selectedWorld];
    positions[world][selectedLevel] = { x, y };
    render(); updateCoords();
    statusEl.innerHTML = '<span class="ok">' + world + ' N' + (selectedLevel + 1) + ' = x=' + x.toFixed(3) + ' y=' + y.toFixed(3) + '</span>';
  });

  // Teclado
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'SELECT') return;
    const step = e.shiftKey ? 0.001 : 0.01;
    const world = WORLD_ORDER[selectedWorld];
    const pos = positions[world][selectedLevel];

    if (e.key === 'g' || e.key === 'G') { saveJson(); return; }
    if (e.key === 'c' || e.key === 'C') { loadJson(); return; }
    if (e.key === '+' || e.key === '=') { avatarSize = Math.min(0.1, avatarSize + 0.005); render(); updateCoords(); return; }
    if (e.key === '-' || e.key === '_') { avatarSize = Math.max(0.01, avatarSize - 0.005); render(); updateCoords(); return; }

    let changed = false;
    switch (e.key) {
      case 'ArrowLeft': pos.x = Math.max(0, pos.x - step); changed = true; break;
      case 'ArrowRight': pos.x = Math.min(1, pos.x + step); changed = true; break;
      case 'ArrowUp': pos.y = Math.max(0, pos.y - step); changed = true; break;
      case 'ArrowDown': pos.y = Math.min(1, pos.y + step); changed = true; break;
      default: return;
    }
    e.preventDefault();
    if (changed) { render(); updateCoords(); }
  });

  function saveJson() {
    const world = WORLD_ORDER[selectedWorld];
    avatarSizes[world] = avatarSize;
    const data = { world, positions: positions[world], avatarSize };
    const json = JSON.stringify(data, null, 2);
    fetch('/api/save-subworld-positions?world=' + encodeURIComponent(world), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: json
    }).then(() => {
      statusEl.innerHTML = '<span class="ok">Guardado: ' + world + ' (' + NUM_LEVELS + ' niveles)</span>';
    }).catch(() => {
      statusEl.innerHTML = '<span class="err">Error al guardar</span>';
    });
  }

  async function loadJson() {
    try {
      const r = await fetch('/api/load-subworld-positions?world=' + encodeURIComponent(WORLD_ORDER[selectedWorld]));
      if (!r.ok) throw new Error();
      const data = await r.json();
      const world = WORLD_ORDER[selectedWorld];
      if (data.positions) Object.assign(positions[world], data.positions);
      if (data.avatarSize) {
        avatarSizes[world] = data.avatarSize;
        avatarSize = data.avatarSize;
      }
      render(); updateCoords();
      statusEl.innerHTML = '<span class="ok">Cargado: ' + WORLD_ORDER[selectedWorld] + '</span>';
    } catch {
      statusEl.innerHTML = '<span class="err">No hay guardado para ' + WORLD_ORDER[selectedWorld] + '</span>';
    }
  }

  // Cargar todos los submundos al inicio
  async function loadAll() {
    for (const w of WORLD_ORDER) {
      try {
        const r = await fetch('/api/load-subworld-positions?world=' + encodeURIComponent(w));
        if (r.ok) {
          const data = await r.json();
          if (data.positions) Object.assign(positions[w], data.positions);
          if (data.avatarSize) avatarSizes[w] = data.avatarSize;
        }
      } catch {}
    }
  }

  img.addEventListener('load', () => {
    render();
    statusEl.innerHTML = '<span class="ok">Imagen cargada: ' + WORLD_ORDER[selectedWorld] + '</span>';
  });
  img.addEventListener('error', () => {
    statusEl.innerHTML = '<span class="err">No se pudo cargar la imagen de ' + WORLD_ORDER[selectedWorld] + '</span>';
  });

  (async () => {
    // Asignar la imagen antes de cargar los JSON para que nunca aparezca el lienzo vacío.
    img.src = WORLD_IMAGES[WORLD_ORDER[selectedWorld]];
    await loadAll();
    avatarSize = avatarSizes[WORLD_ORDER[selectedWorld]] || 0.06;
    render(); updateCoords();
  })();

  const avatarImg = document.getElementById('avatar-img');
  avatarImg.addEventListener('error', () => {
    statusEl.innerHTML = '<span class="err">No se pudo cargar el avatar de ' + WORLD_ORDER[selectedWorld] + '</span>';
  });
  window.addEventListener('resize', render);
</script>

</body>
</html>
