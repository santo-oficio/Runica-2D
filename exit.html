<!DOCTYPE html>
<html lang="es">
<head>
<script src="/web/webdb.js"></script>
<script src="/web/solver.bundle.js"></script>
<script src="/web/api-shim.js"></script>
<script src="/web/tizen.js"></script>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<title>Runika 2D</title>
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000; cursor: default;
  }
  #closed {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    background: #000; color: #333;
    font-family: 'ChelseaMarket', cursive; font-size: 0.9em;
  }
</style>
</head>
<body>
<div id="closed"></div>
<script>
  // Intentar cerrar la ventana
  try { window.close(); } catch {}
  // Si no se cerro, la pagina se queda en negro
  fetch('/api/i18n').then(r => r.json()).then(tr => {
    const d = document.getElementById('closed');
    d.textContent = tr['exit.closed'] || '';
  }).catch(() => {});
</script>
</body>
</html>
