<!DOCTYPE html>
<html lang="es">
<head>
<script src="/web/webdb.js"></script>
<script src="/web/solver.bundle.js"></script>
<script src="/web/api-shim.js"></script>
<script src="/web/tizen.js"></script>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Runika 2D</title>
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; background: #000; overflow: hidden;
    font-family: 'ChelseaMarket', cursive; user-select: none;
  }
  #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .scene { position: absolute; inset: 0; opacity: 0; transition: opacity .8s ease; }
  .scene.on { opacity: 1; }
  .bgimg { width: 100%; height: 100%; object-fit: contain; display: block; }

  /* --- Escena 1: el boss final --- */
  .sprite { position: absolute; object-fit: contain; pointer-events: none;
    filter: drop-shadow(3px 6px 10px rgba(0,0,0,.7)); }
  @keyframes bossHit { 0%,100%{transform:translate(0,0)} 20%{transform:translate(-9px,3px) rotate(-4deg)} 40%{transform:translate(8px,-4px) rotate(3deg)} 60%{transform:translate(-6px,2px) rotate(-2deg)} 80%{transform:translate(5px,-2px) rotate(2deg)} }
  @keyframes bossFall {
    0% { transform: rotate(0) translateY(0); filter: grayscale(0) brightness(1) drop-shadow(3px 6px 10px rgba(0,0,0,.7)); opacity: 1; }
    55% { transform: rotate(78deg) translateY(6%); filter: grayscale(.7) brightness(.75) drop-shadow(3px 6px 10px rgba(0,0,0,.7)); opacity: 1; }
    100% { transform: rotate(92deg) translateY(34%); filter: grayscale(1) brightness(.35); opacity: 0; }
  }

  @keyframes heroCelebrate {
    0%,100% { transform: translateY(0) rotate(0); }
    25% { transform: translateY(-16%) rotate(-8deg); }
    55% { transform: translateY(-14%) rotate(8deg); }
    80% { transform: translateY(-6%) rotate(0); }
  }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 40; }
  #vignette { position: absolute; inset: 0; pointer-events: none; z-index: 35; opacity: 0;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(180,20,10,.55) 100%); }

  /* --- Textos --- */
  .big-text {
    position: absolute; left: 50%; top: 38%; transform: translate(-50%,-50%);
    z-index: 50; text-align: center; pointer-events: none;
    font-size: clamp(30px, 8vh, 90px); color: #ffd54f;
    text-shadow: 0 0 18px rgba(255,180,60,.55), 3px 3px 0 #5a3410, -2px -2px 0 #5a3410, 2px -2px 0 #5a3410, -2px 2px 0 #5a3410;
    opacity: 0; width: 88%; line-height: 1.15;
  }
  .big-text.pop { animation: textPop .55s cubic-bezier(.2,1.6,.4,1) forwards; }
  @keyframes textPop { 0%{opacity:0;transform:translate(-50%,-50%) scale(.2)} 70%{transform:translate(-50%,-50%) scale(1.12)} 100%{opacity:1;transform:translate(-50%,-50%) scale(1)} }
  .sub-text {
    position: absolute; left: 50%; top: 52%; transform: translateX(-50%);
    z-index: 50; font-size: clamp(16px, 3.4vh, 36px); color: #f4e3b2;
    text-shadow: 2px 2px 0 #2a1a08; opacity: 0; transition: opacity .6s;
    pointer-events: none; white-space: nowrap;
  }
  .sub-text.on { opacity: 1; }
  #continue-hint {
    position: absolute; left: 50%; top: 46%; transform: translateX(-50%);
    z-index: 60; font-size: clamp(14px, 2.6vh, 28px); color: #ffe9a3;
    text-shadow: 2px 2px 0 #2a1a08; opacity: 0; pointer-events: none;
    text-align: center; width: 90%;
  }
  /* Gate de inicio: primer gesto del usuario = desbloquea el audio */
  #press-start {
    position: fixed; inset: 0; z-index: 200; background: #000;
    display: flex; align-items: center; justify-content: center;
    color: #ffe9a3; font-size: clamp(18px, 3.5vh, 40px);
    text-shadow: 2px 2px 0 #2a1a08; text-align: center; padding: 0 10%;
    animation: hintBlink 1.2s ease-in-out infinite; cursor: pointer;
  }
  #continue-hint.on { animation: hintBlink 1.1s ease-in-out infinite; }
  @keyframes hintBlink { 0%,100%{opacity:.25} 50%{opacity:1} }

  /* --- Escena 2: mapamundi que se derrumba --- */
  /* Copia gris del mapa recortada con la forma del aura y bordes
     difuminados (mask radial). Una img clonada, no backdrop-filter,
     porque el filtro de fondo no hereda la mascara. El transform-origin
     se fija en el centro del aura para que la "caida" sea puntual. */
  .world-fx {
    position: absolute; z-index: 9; pointer-events: none;
    background-size: contain; /* mismo fit que el fondo para alinear la copia */
    background-position: center; background-repeat: no-repeat;
    filter: grayscale(1) brightness(.5);
    transform: scale(.15); opacity: 0;
    transform-origin: center;
  }
  .world-fx.fall {
    transition: transform .55s cubic-bezier(.5,0,.9,.4), opacity .45s ease;
    transform: scale(1); opacity: 1;
    animation: auraFade 3.2s ease-in-out .7s infinite;
  }
  @keyframes auraFade {
    0%,100% { opacity: 0.9; }
    50% { opacity: 1; }
  }
  /* Paso del heroe entre casillas (hop corto) */
  @keyframes cellHop { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-18%)} }
  /* Derrumbe de la escena del tablero */
  .scene.crumble { animation: boardCrumble 1.6s ease-in forwards; }
  @keyframes boardCrumble {
    0%   { transform: translate(0,0) rotate(0); }
    15%  { transform: translate(-14px,8px) rotate(-.6deg); }
    30%  { transform: translate(12px,-9px) rotate(.7deg); }
    45%  { transform: translate(-10px,-7px) rotate(-.5deg); }
    60%  { transform: translate(8px,6px) rotate(.4deg); }
    75%  { transform: translate(-5px,14px) rotate(-.8deg); }
    100% { transform: translate(0,9vh) rotate(-2.5deg); opacity: 0; }
  }
  @keyframes shakeHard {
    0%,100%{transform:translate(0,0) rotate(0)}
    10%{transform:translate(-16px,9px) rotate(-.5deg)} 20%{transform:translate(14px,-10px) rotate(.5deg)}
    30%{transform:translate(-12px,-7px) rotate(-.4deg)} 40%{transform:translate(11px,8px) rotate(.4deg)}
    50%{transform:translate(-9px,-6px) rotate(-.3deg)} 60%{transform:translate(8px,5px) rotate(.3deg)}
    70%{transform:translate(-6px,4px) rotate(-.2deg)} 80%{transform:translate(5px,-3px) rotate(.2deg)}
    90%{transform:translate(-3px,2px) rotate(-.1deg)}
  }
  @keyframes shakeSoft {
    0%,100%{transform:translate(0,0)}
    20%{transform:translate(-7px,4px)} 40%{transform:translate(6px,-5px)}
    60%{transform:translate(-5px,-3px)} 80%{transform:translate(4px,3px)}
  }
  .shake-hard { animation: shakeHard .7s ease-out; }
  .shake-soft { animation: shakeSoft .45s ease-out; }
  @keyframes dustPuff { 0%{opacity:.85;transform:translate(-50%,-50%) scale(.3)} 100%{opacity:0;transform:translate(-50%,-50%) scale(1.6)} }
  .dust {
    position: absolute; z-index: 30; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, rgba(160,140,110,.8), rgba(120,100,75,.35) 60%, transparent 75%);
    animation: dustPuff 1s ease-out forwards;
  }

  /* --- Escena 3: final epico --- */
  #fx-canvas { position: absolute; inset: 0; z-index: 45; pointer-events: none; }
  .coin-rain { position: absolute; z-index: 44; pointer-events: none; object-fit: contain;
    animation: coinFall linear forwards; }
  @keyframes coinFall {
    0% { transform: translateY(-12vh) rotate(0deg); opacity: 1; }
    92% { opacity: 1; }
    100% { transform: translateY(112vh) rotate(700deg); opacity: 0; }
  }
  @keyframes raysPulse { 0%,100%{opacity:.5;transform:translate(-50%,-50%) scale(1) rotate(0deg)} 50%{opacity:.85;transform:translate(-50%,-50%) scale(1.06) rotate(3deg)} }
  #rays {
    position: absolute; left: 50%; top: 40%; width: 120vmax; height: 120vmax;
    transform: translate(-50%,-50%); z-index: 20; pointer-events: none; opacity: 0;
    background: conic-gradient(from 0deg,
      transparent 0deg 12deg, rgba(255,205,90,.16) 12deg 24deg,
      transparent 24deg 40deg, rgba(255,205,90,.12) 40deg 52deg,
      transparent 52deg 70deg, rgba(255,205,90,.16) 70deg 82deg,
      transparent 82deg 100deg, rgba(255,205,90,.12) 100deg 112deg,
      transparent 112deg 130deg, rgba(255,205,90,.16) 130deg 142deg,
      transparent 142deg 160deg, rgba(255,205,90,.12) 160deg 172deg,
      transparent 172deg 190deg, rgba(255,205,90,.16) 190deg 202deg,
      transparent 202deg 220deg, rgba(255,205,90,.12) 220deg 232deg,
      transparent 232deg 250deg, rgba(255,205,90,.16) 250deg 262deg,
      transparent 262deg 280deg, rgba(255,205,90,.12) 280deg 292deg,
      transparent 292deg 310deg, rgba(255,205,90,.16) 310deg 322deg,
      transparent 322deg 340deg, rgba(255,205,90,.12) 340deg 352deg,
      transparent 352deg 360deg);
    border-radius: 50%;
    transition: opacity 1.2s ease;
  }
  #rays.on { opacity: .9; animation: raysPulse 6s ease-in-out infinite; }
  .letter { display: inline-block; opacity: 0; transform: translateY(-40px) scale(.3); }
  .letter.pop { animation: letterPop .5s cubic-bezier(.2,1.8,.4,1) forwards; }
  @keyframes letterPop { to { opacity: 1; transform: translateY(0) scale(1); } }

  /* --- Escena 3 rediseñada: el héroe y los mundos restaurados --- */
  /* Cielo estrellado de fondo */
  .star { position: absolute; width: 2px; height: 2px; border-radius: 50%;
    background: #ffe9a3; animation: twinkle 3s ease-in-out infinite;
    pointer-events: none; z-index: 15; }
  @keyframes twinkle { 0%,100% { opacity: .12; } 50% { opacity: .85; } }
  /* El héroe emerge en el centro bajo el foco */
  #end-hero { position: absolute; left: 50%; top: 58%; height: 36vh;
    transform: translate(-50%,-50%); object-fit: contain; z-index: 25;
    pointer-events: none; opacity: 0;
    filter: drop-shadow(0 0 16px rgba(255,225,140,.9)) drop-shadow(0 0 46px rgba(255,170,60,.55)); }
  #end-hero.on { animation: heroRise .9s cubic-bezier(.2,1.5,.35,1) both,
    heroSway 3.4s ease-in-out 1s infinite alternate; }
  @keyframes heroRise {
    0% { opacity: 0; transform: translate(-50%,-40%) scale(.35); }
    100% { opacity: 1; transform: translate(-50%,-50%) scale(1); } }
  @keyframes heroSway { from { margin-top: -9px; } to { margin-top: 9px; } }
  /* Total de oro conseguido, bajo el texto de rejugabilidad */
  .end-gold { position: absolute; left: 50%; top: 89.5%; z-index: 30;
    transform: translate(-50%,-50%); display: flex; align-items: center; gap: .45em;
    font-family: 'ChelseaMarket', cursive; color: #ffd76a;
    font-size: clamp(18px, 2.7vh, 32px); white-space: nowrap;
    text-shadow: 0 0 14px rgba(255,190,60,.7), -2px -2px 0 #20140a,
      2px -2px 0 #20140a, -2px 2px 0 #20140a, 2px 2px 0 #20140a;
    opacity: 0; transition: opacity .9s ease; pointer-events: none; }
  .end-gold.on { opacity: 1; }
  .end-gold img { height: 1.5em; }
  /* Pedestal de luz bajo el héroe */
  #end-floor { position: absolute; left: 50%; top: 73%; width: 62vh; height: 12vh;
    transform: translate(-50%,-50%); z-index: 24; pointer-events: none;
    opacity: 0; transition: opacity 1.1s ease;
    background: radial-gradient(ellipse, rgba(255,210,110,.5), rgba(255,180,70,.14) 55%, transparent 75%); }
  #end-floor.on { opacity: 1; }
  /* Orbes de los mundos restaurados: vuelan y coronan al héroe en arco.
     El color del mundo va en `color` → el halo brilla con ese matiz */
  .orb { position: absolute; z-index: 26; pointer-events: none; border-radius: 50%;
    /* El vuelo va por WAAPI transform (compositado); left/top ya quedan en
       el destino — animar left/top repintaba cada frame en WebView de TV */
    box-shadow: 0 0 20px 5px currentColor; }
  .orbcore { width: 100%; height: 100%; border-radius: 50%; }
  .orb.set { animation: orbFloat 2.6s ease-in-out infinite alternate; }
  @keyframes orbFloat { from { transform: translateY(-7px); } to { transform: translateY(7px); } }

  /* Celebración del boss final (portada de bossWinFx de game.html):
     destello dorado, anillos expansivos, chispas, escombros y polvo */
  .win-flash{position:fixed;inset:0;z-index:64;pointer-events:none;animation:winFlash 1.1s ease-out forwards}
  @keyframes winFlash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
  .win-ring{position:fixed;width:120px;height:120px;border:4px solid rgba(255,210,90,.95);border-radius:50%;
    box-shadow:0 0 26px rgba(255,200,80,.85),inset 0 0 26px rgba(255,200,80,.5);
    animation:winRingOut 1.5s ease-out forwards;pointer-events:none;z-index:64}
  @keyframes winRingOut{0%{transform:scale(.15);opacity:1}100%{transform:scale(3.4);opacity:0}}
  .win-spark{position:fixed;border-radius:50%;background:radial-gradient(circle,#fff6c0,#ffc93c 60%,transparent);
    animation:winSparkFly 1.9s ease-out forwards;pointer-events:none;z-index:65}
  @keyframes winSparkFly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)}}
  .win-debris{position:fixed;z-index:66;pointer-events:none;
    background:radial-gradient(circle at 35% 28%,#9c8b74,#5b4a38 55%,#32271c);
    border-radius:42% 58% 55% 45%/48% 44% 56% 52%;
    box-shadow:inset -2px -3px 6px rgba(0,0,0,.55),0 3px 8px rgba(0,0,0,.45);
    animation:debrisFall var(--dur,1.2s) cubic-bezier(.55,.02,.9,.5) both}
  @keyframes debrisFall{0%{transform:translate(0,-30px) rotate(0);opacity:0}
    8%{opacity:1}88%{opacity:1}
    100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
  .win-dust{position:fixed;z-index:62;pointer-events:none;border-radius:50%;
    background:radial-gradient(circle,rgba(160,140,105,.6),transparent 70%);
    animation:winDustPuff 1s ease-out forwards}
  @keyframes winDustPuff{0%{transform:scale(.3);opacity:0}18%{opacity:1}100%{transform:scale(2.4);opacity:0}}
  /* El boss FINAL no cae gris como un guardián más: se sobrecarga de
     luz y estalla — desintegración dorada con anillos gigantes */
  @keyframes bossCharge {
    0%   { filter: brightness(1) drop-shadow(3px 6px 10px rgba(0,0,0,.7)); transform: scale(1); }
    30%  { filter: brightness(2.2) drop-shadow(0 0 18px rgba(255,200,80,.8)); transform: scale(1.08); }
    55%  { filter: brightness(4) drop-shadow(0 0 34px rgba(255,220,120,.95)); transform: scale(1.16) rotate(-2deg); }
    78%  { filter: brightness(6) drop-shadow(0 0 60px #fff); transform: scale(1.22) rotate(2deg); }
    100% { filter: brightness(9) drop-shadow(0 0 90px #fff); transform: scale(1.26); }
  }
  @keyframes bossExplode {
    0%   { opacity: 1; transform: scale(1.26); filter: brightness(9) drop-shadow(0 0 90px #fff); }
    40%  { opacity: .9; transform: scale(1.6); }
    100% { opacity: 0; transform: scale(2.2); }
  }
  .win-ring.big { width: 200px; height: 200px; border-width: 6px;
    animation: winRingBig 1.9s ease-out forwards; }
  @keyframes winRingBig { 0%{transform:scale(.1);opacity:1} 100%{transform:scale(5.2);opacity:0} }
  /* Foco cenital sobre el héroe vencedor: haz de luz + halo pulsante */
  .win-beam{position:fixed;z-index:14;pointer-events:none;
    background:linear-gradient(to bottom,rgba(255,232,160,.55),rgba(255,200,90,.14) 78%,transparent);
    clip-path:polygon(36% 0,64% 0,92% 100%,8% 100%);
    animation:beamIn .9s ease-out both}
  @keyframes beamIn{from{opacity:0}to{opacity:1}}
  .win-halo{position:fixed;z-index:14;pointer-events:none;border-radius:50%;
    background:radial-gradient(circle,rgba(255,214,120,.5) 0%,rgba(255,180,70,.2) 42%,transparent 70%);
    animation:heroGlow 2.4s ease-in-out infinite alternate}
  @keyframes heroGlow{from{opacity:.7;transform:scale(.96)}to{opacity:1;transform:scale(1.07)}}
  .hero-glow{filter:drop-shadow(0 0 12px rgba(255,225,140,.95)) drop-shadow(0 0 38px rgba(255,170,60,.6))!important}
  /* Carga del héroe: se enciende antes del golpe de luz */
  @keyframes heroCharge {
    0%   { filter: none; transform: scale(1); }
    55%  { filter: brightness(2) drop-shadow(0 0 16px rgba(255,220,120,.9)); transform: scale(1.1); }
    100% { filter: brightness(3.2) drop-shadow(0 0 32px #fff); transform: scale(1.2); }
  }
  /* Golpe definitivo: columna de luz que cae del cielo sobre el boss */
  .smite-beam{position:fixed;z-index:40;pointer-events:none;
    background:linear-gradient(to bottom,rgba(255,250,220,0) 0%,#fff 10%,#ffe9a0 55%,rgba(255,190,70,.95));
    clip-path:polygon(40% 0,60% 0,90% 100%,10% 100%);
    filter:drop-shadow(0 0 26px rgba(255,220,120,.95));
    transform-origin:top center;
    animation:smiteIn .22s ease-out forwards,smiteOut .8s ease .35s forwards}
  @keyframes smiteIn{from{opacity:0;transform:scaleY(.1) scaleX(.4)}to{opacity:1;transform:scaleY(1) scaleX(1)}}
  @keyframes smiteOut{to{opacity:0}}

  /* Rótulo "¡Guardián derrotado!" sobre el tablero */
  .down-title{
    position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);
    z-index:67;pointer-events:none;text-align:center;
    font-family:'ChelseaMarket',cursive;font-weight:bold;
    font-size:min(9vh,7vw);color:#ffd34e;line-height:1.1;
    text-shadow:3px 3px 0 #4a2c00,5px 5px 12px #000,
      0 0 22px rgba(255,180,0,.9),0 0 55px rgba(255,140,0,.6);
    -webkit-text-stroke:2px #2a1600;
    animation:bossDownPop 2.1s ease-out forwards;
  }
  @keyframes bossDownPop{
    0%{transform:translate(-50%,-50%) scale(.3);opacity:0}
    14%{transform:translate(-50%,-50%) scale(1.15);opacity:1}
    24%{transform:translate(-50%,-50%) scale(1)}
    78%{opacity:1}
    100%{transform:translate(-50%,-56%) scale(.95);opacity:0}
  }
  /* Fundido entre pantallas: nace en negro y transitionIn() lo revela
     cuando la escena está lista — cero destello de contenido a medias */
  #transition-overlay{position:fixed;inset:0;z-index:200;background:#000;opacity:1;pointer-events:auto}
</style>
</head>
<body>

<div id="stage">
  <!-- Escena 1: el boss final -->
  <div class="scene" id="scene-board">
    <img class="bgimg" id="board-bg" src="/assets/backgrounds/MAZMORRA/bg_01.webp">
    <img class="sprite" id="boss-img" src="/assets/bosses/display/MAZMORRA/boss_MAZMORRA.webp">
    <img class="sprite" id="hero-img">
  </div>
  <!-- Escena 2: mapamundi -->
  <div class="scene" id="scene-map">
    <img class="bgimg" src="/assets/mapamundi/mapamundi.16x9.webp?v=mm16-1">
    <div id="map-overlay" style="position:absolute;inset:0;pointer-events:none"></div>
  </div>
  <!-- Escena 3: final -->
  <div class="scene" id="scene-end">
    <div id="rays"></div>
    <div id="end-floor"></div>
    <img class="sprite" id="end-hero">
  </div>
</div>

<div id="press-start"></div>
<div id="vignette"></div>
<div id="flash"></div>
<canvas id="fx-canvas"></canvas>
<div class="big-text" id="big-text"></div>
<div id="transition-overlay"></div>
<div class="sub-text" id="sub-text"></div>
<div id="continue-hint"></div>

<script src="/assets-cache.js"></script>
<script>
'use strict';

// ---------- Datos ----------
const WORLD_ORDER = ['ESPACIO', 'AGUA', 'TIERRA', 'FUEGO', 'HIELO', 'VIENTO', 'INFRAMUNDO', 'MAZMORRA'];
let translations = {}, fallback = {}, player = null;
let WORLD_POSITIONS = {}, WORLD_AVATAR_POS = {}, avatarSize = 0.06;
let FIN_AREAS = null; // assets/comunes/fin-areas.json (calibrate-fin.html)
let avatarIdx = 0;
// Estado del tablero al vencer (lo guarda game.html): casillas del
// héroe (en el tesoro) y del boss + oro total — la cinemática retoma
// la partida tal cual, como continuación, no como escena nueva
let finalState = null;
try {
  finalState = JSON.parse(sessionStorage.getItem('runika-final-state'));
  sessionStorage.removeItem('runika-final-state');
} catch { finalState = null; }
function avatarPos(w) { return (WORLD_AVATAR_POS[w] && WORLD_AVATAR_POS[w][avatarIdx]) || WORLD_POSITIONS[w]; }
function worldSize(w) { return (WORLD_AVATAR_POS[w] && WORLD_AVATAR_POS[w][avatarIdx] && WORLD_AVATAR_POS[w][avatarIdx].size) || (WORLD_POSITIONS[w] && WORLD_POSITIONS[w].size) || avatarSize; }
let scene = 0, busy = false;

function tt(key, ...args) {
  let s = translations[key] ?? fallback[key] ?? key;
  args.forEach((a, i) => { s = s.replaceAll('{' + i + '}', String(a)); });
  return s;
}
async function loadLang(lang) {
  try { const r = await fetch('/api/i18n' + (lang ? '/' + lang : '')); if (r.ok) return await r.json(); } catch {}
  return {};
}
function getImgRect(img) {
  const nw = img.naturalWidth || 0, nh = img.naturalHeight || 0;
  if (!nw || !nh) return { left: 0, top: 0, width: innerWidth, height: innerHeight };
  const cs = getComputedStyle(img);
  if (cs.objectFit === 'fill') return { left: 0, top: 0, width: innerWidth, height: innerHeight };
  const s = cs.objectFit === 'cover'
    ? Math.max(innerWidth / nw, innerHeight / nh)
    : Math.min(innerWidth / nw, innerHeight / nh);
  const w = nw * s, h = nh * s;
  const pos = (cs.objectPosition || '50% 50%').trim().split(/\s+/);
  const ox = (parseFloat(pos[0]) || 50) / 100, oy = (parseFloat(pos[1] ?? pos[0]) || 50) / 100;
  return { left: (innerWidth - w) * ox, top: (innerHeight - h) * oy, width: w, height: h };
}
function snd(url, vol) { return AssetsCache.playSound(url, vol ?? 0.6); }
// Fundido de salida para rumbles largos: evita cortes en seco cuando el
// clip sobrevive a la animación que lo acompaña
function fadeOutSnd(a, sec) {
  if (!a) return;
  const v0 = a.volume;
  const iv = setInterval(() => {
    a.volume = Math.max(0, a.volume - v0 / 24);
    if (a.volume <= 0 || a.paused) { clearInterval(iv); a.pause(); }
  }, sec * 1000 / 24);
}
function sndFading(url, vol, fadeSec = 2.5) {
  const a = snd(url, vol);
  if (!a) return null;
  const arm = () => {
    if (!isFinite(a.duration) || a.duration <= fadeSec) return;
    setTimeout(() => fadeOutSnd(a, fadeSec), (a.duration - fadeSec) * 1000);
  };
  if (a.readyState >= 1) arm(); else a.addEventListener('loadedmetadata', arm, { once: true });
  return a;
}
let boardRumble = null; // rumble del tablero para silenciarlo al caer MAZMORRA
let finalRumble = null; // derrumbe_final: se funde al entrar la escena final

// ---------- Canvas de particulas ----------
const canvas = document.getElementById('fx-canvas');
const ctx = canvas.getContext('2d');
let particles = [], rafFx = null;
function resizeFx() { canvas.width = innerWidth; canvas.height = innerHeight; }
window.addEventListener('resize', resizeFx); resizeFx();
function fxLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles = particles.filter(p => p.life > 0);
  for (const p of particles) {
    p.life -= 1; p.x += p.vx; p.y += p.vy; p.vy += p.g;
    if (p.spark) { p.vx *= .985; p.vy *= .985; }
    const a = Math.max(0, p.life / p.maxLife);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (p.grow ? (1 + (1 - a) * 2) : 1), 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  rafFx = requestAnimationFrame(fxLoop);
}
function burst(x, y, n, color, speed, opts = {}) {
  for (let i = 0; i < n; i++) {
    const ang = Math.random() * Math.PI * 2, sp = speed * (0.4 + Math.random());
    particles.push({
      x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - (opts.up || 0),
      g: opts.g ?? 0.12, life: maxLife(opts.life ?? 50), maxLife: opts.life ?? 50,
      size: opts.size ?? (2 + Math.random() * 3), color: Array.isArray(color) ? color[i % color.length] : color,
      spark: !!opts.spark, grow: !!opts.grow,
    });
  }
  function maxLife(l) { return l * (0.6 + Math.random() * 0.8); }
}
if (!rafFx) fxLoop();

// ---------- Utilidades escena ----------
const stage = document.getElementById('stage');
function showScene(id) {
  document.querySelectorAll('.scene').forEach(s => s.classList.toggle('on', s.id === id));
}
function shakeStage(soft) {
  stage.classList.remove('shake-hard', 'shake-soft');
  void stage.offsetWidth;
  stage.classList.add(soft ? 'shake-soft' : 'shake-hard');
}
function flash(alpha, ms) {
  const f = document.getElementById('flash');
  f.style.transition = 'none'; f.style.opacity = alpha;
  requestAnimationFrame(() => { f.style.transition = `opacity ${ms}ms ease`; f.style.opacity = 0; });
}
function redPulse() {
  const v = document.getElementById('vignette');
  v.style.transition = 'none'; v.style.opacity = 1;
  requestAnimationFrame(() => { v.style.transition = 'opacity 700ms ease'; v.style.opacity = 0; });
}
function dust(x, y, size) {
  const d = document.createElement('div');
  d.className = 'dust';
  d.style.left = x + 'px'; d.style.top = y + 'px';
  d.style.width = size + 'px'; d.style.height = size + 'px';

  setTimeout(() => d.remove(), 1100);
}
function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

// ---------- ESCENA 1: el boss final cae ----------
async function sceneBoard() {
  scene = 1; busy = true; // bloquea el avance por tecla durante la pelea
  showScene('scene-board');
  const bg = document.getElementById('board-bg');
  await (bg.complete ? Promise.resolve() : new Promise(r => { bg.onload = r; bg.onerror = r; }));

  // Avatar del jugador (el elegido en la partida)
  const hero = document.getElementById('hero-img');
  hero.src = `/assets/avatars/display/avatar_${String(avatarIdx + 1).padStart(2, '0')}.webp`;

  // Calibraciones reales del tablero: avatarArea (rejilla 8x6) vía
  // /api/board-sprites-assets y sprites.json (size/offset por casilla)
  // vía /api/load-board-sprites — igual que calibrate-board-sprites.html
  let assets = null, cal = null;
  try { const res = await fetch('/api/board-sprites-assets?world=MAZMORRA'); if (res.ok) assets = await res.json(); } catch {}
  try { const res = await fetch('/api/load-board-sprites?world=MAZMORRA'); if (res.ok) cal = await res.json(); } catch {}
  const boss = document.getElementById('boss-img');
  if (assets?.boss?.[0]) boss.src = assets.boss[0];
  if (assets?.avatar?.[avatarIdx]) hero.src = assets.avatar[avatarIdx];

  const area = assets?.avatarArea || assets?.boardArea || { x: 0.25, y: 0.3, width: 0.5, height: 0.45 };
  const r = getImgRect(bg);
  const bL = r.left + area.x * r.width, bT = r.top + area.y * r.height;
  const bW = area.width * r.width, bH = area.height * r.height;
  const cw = bW / 8, ch = bH / 6;
  const g = cal?.global || {};
  // Rect del sprite en una casilla — misma fórmula que el calibrador:
  // tamaño = fracción de casilla, centrado + offset (casilla) + global (tablero)
  const spriteRect = (c, row, entry) => {
    const size = (entry?.size ?? 1) * (g.scale ?? 1);
    const w = cw * size, h = ch * size;
    const cx = bL + c * cw + cw / 2 + (entry?.offsetX ?? 0) * cw + (g.offsetX ?? 0) * bW;
    const cy = bT + row * ch + ch / 2 + (entry?.offsetY ?? 0) * ch + (g.offsetY ?? 0) * bH;
    return { left: cx - w / 2, top: cy - h / 2, w, h, cx, cy };
  };
  const heroCal = cal?.avatar?.[avatarIdx] || {};
  const bossCal = cal?.boss?.[0] || {};
  const setCell = (img, c, row, entry) => {
    const rc = spriteRect(c, row, entry);
    img.style.left = rc.left + 'px'; img.style.top = rc.top + 'px';
    img.style.width = rc.w + 'px'; img.style.height = rc.h + 'px';
    return rc;
  };
  // El héroe y el boss en SUS casillas del tablero (runika-final-state):
  // la escena arranca donde acabó la partida — continuidad real
  const ri = n => Math.floor(Math.random() * n);
  let bc = 4 + ri(4), br = ri(6);
  let hc = bc - 1, hr = br; // adyacente al boss, a su izquierda
  if (finalState?.hero && finalState?.boss) {
    [hc, hr] = finalState.hero; [bc, br] = finalState.boss;
    hc = Math.max(0, Math.min(7, hc)); hr = Math.max(0, Math.min(5, hr));
    bc = Math.max(0, Math.min(7, bc)); br = Math.max(0, Math.min(5, br));
    if (hc === bc && hr === br) bc = hc > 0 ? hc - 1 : hc + 1;
  }
  const heroRC = setCell(hero, hc, hr, heroCal);
  const bossRC = setCell(boss, bc, br, bossCal);

  // Presentacion
  const sub = document.getElementById('sub-text');
  sub.textContent = tt('fin.finalBoss');
  sub.style.top = '12%';
  await wait(300); sub.classList.add('on');
  await wait(1600); sub.classList.remove('on');
  await wait(300);

  // El golpe definitivo: el héroe se carga de luz (partículas de
  // energía suben a su alrededor) y una columna de luz cae del cielo
  // sobre el boss — tras esto el boss se sobrecarga y estalla
  hero.style.animation = 'heroCharge 1.05s ease-in forwards';
  const chargeIv = setInterval(() => {
    burst(heroRC.cx + (Math.random() * 40 - 20), heroRC.cy + heroRC.h * 0.25, 10,
      ['#fff3c4', '#ffd54f', '#fff'], 2.5,
      { spark: true, up: 3.5, g: -0.05, size: 2.5, life: 42 });
  }, 110);
  await wait(1050);
  clearInterval(chargeIv);
  const smite = document.createElement('div');
  smite.className = 'smite-beam';
  smite.style.left = (bossRC.cx - cw * 1.15) + 'px';
  smite.style.top = '0px';
  smite.style.width = (cw * 2.3) + 'px';
  smite.style.height = (bossRC.cy + bossRC.h * 0.6) + 'px';
  document.body.appendChild(smite);
  setTimeout(() => smite.remove(), 1400);
  flash(0.95, 350); shakeStage(false); redPulse();
  snd('/assets/sounds/comun/choque.wav', 1);
  boss.style.animation = 'bossHit .45s ease';
  burst(bossRC.cx, bossRC.cy, 60,
    ['#fff3c4', '#ffd54f', '#ff9a3c', '#fff'], 9,
    { size: 4, g: 0.12, spark: true, life: 60 });
  hero.style.animation = '';
  await wait(700);
  boss.style.animation = '';

  // Golpe final: el boss FINAL no cae gris como un guardián más — se
  // sobrecarga de luz incandescente y estalla
  flash(0.9, 400); redPulse(); shakeStage(false);
  boss.style.animation = 'bossCharge 1s ease-in forwards';
  await wait(1050);

  // La explosión: pantalla en blanco, el boss se desintegra en una
  // nube dorada mientras 5 anillos gigantes barren la escena
  flash(1, 800); shakeStage(false); redPulse();
  snd('/assets/sounds/comun/choque.wav', 0.9);
  boss.style.animation = 'bossExplode .8s ease-in forwards';
  burst(bossRC.cx, bossRC.cy, 150,
    ['#ffd54f', '#ff9a3c', '#fff3c4', '#e86a4a', '#9a8a70'], 11,
    { size: 5, g: 0.1, life: 75, spark: true });
  for (let i = 0; i < 5; i++) {
    const ring = document.createElement('div');
    ring.className = 'win-ring big';
    ring.style.left = (bossRC.cx - 100) + 'px';
    ring.style.top = (bossRC.cy - 100) + 'px';
    ring.style.animationDelay = (i * 0.18) + 's';
    document.body.appendChild(ring);
    setTimeout(() => ring.remove(), 2300 + i * 180);
  }
  await wait(700);

  

  // Foco cenital sobre el héroe: haz de luz desde arriba + halo dorado
  // pulsante + brillo en el sprite (el héroe como centro del triunfo)
  hero.classList.add('hero-glow');
  const beam = document.createElement('div');
  beam.className = 'win-beam';
  beam.style.left = (heroRC.cx - cw * 1.6) + 'px';
  beam.style.top = r.top + 'px';
  beam.style.width = (cw * 4.4) + 'px';
  beam.style.height = (heroRC.cy - r.top + ch * 0.6) + 'px';
  document.body.appendChild(beam);
  const halo = document.createElement('div');
  halo.className = 'win-halo';
  const hs = cw * 5;
  halo.style.left = (heroRC.cx - hs / 2) + 'px';
  halo.style.top = (heroRC.cy - hs / 2) + 'px';
  halo.style.width = halo.style.height = hs + 'px';
  document.body.appendChild(halo);
  setTimeout(() => { beam.remove(); halo.remove(); }, 15000);

  await wait(900);
  // Canción del final del juego — en loop desde la explosión del boss,
  // desde el principio y continua hasta los créditos; sin stings
  try {
    const m = JSON.parse(localStorage.getItem('runika-music-pos') || '{}');
    delete m[AssetsCache.MUSIC.fin];
    localStorage.setItem('runika-music-pos', JSON.stringify(m));
  } catch {}
  AssetsCache.setMusicTrack(AssetsCache.MUSIC.fin);
  const big = document.getElementById('big-text');
  big.textContent = tt('game.victory');
  big.classList.add('pop');
  hero.style.animation = 'heroCelebrate .7s ease .1s';
  busy = false; // desde aquí, tecla/clic adelanta a la siguiente escena
  // La escena fluye sola: la victoria se sostiene un momento y continúa
  await wait(3200);
  if (scene === 1) advance();
}

// ---------- ESCENA 1.5: el tablero se desmorona ----------
async function crumbleBoard() {
  // Restos de la celebración del boss viven en <body> fuera de la escena:
  // si no se limpian aquí, el foco/halo del héroe se cuelan a las
  // siguientes escenas (su timeout de seguridad es de 15s)
  document.querySelectorAll('.win-beam,.win-halo,.down-title,.win-flash,.win-ring,.win-spark,.win-debris,.win-dust,.smite-beam')
    .forEach(e => e.remove());
  const sc = document.getElementById('scene-board');
  const hero = document.getElementById('hero-img');
  const boss = document.getElementById('boss-img');
  // 3 temblores crecientes con polvo y truenos
  for (let i = 0; i < 3; i++) {
    shakeStage(i < 2);
    snd('/assets/sounds/comun/choque.wav', 0.45 + i * 0.15);
    const bx = innerWidth * (0.3 + Math.random() * 0.45);
    const by = innerHeight * (0.35 + Math.random() * 0.4);
    dust(bx, by, innerWidth * 0.10);
    burst(bx, by, 35, ['#8a7a60', '#b09a75', '#6a5a45'], 6, { size: 5, g: 0.2 });
    if (i === 1) { hero.style.animation = 'heroCelebrate .5s ease'; }
    await wait(420);
  }
  // La escena entera se hunde con el rumble del derrumbe (13.5s, cubre
  // el hundimiento y el arranque de la caida de los mundos)
  flash(0.6, 500); // destello al ceder el suelo — transición más dramática
  sc.classList.add('crumble');
  boardRumble = sndFading('/assets/sounds/comun/derrumbe.mp3', 0.55);
  snd('/assets/sounds/comun/choque.wav', 0.85);
  shakeStage(false);
  const bx = innerWidth * 0.5, by = innerHeight * 0.7;
  dust(bx, by, innerWidth * 0.3);
  burst(bx, by, 80, ['#8a7a60', '#b09a75', '#6a5a45', '#d0b890'], 9, { size: 6, g: 0.16 });
  await wait(1500);
}

// ---------- ESCENA 2: los mundos se derrumban ----------
async function sceneMap() {
  scene = 2; busy = true;
  document.getElementById('big-text').classList.remove('pop');
  document.getElementById('big-text').style.opacity = 0;
  await crumbleBoard();
  showScene('scene-map');
  const bg = document.querySelector('#scene-map .bgimg');
  await (bg.complete ? Promise.resolve() : new Promise(r => { bg.onload = r; bg.onerror = r; }));
  await wait(700);

  const r = getImgRect(bg);
  const overlay = document.getElementById('map-overlay');
  const sub = document.getElementById('sub-text');
  sub.style.top = '8%';
  sub.textContent = tt('fin.worldsFell');
  sub.classList.add('on');

  const overlayDivs = {};
  for (const w of WORLD_ORDER) {
    const pos = avatarPos(w);
    if (!pos) continue;
    // Div con background en vez de <img>: los backgrounds se repintan al
    // decodificar; un <img> con mask+filter pre-decode rasterizaba vacío
    // y nunca se repintaba (mismo bug que el mapamundi)
    const fx = document.createElement('div');
    fx.className = 'world-fx';
    fx.style.left = r.left + 'px'; fx.style.top = r.top + 'px';
    fx.style.width = r.width + 'px'; fx.style.height = r.height + 'px';
    fx.style.backgroundImage = `url("${bg.src}")`;
    const circ = FIN_AREAS?.aura?.[w];
    let cx, cy;
    const grads = [];
    const grad = (px, py, rr, solid, fade) =>
      `radial-gradient(circle ${rr.toFixed(1)}px at ${px.toFixed(1)}px ${py.toFixed(1)}px, #000 ${solid}%, transparent ${fade}%)`;
    if (circ && circ.r > 0) {
      // Circulo calibrado -> aura irregular determinista: nucleo suave +
      // blobs difuminados en los vertices (sin clip-path: cero bordes duros)
      cx = circ.cx; cy = circ.cy;
      const coreR = circ.r * r.width * 1.05;
      const blobR = coreR * 0.55;
      grads.push(grad(cx * r.width, cy * r.height, coreR, 60, 88));
      for (const p of AssetsCache.auraPoints(circ.cx, circ.cy, circ.r, w, r.width / r.height)) {
        grads.push(grad(p[0] * r.width, p[1] * r.height, blobR, 45, 82));
      }
    } else {
      cx = pos.x; cy = pos.y;
      grads.push(grad(cx * r.width, cy * r.height, worldSize(w) * r.width * 1.2, 55, 90));
    }
    fx.style.webkitMaskImage = grads.join(',');
    fx.style.maskImage = fx.style.webkitMaskImage;
    // La "caida" escala la copia: el origen debe ser el centro del aura,
    // no el centro de la imagen entera
    fx.style.transformOrigin = `${(cx * r.width).toFixed(1)}px ${(cy * r.height).toFixed(1)}px`;
    overlay.appendChild(fx);
    const sz = worldSize(w) * r.width * 2.4;
    overlayDivs[w] = { fx, cx: r.left + pos.x * r.width, cy: r.top + pos.y * r.height, sz };
  }

  // Derrumbe en cadena: los 7 mundos externos y al final MAZMORRA
  for (const w of WORLD_ORDER) {
    const o = overlayDivs[w];
    if (!o) continue;
    const isFinal = w === 'MAZMORRA';
    snd('/assets/sounds/comun/choque.wav', isFinal ? 0.8 : 0.55);
    shakeStage(!isFinal ? true : false);
    o.fx.classList.add('fall');
    dust(o.cx, o.cy + o.sz * 0.28, o.sz * 0.9);
    dust(o.cx - o.sz * 0.25, o.cy + o.sz * 0.2, o.sz * 0.6);
    dust(o.cx + o.sz * 0.25, o.cy + o.sz * 0.2, o.sz * 0.6);
    burst(o.cx, o.cy + o.sz * 0.2, isFinal ? 70 : 30,
      ['#8a7a60', '#b09a75', '#6a5a45', '#d0b890'], isFinal ? 8 : 5, { size: 4, g: 0.15 });
    if (isFinal) {
      flash(0.8, 600); redPulse();
      // MAZMORRA cae con su propio derrumbe oscuro (~21s, fundido final):
      // silencia el rumble del tablero para no montar dos a la vez
      fadeOutSnd(boardRumble, 0.8); boardRumble = null;
      finalRumble = sndFading('/assets/sounds/comun/derrumbe_final.mp3', 0.95, 3);
    }
    await wait(isFinal ? 1600 : 950);
  }
  sub.classList.remove('on');
  await wait(900);
  busy = false;
  sceneEnd();
}

// ---------- ESCENA 3: gran final ----------
// El héroe emerge bajo el foco sobre un pedestal de luz; los 7 mundos
// vuelven a la vida como orbes de color que lo coronan en arco; y el
// título estalla entre rayos, fuegos y lluvia de monedas.
async function sceneEnd() {
  scene = 3; busy = true;
  // El derrumbe de MAZMORRA (21s) aún rugiría bajo la celebración:
  // la destrucción se apaga al entrar la escena final
  fadeOutSnd(finalRumble, 2.2); finalRumble = null;
  // El tema del final sigue en loop desde la explosión del boss —
  // se reafirma por si algo lo cortó, sin reiniciarlo si ya suena
  AssetsCache.setMusicTrack(AssetsCache.MUSIC.fin);
  showScene('scene-end');
  const se = document.getElementById('scene-end');
  se.style.background =
    'radial-gradient(ellipse at center, #241a2e 0%, #120a04 60%, #000 100%)';

  // Cielo estrellado de fondo
  for (let i = 0; i < 130; i++) {
    const st = document.createElement('div');
    st.className = 'star';
    st.style.left = (Math.random() * 100) + 'vw';
    st.style.top = (Math.random() * 100) + 'vh';
    st.style.animationDelay = (Math.random() * 4) + 's';
    st.style.animationDuration = (2 + Math.random() * 3) + 's';
    se.appendChild(st);
  }
  await wait(500);

  // El héroe emerge bajo el foco: pedestal de luz + haz cenital + halo
  const hero = document.getElementById('end-hero');
  hero.src = `/assets/avatars/display/avatar_${String(avatarIdx + 1).padStart(2, '0')}.webp`;
  hero.classList.add('on');
  document.getElementById('end-floor').classList.add('on');
  // Campana grave al emerger el héroe (no un jingle — el tema fin sigue)
  const rise = snd('/assets/sounds/comun/orbe.wav', 0.4);
  if (rise) rise.playbackRate = 0.6;
  const cx = innerWidth / 2, hcy = innerHeight * 0.58;
  const beam = document.createElement('div');
  beam.className = 'win-beam';
  const bw = innerHeight * 0.42;
  beam.style.left = (cx - bw / 2) + 'px';
  beam.style.top = '0px';
  beam.style.width = bw + 'px';
  beam.style.height = (hcy + innerHeight * 0.14) + 'px';
  se.appendChild(beam);
  const halo = document.createElement('div');
  halo.className = 'win-halo';
  const hs = innerHeight * 0.55;
  halo.style.left = (cx - hs / 2) + 'px';
  halo.style.top = (hcy - hs / 2) + 'px';
  halo.style.width = halo.style.height = hs + 'px';
  se.appendChild(halo);
  await wait(1900);

  // Los mundos vuelven a la vida: 7 orbes de color vuelan desde abajo y
  // coronan al héroe en arco, cada uno con su ráfaga del mismo matiz
  const ORBS = [
    ['ESPACIO', '#9d8cff'], ['AGUA', '#4ea8ff'], ['TIERRA', '#7ac74f'],
    ['FUEGO', '#ff7a33'], ['HIELO', '#aef0ff'], ['VIENTO', '#8fffd8'],
    ['INFRAMUNDO', '#e05a6e'],
  ];
  const N = ORBS.length;
  const arcY = hcy - innerHeight * 0.30;
  const arcRx = innerHeight * 0.34;
  for (let i = 0; i < N; i++) {
    const [, col] = ORBS[i];
    // Abanico simétrico sobre la cabeza del héroe (de -65° a +65°)
    const a = (-65 + (130 * i / (N - 1))) * Math.PI / 180;
    const tx = cx + Math.sin(a) * arcRx;
    const ty = arcY + (1 - Math.cos(a)) * innerHeight * 0.10;
    const o = document.createElement('div');
    o.className = 'orb';
    const sz = innerHeight * 0.055;
    o.style.width = o.style.height = sz + 'px';
    const sx = cx + (i % 2 ? 1 : -1) * (innerWidth * 0.35 + Math.random() * 60);
    const sy = innerHeight + 40;
    o.style.left = sx + 'px';
    o.style.top = sy + 'px';
    o.style.color = col;
    const core = document.createElement('div');
    core.className = 'orbcore';
    core.style.background = `radial-gradient(circle at 35% 30%, #fff, ${col} 55%)`;
    o.appendChild(core);
    se.appendChild(o);
    // Vuelo por transform en el compositor; al terminar se fijan las
    // coordenadas reales (fill none → el elemento vuelve a left/top).
    o.animate(
      [{ transform: 'translate(0px,0px)' },
       { transform: 'translate(' + (tx - sz / 2 - sx) + 'px,' + (ty - sz / 2 - sy) + 'px)' }],
      { duration: 720, easing: 'cubic-bezier(.3,.7,.35,1)' });
    setTimeout(() => {
      o.style.left = (tx - sz / 2) + 'px';
      o.style.top = (ty - sz / 2) + 'px';
      burst(tx, ty, 22, ['#fff3c4', col], 4, { size: 3, g: 0.05, spark: true });
      // Campanita ascendente por mundo — arpegio mágico, no un blip de UI
      const bell = snd('/assets/sounds/comun/orbe.wav', 0.5);
      if (bell) bell.playbackRate = 1 + i * 0.17;
      o.classList.add('set');
    }, 720);
    await wait(620);
  }
  await wait(1100);

  // Gran final: estallido + rayos + título letra a letra
  flash(0.9, 900);
  document.getElementById('rays').classList.add('on');

  // Titulo letra a letra
  const big = document.getElementById('big-text');
  big.style.opacity = 1; big.style.top = '13%';
  big.innerHTML = '';
  // El título nombra al héroe — el nombre que el jugador tecleó en la
  // máquina de la selección de personaje; sin nombre, genérico
  const text = player?.playerName
    ? tt('fin.completedNamed', player.playerName)
    : tt('fin.completed');
  const letters = [];
  for (const ch of text) {
    const sp = document.createElement('span');
    sp.className = 'letter';
    sp.textContent = ch === ' ' ? ' ' : ch;
    big.appendChild(sp); letters.push(sp);
  }
  for (let i = 0; i < letters.length; i++) {
    letters[i].classList.add('pop');
    await wait(85);
  }

  // Mensaje de rejugabilidad bajo el titulo (juego infinito, nada se repite)
  const sub = document.getElementById('sub-text');
  sub.classList.remove('on');
  sub.style.top = '78%';
  sub.style.width = '72%';
  sub.style.whiteSpace = 'normal';
  sub.style.lineHeight = '1.3';
  sub.textContent = tt('fin.replay');
  await wait(500);
  sub.classList.add('on');

  // Total de oro conseguido (el del tablero al vencer, o el de la partida).
  // Se coloca justo debajo del texto medido de verdad — así no se pisa con
  // el mensaje ni con el hint en ningún idioma.
  const goldTotal = finalState?.gold ?? player?.gold;
  if (typeof goldTotal === 'number') {
    const g = document.createElement('div');
    g.className = 'end-gold';
    const img = document.createElement('img');
    img.src = '/assets/comunes/monedas.webp';
    const span = document.createElement('span');
    span.textContent = tt('fin.goldTotal', goldTotal);
    g.appendChild(img); g.appendChild(span);
    se.appendChild(g);
    const subBottom = sub.getBoundingClientRect().bottom;
    g.style.top = Math.min(innerHeight * 0.915, subBottom + innerHeight * 0.02) + 'px';
    requestAnimationFrame(() => g.classList.add('on'));
  }

  // Lluvia de monedas + fuegos artificiales
  coinRain();
  const fw = setInterval(() => {
    const x = innerWidth * (0.15 + Math.random() * 0.7);
    const y = innerHeight * (0.12 + Math.random() * 0.45);
    burst(x, y, 46, ['#ffd54f', '#ff9a3c', '#fff3c4', '#e86a4a', '#7ec8e3'], 7, { spark: true, g: 0.05, size: 3, life: 70 });
    snd('/assets/sounds/comun/choque.wav', 0.1);
  }, 800);
  setTimeout(() => clearInterval(fw), 8200);

  await wait(2400);
  // Todo ha acabado: espera a que el jugador pulse para continuar —
  // de aquí se va a los créditos (Esc sigue llevando al menú)
  const hint = document.getElementById('continue-hint');
  hint.style.top = '95.5%';
  hint.textContent = tt('instructions.continue');
  hint.classList.add('on');
  busy = false;
}
function coinRain() {
  for (let i = 0; i < 36; i++) {
    setTimeout(() => {
      const c = document.createElement('img');
      c.src = '/assets/comunes/monedas.webp';
      c.className = 'coin-rain';
      const sz = 26 + Math.random() * 44;
      c.style.width = sz + 'px';
      c.style.left = (Math.random() * 96) + 'vw';
      c.style.top = '-10vh';
      c.style.animationDuration = (2.4 + Math.random() * 2.4) + 's';
      stage.appendChild(c);
      // El oro suena a oro: clink suave al caer (no a cada moneda,
      // que quedaría como ametralladora), tono algo aleatorio
      if (i % 2 === 0) {
        const clink = snd('/assets/sounds/comun/moneda.wav', 0.22);
        if (clink) clink.playbackRate = 0.9 + Math.random() * 0.25;
      }
      setTimeout(() => c.remove(), 5500);
    }, i * 160);
  }
}

// ---------- Avance ----------
let started = false;
// ?auto=1: venimos directos del boss final — la cinemática arranca sola,
// sin gate de "pulsa para empezar" (el audio ya iba desbloqueado)
const AUTO_START = new URLSearchParams(location.search).get('auto') === '1';
function advance() {
  if (!started || busy) return;
  if (scene === 1) { sceneMap(); return; }
  // El gran final encadena con los creditos (su boton Volver lleva al menu)
  if (scene === 3) { AssetsCache.transitionTo('/creditos.html'); return; }
}
document.addEventListener('keydown', e => {
  if (!started) { begin(); return; }
  AssetsCache.unlockAudio();
  if (e.key === 'Escape') { AssetsCache.transitionTo('/menu.html'); return; }
  advance();
});
document.addEventListener('pointerdown', () => {
  if (!started) { begin(); return; }
  AssetsCache.unlockAudio();
  advance();
});
function begin() {
  if (started) return;
  started = true;
  AssetsCache.unlockAudio();
  const ps = document.getElementById('press-start');
  if (AUTO_START) { ps.remove(); }
  else {
    ps.style.animation = 'none';
    ps.style.opacity = '0';
    ps.style.transition = 'opacity .4s ease';
    setTimeout(() => ps.remove(), 450);
  }
  sceneBoard();
}

// ---------- Arranque ----------
(async () => {
  await AssetsCache.loadSettings();
  // Ambiente de mazmorra bajo la pelea final — victory.mp3 (una vez)
  // toma el relevo en la derrota del boss
  AssetsCache.setMusicTrack(AssetsCache.musicForWorld('MAZMORRA'));
  fallback = await loadLang('es');
  translations = await loadLang();
  await AssetsCache.preloadSounds([
    '/assets/sounds/comun/choque.wav',
    '/assets/sounds/comun/move.wav',
    '/assets/sounds/comun/derrumbe.mp3',
    '/assets/sounds/comun/derrumbe_final.mp3',
    '/assets/sounds/comun/orbe.wav',
    '/assets/sounds/comun/moneda.wav',
  ]);
  try {
    const r = await fetch('/api/savegame');
    if (r.ok) { const d = await r.json(); player = d.player || null; }
  } catch {}
  if (player && typeof player.avatarIndex === 'number') avatarIdx = player.avatarIndex;
  try {
    const r = await fetch('/api/load-avatar-positions');
    if (r.ok) { const d = await r.json(); if (d.positions) WORLD_POSITIONS = d.positions; if (d.avatars) WORLD_AVATAR_POS = d.avatars; if (d.avatarSize) avatarSize = d.avatarSize; }
  } catch {}
  try {
    const r = await fetch('/api/load-fin-areas');
    if (r.ok) FIN_AREAS = await r.json();
  } catch {}
  WORLD_ORDER.forEach(w => { if (!WORLD_POSITIONS[w]) WORLD_POSITIONS[w] = { x: 0.5, y: 0.5 }; });
  // Revela solo cuando la primera escena tiene sus imágenes decodificadas —
  // la página nace tras un fundido negro (transition-overlay). Solo cuentan
  // las que ya tienen src: hero-img se asigna dentro de sceneBoard() y sin
  // AUTO_START esperar por él ocultaría el gate de "pulsa para empezar".
  const firstImgs = [...document.querySelectorAll('#scene-board img')].filter(im => im.getAttribute('src'));
  Promise.all(firstImgs.map(im =>
    (im.complete && im.naturalWidth) ? Promise.resolve()
      : new Promise(res => { im.addEventListener('load', res, { once: true }); im.addEventListener('error', res, { once: true }); })
  )).then(() => AssetsCache.transitionIn());
  if (AUTO_START) begin();
  else document.getElementById('press-start').textContent = tt('loading.pressStart');
})();
</script>
</body>
