<!DOCTYPE html>
<html lang="es">
<head>
<script src="/web/webdb.js"></script>
<script src="/web/solver.bundle.js"></script>
<script src="/web/api-shim.js"></script>
<script src="/web/tizen.js"></script>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Runika 2D</title>
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0a0806; font-family: 'ChelseaMarket', cursive;
  }
  /* Pantalla de carga */
  #loading-screen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 100; background: #0a0806;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #e8d4a8;
  }
  #loading-screen .title {
    font-family: 'ChelseaMarket', cursive;
    font-size: 2.5em; color: #f0d890;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    margin-bottom: 30px; letter-spacing: 3px;
  }
  #loading-bar-bg {
    width: 300px; height: 8px;
    background: rgba(60, 42, 20, 0.5);
    border: 1px solid rgba(180, 150, 80, 0.4);
    border-radius: 4px; overflow: hidden;
  }
  #loading-bar {
    width: 0%; height: 100%;
    background: linear-gradient(90deg, #c4a050, #f0d890);
    transition: width 0.2s ease;
  }
  #loading-text {
    margin-top: 12px; font-size: 0.9em; color: #a08850;
    font-family: 'ChelseaMarket', cursive;
  }
  #transition-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 90; background: #000;
    opacity: 1; pointer-events: auto; /* nace en negro: cero destello al entrar */
  }
  #stage {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  #bg {
    width: 100%; height: 100%;
    object-fit: contain; display: block;
  }
  #text-area {
    position: absolute;
    z-index: 11;
    pointer-events: auto;
    overflow-y: auto;
    padding: 15px 25px;
    transition: box-shadow 0.3s ease;
  }
  #text-area.focused {
    box-shadow: inset 0 0 0 2px rgba(138, 96, 48, 0.5);
  }
  #text-area::-webkit-scrollbar { width: 6px; }
  #text-area::-webkit-scrollbar-track { background: rgba(100,80,40,0.15); border-radius: 3px; }
  #text-area::-webkit-scrollbar-thumb { background: rgba(100,70,30,0.4); border-radius: 3px; }
  h1 {
    font-family: 'ChelseaMarket', cursive;
    font-size: clamp(1.3em, 2.5vw, 2em);
    color: #3a2810;
    text-align: center;
    text-shadow: 1px 1px 0 rgba(255,240,200,0.5);
    margin-bottom: 15px;
    letter-spacing: 1px;
  }
  /* Calaveras de adorno flanqueando el titulo */
  h1::before, h1::after {
    content: '';
    display: inline-block;
    width: 0.95em; height: 0.95em;
    margin: 0 0.45em;
    vertical-align: -0.08em;
    background: url('/assets/comunes/calavera.webp') center / contain no-repeat;
    opacity: 0.75;
    filter: sepia(1) brightness(0.45) drop-shadow(1px 1px 0 rgba(255,240,200,0.4));
  }
  h1::after { transform: scaleX(-1); }
  .section { margin-bottom: 18px; }
  .section-title {
    font-family: 'ChelseaMarket', cursive;
    font-size: clamp(1.1em, 2vw, 1.3em);
    color: #5a3a18;
    text-shadow: 1px 1px 0 rgba(255,240,200,0.4);
    margin-bottom: 8px;
    padding-bottom: 4px;
    border-bottom: 1px solid rgba(90, 58, 24, 0.3);
  }
  .section-title::before {
    content: '';
    display: inline-block;
    width: 0.85em; height: 0.85em;
    margin-right: 0.4em;
    vertical-align: -0.06em;
    background: url('/assets/comunes/calavera.webp') center / contain no-repeat;
    opacity: 0.6;
    filter: sepia(1) brightness(0.4);
  }
  .item {
    font-family: 'ChelseaMarket', cursive;
    font-size: clamp(0.85em, 1.5vw, 1em);
    color: #4a3018;
    line-height: 1.6;
    padding: 4px 0 4px 22px;
    position: relative;
  }
  .item::before {
    content: '';
    position: absolute; left: 0; top: 0.62em;
    width: 0.8em; height: 0.8em;
    background: url('/assets/comunes/calavera.webp') center / contain no-repeat;
    opacity: 0.5;
    filter: sepia(1) brightness(0.45);
  }
  .item-icon {
    display: flex; align-items: center;
    padding: 6px 0 6px 22px;
    position: relative;
    font-family: 'ChelseaMarket', cursive;
    font-size: clamp(0.85em, 1.5vw, 1em);
    color: #4a3018;
    line-height: 1.5;
  }
  .item-icon::before {
    content: '';
    position: absolute; left: 0; top: 50%;
    transform: translateY(-50%);
    width: 0.8em; height: 0.8em;
    background: url('/assets/comunes/calavera.webp') center / contain no-repeat;
    opacity: 0.5;
    filter: sepia(1) brightness(0.45);
  }
  /* Divisor ornamental: linea - calavera - linea */
  .divider {
    display: flex; align-items: center; gap: 12px;
    margin: 16px 0 18px;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(90,58,24,0.55), transparent);
  }
  .divider img {
    width: 22px; height: 22px; object-fit: contain;
    opacity: 0.6; filter: sepia(1) brightness(0.4);
  }
  .item-icon img {
    width: 40px; height: 40px;
    margin-right: 10px;
    object-fit: contain;
    flex-shrink: 0;
    filter: drop-shadow(2px 2px 3px rgba(60,40,10,0.4));
  }
  .page { display: none; }
  .page.active { display: block; animation: fadeIn 0.4s ease; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .page { display: none; }
  .page.active { display: block; animation: fadeIn 0.4s ease; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  #nav {
    position: absolute; bottom: 20px; left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    display: flex; align-items: center; justify-content: center;
    gap: 20px;
    pointer-events: auto;
  }
  .btn3d {
    font-family: 'ChelseaMarket', cursive;
    font-size: clamp(0.9em, 1.5vw, 1.05em);
    color: #e8d4a8;
    padding: 10px 30px;
    background: linear-gradient(180deg, rgba(60, 42, 20, 0.9), rgba(35, 24, 10, 0.95));
    border: 2px solid rgba(180, 150, 80, 0.5);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s ease;
    box-shadow:
      0 4px 0 rgba(20, 12, 4, 0.8),
      0 6px 10px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255, 220, 150, 0.15);
    text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
    user-select: none;
  }
  .btn3d:hover {
    background: linear-gradient(180deg, rgba(80, 58, 28, 0.9), rgba(50, 34, 14, 0.95));
    border-color: rgba(232, 212, 168, 0.7);
    color: #fff8e0;
    box-shadow:
      0 4px 0 rgba(20, 12, 4, 0.8),
      0 6px 15px rgba(232, 212, 168, 0.2),
      inset 0 1px 0 rgba(255, 220, 150, 0.2);
  }
  .btn3d.focused {
    border-color: rgba(232, 212, 168, 0.9);
    box-shadow:
      0 4px 0 rgba(20, 12, 4, 0.8),
      0 0 20px rgba(232, 212, 168, 0.4),
      inset 0 1px 0 rgba(255, 220, 150, 0.2);
  }
  .btn3d:active {
    transform: translateY(3px);
    box-shadow:
      0 1px 0 rgba(20, 12, 4, 0.8),
      0 2px 5px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255, 220, 150, 0.1);
  }
  /* Boton atras: solo el AREA clickeable sobre el boton pintado en la imagen.
     Invisible; al tener foco se marca con un anillo dorado. */
  #btn-back {
    position: absolute;
    z-index: 21;
    border-radius: 50%;
    padding: 0;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    line-height: 1.15;
    font-family: 'ChelseaMarket', cursive;
    background: transparent;
    border: 3px solid transparent;
    box-shadow: none;
    color: transparent;
    text-shadow: none;
    cursor: pointer;
    user-select: none;
  }
  #btn-back:hover {
    border-color: rgba(255, 204, 68, 0.5);
    box-shadow: 0 0 14px rgba(255, 204, 68, 0.35);
  }
  #btn-back.focused {
    border-color: rgba(255, 204, 68, 0.95);
    box-shadow: 0 0 22px rgba(255, 204, 68, 0.6);
  }
  #page-info {
    font-family: 'ChelseaMarket', cursive;
    font-size: 0.9em;
    color: #e8d4a8;
    min-width: 50px;
    text-align: center;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
  }
</style>
</head>
<body>

<!-- Pantalla de carga -->
<div id="loading-screen">
  <div class="title" data-i18n="menu.title"></div>
  <div id="loading-bar-bg"><div id="loading-bar"></div></div>
  <div id="loading-text"></div>
</div>

<!-- Overlay de transicion -->
<div id="transition-overlay"></div>

<div id="stage">
  <img id="bg" src="/assets/instrucciones/instrucciones.webp" />
</div>

<div id="text-area">
  <h1 data-i18n="instructions.title"></h1>
  <div class="divider"><img src="/assets/comunes/calavera.webp" alt=""></div>
  <div class="section">
    <div class="section-title" data-i18n="instructions.storyTitle"></div>
    <div class="item" data-i18n="instructions.story1"></div>
    <div class="item" data-i18n="instructions.story2"></div>
    <div class="item" data-i18n="instructions.story3"></div>
  </div>
  <div class="divider"><img src="/assets/comunes/calavera.webp" alt=""></div>
  <div class="section">
    <div class="section-title" data-i18n="instructions.controls"></div>
    <div class="item" data-i18n="instructions.controlsMove"></div>
    <div class="item" data-i18n="instructions.controlsBack"></div>
  </div>
  <div class="divider"><img src="/assets/comunes/calavera.webp" alt=""></div>
  <div class="section">
    <div class="section-title" data-i18n="instructions.rules"></div>
    <div class="item" data-i18n="instructions.rule1"></div>
    <div class="item" data-i18n="instructions.rule2"></div>
    <div class="item" data-i18n="instructions.rule3"></div>
    <div class="item" data-i18n="instructions.rule4"></div>
    <div class="item" data-i18n="instructions.rule5"></div>
    <div class="item" data-i18n="instructions.rule6"></div>
    <div class="item" data-i18n="instructions.rule7"></div>
  </div>
  <div class="divider"><img src="/assets/comunes/calavera.webp" alt=""></div>
  <div class="section">
    <div class="section-title" data-i18n="instructions.objects"></div>
    <div class="item-icon"><img src="/assets/avatars/display/avatar_06.webp" alt=""><span data-i18n="instructions.objAvatar"></span></div>
    <div class="item-icon"><img src="/assets/enemys/display/ESPACIO/enemy_ESPACIO.webp" alt=""><span data-i18n="instructions.objEnemy"></span></div>
    <div class="item-icon"><img src="/assets/obstaculos/display/ESPACIO/cosmic_portal_tile.webp" alt=""><span data-i18n="instructions.objObstacle"></span></div>
    <div class="item-icon"><img src="/assets/trampas/display/AGUA/image_25.webp" alt=""><span data-i18n="instructions.objTrap"></span></div>
    <div class="item-icon"><img src="/assets/salida/display/ESPACIO/image_20260921_155734.webp" alt=""><span data-i18n="instructions.objGoal"></span></div>
  </div>
</div>

<button id="btn-back" data-i18n="instructions.back"></button>


<script src="/assets-cache.js"></script>
<script>
  let translations = {};
  let fallback = {};
  // Fallback por si no hay calibracion guardada; el valor real viene de
  // assets/instrucciones/instructions-areas.json (calibrate-instructions.html)
  let TEXT_AREA = { x: 0.365625, y: 0.391877, w: 0.272396, h: 0.357849 };
  // Boton atras eliptico: centro normalizado + radios (rx del ancho, ry del
  // alto). Fallback legacy: circulo {r}.
  let BACK_BUTTON = { cx: 0.293, cy: 0.905, rx: 0.046, ry: 0.08 };

  // Foco: 'scroll' (pergamino) o 'button' (boton volver)
  let focus = 'scroll';

  async function loadLang(lang) {
    const r = await fetch('/api/i18n' + (lang ? '/' + lang : ''));
    if (!r.ok) return {};
    return await r.json();
  }
  function t(key) { return translations[key] ?? fallback[key] ?? key; }

  function applyI18n() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      el.textContent = t(key);
    });
    document.title = t('instructions.title') + ' — ' + t('menu.title');
  }

  async function loadTextArea() {
    try {
      const r = await fetch('/api/load-instructions-areas');
      if (!r.ok) return;
      const data = await r.json();
      const a = data.areas && data.areas[0];
      if (a) TEXT_AREA = { x: a.x, y: a.y, w: a.w, h: a.h };
      if (data.backButton) BACK_BUTTON = data.backButton;
    } catch {}
  }

  function positionTextArea() {
    const bg = document.getElementById('bg');
    const rect = bg.getBoundingClientRect();
    // Rect visible de la imagen (descuenta el letterbox de object-fit: contain)
    const iw = bg.naturalWidth || 1672;
    const ih = bg.naturalHeight || 941;
    const s = Math.min(rect.width / iw, rect.height / ih);
    const w = iw * s, h = ih * s;
    const r = {
      left: rect.left + (rect.width - w) / 2,
      top: rect.top + (rect.height - h) / 2,
      width: w, height: h,
    };
    const ta = document.getElementById('text-area');
    ta.style.left = (r.left + TEXT_AREA.x * r.width) + 'px';
    ta.style.top = (r.top + TEXT_AREA.y * r.height) + 'px';
    ta.style.width = (TEXT_AREA.w * r.width) + 'px';
    ta.style.height = (TEXT_AREA.h * r.height) + 'px';
    // Boton atras eliptico sobre la elipse calibrada (o circulo legacy {r})
    const btn = document.getElementById('btn-back');
    const bw = 2 * (BACK_BUTTON.rx ?? BACK_BUTTON.r ?? 0.046) * r.width;
    const bh = BACK_BUTTON.ry != null ? 2 * BACK_BUTTON.ry * r.height : bw;
    btn.style.left = (r.left + BACK_BUTTON.cx * r.width - bw / 2) + 'px';
    btn.style.top = (r.top + BACK_BUTTON.cy * r.height - bh / 2) + 'px';
    btn.style.width = bw + 'px';
    btn.style.height = bh + 'px';
  }

  function updateFocus() {
    const ta = document.getElementById('text-area');
    const btn = document.getElementById('btn-back');
    ta.classList.toggle('focused', focus === 'scroll');
    btn.classList.toggle('focused', focus === 'button');
  }

  function isScrolledToBottom() {
    const ta = document.getElementById('text-area');
    return ta.scrollTop + ta.clientHeight >= ta.scrollHeight - 2;
  }

  // Sonidos desde cache (Web Audio API)
  AssetsCache.unlockAudio();
  document.addEventListener('click', () => AssetsCache.unlockAudio(), { once: true });
  document.addEventListener('keydown', () => AssetsCache.unlockAudio(), { once: true });

  function playMove() {
    AssetsCache.playSound('/assets/sounds/comun/move.wav', 0.5);
  }
  function playSelect() {
    AssetsCache.playSound('/assets/sounds/comun/press.wav', 0.7);
  }
  function playBack() {
    AssetsCache.playSound('/assets/sounds/comun/back.wav', 0.6);
  }
  function playHover() {
    AssetsCache.playSound('/assets/sounds/comun/hover.wav', 0.45);
  }

  function goBack() { AssetsCache.transitionTo('/menu.html'); }

  // Boton volver
  document.getElementById('btn-back').addEventListener('click', () => {
    playBack();
    goBack();
  });
  document.getElementById('btn-back').addEventListener('mouseenter', () => playHover());

  // Teclado
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { playBack(); goBack(); return; }

    if (focus === 'scroll') {
      // Foco en el pergamino (WASD = flechas, como en el juego)
      if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === ' ' ||
          e.key === 's' || e.key === 'S' || e.key === 'd' || e.key === 'D') {
        e.preventDefault();
        const ta = document.getElementById('text-area');
        const step = ta.clientHeight * 0.8;
        ta.scrollBy({ top: step, behavior: 'smooth' });
        // Si ya esta al fondo, pasar foco al boton
        setTimeout(() => {
          if (isScrolledToBottom()) {
            focus = 'button';
            updateFocus();
            playMove();
          }
        }, 300);
      } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft' ||
                 e.key === 'w' || e.key === 'W' || e.key === 'a' || e.key === 'A') {
        e.preventDefault();
        const ta = document.getElementById('text-area');
        if (ta.scrollTop <= 0) {
          // Ya arriba, no hace nada
          return;
        }
        const step = ta.clientHeight * 0.8;
        ta.scrollBy({ top: -step, behavior: 'smooth' });
      } else if (e.key === 'Enter') {
        e.preventDefault();
        // Si esta al fondo, Enter activa el boton
        if (isScrolledToBottom()) {
          playBack();
          goBack();
        } else {
          // Sino, avanza scroll
          const ta = document.getElementById('text-area');
          const step = ta.clientHeight * 0.8;
          ta.scrollBy({ top: step, behavior: 'smooth' });
          setTimeout(() => {
            if (isScrolledToBottom()) {
              focus = 'button';
              updateFocus();
              playMove();
            }
          }, 300);
        }
      }
    } else {
      // Foco en el boton volver
      if (e.key === 'ArrowUp' || e.key === 'ArrowLeft' ||
          e.key === 'w' || e.key === 'W' || e.key === 'a' || e.key === 'A') {
        e.preventDefault();
        focus = 'scroll';
        updateFocus();
        playMove();
        // Vuelve al pergamino conservando la posicion del scroll
      } else if (e.key === 'ArrowDown' || e.key === 'ArrowRight' ||
                 e.key === 's' || e.key === 'S' || e.key === 'd' || e.key === 'D') {
        e.preventDefault();
        // No hace nada en el boton, solo Enter/Espacio activan
      } else if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        playBack();
        goBack();
      }
    }
  });

  // Click en el pergamino recupera el foco
  document.getElementById('text-area').addEventListener('click', () => {
    if (focus !== 'scroll') {
      focus = 'scroll';
      updateFocus();
    }
  });

  // Scroll manual: si llega al fondo, foco al boton
  document.getElementById('text-area').addEventListener('scroll', () => {
    if (focus === 'scroll' && isScrolledToBottom()) {
      // No auto-cambiar foco en scroll manual, solo con teclado
    }
  });


  // --- Init con cache + transicion ---
  (async () => {
    // Idioma primero (JSON local, instantaneo): asi la pantalla de carga
    // ya muestra los textos traducidos.
    await AssetsCache.loadSettings();
    // Pantalla del menú: siempre suena el tema principal
    AssetsCache.setMusicTrack(AssetsCache.MUSIC.main);
    fallback = await loadLang('es');
    translations = await loadLang();
    applyI18n();
    await loadTextArea();
    positionTextArea();

    if (sessionStorage.getItem('runika-session') === 'active') {
      // Ya en sesion, ir directo
      focus = 'scroll';
      updateFocus();
      AssetsCache.revealPage();
      return;
    }

    AssetsCache.showLoading();
    const loadingBar = document.getElementById('loading-bar');
    const loadingText = document.getElementById('loading-text');
    loadingText.textContent = t('loading.text') + ' 0%';

    await AssetsCache.preloadAll((loaded, total) => {
      const pct = Math.round((loaded / total) * 100);
      loadingBar.style.width = pct + '%';
      loadingText.textContent = t('loading.text') + ' ' + pct + '%';
    });

    focus = 'scroll';
    updateFocus();

    AssetsCache.revealPage();
  })();

  document.getElementById('bg').addEventListener('load', positionTextArea);
  window.addEventListener('resize', positionTextArea);
</script>

</body>
</html>
