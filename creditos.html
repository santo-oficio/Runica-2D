<!DOCTYPE html>
<html lang="es">
<head>
<script src="/web/webdb.js"></script>
<script src="/web/solver.bundle.js"></script>
<script src="/web/api-shim.js"></script>
<script src="/web/tizen.js"></script>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Runika 2D</title>
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; background: #000; overflow: hidden;
    font-family: 'ChelseaMarket', cursive;
    user-select: none;
  }
  /* Pantalla de carga */
  #loading-screen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 100; background: #0a0806;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #e8d4a8;
  }
  #loading-screen .title {
    font-size: 2.5em; color: #f0d890;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    margin-bottom: 30px; letter-spacing: 3px;
  }
  #loading-bar-bg {
    width: 300px; height: 8px;
    background: rgba(60, 42, 20, 0.5);
    border: 1px solid rgba(180, 150, 80, 0.4);
    border-radius: 4px; overflow: hidden;
  }
  #loading-bar {
    width: 0%; height: 100%;
    background: linear-gradient(90deg, #c4a050, #f0d890);
    transition: width 0.2s ease;
  }
  #loading-text { margin-top: 12px; font-size: 0.9em; color: #a08850; }
  #transition-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 90; background: #000;
    opacity: 1; pointer-events: auto; /* nace en negro: cero destello al entrar */
  }
  #stage {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  #bg { width: 100%; height: 100%; object-fit: contain; display: block; }

  /* Titulo (area calibrada, sobre el cartel/pergamino de la imagen) */
  #title-area {
    position: absolute; z-index: 11; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  #title-area h1 {
    color: #3a2810; text-align: center;
    text-shadow: 1px 1px 0 rgba(255,240,200,0.5);
    letter-spacing: 1px; white-space: nowrap;
  }
  /* Calaveras de adorno flanqueando el titulo */
  #title-area h1::before, #title-area h1::after {
    content: '';
    display: inline-block;
    width: 0.95em; height: 0.95em;
    margin: 0 0.45em;
    vertical-align: -0.08em;
    background: url('/assets/comunes/calavera.webp') center / contain no-repeat;
    opacity: 0.75;
    filter: sepia(0.4) brightness(0.55);
  }
  #title-area h1::after { transform: scaleX(-1); }

  /* Texto de creditos (area calibrada, scroll cinematico) */
  #text-area {
    position: absolute; z-index: 11;
    pointer-events: auto;
    overflow: hidden;
    padding: 10px 18px;
    color: #3a2810;
    text-align: center;
    transition: box-shadow 0.3s ease;
    /* Fundido en los bordes: el texto entra por abajo y desaparece arriba */
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 16%, #000 88%, transparent 100%);
    mask-image: linear-gradient(to bottom, transparent 0, #000 16%, #000 88%, transparent 100%);
  }
  #text-area.focused { box-shadow: inset 0 0 0 2px rgba(138, 96, 48, 0.5); }
  #credits-flow { will-change: transform; transition: opacity 0.6s ease; }
  #text-area .line { margin-bottom: 1.15em; line-height: 1.7; }
  #text-area .line.big { font-size: 1.25em; font-weight: bold; }
  #text-area .divider {
    display: flex; align-items: center; justify-content: center;
    gap: 14px; margin: 1.4em auto; width: 80%;
  }
  #text-area .divider::before, #text-area .divider::after {
    content: ''; flex: 1; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(100,70,30,0.5));
  }
  #text-area .divider::after {
    background: linear-gradient(90deg, rgba(100,70,30,0.5), transparent);
  }
  #text-area .divider img { width: 1.1em; height: 1.1em; opacity: 0.7; filter: sepia(0.4) brightness(0.55); }

  /* Boton atras: area invisible sobre la brujula pintada */
  #btn-back {
    position: absolute; z-index: 21;
    border-radius: 50%;
    padding: 0;
    display: flex; align-items: center; justify-content: center;
    text-align: center; line-height: 1.15;
    background: transparent;
    border: 3px solid transparent;
    box-shadow: none;
    color: transparent; text-shadow: none;
    cursor: pointer; user-select: none;
    font-family: 'ChelseaMarket', cursive;
  }
  #btn-back:hover {
    border-color: rgba(255, 204, 68, 0.5);
    box-shadow: 0 0 14px rgba(255, 204, 68, 0.35);
  }
  #btn-back.focused {
    border-color: rgba(255, 204, 68, 0.95);
    box-shadow: 0 0 18px rgba(255, 204, 68, 0.6), inset 0 0 12px rgba(255, 204, 68, 0.25);
  }

</style>
</head>
<body>

<div id="loading-screen">
  <div class="title" data-i18n="menu.title"></div>
  <div id="loading-bar-bg"><div id="loading-bar"></div></div>
  <div id="loading-text"></div>
</div>

<!-- Overlay de transicion -->
<div id="transition-overlay"></div>

<div id="stage">
  <img id="bg" src="/assets/creditos/creditos.jpg?v=creditos-8k" />
</div>

<div id="title-area"><h1 data-i18n="credits.title"></h1></div>

<div id="text-area">
  <div id="credits-flow">
    <div class="line big" data-i18n="menu.title"></div>
    <div class="line" data-i18n="credits.created"></div>
    <div class="divider"><img src="/assets/comunes/calavera.webp" alt=""></div>
    <div class="line" data-i18n="credits.design"></div>
    <div class="divider"><img src="/assets/comunes/calavera.webp" alt=""></div>
    <div class="line" data-i18n="credits.inspired"></div>
    <div class="line" data-i18n="credits.made"></div>
    <div class="divider"><img src="/assets/comunes/calavera.webp" alt=""></div>
    <div class="line" data-i18n="credits.dedication1"></div>
    <div class="line" data-i18n="credits.wife"></div>
    <div class="line" data-i18n="credits.dedication2"></div>
    <div class="line" data-i18n="credits.sabela2"></div>
    <div class="divider"><img src="/assets/comunes/calavera.webp" alt=""></div>
    <div class="line" data-i18n="credits.joke"></div>
    <div class="divider"><img src="/assets/comunes/calavera.webp" alt=""></div>
    <div class="line" data-i18n="credits.thanks"></div>
  </div>
</div>

<button id="btn-back" data-i18n="credits.back"></button>


<script src="/assets-cache.js"></script>
<script>
  let translations = {};
  let fallback = {};
  // Fallback por si no hay calibracion guardada; el valor real viene de
  // assets/creditos/creditos-areas.json (calibrate-creditos.html)
  let TITLE_AREA = { x: 0.35, y: 0.10, w: 0.30, h: 0.10 };
  let TEXT_AREA = { x: 0.36, y: 0.30, w: 0.28, h: 0.42 };
  // Boton atras eliptico: centro normalizado + radios (rx fraccion del
  // ancho de imagen, ry del alto). Fallback legacy: circulo {r}.
  let BACK_BUTTON = { cx: 0.30, cy: 0.88, rx: 0.04, ry: 0.07 };

  // Foco: 'scroll' (texto creditos) o 'button' (boton volver)
  let focus = 'scroll';

  async function loadLang(lang) {
    const r = await fetch('/api/i18n' + (lang ? '/' + lang : ''));
    if (!r.ok) return {};
    return await r.json();
  }
  function t(key) { return translations[key] ?? fallback[key] ?? key; }

  function applyI18n() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      el.textContent = t(key);
    });
    document.title = t('credits.title') + ' — ' + t('menu.title');
  }

  async function loadAreas() {
    try {
      const r = await fetch('/api/load-creditos-areas');
      if (!r.ok) return;
      const data = await r.json();
      if (data.areas?.title?.w > 0) TITLE_AREA = data.areas.title;
      if (data.areas?.credits?.w > 0) TEXT_AREA = data.areas.credits;
      if (data.backButton) BACK_BUTTON = data.backButton;
    } catch {}
  }

  function positionAreas() {
    const bg = document.getElementById('bg');
    const rect = AssetsCache.layoutRect(bg);
    // Rect visible de la imagen (descuenta el letterbox de object-fit: contain)
    const iw = bg.naturalWidth || 7680;
    const ih = bg.naturalHeight || 4320;
    const cs = getComputedStyle(bg);
    const fill = cs.objectFit === 'fill';
    const s = fill ? 0 : (cs.objectFit === 'cover'
      ? Math.max(rect.width / iw, rect.height / ih)
      : Math.min(rect.width / iw, rect.height / ih));
    const w = fill ? rect.width : iw * s, h = fill ? rect.height : ih * s;
    const pos = (cs.objectPosition || '50% 50%').trim().split(/\s+/);
    const ox = (parseFloat(pos[0]) || 50) / 100, oy = (parseFloat(pos[1] ?? pos[0]) || 50) / 100;
    const r = {
      left: fill ? rect.left : rect.left + (rect.width - w) * ox,
      top: fill ? rect.top : rect.top + (rect.height - h) * oy,
      width: w, height: h,
    };
    imgH = r.height;
    const title = document.getElementById('title-area');
    title.style.left = (r.left + TITLE_AREA.x * r.width) + 'px';
    title.style.top = (r.top + TITLE_AREA.y * r.height) + 'px';
    title.style.width = (TITLE_AREA.w * r.width) + 'px';
    title.style.height = (TITLE_AREA.h * r.height) + 'px';
    const ta = document.getElementById('text-area');
    ta.style.left = (r.left + TEXT_AREA.x * r.width) + 'px';
    ta.style.top = (r.top + TEXT_AREA.y * r.height) + 'px';
    ta.style.width = (TEXT_AREA.w * r.width) + 'px';
    ta.style.height = (TEXT_AREA.h * r.height) + 'px';
    ta.style.fontSize = Math.max(12, TEXT_AREA.h * r.height * 0.18 * (TEXT_AREA.fontScale || 1)) + 'px';
    // Boton atras eliptico sobre la elipse calibrada (o circulo legacy {r})
    const btn = document.getElementById('btn-back');
    const bw = 2 * (BACK_BUTTON.rx ?? BACK_BUTTON.r ?? 0.04) * r.width;
    const bh = BACK_BUTTON.ry != null ? 2 * BACK_BUTTON.ry * r.height : bw;
    btn.style.left = (r.left + BACK_BUTTON.cx * r.width - bw / 2) + 'px';
    btn.style.top = (r.top + BACK_BUTTON.cy * r.height - bh / 2) + 'px';
    btn.style.width = bw + 'px';
    btn.style.height = bh + 'px';
    // Auto-ajuste del titulo para que no se corte
    const h1 = title.querySelector('h1');
    let fs = TITLE_AREA.h * r.height * 0.62 * (TITLE_AREA.fontScale || 1);
    h1.style.fontSize = fs + 'px';
    while ((h1.scrollWidth > title.clientWidth + 1 || h1.scrollHeight > title.clientHeight + 1) && fs > 6) {
      fs--;
      h1.style.fontSize = fs + 'px';
    }
  }

  function updateFocus() {
    const ta = document.getElementById('text-area');
    const btn = document.getElementById('btn-back');
    ta.classList.toggle('focused', focus === 'scroll');
    btn.classList.toggle('focused', focus === 'button');
  }

  // --- Scroll cinematografico (estilo Star Wars) ---
  // El texto entra por el borde inferior, sube lentamente y desaparece por
  // arriba con un fundido (mascara CSS). Al terminar espera, se desvance y
  // vuelve a empezar desde abajo. Las flechas toman el control unos segundos.
  let scrollPos = 0;          // posicion continua en px (negativo = aun no entra)
  let scrollInit = false;
  let imgH = 0;               // alto de la imagen visible (velocidad relativa)
  let manualUntil = 0;        // auto-scroll pausado tras input manual
  let holdUntil = -1;         // pausa al final antes del fundido de reinicio
  let resetting = false;
  let lastTick = 0;

  function creditsMaxScroll() {
    const flow = document.getElementById('credits-flow');
    const ta = document.getElementById('text-area');
    // Termina cuando el final del texto queda ~1/3 por debajo del borde
    // superior (ultimas lineas visibles centradas durante la pausa).
    return Math.max(0, flow.scrollHeight - ta.clientHeight * 0.35);
  }
  function applyScroll() {
    document.getElementById('credits-flow').style.transform =
      'translateY(' + (-scrollPos) + 'px)';
  }
  function isScrolledToBottom() {
    return scrollPos >= creditsMaxScroll() - 2;
  }
  function scrollTick(ts) {
    const dt = Math.min(60, ts - (lastTick || ts));
    lastTick = ts;
    const flow = document.getElementById('credits-flow');
    const ta = document.getElementById('text-area');
    if (!scrollInit && ta.clientHeight > 0 && flow.scrollHeight > 0) {
      // Arranque: el primer renglon ya esta en zona legible — en TV el
      // texto tardaba ~15-20s en aparecer y parecia pantalla vacia.
      scrollPos = -ta.clientHeight * 0.12;
      applyScroll();
      scrollInit = true;
      manualUntil = ts + 1200;
    }
    const max = creditsMaxScroll();
    if (max > 0 && !resetting && scrollInit) {
      if (holdUntil > 0) {
        if (ts >= holdUntil) {
          resetting = true;
          flow.style.opacity = '0';
          setTimeout(() => {
            scrollPos = -ta.clientHeight * 0.12;
            applyScroll();
            flow.style.opacity = '1';
            resetting = false;
            holdUntil = -1;
            manualUntil = performance.now() + 1500;
          }, 650);
        }
      } else if (scrollPos >= max - 0.5) {
        scrollPos = max;
        applyScroll();
        holdUntil = ts + 4000;
      } else if (ts >= manualUntil) {
        scrollPos = Math.min(max, scrollPos + imgH * 0.03 * dt / 1000);
        applyScroll();
      }
    }
    requestAnimationFrame(scrollTick);
  }
  requestAnimationFrame(scrollTick);

  function manualScroll(dir) {
    const ta = document.getElementById('text-area');
    const step = ta.clientHeight * 0.6;
    holdUntil = -1;
    scrollPos = Math.max(-ta.clientHeight * 0.9,
      Math.min(creditsMaxScroll(), scrollPos + dir * step));
    manualUntil = performance.now() + 4500;
    applyScroll();
  }

  // Sonidos desde cache
  AssetsCache.unlockAudio();
  document.addEventListener('click', () => AssetsCache.unlockAudio(), { once: true });
  document.addEventListener('keydown', () => AssetsCache.unlockAudio(), { once: true });

  function playMove() {
    AssetsCache.playSound('/assets/sounds/comun/move.wav', 0.5);
  }
  function playSelect() {
    AssetsCache.playSound('/assets/sounds/comun/press.wav', 0.7);
  }
  function playBack() {
    AssetsCache.playSound('/assets/sounds/comun/back.wav', 0.6);
  }
  function playHover() {
    AssetsCache.playSound('/assets/sounds/comun/hover.wav', 0.45);
  }

  function goBack() { AssetsCache.transitionTo('/menu.html'); }

  // Boton volver
  document.getElementById('btn-back').addEventListener('click', () => {
    playBack();
    goBack();
  });
  document.getElementById('btn-back').addEventListener('mouseenter', () => playHover());

  // Teclado: mismas reglas a fuego que instrucciones (foco en el texto;
  // abajo hace scroll; al llegar al final baja al boton; arriba desde el
  // boton vuelve al texto conservando el scroll; flechas/WASD)
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { playBack(); goBack(); return; }

    if (focus === 'scroll') {
      if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === ' ' ||
          e.key === 's' || e.key === 'S' || e.key === 'd' || e.key === 'D') {
        e.preventDefault();
        manualScroll(1);
        if (isScrolledToBottom()) {
          focus = 'button';
          updateFocus();
          playMove();
        }
      } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft' ||
                 e.key === 'w' || e.key === 'W' || e.key === 'a' || e.key === 'A') {
        e.preventDefault();
        if (scrollPos <= -document.getElementById('text-area').clientHeight * 0.9) return;
        manualScroll(-1);
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (isScrolledToBottom()) {
          playBack();
          goBack();
        } else {
          manualScroll(1);
          if (isScrolledToBottom()) {
            focus = 'button';
            updateFocus();
            playMove();
          }
        }
      }
    } else {
      if (e.key === 'ArrowUp' || e.key === 'ArrowLeft' ||
          e.key === 'w' || e.key === 'W' || e.key === 'a' || e.key === 'A') {
        e.preventDefault();
        focus = 'scroll';
        updateFocus();
        playMove();
        // Vuelve al texto conservando la posicion del scroll
      } else if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        playBack();
        goBack();
      }
    }
  });

  // Click en el texto recupera el foco
  document.getElementById('text-area').addEventListener('click', () => {
    if (focus !== 'scroll') {
      focus = 'scroll';
      updateFocus();
    }
  });


  // --- Init con cache + transicion ---
  (async () => {
    // Idioma primero (JSON local, instantaneo): asi la pantalla de carga
    // ya muestra los textos traducidos.
    await AssetsCache.loadSettings();
    // Continua la pista que traía la pantalla anterior: si venimos de la
    // batalla final, victory.mp3 sigue sonando durante los créditos (una
    // sola película, sin corte); si venimos del menú, sigue su tema.
    AssetsCache.setMusicTrack(AssetsCache.currentMusicTrack() || AssetsCache.MUSIC.main);
    fallback = await loadLang('es');
    translations = await loadLang();
    applyI18n();
    await loadAreas();
    positionAreas();

    if (sessionStorage.getItem('runika-session') === 'active') {
      focus = 'scroll';
      updateFocus();
      AssetsCache.revealPage();
      return;
    }

    AssetsCache.showLoading();
    const loadingBar = document.getElementById('loading-bar');
    const loadingText = document.getElementById('loading-text');
    loadingText.textContent = t('loading.text') + ' 0%';

    await AssetsCache.preloadAll((loaded, total) => {
      const pct = Math.round((loaded / total) * 100);
      loadingBar.style.width = pct + '%';
      loadingText.textContent = t('loading.text') + ' ' + pct + '%';
    });

    focus = 'scroll';
    updateFocus();

    AssetsCache.revealPage();
  })();

  document.getElementById('bg').addEventListener('load', positionAreas);
  window.addEventListener('resize', positionAreas);
</script>

</body>
</html>
